<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Evidence is stronger in combination</title><desc id="desc">Symptoms and codes begin the case; command response and electrical evidence narrow it. Symptom; Fault record; Operating data; Command result; Power and ground; Mechanical context.</desc><rect width="1280" height="720" fill="#181426"/><rect width="1280" height="16" fill="#c5a3ff"/><text x="64" y="68" class="heading">Evidence is stronger in combination</text><text x="64" y="114" class="sub">Symptoms and codes begin the case; command response and electrical evidence narrow it.</text><circle cx="640" cy="420" r="84" fill="#c5a3ff"/><text x="640" y="427" text-anchor="middle" class="label"><tspan x="640" dy="0">QUALIFY</tspan></text><path d="M640 420L640 185" stroke="#698397" stroke-width="4"/><rect x="535" y="147" width="210" height="76" rx="20" fill="#3e315c" stroke="#c5a3ff" stroke-width="3"/><text x="640" y="192" text-anchor="middle" class="label"><tspan x="640" dy="0">Symptom</tspan></text><path d="M640 420L843.5159698893431 302.5" stroke="#698397" stroke-width="4"/><rect x="738.5159698893431" y="264.5" width="210" height="76" rx="20" fill="#3e315c" stroke="#78e3d2" stroke-width="3"/><text x="843.5159698893431" y="309.5" text-anchor="middle" class="label"><tspan x="843.5159698893431" dy="0">Fault record</tspan></text><path d="M640 420L843.5159698893431 537.5" stroke="#698397" stroke-width="4"/><rect x="738.5159698893431" y="499.5" width="210" height="76" rx="20" fill="#3e315c" stroke="#c5a3ff" stroke-width="3"/><text x="843.5159698893431" y="544.5" text-anchor="middle" class="label"><tspan x="843.5159698893431" dy="0">Operating data</tspan></text><path d="M640 420L640 655" stroke="#698397" stroke-width="4"/><rect x="535" y="617" width="210" height="76" rx="20" fill="#3e315c" stroke="#78e3d2" stroke-width="3"/><text x="640" y="662" text-anchor="middle" class="label"