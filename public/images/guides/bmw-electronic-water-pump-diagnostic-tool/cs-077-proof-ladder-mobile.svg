<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Evidence is stronger in combination</title><desc id="desc">Symptoms and codes begin the case; command response and electrical evidence narrow it. Symptom; Fault record; Operating data; Command result; Power and ground; Mechanical context.</desc><rect width="720" height="980" fill="#181426"/><rect width="720" height="16" fill="#c5a3ff"/><text x="44" y="70" text-anchor="start" class="heading"><tspan x="44" dy="0">Evidence is stronger in</tspan><tspan x="44" dy="34">combination</tspan></text><text x="44" y="156" text-anchor="start" class="sub"><tspan x="44" dy="0">Symptoms and codes begin the case; command response</tspan><tspan x="44" dy="24">and electrical evidence narrow it.</tspan></text><circle cx="360" cy="545" r="88" fill="#c5a3ff"/><text x="360" y="553" text-anchor="middle" class="label"><tspan x="360" dy="0">DECIDE</tspan></text><path d="M360 545L360 300" stroke="#698397" stroke-width="4"/><rect x="257" y="258" width="206" height="84" rx="20" fill="#3e315c" stroke="#c5a3ff" stroke-width="3"/><text x="360" y="308" text-anchor="middle" class="label"><tspan x="360" dy="0">Symptom</tspan></text><path d="M360 545L554.8557158514986 422.5" stroke="#698397" stroke-width="4"/><rect x="451.85571585149864" y="380.5" width="206" height="84" rx="20" fill="#3e315c" stroke="#78e3d2" stroke-width="3"/><text x="554.8557158514986" y="430.5" text-anchor="middle" class="label"><tspan x="554.8557158514986" dy="0">Fault record</tspan></text><path d="M360 545L554.8557158514986 667.5" stroke="#698397" stroke-width="4"/><rect x="451.85571585149864" y="625.5" width="206" height="84" rx="20" fill="#3e315c" stroke="#c5a3ff" stroke-width="3"/><text x="554.8557158514986" y="675.5" text-anchor="middle" class="label"><tspan x="554.8557158514986" dy="0">Operating data</tspan></text><path d="M360 545L360 790" stroke="#698397" stroke-width="4"/><rect x="257" y="748" width="206" height="84" rx="20" fill="#3e315c" stroke="#78e3d2" stroke-width="3"/><text x="360" y="798" text-anchor="middle" class="label"><tspan x="360" dy="0">Command result</tspan></text><path d="M360 545L165.14428414850133 667.5000000000001" stroke="#698397" stroke-width="4"/><rect x="62.14428414850133" y="625.5000000000001" width="206" height="84" rx="20" fill="#3e315c" stroke="#c5a3ff" stroke-width="3"/><text x="165.14428414850133" y="663.5000000000001" text-anchor="middle" class="label"><tspan x="165.14428414850133" dy="0">Power and</tspan><tspan x="165.14428414850133" dy="24">ground</tspan></text><path d="M360 545L165.14428414850133 422.5" stroke="#698397" stroke-width="4"/><rect x="62.14428414850133" y="380.5" width="206" height="84" rx="20" fill="#3e315c" stroke="#78e3d2" stroke-width="3"/><text x="165.14428414850133" y="418.5" text-anchor="middle" class="label"><tspan x="165.14428414850133" dy="0">Mechanical</tspan><tspan x="165.14428414850133" dy="24">context</tspan></text><circle cx="24" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="40" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="56" cy="958" r="2" fill="#78e3d2" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#bfd0dc}.label{font:600 19px Arial,sans-serif;fill:#fff}</style></svg>