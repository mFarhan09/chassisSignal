<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">From symptom to a defensible pump decision</title><desc id="desc">A staged route separates DME evidence, data, command capability, electrical path and escalation. Identify engine; Read DME faults; Review live data; Verify activation; Check electrical path; Escalate safely.</desc><rect width="720" height="980" fill="#071722"/><rect width="720" height="16" fill="#77d8c8"/><text x="44" y="70" text-anchor="start" class="heading"><tspan x="44" dy="0">From symptom to a defensible pump</tspan><tspan x="44" dy="34">decision</tspan></text><text x="44" y="156" text-anchor="start" class="sub"><tspan x="44" dy="0">A staged route separates DME evidence, data, command</tspan><tspan x="44" dy="24">capability, electrical path and escalation.</tspan></text><rect x="80" y="238" width="560" height="84" rx="18" fill="#1b4050" stroke="#77d8c8" stroke-width="3"/><circle cx="115" cy="280" r="21" fill="#77d8c8"/><text x="365" y="288" text-anchor="middle" class="label"><tspan x="365" dy="0">Identify engine</tspan></text><path d="M115 301V377" stroke="#698397" stroke-width="5"/><rect x="80" y="356" width="560" height="84" rx="18" fill="#1b4050" stroke="#77d8c8" stroke-width="3"/><circle cx="115" cy="398" r="21" fill="#77d8c8"/><text x="365" y="406" text-anchor="middle" class="label"><tspan x="365" dy="0">Read DME faults</tspan></text><path d="M115 419V495" stroke="#698397" stroke-width="5"/><rect x="80" y="474" width="560" height="84" rx="18" fill="#1b4050" stroke="#77d8c8" stroke-width="3"/><circle cx="115" cy="516" r="21" fill="#77d8c8"/><text x="365" y="524" text-anchor="middle" class="label"><tspan x="365" dy="0">Review live data</tspan></text><path d="M115 537V613" stroke="#698397" stroke-width="5"/><rect x="80" y="592" width="560" height="84" rx="18" fill="#1b4050" stroke="#77d8c8" stroke-width="3"/><circle cx="115" cy="634" r="21" fill="#77d8c8"/><text x="365" y="642" text-anchor="middle" class="label"><tspan x="365" dy="0">Verify activation</tspan></text><path d="M115 655V731" stroke="#698397" stroke-width="5"/><rect x="80" y="710" width="560" height="84" rx="18" fill="#1b4050" stroke="#77d8c8" stroke-width="3"/><circle cx="115" cy="752" r="21" fill="#77d8c8"/><text x="365" y="760" text-anchor="middle" class="label"><tspan x="365" dy="0">Check electrical path</tspan></text><path d="M115 773V849" stroke="#698397" stroke-width="5"/><rect x="80" y="828" width="560" height="84" rx="18" fill="#1b4050" stroke="#f5c26b" stroke-width="3"/><circle cx="115" cy="870" r="21" fill="#f5c26b"/><text x="365" y="878" text-anchor="middle" class="label"><tspan x="365" dy="0">Escalate safely</tspan></text><circle cx="24" cy="958" r="2" fill="#f5c26b" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#bfd0dc}.label{font:600 19px Arial,sans-serif;fill:#fff}</style></svg>