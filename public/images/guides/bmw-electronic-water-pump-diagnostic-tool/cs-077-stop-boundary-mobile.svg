<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Know when the scan tool stops helping</title><desc id="desc">Hot-system hazards, missing specifications and mechanical faults move the job to exact repair information. Cold safe condition; Vehicle-specific plan; No copied thresholds; Mechanical inspection; Qualified escalation.</desc><rect width="720" height="980" fill="#17120c"/><rect width="720" height="16" fill="#f0ad4e"/><text x="44" y="70" text-anchor="start" class="heading"><tspan x="44" dy="0">Know when the scan tool stops</tspan><tspan x="44" dy="34">helping</tspan></text><text x="44" y="156" text-anchor="start" class="sub"><tspan x="44" dy="0">Hot-system hazards, missing specifications and</tspan><tspan x="44" dy="24">mechanical faults move the job to exact repair</tspan><tspan x="44" dy="24">information.</tspan></text><rect x="55" y="262" width="300" height="142" rx="18" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="205" y="328" text-anchor="middle" class="label"><tspan x="205" dy="0">Cold safe</tspan><tspan x="205" dy="24">condition</tspan></text><rect x="365" y="262" width="300" height="142" rx="21" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="515" y="328" text-anchor="middle" class="label"><tspan x="515" dy="0">Vehicle-specific</tspan><tspan x="515" dy="24">plan</tspan></text><rect x="55" y="452" width="300" height="142" rx="24" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="205" y="518" text-anchor="middle" class="label"><tspan x="205" dy="0">No copied</tspan><tspan x="205" dy="24">thresholds</tspan></text><rect x="365" y="452" width="300" height="142" rx="27" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="515" y="518" text-anchor="middle" class="label"><tspan x="515" dy="0">Mechanical</tspan><tspan x="515" dy="24">inspection</tspan></text><rect x="55" y="642" width="300" height="142" rx="30" fill="#49351f" stroke="#e8e1d3" stroke-width="4"/><text x="205" y="708" text-anchor="middle" class="label"><tspan x="205" dy="0">Qualified</tspan><tspan x="205" dy="24">escalation</tspan></text><circle cx="24" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="40" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="56" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="72" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#bfd0dc}.label{font:600 19px Arial,sans-serif;fill:#fff}</style></svg>