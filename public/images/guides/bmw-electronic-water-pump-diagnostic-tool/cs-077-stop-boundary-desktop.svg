<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Know when the scan tool stops helping</title><desc id="desc">Hot-system hazards, missing specifications and mechanical faults move the job to exact repair information. Cold safe condition; Vehicle-specific plan; No copied thresholds; Mechanical inspection; Qualified escalation.</desc><rect width="1280" height="720" fill="#17120c"/><rect width="1280" height="16" fill="#f0ad4e"/><text x="64" y="68" class="heading">Know when the scan tool stops helping</text><text x="64" y="114" class="sub">Hot-system hazards, missing specifications and mechanical faults move the job to exact repair information.</text><path d="M125 230H1155L1121 290H159Z" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><text x="640" y="268" text-anchor="middle" class="label"><tspan x="640" dy="0">Cold safe condition</tspan></text><path d="M182.5 310H1097.5L1063.5 370H216.5Z" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><text x="640" y="336" text-anchor="middle" class="label"><tspan x="640" dy="0">Vehicle-specific</tspan><tspan x="640" dy="24">plan</tspan></text><path d="M240 390H1040L1006 450H274Z" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><text x="640" y="428" text-anchor="middle" class="label"><tspan x="640" dy="0">No copied thresholds</tspan></text><path d="M297.5 470H982.5L948.5 530H331.5Z" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><text x="640" y="496" text-anchor="middle" class="label"><tspan x="640" dy="0">Mechanical</tspan><tspan x="640" dy="24">inspection</tspan></text><path d="M355 550H925L891 610H389Z" fill="#e8e1d3" stroke="#f0ad4e" stroke-width="3"/><text x="640" y="588" text-anchor="middle" class="label"><tspan x="640" dy="0">Qualified escalation</tspan></text><circle cx="24" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="40" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="56" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="72" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#bfd0dc}.label{font:600 17px Arial,sans-serif;fill:#fff}</style></svg>