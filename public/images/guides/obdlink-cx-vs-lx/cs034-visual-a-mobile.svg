<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" data-layout="radio-routes"><title>Bluetooth routes</title><desc>CX and LX use different Bluetooth transports and platform boundaries. iOS, Android, Windows, BLE, Classic</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f5b95f"/></marker></defs><rect width="100%" height="100%" fill="#081421"/><circle cx="640" cy="70" r="120" fill="#f5b95f" opacity="0.06"/><text x="48" y="58" class="k">CHASSIS SIGNAL / RADIO-ROUTES</text><text x="48" y="112" class="title" text-anchor="start"><tspan x="48" dy="0">Bluetooth routes</tspan></text><text x="48" y="190" class="subtitle" text-anchor="start"><tspan x="48" dy="0">CX and LX use different Bluetooth transports and platform</tspan><tspan x="48" dy="24">boundaries.</tspan></text><g><rect x="50" y="245" width="210" height="70" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="155" y="286" class="label" text-anchor="middle"><tspan x="155" dy="0">iOS</tspan></text></g><g><rect x="50" y="375" width="210" height="70" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="155" y="416" class="label" text-anchor="middle"><tspan x="155" dy="0">Android</tspan></text></g><g><rect x="50" y="505" width="210" height="70" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="155" y="546" class="label" text-anchor="middle"><tspan x="155" dy="0">Windows</tspan></text></g><g><rect x="435" y="300" width="230" height="78" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="550" y="345" class="label" text-anchor="middle"><tspan x="550" dy="0">BLE</tspan></text></g><g><rect x="435" y="560" width="230" height="78" rx="14" fill="#2d2534" stroke="#ef7d75" stroke-width="2"/><text x="550" y="605" class="label" text-anchor="middle"><tspan x="550" dy="0">Classic</tspan></text></g><path d="M 260 280 L 435 339" fill="none" stroke="#f5b95f" stroke-width="4" marker-end="url(#arrow)"/><path d="M 260 410 L 435 339" fill="none" stroke="#f5b95f" stroke-width="4" marker-end="url(#arrow)"/><path d="M 260 540 L 435 599" fill="none" stroke="#ef7d75" stroke-width="4"/><text x="48" y="932" class="k">DECISION ARTIFACT / CS-034</text><style>.title{font:700 30px Arial,sans-serif;fill:#fff}.subtitle{font:17px Arial,sans-serif;fill:#b7c8d8}.k{font:14px Arial,sans-serif;fill:#f5b95f;letter-spacing:2px}.label{font:700 16px Arial,sans-serif;fill:#fff}.zone{font:700 15px Arial,sans-serif;fill:#d9e7ef;letter-spacing:2px}.plus{font:700 28px Arial,sans-serif;fill:#b7c8d8}</style></svg>