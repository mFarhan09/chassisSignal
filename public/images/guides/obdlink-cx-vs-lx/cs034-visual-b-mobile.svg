<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" data-layout="platform-staircase"><title>Platform is gate one</title><desc>A transport-first matrix prevents Bluetooth from hiding iOS incompatibility. Host, Application, Protocol, Vehicle</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ef7d75"/></marker></defs><rect width="100%" height="100%" fill="#081421"/><circle cx="640" cy="70" r="120" fill="#ef7d75" opacity="0.06"/><text x="48" y="58" class="k">CHASSIS SIGNAL / PLATFORM-STAIRCASE</text><text x="48" y="112" class="title" text-anchor="start"><tspan x="48" dy="0">Platform is gate one</tspan></text><text x="48" y="190" class="subtitle" text-anchor="start"><tspan x="48" dy="0">A transport-first matrix prevents Bluetooth from hiding</tspan><tspan x="48" dy="24">iOS incompatibility.</tspan></text><g><rect x="48" y="245" width="624" height="82" rx="14" fill="#10334a" stroke="#ef7d75" stroke-width="2"/><text x="360" y="292" class="label" text-anchor="middle"><tspan x="360" dy="0">Host</tspan></text></g><g><rect x="83" y="370" width="554" height="82" rx="14" fill="#2d2534" stroke="#7fa9ff" stroke-width="2"/><text x="360" y="417" class="label" text-anchor="middle"><tspan x="360" dy="0">Application</tspan></text></g><g><rect x="118" y="495" width="484" height="82" rx="14" fill="#10334a" stroke="#ef7d75" stroke-width="2"/><text x="360" y="542" class="label" text-anchor="middle"><tspan x="360" dy="0">Protocol</tspan></text></g><g><rect x="153" y="620" width="414" height="82" rx="14" fill="#2d2534" stroke="#7fa9ff" stroke-width="2"/><text x="360" y="667" class="label" text-anchor="middle"><tspan x="360" dy="0">Vehicle</tspan></text></g><text x="48" y="932" class="k">DECISION ARTIFACT / CS-034</text><style>.title{font:700 30px Arial,sans-serif;fill:#fff}.subtitle{font:17px Arial,sans-serif;fill:#b7c8d8}.k{font:14px Arial,sans-serif;fill:#ef7d75;letter-spacing:2px}.label{font:700 16px Arial,sans-serif;fill:#fff}.zone{font:700 15px Arial,sans-serif;fill:#d9e7ef;letter-spacing:2px}.plus{font:700 28px Arial,sans-serif;fill:#b7c8d8}</style></svg>