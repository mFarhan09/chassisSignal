<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" data-layout="platform-staircase"><title>Platform is gate one</title><desc>A transport-first matrix prevents Bluetooth from hiding iOS incompatibility. Host, Application, Protocol, Vehicle</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ef7d75"/></marker></defs><rect width="100%" height="100%" fill="#081421"/><circle cx="1200" cy="70" r="170" fill="#ef7d75" opacity="0.06"/><text x="70" y="58" class="k">CHASSIS SIGNAL / PLATFORM-STAIRCASE</text><text x="70" y="112" class="title" text-anchor="start"><tspan x="70" dy="0">Platform is gate one</tspan></text><text x="70" y="178" class="subtitle" text-anchor="start"><tspan x="70" dy="0">A transport-first matrix prevents Bluetooth from hiding iOS incompatibility.</tspan></text><g><rect x="70" y="520" width="210" height="76" rx="14" fill="#10334a" stroke="#ef7d75" stroke-width="2"/><text x="175" y="564" class="label" text-anchor="middle"><tspan x="175" dy="0">Host</tspan></text></g><g><rect x="250" y="450" width="210" height="76" rx="14" fill="#2d2534" stroke="#7fa9ff" stroke-width="2"/><text x="355" y="494" class="label" text-anchor="middle"><tspan x="355" dy="0">Application</tspan></text></g><g><rect x="430" y="380" width="210" height="76" rx="14" fill="#10334a" stroke="#ef7d75" stroke-width="2"/><text x="535" y="424" class="label" text-anchor="middle"><tspan x="535" dy="0">Protocol</tspan></text></g><g><rect x="610" y="310" width="210" height="76" rx="14" fill="#2d2534" stroke="#7fa9ff" stroke-width="2"/><text x="715" y="354" class="label" text-anchor="middle"><tspan x="715" dy="0">Vehicle</tspan></text></g><text x="70" y="692" class="k">DECISION ARTIFACT / CS-034</text><style>.title{font:700 40px Arial,sans-serif;fill:#fff}.subtitle{font:19px Arial,sans-serif;fill:#b7c8d8}.k{font:14px Arial,sans-serif;fill:#ef7d75;letter-spacing:2px}.label{font:700 18px Arial,sans-serif;fill:#fff}.zone{font:700 15px Arial,sans-serif;fill:#d9e7ef;letter-spacing:2px}.plus{font:700 28px Arial,sans-serif;fill:#b7c8d8}</style></svg>