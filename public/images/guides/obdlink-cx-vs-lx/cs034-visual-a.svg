<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" data-layout="radio-routes"><title>Bluetooth routes</title><desc>CX and LX use different Bluetooth transports and platform boundaries. iOS, Android, Windows, BLE, Classic</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f5b95f"/></marker></defs><rect width="100%" height="100%" fill="#081421"/><circle cx="1200" cy="70" r="170" fill="#f5b95f" opacity="0.06"/><text x="70" y="58" class="k">CHASSIS SIGNAL / RADIO-ROUTES</text><text x="70" y="112" class="title" text-anchor="start"><tspan x="70" dy="0">Bluetooth routes</tspan></text><text x="70" y="178" class="subtitle" text-anchor="start"><tspan x="70" dy="0">CX and LX use different Bluetooth transports and platform boundaries.</tspan></text><g><rect x="70" y="260" width="190" height="72" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="165" y="302" class="label" text-anchor="middle"><tspan x="165" dy="0">iOS</tspan></text></g><g><rect x="70" y="380" width="190" height="72" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="165" y="422" class="label" text-anchor="middle"><tspan x="165" dy="0">Android</tspan></text></g><g><rect x="70" y="500" width="190" height="72" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="165" y="542" class="label" text-anchor="middle"><tspan x="165" dy="0">Windows</tspan></text></g><g><rect x="520" y="290" width="230" height="84" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="635" y="338" class="label" text-anchor="middle"><tspan x="635" dy="0">BLE</tspan></text></g><g><rect x="520" y="500" width="230" height="84" rx="14" fill="#2d2534" stroke="#ef7d75" stroke-width="2"/><text x="635" y="548" class="label" text-anchor="middle"><tspan x="635" dy="0">Classic</tspan></text></g><path d="M 260 296 L 520 332" fill="none" stroke="#f5b95f" stroke-width="4" marker-end="url(#arrow)"/><path d="M 260 416 L 520 332" fill="none" stroke="#f5b95f" stroke-width="4" marker-end="url(#arrow)"/><path d="M 260 536 L 520 542" fill="none" stroke="#ef7d75" stroke-width="4"/><path d="M 750 332 L 1070 332" fill="none" stroke="#f5b95f" stroke-width="4" marker-end="url(#arrow)"/><path d="M 750 542 L 1070 542" fill="none" stroke="#ef7d75" stroke-width="4"/><g><rect x="1060" y="290" width="150" height="84" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="1135" y="338" class="label" text-anchor="middle"><tspan x="1135" dy="0">CX</tspan></text></g><g><rect x="1060" y="500" width="150" height="84" rx="14" fill="#2d2534" stroke="#ef7d75" stroke-width="2"/><text x="1135" y="548" class="label" text-anchor="middle"><tspan x="1135" dy="0">LX</tspan></text></g><text x="70" y="692" class="k">DECISION ARTIFACT / CS-034</text><style>.title{font:700 40px Arial,sans-serif;fill:#fff}.subtitle{font:19px Arial,sans-serif;fill:#b7c8d8}.k{font:14px Arial,sans-serif;fill:#f5b95f;letter-spacing:2px}.label{font:700 18px Arial,sans-serif;fill:#fff}.zone{font:700 15px Arial,sans-serif;fill:#d9e7ef;letter-spacing:2px}.plus{font:700 28px Arial,sans-serif;fill:#b7c8d8}</style></svg>