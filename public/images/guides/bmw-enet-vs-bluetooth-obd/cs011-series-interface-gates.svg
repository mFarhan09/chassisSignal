<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="709" viewBox="0 0 1100 709" role="img" aria-labelledby="title desc"><title id="title">Generation narrows the interface shortlist</title><desc id="desc">Use the live app table; these are architecture boundaries, not universal promises.</desc><rect width="1100" height="709" rx="24" fill="#f8fafc"/><rect width="1100" height="14" fill="#c2410c"/><text x="44" y="62" font-size="34" font-weight="800" fill="#35180d">Generation narrows the interface shortlist</text><text x="44" y="104" font-size="18" fill="#475569">Use the live app table; these are architecture boundaries, not universal promises.</text><rect x="50" y="165" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="201" font-size="20" font-weight="700" fill="#35180d">F/G/I Series</text><text x="70" y="233" font-size="16" fill="#475569">Official tables commonly list ENET plus selected</text><text x="70" y="255" font-size="16" fill="#475569">wireless adapters.</text><rect x="560" y="165" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="201" font-size="20" font-weight="700" fill="#35180d">E/R Series</text><text x="580" y="233" font-size="16" fill="#475569">Selected Bluetooth/Wi-Fi products and DCAN/USB</text><text x="580" y="255" font-size="16" fill="#475569">appear by app/platform.</text><rect x="50" y="333" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="369" font-size="20" font-weight="700" fill="#35180d">iOS</text><text x="70" y="401" font-size="16" fill="#475569">BLE, supported classic products, Wi-Fi, or</text><text x="70" y="423" font-size="16" fill="#475569">Ethernet as explicitly listed.</text><rect x="560" y="333" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="369" font-size="20" font-weight="700" fill="#35180d">Android</text><text x="580" y="401" font-size="16" fill="#475569">Bluetooth, Wi-Fi, ENET, or USB depend on device</text><text x="580" y="423" font-size="16" fill="#475569">support.</text><rect x="50" y="501" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="537" font-size="20" font-weight="700" fill="#35180d">Windows</text><text x="70" y="569" font-size="16" fill="#475569">Publisher manuals may restrict wireless and</text><text x="70" y="591" font-size="16" fill="#475569">require cable paths.</text><text x="44" y="691" font-size="13" fill="#64748b">Chassis Signal · documentation-first editorial synthesis</text></svg>