<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1129" viewBox="0 0 420 1129" role="img" aria-labelledby="title desc"><title id="title">Generation narrows the interface shortlist</title><desc id="desc">Use the live app table; these are architecture boundaries, not universal promises.</desc><rect width="420" height="1129" rx="24" fill="#f8fafc"/><rect width="420" height="14" fill="#c2410c"/><text x="28" y="62" font-size="24" font-weight="800" fill="#35180d">Generation narrows the</text><text x="28" y="93" font-size="24" font-weight="800" fill="#35180d">interface shortlist</text><text x="28" y="135" font-size="14" fill="#475569">Use the live app table; these are</text><text x="28" y="156" font-size="14" fill="#475569">architecture boundaries, not universal</text><text x="28" y="177" font-size="14" fill="#475569">promises.</text><rect x="30" y="249" width="360" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="285" font-size="17" font-weight="700" fill="#35180d">F/G/I Series</text><text x="50" y="317" font-size="14" fill="#475569">Official tables commonly list ENET plus</text><text x="50" y="339" font-size="14" fill="#475569">selected wireless adapters.</text><rect x="30" y="417" width="360" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="453" font-size="17" font-weight="700" fill="#35180d">E/R Series</text><text x="50" y="485" font-size="14" fill="#475569">Selected Bluetooth/Wi-Fi products and</text><text x="50" y="507" font-size="14" fill="#475569">DCAN/USB appear by app/platform.</text><rect x="30" y="585" width="360" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="621" font-size="17" font-weight="700" fill="#35180d">iOS</text><text x="50" y="653" font-size="14" fill="#475569">BLE, supported classic products, Wi-Fi, or</text><text x="50" y="675" font-size="14" fill="#475569">Ethernet as explicitly listed.</text><rect x="30" y="753" width="360" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="789" font-size="17" font-weight="700" fill="#35180d">Android</text><text x="50" y="821" font-size="14" fill="#475569">Bluetooth, Wi-Fi, ENET, or USB depend on</text><text x="50" y="843" font-size="14" fill="#475569">device support.</text><rect x="30" y="921" width="360" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="957" font-size="17" font-weight="700" fill="#35180d">Windows</text><text x="50" y="989" font-size="14" fill="#475569">Publisher manuals may restrict wireless</text><text x="50" y="1011" font-size="14" fill="#475569">and require cable paths.</text><text x="28" y="1111" font-size="13" fill="#64748b">Chassis Signal · documentation-first editorial synthesis</text></svg>