<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">CS-048 task risk tree</title><desc id="d">Article-specific diagram for bmw icom vs k dcan</desc><rect width="100%" height="100%" fill="#0f2324"/><text x="70" y="80" class="eye">CS-048 / DECISION EVIDENCE</text><text x="70" y="145" class="head">TASK RISK TREE</text><text x="70" y="190" class="sub">Match the interface to task and risk</text><circle cx="390" cy="245" r="42" fill="#2eb5a2"/><text x="390" y="252" text-anchor="middle" class="num">1</text><text x="325" y="252" text-anchor="end" class="label">Read codes</text><path d="M390 290 L890 300" stroke="#fff" stroke-width="5"/><circle cx="890" cy="330" r="42" fill="#ee7467"/><text x="890" y="337" text-anchor="middle" class="num">2</text><text x="955" y="337" text-anchor="start" class="label">Service/coding</text><path d="M890 375 L390 385" stroke="#fff" stroke-width="5"/><circle cx="390" cy="415" r="42" fill="#2eb5a2"/><text x="390" y="422" text-anchor="middle" class="num">3</text><text x="325" y="422" text-anchor="end" class="label">Flash/program</text><path d="M390 460 L890 470" stroke="#fff" stroke-width="5"/><circle cx="890" cy="500" r="42" fill="#ee7467"/><text x="890" y="507" text-anchor="middle" class="num">4</text><text x="955" y="507" text-anchor="start" class="label">Official procedure</text><path d="M890 545 L390 555" stroke="#fff" stroke-width="5"/><circle cx="390" cy="585" r="42" fill="#2eb5a2"/><text x="390" y="592" text-anchor="middle" class="num">5</text><text x="325" y="592" text-anchor="end" class="label">Stop if unresolved</text><style>.head{font:700 38px Arial;fill:#fff}.eye{font:700 18px Arial;fill:#ee7467}.sub{font:400 20px Arial;fill:#c9d5dc}.label{font:700 19px Arial;fill:#fff}.num{font:700 19px Arial;fill:#0f2324}</style></svg>