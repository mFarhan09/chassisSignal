<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="t d"><title id="t">CS-048 connection topology</title><desc id="d">Article-specific diagram for bmw icom vs k dcan</desc><rect width="100%" height="100%" fill="#0f2324"/><text x="50" y="80" class="eye">CS-048 / DECISION EVIDENCE</text><text x="50" y="145" class="head">CONNECTION TOPOLOGY</text><text x="50" y="190" class="sub">USB cable and LAN gateway use different paths</text><rect x="50" y="250" width="297.59999999999997" height="58" rx="29" fill="#2eb5a2"/><text x="74" y="288" class="label">USB cable</text><rect x="50" y="375" width="359.59999999999997" height="58" rx="29" fill="#ee7467"/><text x="74" y="413" class="label">K+DCAN workflow</text><rect x="50" y="500" width="421.59999999999997" height="58" rx="29" fill="#2eb5a2"/><text x="74" y="538" class="label">LAN gateway</text><rect x="50" y="625" width="483.6" height="58" rx="29" fill="#ee7467"/><text x="74" y="663" class="label">ICOM + ISTA</text><rect x="50" y="750" width="545.6" height="58" rx="29" fill="#2eb5a2"/><text x="74" y="788" class="label">Stable power</text><style>.head{font:700 30px Arial;fill:#fff}.eye{font:700 18px Arial;fill:#ee7467}.sub{font:400 18px Arial;fill:#c9d5dc}.label{font:700 18px Arial;fill:#fff}.num{font:700 19px Arial;fill:#0f2324}</style></svg>