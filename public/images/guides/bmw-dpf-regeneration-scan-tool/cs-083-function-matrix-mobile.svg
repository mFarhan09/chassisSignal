<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="ti de"><title id="ti">DPF function taxonomy and preconditions</title><desc id="de">A tool that shows DPF data does not necessarily request a regeneration; separate the functions.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="58" class="h">DPF function taxonomy and preconditions</text><text x="44" y="94" class="s">A tool that shows DPF data does not necessarily request a regeneration; separate</text><text x="44" y="115" class="s">the functions.</text><rect x="40" y="156" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="186" class="l">Read DPF data</text><text x="56" y="210" class="m">What it proves: Current soot/ash load and pressure</text><text x="56" y="232" class="m">Precondition / limit: Live values only; not a repair</text><rect x="40" y="306" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="336" class="l">Read / clear codes</text><text x="56" y="360" class="m">What it proves: Faults present or in history</text><text x="56" y="382" class="m">Precondition / limit: Clearing hides, not fixes, a cause</text><rect x="40" y="456" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="486" class="l">Regeneration status</text><text x="56" y="510" class="m">What it proves: Whether and when it last ran</text><text x="56" y="532" class="m">Precondition / limit: Status is evidence, not action</text><rect x="40" y="606" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="636" class="l">Regeneration request</text><text x="56" y="660" class="m">What it proves: Tool can start a service regen</text><text x="56" y="682" class="m">Precondition / limit: Needs temp, fuel, no blocking fault</text><rect x="40" y="756" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="786" class="l">Replacement reset</text><text x="56" y="810" class="m">What it proves: Adaptation reset for a new DPF</text><text x="56" y="832" class="m">Precondition / limit: Only after a genuine replacement</text><style>.h{font:700 29px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 17px Arial,sans-serif;fill:#bfd0dc}.l{font:600 17px Arial,sans-serif;fill:#fff}.m{font:400 15px Arial,sans-serif;fill:#bfd0dc}.b{font:700 16px Arial,sans-serif;fill:#0c1727}.t{font:700 16px Arial,sans-serif;fill:#65c8ff}</style></svg>