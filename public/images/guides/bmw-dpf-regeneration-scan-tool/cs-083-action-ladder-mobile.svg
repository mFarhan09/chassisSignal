<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="ti de"><title id="ti">From DPF warning to the correct action</title><desc id="de">Follow the evidence in order; do not jump from a warning light to a forced regeneration.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="58" class="h">From DPF warning to the correct action</text><text x="44" y="94" class="s">Follow the evidence in order; do not jump from a warning light to a forced</text><text x="44" y="115" class="s">regeneration.</text><rect x="40" y="162" width="640" height="113" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="74" cy="220" r="20" fill="#65c8ff"/><text x="74" y="226" text-anchor="middle" class="b">1</text><text x="112" y="214" class="l">DPF warning or regen prompt</text><text x="112" y="236" class="m">Do not assume the filter is failed.</text><path d="M74 275 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 74 275)"/><rect x="40" y="289" width="640" height="113" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="74" cy="347" r="20" fill="#65c8ff"/><text x="74" y="353" text-anchor="middle" class="b">2</text><text x="112" y="341" class="l">Read data and fault memory</text><text x="112" y="363" class="m">Check soot/ash load and any active faults.</text><path d="M74 403 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 74 403)"/><rect x="40" y="417" width="640" height="113" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="74" cy="474" r="20" fill="#65c8ff"/><text x="74" y="480" text-anchor="middle" class="b">3</text><text x="112" y="468" class="l">Rule out blocking faults</text><text x="112" y="490" class="m">EGR, sensors, glow and thermostat faults first.</text><path d="M74 530 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 74 530)"/><rect x="40" y="544" width="640" height="113" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="74" cy="602" r="20" fill="#65c8ff"/><text x="74" y="608" text-anchor="middle" class="b">4</text><text x="112" y="596" class="l">Confirm prerequisites</text><text x="112" y="618" class="m">Temperature, fuel level and a safe location.</text><path d="M74 657 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 74 657)"/><rect x="40" y="671" width="640" height="113" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="74" cy="729" r="20" fill="#65c8ff"/><text x="74" y="735" text-anchor="middle" class="b">5</text><text x="112" y="723" class="l">Request regeneration</text><text x="112" y="745" class="m">Only with clear preconditions; monitor the run.</text><path d="M74 785 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 74 785)"/><rect x="40" y="799" width="640" height="113" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="74" cy="856" r="20" fill="#65c8ff"/><text x="74" y="862" text-anchor="middle" class="b">6</text><text x="112" y="850" class="l">Verify completion or escalate</text><text x="112" y="872" class="m">Pressure and soot normalize, or go to a workshop.</text><text x="40" y="956" class="s" fill="#ff7f7f">A blocking fault means stop and diagnose — not repeat forced regenerations.</text><style>.h{font:700 29px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 17px Arial,sans-serif;fill:#bfd0dc}.l{font:600 17px Arial,sans-serif;fill:#fff}.m{font:400 15px Arial,sans-serif;fill:#bfd0dc}.b{font:700 16px Arial,sans-serif;fill:#0c1727}.t{font:700 16px Arial,sans-serif;fill:#65c8ff}</style></svg>