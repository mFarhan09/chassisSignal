<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ti de"><title id="ti">DPF function taxonomy and preconditions</title><desc id="de">A tool that shows DPF data does not necessarily request a regeneration; separate the functions.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="56" y="60" class="h">DPF function taxonomy and preconditions</text><text x="56" y="102" class="s">A tool that shows DPF data does not necessarily request a regeneration; separate the functions.</text><rect x="56" y="147" width="1168" height="40" fill="#1b2f4a"/><text x="70" y="174" class="t">Function</text><text x="573" y="174" text-anchor="middle" class="t">What it proves</text><text x="1007" y="174" text-anchor="middle" class="t">Precondition / limit</text><rect x="56" y="187" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="242" class="l">Read DPF data</text><text x="573" y="241" text-anchor="middle" class="m">Current soot/ash load and pressure</text><text x="1007" y="241" text-anchor="middle" class="m">Live values only; not a repair</text><line x1="356" y1="147" x2="356" y2="288" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="288" stroke="#3a5578" stroke-width="1"/><rect x="56" y="287.6" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="343" class="l">Read / clear codes</text><text x="573" y="342" text-anchor="middle" class="m">Faults present or in history</text><text x="1007" y="342" text-anchor="middle" class="m">Clearing hides, not fixes, a cause</text><line x1="356" y1="147" x2="356" y2="388" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="388" stroke="#3a5578" stroke-width="1"/><rect x="56" y="388.20000000000005" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="444" class="l">Regeneration status</text><text x="573" y="443" text-anchor="middle" class="m">Whether and when it last ran</text><text x="1007" y="443" text-anchor="middle" class="m">Status is evidence, not action</text><line x1="356" y1="147" x2="356" y2="489" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="489" stroke="#3a5578" stroke-width="1"/><rect x="56" y="488.80000000000007" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="544" class="l">Regeneration request</text><text x="573" y="543" text-anchor="middle" class="m">Tool can start a service regen</text><text x="1007" y="543" text-anchor="middle" class="m">Needs temp, fuel, no blocking fault</text><line x1="356" y1="147" x2="356" y2="589" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="589" stroke="#3a5578" stroke-width="1"/><rect x="56" y="589.4000000000001" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="645" class="l">Replacement reset</text><text x="573" y="644" text-anchor="middle" class="m">Adaptation reset for a new DPF</text><text x="1007" y="644" text-anchor="middle" class="m">Only after a genuine replacement</text><line x1="356" y1="147" x2="356" y2="690" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="690" stroke="#3a5578" stroke-width="1"/><style>.h{font:700 34px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 19px Arial,sans-serif;fill:#bfd0dc}.l{font:600 16px Arial,sans-serif;fill:#fff}.m{font:400 14px Arial,sans-serif;fill:#bfd0dc}.b{font:700 15px Arial,sans-serif;fill:#0c1727}.t{font:700 15px Arial,sans-serif;fill:#65c8ff}</style></svg>