<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ti de"><title id="ti">From DPF warning to the correct action</title><desc id="de">Follow the evidence in order; do not jump from a warning light to a forced regeneration.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="56" y="60" class="h">From DPF warning to the correct action</text><text x="56" y="102" class="s">Follow the evidence in order; do not jump from a warning light to a forced regeneration.</text><rect x="56" y="151" width="1168" height="72" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="90" cy="188" r="20" fill="#65c8ff"/><text x="90" y="194" text-anchor="middle" class="b">1</text><text x="128" y="194" class="l">DPF warning or regen prompt</text><text x="547" y="192" class="m">Do not assume the filter is failed.</text><path d="M90 223 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 90 223)"/><rect x="56" y="237" width="1168" height="72" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="90" cy="274" r="20" fill="#65c8ff"/><text x="90" y="280" text-anchor="middle" class="b">2</text><text x="128" y="280" class="l">Read data and fault memory</text><text x="547" y="278" class="m">Check soot/ash load and any active faults.</text><path d="M90 309 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 90 309)"/><rect x="56" y="323" width="1168" height="72" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="90" cy="360" r="20" fill="#65c8ff"/><text x="90" y="366" text-anchor="middle" class="b">3</text><text x="128" y="366" class="l">Rule out blocking faults</text><text x="547" y="364" class="m">EGR, sensors, glow and thermostat faults first.</text><path d="M90 394 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 90 394)"/><rect x="56" y="408" width="1168" height="72" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="90" cy="445" r="20" fill="#65c8ff"/><text x="90" y="451" text-anchor="middle" class="b">4</text><text x="128" y="451" class="l">Confirm prerequisites</text><text x="547" y="449" class="m">Temperature, fuel level and a safe location.</text><path d="M90 480 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 90 480)"/><rect x="56" y="494" width="1168" height="72" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="90" cy="531" r="20" fill="#65c8ff"/><text x="90" y="537" text-anchor="middle" class="b">5</text><text x="128" y="537" class="l">Request regeneration</text><text x="547" y="535" class="m">Only with clear preconditions; monitor the run.</text><path d="M90 566 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 90 566)"/><rect x="56" y="580" width="1168" height="72" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="90" cy="617" r="20" fill="#65c8ff"/><text x="90" y="623" text-anchor="middle" class="b">6</text><text x="128" y="623" class="l">Verify completion or escalate</text><text x="547" y="621" class="m">Pressure and soot normalize, or go to a workshop.</text><text x="56" y="696" class="s" fill="#ff7f7f">A blocking fault means stop and diagnose — not repeat forced regenerations.</text><style>.h{font:700 34px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 19px Arial,sans-serif;fill:#bfd0dc}.l{font:600 16px Arial,sans-serif;fill:#fff}.m{font:400 14px Arial,sans-serif;fill:#bfd0dc}.b{font:700 15px Arial,sans-serif;fill:#0c1727}.t{font:700 15px Arial,sans-serif;fill:#65c8ff}</style></svg>