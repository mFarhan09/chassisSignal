<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="ti de"><title id="ti">Adapter verification checklist</title><desc id="de">Clear each item for your exact car and app before purchase; a connector shape proves nothing.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="58" class="h">Adapter verification checklist</text><text x="44" y="94" class="s">Clear each item for your exact car and app before purchase; a connector shape</text><text x="44" y="115" class="s">proves nothing.</text><rect x="40" y="161" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="221" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 235 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="227" class="l">Confirm the app and your exact model</text><text x="100" y="249" class="m">Check BimmerCode/BimmerLink's own compatibility page for your series and year.</text><rect x="40" y="320" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="380" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 394 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="386" class="l">Match your phone platform</text><text x="100" y="408" class="m">Both support iOS and Android; note UniCarScan also lists Windows.</text><rect x="40" y="479" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="539" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 553 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="545" class="l">Know the pairing steps</text><text x="100" y="567" class="m">iOS needs no pairing; Android pairs the adapter in Bluetooth settings.</text><rect x="40" y="637" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="698" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 712 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="704" class="l">Weigh the app ecosystem</text><text x="100" y="726" class="m">Choose UniCarScan if you also use MotoScan or TuneECU; CX if BMW-only.</text><rect x="40" y="796" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="857" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 871 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="863" class="l">Consider idle current</text><text x="100" y="885" class="m">If the car sits, prefer an adapter with low sleep draw and unplug when parked.</text><style>.h{font:700 29px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 17px Arial,sans-serif;fill:#bfd0dc}.l{font:600 17px Arial,sans-serif;fill:#fff}.m{font:400 15px Arial,sans-serif;fill:#bfd0dc}.b{font:700 16px Arial,sans-serif;fill:#0c1727}.t{font:700 16px Arial,sans-serif;fill:#65c8ff}</style></svg>