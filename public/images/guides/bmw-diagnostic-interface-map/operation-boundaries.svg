<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Different risk categories</title><desc id="d">Read only then Configuration then Service/actuation then Programming</desc><rect width="1200" height="430" fill="#f6f7f3" rx="20"/><text x="30" y="57" font-family="Arial,sans-serif" font-weight="bold" font-size="34" fill="#123d34">Different risk categories</text><rect x="50.0" y="137" width="266.8" height="170" rx="14" fill="#e4eaf2" stroke="#aabcb4"/><text x="67.0" y="183" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#143b35">1</text><text x="67.0" y="240" font-family="Arial,sans-serif" font-size="21" fill="#143b35">Read only</text><rect x="327.8" y="137" width="266.8" height="170" rx="14" fill="#dbeae4" stroke="#aabcb4"/><text x="344.8" y="183" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#143b35">2</text><text x="344.8" y="240" font-family="Arial,sans-serif" font-size="21" fill="#143b35">Configuration</text><rect x="605.5" y="137" width="266.8" height="170" rx="14" fill="#e4eaf2" stroke="#aabcb4"/><text x="622.5" y="183" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#143b35">3</text><text x="622.5" y="240" font-family="Arial,sans-serif" font-size="21" fill="#143b35">Service/actuation</text><rect x="883.3" y="137" width="266.8" height="170" rx="14" fill="#dbeae4" stroke="#aabcb4"/><text x="900.3" y="183" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#143b35">4</text><text x="900.3" y="240" font-family="Arial,sans-serif" font-size="21" fill="#143b35">Programming</text><text x="30" y="402" font-family="Arial,sans-serif" font-size="20" fill="#4b655b">Evidence-led only • Verify each applicable layer</text></svg>