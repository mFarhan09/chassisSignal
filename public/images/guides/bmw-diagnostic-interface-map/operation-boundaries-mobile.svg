<svg xmlns="http://www.w3.org/2000/svg" width="680" height="642" viewBox="0 0 680 642" role="img" aria-labelledby="t d"><title id="t">Different risk categories</title><desc id="d">Read only then Configuration then Service/actuation then Programming</desc><rect width="680" height="642" fill="#f6f7f3" rx="20"/><text x="30" y="57" font-family="Arial,sans-serif" font-weight="bold" font-size="29" fill="#123d34">Different risk categories</text><rect x="28.0" y="100" width="624.0" height="91" rx="14" fill="#e4eaf2" stroke="#aabcb4"/><text x="45.0" y="146" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#143b35">1</text><text x="45.0" y="172" font-family="Arial,sans-serif" font-size="23" fill="#143b35">Read only</text><rect x="28.0" y="222" width="624.0" height="91" rx="14" fill="#dbeae4" stroke="#aabcb4"/><text x="45.0" y="268" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#143b35">2</text><text x="45.0" y="294" font-family="Arial,sans-serif" font-size="23" fill="#143b35">Configuration</text><rect x="28.0" y="344" width="624.0" height="91" rx="14" fill="#e4eaf2" stroke="#aabcb4"/><text x="45.0" y="390" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#143b35">3</text><text x="45.0" y="416" font-family="Arial,sans-serif" font-size="23" fill="#143b35">Service/actuation</text><rect x="28.0" y="466" width="624.0" height="91" rx="14" fill="#dbeae4" stroke="#aabcb4"/><text x="45.0" y="512" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#143b35">4</text><text x="45.0" y="538" font-family="Arial,sans-serif" font-size="23" fill="#143b35">Programming</text><text x="30" y="614" font-family="Arial,sans-serif" font-size="20" fill="#4b655b">Evidence-led only • Verify each applicable layer</text></svg>