<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Service mode is a state machine</title><desc id="desc">Diagnosis, service entry, mechanical work, restoration and verification are distinct states. Pre-scan; Service entry; Mechanical service; Restore state; Post-check.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="64" y="68" class="heading">Service mode is a state machine</text><text x="64" y="114" class="sub">Diagnosis, service entry, mechanical work, restoration and verification are distinct states.</text><circle cx="105" cy="215" r="21" fill="#65c8ff"/><rect x="155" y="184" width="950" height="62" rx="15" fill="#243b5a"/><text x="190" y="222" text-anchor="start" class="label"><tspan x="190" dy="0">Pre-scan</tspan></text><circle cx="105" cy="297" r="21" fill="#65c8ff"/><rect x="155" y="266" width="950" height="62" rx="15" fill="#243b5a"/><text x="190" y="304" text-anchor="start" class="label"><tspan x="190" dy="0">Service entry</tspan></text><circle cx="105" cy="379" r="21" fill="#65c8ff"/><rect x="155" y="348" width="950" height="62" rx="15" fill="#243b5a"/><text x="190" y="386" text-anchor="start" class="label"><tspan x="190" dy="0">Mechanical service</tspan></text><circle cx="105" cy="461" r="21" fill="#65c8ff"/><rect x="155" y="430" width="950" height="62" rx="15" fill="#243b5a"/><text x="190" y="468" text-anchor="start" class="label"><tspan x="190" dy="0">Restore state</tspan></text><circle cx="105" cy="543" r="21" fill="#ff7f7f"/><rect x="155" y="512" width="950" height="62" rx="15" fill="#243b5a"/><text x="190" y="550" text-anchor="start" class="label"><tspan x="190" dy="0">Post-check</tspan></text><circle cx="24" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="40" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="56" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="72" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="88" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="104" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="120" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="136" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="152" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="168" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="184" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#bfd0dc}.label{font:600 17px Arial,sans-serif;fill:#fff}</style></svg>