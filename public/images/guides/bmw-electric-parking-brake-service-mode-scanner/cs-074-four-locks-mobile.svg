<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Four locks before a command</title><desc id="desc">Architecture, service event, exact function and conditions must all unlock. Brake system; Service event; Named command; Vehicle conditions; Permission to proceed.</desc><rect width="720" height="980" fill="#17120c"/><rect width="720" height="16" fill="#f0ad4e"/><text x="44" y="70" class="heading">Four locks before a command</text><text x="44" y="122" class="sub">Architecture, service event, exact function and conditions must all unlock.</text><rect x="65" y="210" width="590" height="92" rx="46" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="360" y="264" text-anchor="middle" class="label"><tspan x="360" dy="0">Brake system</tspan></text><rect x="93" y="340" width="534" height="92" rx="46" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="360" y="394" text-anchor="middle" class="label"><tspan x="360" dy="0">Service event</tspan></text><rect x="121" y="470" width="478" height="92" rx="46" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="360" y="524" text-anchor="middle" class="label"><tspan x="360" dy="0">Named command</tspan></text><rect x="149" y="600" width="422" height="92" rx="46" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="360" y="654" text-anchor="middle" class="label"><tspan x="360" dy="0">Vehicle conditions</tspan></text><rect x="177" y="730" width="366" height="92" rx="46" fill="#49351f" stroke="#e8e1d3" stroke-width="4"/><text x="360" y="772" text-anchor="middle" class="label"><tspan x="360" dy="0">Permission to</tspan><tspan x="360" dy="24">proceed</tspan></text><circle cx="24" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="40" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="56" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="72" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="88" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="104" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="120" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="136" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="152" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="168" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#bfd0dc}.label{font:600 19px Arial,sans-serif;fill:#fff}</style></svg>