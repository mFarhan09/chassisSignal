<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Service mode is a state machine</title><desc id="desc">Diagnosis, service entry, mechanical work, restoration and verification are distinct states. Pre-scan; Service entry; Mechanical service; Restore state; Post-check.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="70" class="heading">Service mode is a state machine</text><text x="44" y="122" class="sub">Diagnosis, service entry, mechanical work, restoration and verification are distinct states.</text><rect x="80" y="210" width="560" height="84" rx="18" fill="#243b5a" stroke="#65c8ff" stroke-width="3"/><circle cx="115" cy="252" r="21" fill="#65c8ff"/><text x="365" y="260" text-anchor="middle" class="label"><tspan x="365" dy="0">Pre-scan</tspan></text><path d="M115 273V366" stroke="#698397" stroke-width="5"/><rect x="80" y="345" width="560" height="84" rx="18" fill="#243b5a" stroke="#65c8ff" stroke-width="3"/><circle cx="115" cy="387" r="21" fill="#65c8ff"/><text x="365" y="395" text-anchor="middle" class="label"><tspan x="365" dy="0">Service entry</tspan></text><path d="M115 408V501" stroke="#698397" stroke-width="5"/><rect x="80" y="480" width="560" height="84" rx="18" fill="#243b5a" stroke="#65c8ff" stroke-width="3"/><circle cx="115" cy="522" r="21" fill="#65c8ff"/><text x="365" y="530" text-anchor="middle" class="label"><tspan x="365" dy="0">Mechanical service</tspan></text><path d="M115 543V636" stroke="#698397" stroke-width="5"/><rect x="80" y="615" width="560" height="84" rx="18" fill="#243b5a" stroke="#65c8ff" stroke-width="3"/><circle cx="115" cy="657" r="21" fill="#65c8ff"/><text x="365" y="665" text-anchor="middle" class="label"><tspan x="365" dy="0">Restore state</tspan></text><path d="M115 678V771" stroke="#698397" stroke-width="5"/><rect x="80" y="750" width="560" height="84" rx="18" fill="#243b5a" stroke="#ff7f7f" stroke-width="3"/><circle cx="115" cy="792" r="21" fill="#ff7f7f"/><text x="365" y="800" text-anchor="middle" class="label"><tspan x="365" dy="0">Post-check</tspan></text><circle cx="24" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="40" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="56" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="72" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="88" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="104" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="120" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="136" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="152" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="168" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="184" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#bfd0dc}.label{font:600 19px Arial,sans-serif;fill:#fff}</style></svg>