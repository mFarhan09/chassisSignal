<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Four locks before a command</title><desc id="desc">Architecture, service event, exact function and conditions must all unlock. Brake system; Service event; Named command; Vehicle conditions; Permission to proceed.</desc><rect width="1280" height="720" fill="#17120c"/><rect width="1280" height="16" fill="#f0ad4e"/><text x="64" y="68" class="heading">Four locks before a command</text><text x="64" y="114" class="sub">Architecture, service event, exact function and conditions must all unlock.</text><rect x="107.5" y="300" width="185" height="145" rx="22" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="200" y="380" text-anchor="middle" class="label"><tspan x="200" dy="0">Brake system</tspan></text><path d="M292.5 372L327.5 467" stroke="#f0ad4e" stroke-width="5"/><rect x="327.5" y="395" width="185" height="145" rx="25" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="420" y="475" text-anchor="middle" class="label"><tspan x="420" dy="0">Service event</tspan></text><path d="M512.5 467L547.5 372" stroke="#f0ad4e" stroke-width="5"/><rect x="547.5" y="300" width="185" height="145" rx="28" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="640" y="380" text-anchor="middle" class="label"><tspan x="640" dy="0">Named command</tspan></text><path d="M732.5 372L767.5 467" stroke="#f0ad4e" stroke-width="5"/><rect x="767.5" y="395" width="185" height="145" rx="31" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="860" y="475" text-anchor="middle" class="label"><tspan x="860" dy="0">Vehicle conditions</tspan></text><path d="M952.5 467L987.5 372" stroke="#f0ad4e" stroke-width="5"/><rect x="987.5" y="300" width="185" height="145" rx="34" fill="#49351f" stroke="#e8e1d3" stroke-width="4"/><text x="1080" y="368" text-anchor="middle" class="label"><tspan x="1080" dy="0">Permission to</tspan><tspan x="1080" dy="24">proceed</tspan></text><circle cx="24" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="40" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="56" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="72" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="88" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="104" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="120" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="136" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="152" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="168" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#bfd0dc}.label{font:600 17px Arial,sans-serif;fill:#fff}</style></svg>