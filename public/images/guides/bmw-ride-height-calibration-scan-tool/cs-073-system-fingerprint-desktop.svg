<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Identify the suspension fingerprint</title><desc id="desc">Vehicle, axle layout, control unit, sensors and service event define the calibration owner. Vehicle identity; Axle configuration; EHC or VDM; Sensor state; Service trigger.</desc><rect width="1280" height="720" fill="#111827"/><rect width="1280" height="16" fill="#72b7ff"/><text x="64" y="68" class="heading">Identify the suspension fingerprint</text><text x="64" y="114" class="sub">Vehicle, axle layout, control unit, sensors and service event define the calibration owner.</text><rect x="107.5" y="300" width="185" height="145" rx="22" fill="#28364d" stroke="#72b7ff" stroke-width="4"/><text x="200" y="380" text-anchor="middle" class="label"><tspan x="200" dy="0">Vehicle identity</tspan></text><path d="M292.5 372L327.5 467" stroke="#72b7ff" stroke-width="5"/><rect x="327.5" y="395" width="185" height="145" rx="25" fill="#28364d" stroke="#72b7ff" stroke-width="4"/><text x="420" y="475" text-anchor="middle" class="label"><tspan x="420" dy="0">Axle configuration</tspan></text><path d="M512.5 467L547.5 372" stroke="#72b7ff" stroke-width="5"/><rect x="547.5" y="300" width="185" height="145" rx="28" fill="#28364d" stroke="#72b7ff" stroke-width="4"/><text x="640" y="380" text-anchor="middle" class="label"><tspan x="640" dy="0">EHC or VDM</tspan></text><path d="M732.5 372L767.5 467" stroke="#72b7ff" stroke-width="5"/><rect x="767.5" y="395" width="185" height="145" rx="31" fill="#28364d" stroke="#72b7ff" stroke-width="4"/><text x="860" y="475" text-anchor="middle" class="label"><tspan x="860" dy="0">Sensor state</tspan></text><path d="M952.5 467L987.5 372" stroke="#72b7ff" stroke-width="5"/><rect x="987.5" y="300" width="185" height="145" rx="34" fill="#28364d" stroke="#ffb85c" stroke-width="4"/><text x="1080" y="380" text-anchor="middle" class="label"><tspan x="1080" dy="0">Service trigger</tspan></text><circle cx="24" cy="698" r="2" fill="#ffb85c" opacity=".28"/><circle cx="40" cy="698" r="2" fill="#ffb85c" opacity=".28"/><circle cx="56" cy="698" r="2" fill="#ffb85c" opacity=".28"/><circle cx="72" cy="698" r="2" fill="#ffb85c" opacity=".28"/><circle cx="88" cy="698" r="2" fill="#ffb85c" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#bfd0dc}.label{font:600 17px Arial,sans-serif;fill:#fff}</style></svg>