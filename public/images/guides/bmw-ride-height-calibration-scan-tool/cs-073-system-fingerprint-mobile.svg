<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Identify the suspension fingerprint</title><desc id="desc">Vehicle, axle layout, control unit, sensors and service event define the calibration owner. Vehicle identity; Axle configuration; EHC or VDM; Sensor state; Service trigger.</desc><rect width="720" height="980" fill="#111827"/><rect width="720" height="16" fill="#72b7ff"/><text x="44" y="70" class="heading">Identify the suspension fingerprint</text><text x="44" y="122" class="sub">Vehicle, axle layout, control unit, sensors and service event define the calibration owner.</text><rect x="65" y="210" width="590" height="92" rx="46" fill="#28364d" stroke="#72b7ff" stroke-width="4"/><text x="360" y="264" text-anchor="middle" class="label"><tspan x="360" dy="0">Vehicle identity</tspan></text><rect x="93" y="340" width="534" height="92" rx="46" fill="#28364d" stroke="#72b7ff" stroke-width="4"/><text x="360" y="394" text-anchor="middle" class="label"><tspan x="360" dy="0">Axle configuration</tspan></text><rect x="121" y="470" width="478" height="92" rx="46" fill="#28364d" stroke="#72b7ff" stroke-width="4"/><text x="360" y="524" text-anchor="middle" class="label"><tspan x="360" dy="0">EHC or VDM</tspan></text><rect x="149" y="600" width="422" height="92" rx="46" fill="#28364d" stroke="#72b7ff" stroke-width="4"/><text x="360" y="654" text-anchor="middle" class="label"><tspan x="360" dy="0">Sensor state</tspan></text><rect x="177" y="730" width="366" height="92" rx="46" fill="#28364d" stroke="#ffb85c" stroke-width="4"/><text x="360" y="784" text-anchor="middle" class="label"><tspan x="360" dy="0">Service trigger</tspan></text><circle cx="24" cy="958" r="2" fill="#ffb85c" opacity=".28"/><circle cx="40" cy="958" r="2" fill="#ffb85c" opacity=".28"/><circle cx="56" cy="958" r="2" fill="#ffb85c" opacity=".28"/><circle cx="72" cy="958" r="2" fill="#ffb85c" opacity=".28"/><circle cx="88" cy="958" r="2" fill="#ffb85c" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#bfd0dc}.label{font:600 19px Arial,sans-serif;fill:#fff}</style></svg>