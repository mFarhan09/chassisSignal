<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Stop when the reference is unreliable</title><desc id="desc">Mechanical faults, unsafe support or missing specifications invalidate calibration. Level surface; Correct loading; Healthy sensors; No mechanical fault; Current repair plan.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="70" class="heading">Stop when the reference is unreliable</text><text x="44" y="122" class="sub">Mechanical faults, unsafe support or missing specifications invalidate calibration.</text><circle cx="360" cy="520" r="94" fill="#65c8ff"/><text x="360" y="528" text-anchor="middle" class="label"><tspan x="360" dy="0">DECIDE</tspan></text><path d="M360 520L360 235" stroke="#698397" stroke-width="4"/><rect x="255" y="193" width="210" height="84" rx="20" fill="#243b5a" stroke="#65c8ff" stroke-width="3"/><text x="360" y="243" text-anchor="middle" class="label"><tspan x="360" dy="0">Level surface</tspan></text><path d="M360 520L583.4982813293611 431.93015660314" stroke="#698397" stroke-width="4"/><rect x="478.49828132936113" y="389.93015660314" width="210" height="84" rx="20" fill="#243b5a" stroke="#ff7f7f" stroke-width="3"/><text x="583.4982813293611" y="439.93015660314" text-anchor="middle" class="label"><tspan x="583.4982813293611" dy="0">Correct loading</tspan></text><path d="M360 520L498.1295342887312 750.56984339686" stroke="#698397" stroke-width="4"/><rect x="393.1295342887312" y="708.56984339686" width="210" height="84" rx="20" fill="#243b5a" stroke="#65c8ff" stroke-width="3"/><text x="498.1295342887312" y="758.56984339686" text-anchor="middle" class="label"><tspan x="498.1295342887312" dy="0">Healthy sensors</tspan></text><path d="M360 520L221.87046571126885 750.56984339686" stroke="#698397" stroke-width="4"/><rect x="116.87046571126885" y="708.56984339686" width="210" height="84