<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Calibration is a closed evidence loop</title><desc id="desc">Preparation and measurement surround the diagnostic command and its verification. Prepare; Measure; Enter values; Execute function; Verify state.</desc><rect width="1280" height="720" fill="#181426"/><rect width="1280" height="16" fill="#c5a3ff"/><text x="64" y="68" class="heading">Calibration is a closed evidence loop</text><text x="64" y="114" class="sub">Preparation and measurement surround the diagnostic command and its verification.</text><circle cx="105" cy="215" r="21" fill="#c5a3ff"/><rect x="155" y="184" width="950" height="62" rx="15" fill="#3e315c"/><text x="190" y="222" text-anchor="start" class="label"><tspan x="190" dy="0">Prepare</tspan></text><circle cx="105" cy="297" r="21" fill="#c5a3ff"/><rect x="155" y="266" width="950" height="62" rx="15" fill="#3e315c"/><text x="190" y="304" text-anchor="start" class="label"><tspan x="190" dy="0">Measure</tspan></text><circle cx="105" cy="379" r="21" fill="#c5a3ff"/><rect x="155" y="348" width="950" height="62" rx="15" fill="#3e315c"/><text x="190" y="386" text-anchor="start" class="label"><tspan x="190" dy="0">Enter values</tspan></text><circle cx="105" cy="461" r="21" fill="#c5a3ff"/><rect x="155" y="430" width="950" height="62" rx="15" fill="#3e315c"/><text x="190" y="468" text-anchor="start" class="label"><tspan x="190" dy="0">Execute function</tspan></text><circle cx="105" cy="543" r="21" fill="#78e3d2"/><rect x="155" y="512" width="950" height="62" rx="15" fill="#3e315c"/><text x="190" y="550" text-anchor="start" class="label"><tspan x="190" dy="0">Verify state</tspan></text><circle cx="24" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="40" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="56" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="72" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="88" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="104" cy="698" r="2" fill="#78e3d2" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#bfd0dc}.label{font:600 17px Arial,sans-serif;fill:#fff}</style></svg>