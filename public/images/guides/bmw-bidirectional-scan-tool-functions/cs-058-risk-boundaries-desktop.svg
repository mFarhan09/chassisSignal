<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Diagnostic Risk Boundaries</title><desc id="desc">Safety classification distinguishing read-only diagnosis from component actuation, calibration resets, and ECU flashing.</desc><rect width="100%" height="100%" fill="#17281f"/><text x="68" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f4ba55">SAFETY AND RISK CLASSIFICATION</text><text x="68" y="112" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">DIAGNOSTIC RISK BOUNDARIES</text><text x="68" y="158" font-family="Arial, sans-serif" font-size="19" fill="#e9f5ec">Understand the distinct operational risks between component tests and software writes</text><line x1="100" y1="610" x2="1170" y2="610" stroke="#e9f5ec" stroke-width="5" /><line x1="100" y1="240" x2="100" y2="610" stroke="#e9f5ec" stroke-width="5" /><path d="M110 570 C330 555 480 500 640 420 S930 270 1160 250" stroke="#f4ba55" stroke-width="11" fill="none" /><polygon points="155,550 180,505 205,550" fill="#60c780" /><text x="180" y="585" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="180" dy="0">Read-only</tspan></text><polygon points="365,485 390,440 415,485" fill="#60c780" /><text x="390" y="520" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="390" dy="0">Reset or</tspan><tspan x="390" dy="22">relearn</tspan></text><polygon points="575,420 600,375 625,420" fill="#f4ba55" /><text x="600" y="455" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="600" dy="0">Actuator</tspan><tspan x="600" dy="22">command</tspan></text><polygon points="785,355 810,310 835,355" fill="#f4ba55" /><text x="810" y="390" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="810" dy="0">Configuration</tspan><tspan x="810" dy="22">write</tspan></text><polygon points="995,290 1020,245 1045,290" fill="#f4ba55" /><text x="1020" y="325" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="1020" dy="0">Software</tspan><tspan x="1020" dy="22">write</tspan></text></svg>