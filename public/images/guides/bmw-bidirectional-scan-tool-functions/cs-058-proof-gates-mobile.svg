<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Purchase Proof Gates</title><desc id="desc">Verification gates requiring proof of exact vehicle chassis, named electronic module, and specific active actuator command.</desc><rect width="100%" height="100%" fill="#17281f"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f4ba55">COVERAGE VERIFICATION</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#fff">PURCHASE PROOF GATES</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="17" fill="#e9f5ec">Demand verified module and actuator command proof before ordering hardware</text><path d="M90 770 C170 650 120 540 230 475 C340 410 310 300 560 250" stroke="#e9f5ec" stroke-width="12" fill="none" /><rect x="85" y="680" width="250" height="72" rx="12" fill="#60c780" /><path d="M210 680 v-45" stroke="#60c780" stroke-width="6" fill="none" /><text x="210" y="704" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="210" dy="0">Exact vehicle</tspan></text><rect x="440" y="575" width="250" height="72" rx="12" fill="#f4ba55" /><path d="M565 575 v-45" stroke="#f4ba55" stroke-width="6" fill="none" /><text x="565" y="599" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="565" dy="0">Named module</tspan></text><rect x="85" y="470" width="250" height="72" rx="12" fill="#60c780" /><path d="M210 470 v-45" stroke="#60c780" stroke-width="6" fill="none" /><text x="210" y="494" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="210" dy="0">Named command</tspan></text><rect x="440" y="365" width="250" height="72" rx="12" fill="#f4ba55" /><path d="M565 365 v-45" stroke="#f4ba55" stroke-width="6" fill="none" /><text x="565" y="389" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="565" dy="0">License state</tspan></text><rect x="85" y="260" width="250" height="72" rx="12" fill="#60c780" /><path d="M210 260 v-45" stroke="#60c780" stroke-width="6" fill="none" /><text x="210" y="284" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="210" dy="0">Safety condition</tspan></text></svg>