<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Purchase Proof Gates</title><desc id="desc">Verification gates requiring proof of exact vehicle chassis, named electronic module, and specific active actuator command.</desc><rect width="100%" height="100%" fill="#17281f"/><text x="68" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f4ba55">COVERAGE VERIFICATION</text><text x="68" y="112" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">PURCHASE PROOF GATES</text><text x="68" y="158" font-family="Arial, sans-serif" font-size="19" fill="#e9f5ec">Demand verified module and actuator command proof before ordering hardware</text><line x1="105" y1="440" x2="1175" y2="440" stroke="#e9f5ec" stroke-width="12" /><path d="M170 440 V300" stroke="#60c780" stroke-width="7" fill="none" /><rect x="90" y="245" width="160" height="90" rx="16" fill="none" stroke="#60c780" stroke-width="7"/><text x="170" y="278" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="170" dy="0">Exact vehicle</tspan></text><path d="M385 440 V480" stroke="#f4ba55" stroke-width="7" fill="none" /><rect x="305" y="425" width="160" height="90" rx="16" fill="none" stroke="#f4ba55" stroke-width="7"/><text x="385" y="458" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="385" dy="0">Named module</tspan></text><path d="M600 440 V300" stroke="#60c780" stroke-width="7" fill="none" /><rect x="520" y="245" width="160" height="90" rx="16" fill="none" stroke="#60c780" stroke-width="7"/><text x="600" y="278" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="600" dy="0">Named command</tspan></text><path d="M815 440 V480" stroke="#f4ba55" stroke-width="7" fill="none" /><rect x="735" y="425" width="160" height="90" rx="16" fill="none" stroke="#f4ba55" stroke-width="7"/><text x="815" y="458" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="815" dy="0">License state</tspan></text><path d="M1030 440 V300" stroke="#60c780" stroke-width="7" fill="none" /><rect x="950" y="245" width="160" height="90" rx="16" fill="none" stroke="#60c780" stroke-width="7"/><text x="1030" y="278" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="1030" dy="0">Safety</tspan><tspan x="1030" dy="22">condition</tspan></text></svg>