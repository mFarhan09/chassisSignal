<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Active-Test Diagnostic Loop</title><desc id="desc">Step-by-step diagnostic loop illustrating fault symptom verification, module readiness, and actuator command execution.</desc><rect width="100%" height="100%" fill="#17281f"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f4ba55">DIAGNOSTIC PROCEDURE</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#fff">ACTIVE-TEST DIAGNOSTIC LOOP</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="17" fill="#e9f5ec">Validate component operation methodically with controlled actuator commands</text><path d="M360 280 Q440 355 570 430" stroke="#e9f5ec" stroke-width="6" fill="none" /><circle cx="360" cy="280" r="58" fill="#60c780" /><text x="360" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#17281f">1</text><text x="360" y="368" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="360" dy="0">Record symptom</tspan></text><path d="M570 430 Q555 565 490 700" stroke="#e9f5ec" stroke-width="6" fill="none" /><circle cx="570" cy="430" r="58" fill="#f4ba55" /><text x="570" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#17281f">2</text><text x="570" y="518" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="570" dy="0">Read faults</tspan></text><path d="M490 700 Q335 700 230 700" stroke="#e9f5ec" stroke-width="6" fill="none" /><circle cx="490" cy="700" r="58" fill="#60c780" /><text x="490" y="706" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#17281f">3</text><text x="490" y="788" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="490" dy="0">Check</tspan><tspan x="490" dy="22">prerequisites</tspan></text><path d="M230 700 Q215 565 150 430" stroke="#e9f5ec" stroke-width="6" fill="none" /><circle cx="230" cy="700" r="58" fill="#f4ba55" /><text x="230" y="706" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#17281f">4</text><text x="230" y="788" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="230" dy="0">Command output</tspan></text><path d="M150 430 Q230 355 360 280" stroke="#e9f5ec" stroke-width="6" fill="none" /><circle cx="150" cy="430" r="58" fill="#60c780" /><text x="150" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#17281f">5</text><text x="150" y="518" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="150" dy="0">Observe response</tspan></text><circle cx="360" cy="510" r="70" fill="#e9f5ec" /><text x="360" y="505" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17281f"><tspan x="360" dy="0">observe</tspan></text></svg>