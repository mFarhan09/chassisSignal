<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Active-Test Diagnostic Loop</title><desc id="desc">Step-by-step diagnostic loop illustrating fault symptom verification, module readiness, and actuator command execution.</desc><rect width="100%" height="100%" fill="#17281f"/><text x="68" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f4ba55">DIAGNOSTIC PROCEDURE</text><text x="68" y="112" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">ACTIVE-TEST DIAGNOSTIC LOOP</text><text x="68" y="158" font-family="Arial, sans-serif" font-size="19" fill="#e9f5ec">Validate component operation methodically with controlled actuator commands</text><path d="M250 420 Q315 340 430 260" stroke="#e9f5ec" stroke-width="6" fill="none" /><circle cx="250" cy="420" r="62" fill="#60c780" /><text x="250" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#17281f">1</text><text x="250" y="518" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="250" dy="0">Record symptom</tspan></text><path d="M430 260 Q600 265 720 270" stroke="#e9f5ec" stroke-width="6" fill="none" /><circle cx="430" cy="260" r="62" fill="#f4ba55" /><text x="430" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#17281f">2</text><text x="430" y="358" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="430" dy="0">Read faults</tspan></text><path d="M720 270 Q840 345 1010 420" stroke="#e9f5ec" stroke-width="6" fill="none" /><circle cx="720" cy="270" r="62" fill="#60c780" /><text x="720" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#17281f">3</text><text x="720" y="368" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="720" dy="0">Check</tspan><tspan x="720" dy="22">prerequisites</tspan></text><path d="M1010 420 Q890 500 720 580" stroke="#e9f5ec" stroke-width="6" fill="none" /><circle cx="1010" cy="420" r="62" fill="#f4ba55" /><text x="1010" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#17281f">4</text><text x="1010" y="518" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="1010" dy="0">Command output</tspan></text><path d="M720 580 Q460 500 250 420" stroke="#e9f5ec" stroke-width="6" fill="none" /><circle cx="720" cy="580" r="62" fill="#60c780" /><text x="720" y="586" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#17281f">5</text><text x="720" y="678" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="720" dy="0">Observe response</tspan></text><circle cx="630" cy="420" r="78" fill="#e9f5ec" /><text x="630" y="415" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17281f"><tspan x="630" dy="0">observe</tspan></text></svg>