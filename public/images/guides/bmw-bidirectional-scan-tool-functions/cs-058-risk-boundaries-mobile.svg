<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Diagnostic Risk Boundaries</title><desc id="desc">Safety classification distinguishing read-only diagnosis from component actuation, calibration resets, and ECU flashing.</desc><rect width="100%" height="100%" fill="#17281f"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f4ba55">SAFETY AND RISK CLASSIFICATION</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#fff">DIAGNOSTIC RISK BOUNDARIES</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="17" fill="#e9f5ec">Understand the distinct operational risks between component tests and software writes</text><line x1="100" y1="780" x2="630" y2="780" stroke="#e9f5ec" stroke-width="5" /><line x1="100" y1="250" x2="100" y2="780" stroke="#e9f5ec" stroke-width="5" /><path d="M100 710 C230 650 310 570 390 440 C470 330 560 280 630 245" stroke="#f4ba55" stroke-width="10" fill="none" /><circle cx="150" cy="700" r="24" fill="#60c780" /><text x="150" y="745" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff"><tspan x="150" dy="0">Read-only</tspan></text><circle cx="255" cy="612" r="24" fill="#60c780" /><text x="255" y="657" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff"><tspan x="255" dy="0">Reset or</tspan><tspan x="255" dy="22">relearn</tspan></text><circle cx="360" cy="524" r="24" fill="#f4ba55" /><text x="360" y="569" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff"><tspan x="360" dy="0">Actuator</tspan><tspan x="360" dy="22">command</tspan></text><circle cx="465" cy="436" r="24" fill="#f4ba55" /><text x="465" y="481" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff"><tspan x="465" dy="0">Configuration</tspan><tspan x="465" dy="22">write</tspan></text><circle cx="570" cy="348" r="24" fill="#f4ba55" /><text x="570" y="393" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff"><tspan x="570" dy="0">Software</tspan><tspan x="570" dy="22">write</tspan></text></svg>