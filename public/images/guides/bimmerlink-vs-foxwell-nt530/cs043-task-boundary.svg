<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" data-layout="task-boundary-grid"><title>Keep four task classes separate</title><desc>A product name is not a universal capability list. Read faults, Live data, Service functions, Coding, Programming, Exact vehicle check</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fa9ff"/></marker></defs><rect width="100%" height="100%" fill="#081421"/><circle cx="1200" cy="70" r="170" fill="#7fa9ff" opacity="0.06"/><text x="70" y="58" class="k">CHASSIS SIGNAL / TASK-BOUNDARY-GRID</text><text x="70" y="112" class="title" text-anchor="start"><tspan x="70" dy="0">Keep four task classes separate</tspan></text><text x="70" y="178" class="subtitle" text-anchor="start"><tspan x="70" dy="0">A product name is not a universal capability list.</tspan></text><g><rect x="70" y="245" width="1140" height="58" rx="10" fill="#102b40"/><text x="88" y="281" class="label" text-anchor="start"><tspan x="88" dy="0">Read faults</tspan></text><rect x="900" y="263" width="38.57142857142857" height="20" rx="5" fill="#7fa9ff"/></g><g><rect x="70" y="311" width="1140" height="58" rx="10" fill="#102b40"/><text x="88" y="347" class="label" text-anchor="start"><tspan x="88" dy="0">Live data</tspan></text><rect x="900" y="329" width="77.14285714285714" height="20" rx="5" fill="#45d6c6"/></g><g><rect x="70" y="377" width="1140" height="58" rx="10" fill="#102b40"/><text x="88" y="413" class="label" text-anchor="start"><tspan x="88" dy="0">Service functions</tspan></text><rect x="900" y="395" width="115.71428571428571" height="20" rx="5" fill="#7fa9ff"/></g><g><rect x="70" y="443" width="1140" height="58" rx="10" fill="#102b40"/><text x="88" y="479" class="label" text-anchor="start"><tspan x="88" dy="0">Coding</tspan></text><rect x="900" y="461" width="154.28571428571428" height="20" rx="5" fill="#45d6c6"/></g><g><rect x="70" y="509