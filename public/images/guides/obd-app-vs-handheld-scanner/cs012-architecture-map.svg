<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Two diagnostic ownership stacks</title><desc id="desc">The vehicle task is the gate; form factor comes second.</desc><rect width="1200" height="700" fill="#fffbeb"/><text x="70" y="92" font-family="Arial" font-size="48" font-weight="800" fill="#78350f">Two diagnostic ownership stacks</text><text x="70" y="145" font-family="Arial" font-size="25" fill="#475569">The vehicle task is the gate; form factor comes second.</text><g><rect x="70" y="245" width="310" height="235" rx="28" fill="#ffffff" stroke="#b45309" stroke-width="4"/><circle cx="118" cy="295" r="25" fill="#b45309"/><text x="118" y="304" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">1</text><text x="100" y="360" font-size="31" font-weight="700" fill="#78350f">App path</text><foreignObject x="100" y="385" width="250" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font:24px/1.35 Arial;color:#334155">Vehicle -&gt; adapter -&gt; phone app</div></foreignObject><path d="M 385 365 L 430 365" stroke="#b45309" stroke-width="8"/><path d="M 422 351 L 440 365 L 422 379" fill="none" stroke="#b45309" stroke-width="8"/></g><g><rect x="445" y="245" width="310" height="235" rx="28" fill="#fef3c7" stroke="#b45309" stroke-width="4"/><circle cx="493" cy="295" r="25" fill="#b45309"/><text x="493" y="304" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">2</text><text x="475" y="360" font-size="31" font-weight="700" fill="#78350f">Handheld path</text><foreignObject x="475" y="385" width="250" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font:24px/1.35 Arial;color:#334155">Vehicle -&gt; dedicated scanner</div></foreignObject><path d="M 760 365 L 805 365" stroke="#b45309" stroke-width="8"/><path d="M 797 351 L 815 365 L 797 379" fill="none" stroke="#b45309" stroke-width="8"/></g><g><rect x="820" y="245" width="310" height="235" rx="28" fill="#ffffff" stroke="#b45309" stroke-width="4"/><circle cx="868" cy="295" r="25" fill="#b45309"/><text x="868" y="304" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">3</text><text x="850" y="360" font-size="31" font-weight="700" fill="#78350f">Coverage gate</text><foreignObject x="850" y="385" width="250" height="78"><div xmlns="http://www.w3.org/1999/xhtml" style="font:24px/1.35 Arial;color:#334155">Vehicle + module + function + region</div></foreignObject></g><text x="70" y="625" font-family="Arial" font-size="20" fill="#64748b">Original analysis • CS-012 • documentation-first</text></svg>
