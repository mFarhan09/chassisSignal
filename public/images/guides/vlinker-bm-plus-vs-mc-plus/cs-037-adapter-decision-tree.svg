<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">CS-037 adapter decision tree</title><desc id="d">Article-specific diagram for vlinker bm plus vs mc plus</desc><rect width="100%" height="100%" fill="#071d2b"/><text x="70" y="80" class="eye">CS-037 / DECISION EVIDENCE</text><text x="70" y="145" class="head">ADAPTER DECISION TREE</text><text x="70" y="190" class="sub">Let the named workflow decide the adapter</text><circle cx="390" cy="245" r="42" fill="#1fa6a0"/><text x="390" y="252" text-anchor="middle" class="num">1</text><text x="325" y="252" text-anchor="end" class="label">Name the app</text><path d="M390 290 L890 300" stroke="#fff" stroke-width="5"/><circle cx="890" cy="330" r="42" fill="#f6c85f"/><text x="890" y="337" text-anchor="middle" class="num">2</text><text x="955" y="337" text-anchor="start" class="label">Select vehicle</text><path d="M890 375 L390 385" stroke="#fff" stroke-width="5"/><circle cx="390" cy="415" r="42" fill="#1fa6a0"/><text x="390" y="422" text-anchor="middle" class="num">3</text><text x="325" y="422" text-anchor="end" class="label">Match full model</text><path d="M390 460 L890 470" stroke="#fff" stroke-width="5"/><circle cx="890" cy="500" r="42" fill="#f6c85f"/><text x="890" y="507" text-anchor="middle" class="num">4</text><text x="955" y="507" text-anchor="start" class="label">Confirm host</text><path d="M890 545 L390 555" stroke="#fff" stroke-width="5"/><circle cx="390" cy="585" r="42" fill="#1fa6a0"/><text x="390" y="592" text-anchor="middle" class="num">5</text><text x="325" y="592" text-anchor="end" class="label">Recheck checkout</text><style>.head{font:700 38px Arial;fill:#fff}.eye{font:700 18px Arial;fill:#f6c85f}.sub{font:400 20px Arial;fill:#c9d5dc}.label{font:700 19px Arial;fill:#fff}.num{font:700 19px Arial;fill:#071d2b}</style></svg>