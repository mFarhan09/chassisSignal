<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="t d"><title id="t">CS-037 adapter decision tree</title><desc id="d">Article-specific diagram for vlinker bm plus vs mc plus</desc><rect width="100%" height="100%" fill="#071d2b"/><text x="50" y="80" class="eye">CS-037 / DECISION EVIDENCE</text><text x="50" y="145" class="head">ADAPTER DECISION TREE</text><text x="50" y="190" class="sub">Let the named workflow decide the adapter</text><circle cx="360" cy="245" r="42" fill="#1fa6a0"/><text x="360" y="252" text-anchor="middle" class="num">1</text><text x="50" y="252"  class="label">Name the app</text><path d="M360 290 L360 335" stroke="#fff" stroke-width="5"/><circle cx="360" cy="380" r="42" fill="#f6c85f"/><text x="360" y="387" text-anchor="middle" class="num">2</text><text x="50" y="387"  class="label">Select vehicle</text><path d="M360 425 L360 470" stroke="#fff" stroke-width="5"/><circle cx="360" cy="515" r="42" fill="#1fa6a0"/><text x="360" y="522" text-anchor="middle" class="num">3</text><text x="50" y="522"  class="label">Match full model</text><path d="M360 560 L360 605" stroke="#fff" stroke-width="5"/><circle cx="360" cy="650" r="42" fill="#f6c85f"/><text x="360" y="657" text-anchor="middle" class="num">4</text><text x="50" y="657"  class="label">Confirm host</text><path d="M360 695 L360 740" stroke="#fff" stroke-width="5"/><circle cx="360" cy="785" r="42" fill="#1fa6a0"/><text x="360" y="792" text-anchor="middle" class="num">5</text><text x="50" y="792"  class="label">Recheck checkout</text><style>.head{font:700 30px Arial;fill:#fff}.eye{font:700 18px Arial;fill:#f6c85f}.sub{font:400 18px Arial;fill:#c9d5dc}.label{font:700 18px Arial;fill:#fff}.num{font:700 19px Arial;fill:#071d2b}</style></svg>