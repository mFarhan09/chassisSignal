<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Ownership Cost Horizon</title><desc id="desc">Cost comparison tracking initial app purchase, adapter hardware, feature add-ons, and recurring annual subscription costs.</desc><rect width="100%" height="100%" fill="#102530"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f3a34a">LONG-TERM COST COMPARISON</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#fff">OWNERSHIP HORIZON</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="17" fill="#e7f0ee">Weigh one-time purchases against recurring subscription commitments</text><path d="M90 760 C190 690 210 590 300 560 C395 525 450 415 620 300" stroke="#32b8a6" stroke-width="12" fill="none" /><line x1="90" y1="790" x2="635" y2="790" stroke="#e7f0ee" stroke-width="4" /><line x1="90" y1="300" x2="90" y2="790" stroke="#e7f0ee" stroke-width="4" /><rect x="120" y="700" width="66" height="90" rx="8" fill="#32b8a6" /><text x="153" y="835" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e7f0ee"><tspan x="153" dy="0">App access</tspan></text><rect x="212" y="622" width="66" height="132" rx="8" fill="#f3a34a" /><text x="245" y="835" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e7f0ee"><tspan x="245" dy="0">Scanner</tspan><tspan x="245" dy="22">hardware</tspan></text><rect x="304" y="544" width="66" height="174" rx="8" fill="#32b8a6" /><text x="337" y="835" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e7f0ee"><tspan x="337" dy="0">Optional</tspan><tspan x="337" dy="22">extras</tspan></text><rect x="396" y="466" width="66" height="216" rx="8" fill="#f3a34a" /><text x="429" y="835" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e7f0ee"><tspan x="429" dy="0">Renewal</tspan><tspan x="429" dy="22">exposure</tspan></text><rect x="488" y="388" width="66" height="258" rx="8" fill="#32b8a6" /><text x="521" y="835" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e7f0ee"><tspan x="521" dy="0">Recheck</tspan><tspan x="521" dy="22">checkout</tspan></text></svg>