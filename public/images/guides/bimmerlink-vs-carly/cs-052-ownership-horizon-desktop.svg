<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Ownership Cost Horizon</title><desc id="desc">Cost comparison tracking initial app purchase, adapter hardware, feature add-ons, and recurring annual subscription costs.</desc><rect width="100%" height="100%" fill="#102530"/><text x="68" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f3a34a">LONG-TERM COST COMPARISON</text><text x="68" y="112" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">OWNERSHIP HORIZON</text><text x="68" y="158" font-family="Arial, sans-serif" font-size="19" fill="#e7f0ee">Weigh one-time purchases against recurring subscription commitments</text><line x1="100" y1="610" x2="1180" y2="610" stroke="#e7f0ee" stroke-width="4" /><rect x="135" y="530" width="120" height="80" rx="10" fill="#32b8a6" /><circle cx="195" cy="510" r="14" fill="#e7f0ee" /><text x="195" y="652" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#e7f0ee"><tspan x="195" dy="0">App access</tspan></text><rect x="345" y="468" width="120" height="142" rx="10" fill="#f3a34a" /><circle cx="405" cy="448" r="14" fill="#e7f0ee" /><text x="405" y="652" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#e7f0ee"><tspan x="405" dy="0">Scanner</tspan><tspan x="405" dy="22">hardware</tspan></text><rect x="555" y="406" width="120" height="204" rx="10" fill="#32b8a6" /><circle cx="615" cy="386" r="14" fill="#e7f0ee" /><text x="615" y="652" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#e7f0ee"><tspan x="615" dy="0">Optional</tspan><tspan x="615" dy="22">extras</tspan></text><rect x="765" y="344" width="120" height="266" rx="10" fill="#f3a34a" /><circle cx="825" cy="324" r="14" fill="#e7f0ee" /><text