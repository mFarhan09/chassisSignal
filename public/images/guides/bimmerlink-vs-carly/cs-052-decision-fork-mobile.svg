<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">BimmerLink or Carly Decision Tree</title><desc id="desc">Decision tree routing BMW owners between dedicated diagnostics with BimmerLink and integrated coding with Carly.</desc><rect width="100%" height="100%" fill="#102530"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f3a34a">PURCHASE DECISION PATH</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#fff">BIMMERLINK OR CARLY DECISION FORK</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="17" fill="#e7f0ee">Separate focused diagnostics from multi-brand subscription packages</text><circle cx="360" cy="265" r="54" fill="#e7f0ee" /><path d="M360 319 V390 L180 500" stroke="#32b8a6" stroke-width="9" fill="none" /><path d="M360 390 L540 500" stroke="#f3a34a" stroke-width="9" fill="none" /><rect x="55" y="500" width="250" height="180" rx="24" fill="#32b8a6" /><rect x="415" y="500" width="250" height="180" rx="24" fill="#f3a34a" /><path d="M180 680 V780" stroke="#32b8a6" stroke-width="7" fill="none" /><path d="M540 680 V780" stroke="#f3a34a" stroke-width="7" fill="none" /><polygon points="155,780 205,780 180,820" fill="#32b8a6" /><polygon points="515,780 565,780 540,820" fill="#f3a34a" /><text x="360" y="270" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#102530"><tspan x="360" dy="0">BMW-focused</tspan><tspan x="360" dy="22">diagnosis</tspan></text><text x="180" y="555" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="180" dy="0">Broad app</tspan><tspan x="180" dy="22">ecosystem</tspan></text><text x="540" y="555" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="540" dy="0">Coding required</tspan></text></svg>