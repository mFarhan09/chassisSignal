<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">BimmerLink vs Carly Job-First Scorecard</title><desc id="desc">Scorecard evaluating module diagnostics, live data logging, service resets, coding capability, and pricing models.</desc><rect width="100%" height="100%" fill="#102530"/><text x="68" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f3a34a">DIAGNOSTIC TASK FIT</text><text x="68" y="112" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">JOB-FIRST SCORECARD</text><text x="68" y="158" font-family="Arial, sans-serif" font-size="19" fill="#e7f0ee">Match the app to the job before comparing price</text><rect x="70" y="235" width="1140" height="390" rx="30" fill="none" stroke="#e7f0ee" stroke-width="4"/><rect x="115" y="270" width="455" height="78" rx="18" fill="#32b8a6" /><rect x="710" y="270" width="455" height="78" rx="18" fill="#f3a34a" /><line x1="640" y1="235" x2="640" y2="625" stroke="#e7f0ee" stroke-width="4" /><rect x="125" y="410" width="165" height="128" rx="18" fill="none" stroke="#32b8a6" stroke-width="8"/><text x="207" y="458" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#e7f0ee"><tspan x="207" dy="0">Read all</tspan><tspan x="207" dy="22">modules</tspan></text><rect x="330" y="410" width="165" height="128" rx="18" fill="none" stroke="#f3a34a" stroke-width="8"/><text x="412" y="458" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#e7f0ee"><tspan x="412" dy="0">Log live</tspan><tspan x="412" dy="22">values</tspan></text><rect x="535" y="410" width="165" height="128" rx="18" fill="none" stroke="#32b8a6" stroke-width="8"/><text x="617" y="458" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#e7f0ee"><tspa