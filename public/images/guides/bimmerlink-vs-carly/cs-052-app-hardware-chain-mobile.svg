<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Diagnostic App and Hardware Chain</title><desc id="desc">Diagram showing dependencies between phone platform, software license, approved adapter, and exact BMW model.</desc><rect width="100%" height="100%" fill="#102530"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f3a34a">CONNECTION DEPENDENCIES</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#fff">APP AND HARDWARE CHAIN</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="17" fill="#e7f0ee">Confirm phone platform, license terms, adapter, and vehicle support together</text><rect x="70" y="230" width="250" height="120" rx="28" fill="#32b8a6" /><rect x="400" y="230" width="250" height="120" rx="28" fill="#f3a34a" /><path d="M195 350 V430 H360 V500" stroke="#e7f0ee" stroke-width="7" fill="none" /><path d="M525 350 V430 H360 V500" stroke="#e7f0ee" stroke-width="7" fill="none" /><polygon points="340,490 380,490 360,525" fill="#e7f0ee" /><rect x="155" y="525" width="410" height="105" rx="22" fill="none" stroke="#e7f0ee" stroke-width="6"/><path d="M360 630 V700" stroke="#e7f0ee" stroke-width="8" fill="none" /><ellipse cx="360" cy="770" rx="235" ry="82" fill="#32b8a6" /><text x="195" y="280" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="195" dy="0">Phone platform</tspan></text><text x="525" y="280" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="525" dy="0">Paid access</tspan></text><text x="360" y="570" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="360" dy="0">Approved adapter</tspan></text><text x="360" y="760" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="360" dy="0">Exact BMW</tspan></text></svg>