<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">BimmerLink or Carly Decision Tree</title><desc id="desc">Decision tree routing BMW owners between dedicated diagnostics with BimmerLink and integrated coding with Carly.</desc><rect width="100%" height="100%" fill="#102530"/><text x="68" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f3a34a">PURCHASE DECISION PATH</text><text x="68" y="112" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">BIMMERLINK OR CARLY DECISION FORK</text><text x="68" y="158" font-family="Arial, sans-serif" font-size="19" fill="#e7f0ee">Separate focused diagnostics from multi-brand subscription packages</text><circle cx="170" cy="420" r="62" fill="#e7f0ee" /><path d="M232 420 H410" stroke="#e7f0ee" stroke-width="9" fill="none" /><path d="M410 420 C520 420 520 285 650 285" stroke="#32b8a6" stroke-width="9" fill="none" /><path d="M410 420 C520 420 520 555 650 555" stroke="#f3a34a" stroke-width="9" fill="none" /><rect x="650" y="230" width="470" height="110" rx="24" fill="#32b8a6" /><rect x="650" y="500" width="470" height="110" rx="24" fill="#f3a34a" /><text x="170" y="415" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#102530"><tspan x="170" dy="0">BMW-focused</tspan><tspan x="170" dy="22">diagnosis</tspan></text><text x="885" y="275" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="885" dy="0">Broad app ecosystem</tspan></text><text x="885" y="545" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="885" dy="0">Coding required</tspan></text></svg>