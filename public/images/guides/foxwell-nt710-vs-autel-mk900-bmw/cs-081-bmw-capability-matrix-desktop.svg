<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="t1 d1">
<title id="t1">BMW capability: what each maker documents</title>
<desc id="d1">Row comparison of BMW diagnostic tasks against Foxwell NT710 and Autel MK900 published documentation. Coding is documented by Foxwell only. DoIP and CAN FD are documented by Autel only.</desc>
<rect width="1280" height="760" fill="#0f1620"/>
<text x="48" y="58" fill="#f2f6fa" font-family="Georgia,serif" font-size="30" font-weight="bold">BMW capability, as published by each maker</text>
<text x="48" y="88" fill="#8fa3b8" font-family="Helvetica,Arial,sans-serif" font-size="16">Sources: Foxwell NT710 product page and Autel MK900 product page plus user manual v2.3. Verified 2026-09-24.</text>
<rect x="48" y="112" width="560" height="44" fill="#1b2635"/>
<rect x="620" y="112" width="290" height="44" fill="#1f3a2e"/>
<rect x="922" y="112" width="290" height="44" fill="#332a1c"/>
<text x="64" y="141" fill="#c8d6e4" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold">BMW task</text>
<text x="636" y="141" fill="#7fe0a8" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold">Foxwell NT710</text>
<text x="938" y="141" fill="#f0c674" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold">Autel MK900</text>
<g font-family="Helvetica,Arial,sans-serif" font-size="15">
<rect x="48" y="166" width="1164" height="52" fill="#141d29"/>
<text x="64" y="197" fill="#dce6f0">Maker-specific system fault codes</text>
<text x="636" y="197" fill="#7fe0a8">Documented</text><text x="938" y="197" fill="#f0c674">Documented</text>
<rect x="48" y="222" width="1164" height="52" fill="#101923"/>
<text x="64" y="253" fill="#dce6f0">Bidirectional component control</text>
<text x="636" y="253" fill="#7fe0a8">Documented</text><text x="938" y="253" fill="#f0c674">Documented as Active Test</text>
<rect x="48" y="278" width="1164" height="52" fill="#141d29"/>
<text x="64" y="309" fill="#dce6f0">Service and maintenance routines</text>
<text x="636" y="309" fill="#7fe0a8">30+ stated</text><text x="938" y="309" fill="#f0c674">Documented</text>
<rect x="48" y="334" width="1164" height="62" fill="#2a1f2e" stroke="#c98bdb" stroke-width="2"/>
<text x="64" y="360" fill="#f3e2fa" font-weight="bold">Module coding and personalisation</text>
<text x="64" y="382" fill="#b79ac4" font-size="13">The row that decides most BMW purchases</text>
<text x="636" y="371" fill="#7fe0a8" font-weight="bold">Claimed</text>
<text x="938" y="364" fill="#e2a0a0" font-weight="bold">Not claimed</text>
<text x="938" y="384" fill="#9b7f7f" font-size="12">Absent from manual and feature table</text>
<rect x="48" y="400" width="1164" height="52" fill="#101923"/>
<text x="64" y="431" fill="#dce6f0">DoIP transport</text>
<text x="636" y="431" fill="#8fa3b8">Not stated</text><text x="938" y="431" fill="#f0c674" font-weight="bold">Documented</text>
<rect x="48" y="456" width="1164" height="52" fill="#141d29"/>
<text x="64" y="487" fill="#dce6f0">CAN FD transport</text>
<text x="636" y="487" fill="#8fa3b8">Not stated</text><text x="938" y="487" fill="#f0c674" font-weight="bold">Documented</text>
<rect x="48" y="512" width="1164" height="52" fill="#101923"/>
<text x="64" y="543" fill="#dce6f0">Vehicle reach beyond BMW</text>
<text x="636" y="543" fill="#e2a0a0">One make as purchased</text><text x="938" y="543" fill="#f0c674">US, Asian, European, 1996+</text>
</g>
<rect x="48" y="586" width="1164" height="128" fill="#16212e" stroke="#2c3e52"/>
<text x="68" y="616" fill="#f2f6fa" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold">Read the blanks correctly</text>
<text x="68" y="646" fill="#a9bccf" font-family="Helvetica,Arial,sans-serif" font-size="15">"Not stated" means the maker does not publish it, not that the tool cannot do it.</text>
<text x="68" y="672" fill="#a9bccf" font-family="Helvetica,Arial,sans-serif" font-size="15">Both makers qualify coverage by vehicle. Autel: "Available functions may vary by vehicle."</text>
<text x="68" y="698" fill="#a9bccf" font-family="Helvetica,Arial,sans-serif" font-size="15">Foxwell: "Coverage varies by vehicle condition." Confirm against your VIN before buying.</text>
</svg>
