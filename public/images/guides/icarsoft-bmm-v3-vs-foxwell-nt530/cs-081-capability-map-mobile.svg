<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="ti de"><title id="ti">BMW diagnostic capability decision map</title><desc id="de">Move left to right; each stage must pass for your exact car before the tool choice matters.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="58" class="h">BMW diagnostic capability decision map</text><text x="44" y="94" class="s">Move left to right; each stage must pass for your exact car before the tool choice</text><text x="44" y="115" class="s">matters.</text><rect x="102" y="162" width="578" height="137" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="70" cy="231" r="20" fill="#65c8ff"/><text x="70" y="237" text-anchor="middle" class="b">1</text><line x1="70" y1="251" x2="70" y2="362" stroke="#65c8ff" stroke-width="3"/><text x="118" y="223" class="l">Vehicle &amp; chassis</text><text x="118" y="245" class="m">Confirm model year and chassis; pre-2001 needs the 20-pin adapter path.</text><rect x="102" y="313" width="578" height="137" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="70" cy="382" r="20" fill="#65c8ff"/><text x="70" y="388" text-anchor="middle" class="b">2</text><line x1="70" y1="402" x2="70" y2="513" stroke="#65c8ff" stroke-width="3"/><text x="118" y="374" class="l">Module coverage</text><text x="118" y="396" class="m">Check the exact control modules you need are readable, not just 'all systems'.</text><rect x="102" y="464" width="578" height="137" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="70" cy="533" r="20" fill="#65c8ff"/><text x="70" y="539" text-anchor="middle" class="b">3</text><line x1="70" y1="553" x2="70" y2="664" stroke="#65c8ff" stroke-width="3"/><text x="118" y="525" class="l">Bidirectional need</text><text x="118" y="547" class="m">Decide if you need active component tests, not only fault codes.</text><rect x="102" y="614" width="578" height="137" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="70" cy="684" r="20" fill="#65c8ff"/><text x="70" y="690" text-anchor="middle" class="b">4</text><line x1="70" y1="704" x2="70" y2="815" stroke="#65c8ff" stroke-width="3"/><text x="118" y="676" class="l">Service function</text><text x="118" y="698" class="m">Name the exact routine: oil, EPB, SAS, registration, DPF request.</text><rect x="102" y="765" width="578" height="137" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="70" cy="835" r="20" fill="#65c8ff"/><text x="70" y="841" text-anchor="middle" class="b">5</text><text x="118" y="827" class="l">Exact-tool proof</text><text x="118" y="849" class="m">Match the function to a dated result for your VIN and software version.</text><rect x="40" y="910" width="640" height="52" rx="10" fill="#1b2f4a" stroke="#ff7f7f" stroke-width="2"/><text x="54" y="934" class="m" fill="#ff7f7f">A menu option is not proof of a successful operation. Demand a dated result for your exact</text><text x="54" y="952" class="m" fill="#ff7f7f">VIN, module and software.</text><style>.h{font:700 29px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 17px Arial,sans-serif;fill:#bfd0dc}.l{font:600 17px Arial,sans-serif;fill:#fff}.m{font:400 15px Arial,sans-serif;fill:#bfd0dc}.b{font:700 16px Arial,sans-serif;fill:#0c1727}.t{font:700 16px Arial,sans-serif;fill:#65c8ff}</style></svg>