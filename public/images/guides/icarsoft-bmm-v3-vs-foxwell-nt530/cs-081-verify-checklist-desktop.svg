<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ti de"><title id="ti">Pre-purchase verification checklist</title><desc id="de">Clear every item for your exact car before buying either tool; unknown is not supported.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="56" y="60" class="h">Pre-purchase verification checklist</text><text x="56" y="102" class="s">Clear every item for your exact car before buying either tool; unknown is not supported.</text><rect x="56" y="150" width="1168" height="97" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="72" y="186" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M78 200 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="116" y="204" class="l">Confirm exact current SKU and box contents</text><text x="593" y="198" class="m">Model names and adapters change; verify the invoice, not the marketing image.</text><rect x="56" y="259" width="1168" height="97" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="72" y="294" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M78 308 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="116" y="314" class="l">Match each needed service function to your car</text><text x="593" y="306" class="m">Ask the seller for a dated coverage result for your VIN and software version.</text><rect x="56" y="368" width="1168" height="97" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="72" y="404" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M78 418 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="116" y="422" class="l">Separate active tests from coding claims</text><text x="593" y="416" class="m">A bi-directional label does not include every command or ECU programming.</text><rect x="56" y="477" width="1168" height="97" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="72" y="512" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M78 526 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="116" y="532" class="l">Check chassis-era and adapter needs</text><text x="593" y="524" class="m">Pre-2001 BMW/MINI needs the 20-pin adapter; confirm 16-pin covers your year.</text><rect x="56" y="586" width="1168" height="97" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="72" y="622" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M78 636 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="116" y="640" class="l">Confirm the software-update terms in writing</text><text x="593" y="634" class="m">Update policy and cost differ by product and seller; date-stamp what you are told.</text><style>.h{font:700 34px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 19px Arial,sans-serif;fill:#bfd0dc}.l{font:600 16px Arial,sans-serif;fill:#fff}.m{font:400 14px Arial,sans-serif;fill:#bfd0dc}.b{font:700 15px Arial,sans-serif;fill:#0c1727}.t{font:700 15px Arial,sans-serif;fill:#65c8ff}</style></svg>