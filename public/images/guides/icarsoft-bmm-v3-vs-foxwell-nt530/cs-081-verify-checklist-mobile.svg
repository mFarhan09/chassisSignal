<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="ti de"><title id="ti">Pre-purchase verification checklist</title><desc id="de">Clear every item for your exact car before buying either tool; unknown is not supported.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="58" class="h">Pre-purchase verification checklist</text><text x="44" y="94" class="s">Clear every item for your exact car before buying either tool; unknown is not</text><text x="44" y="115" class="s">supported.</text><rect x="40" y="161" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="221" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 235 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="227" class="l">Confirm exact current SKU and box contents</text><text x="100" y="249" class="m">Model names and adapters change; verify the invoice, not the marketing image.</text><rect x="40" y="320" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="380" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 394 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="386" class="l">Match each needed service function to your car</text><text x="100" y="408" class="m">Ask the seller for a dated coverage result for your VIN and software version.</text><rect x="40" y="479" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="539" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 553 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="545" class="l">Separate active tests from coding claims</text><text x="100" y="567" class="m">A bi-directional label does not include every command or ECU programming.</text><rect x="40" y="637" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="698" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 712 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="704" class="l">Check chassis-era and adapter needs</text><text x="100" y="726" class="m">Pre-2001 BMW/MINI needs the 20-pin adapter; confirm 16-pin covers your year.</text><rect x="40" y="796" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="857" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 871 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="863" class="l">Confirm the software-update terms in writing</text><text x="100" y="885" class="m">Update policy and cost differ by product and seller; date-stamp what you are told.</text><style>.h{font:700 29px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 17px Arial,sans-serif;fill:#bfd0dc}.l{font:600 17px Arial,sans-serif;fill:#fff}.m{font:400 15px Arial,sans-serif;fill:#bfd0dc}.b{font:700 16px Arial,sans-serif;fill:#0c1727}.t{font:700 16px Arial,sans-serif;fill:#65c8ff}</style></svg>