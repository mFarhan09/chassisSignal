<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" width="360" height="430" role="img" aria-labelledby="t089m d089m">
<title id="t089m">Which vehicle transports each maker documents</title>
<desc id="d089m">LAUNCH states support for CAN FD and DoIP on the shared X-431 Classic 8-inch page that covers the PRO ELITE alongside the PROS ELITE and PRO STAR, so the claim is made for the model group rather than for one unit. Foxwell publishes neither protocol for the NT710, which is an absence of a published claim rather than proof that the tool cannot communicate.</desc>
<rect width="360" height="430" fill="#0f1620"/>
<text x="18" y="32" fill="#f2f6fa" font-family="Georgia,serif" font-size="20" font-weight="bold">What each maker</text>
<text x="18" y="56" fill="#f2f6fa" font-family="Georgia,serif" font-size="20" font-weight="bold">puts in writing</text>
<text x="18" y="80" fill="#8fa3b8" font-family="Helvetica,Arial,sans-serif" font-size="13">Transport support for newer BMW</text>

<rect x="16" y="98" width="328" height="136" rx="9" fill="#16212e" stroke="#2f6b45" stroke-width="2"/>
<text x="38" y="128" fill="#7fe0a8" font-family="Georgia,serif" font-size="18" font-weight="bold">LAUNCH X-431 PRO ELITE</text>
<rect x="38" y="146" width="128" height="44" rx="22" fill="#1f3a2e" stroke="#2f6b45" stroke-width="2"/>
<text x="102" y="174" fill="#7fe0a8" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CAN FD</text>
<rect x="178" y="146" width="128" height="44" rx="22" fill="#1f3a2e" stroke="#2f6b45" stroke-width="2"/>
<text x="242" y="174" fill="#7fe0a8" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle">DoIP</text>
<text x="38" y="216" fill="#8fa3b8" font-family="Helvetica,Arial,sans-serif" font-size="13">Stated on the shared X-431 8-inch page</text>

<rect x="16" y="250" width="328" height="122" rx="9" fill="#16212e" stroke="#2c3e52" stroke-width="2"/>
<text x="38" y="280" fill="#9fdcf0" font-family="Georgia,serif" font-size="18" font-weight="bold">Foxwell NT710</text>
<rect x="38" y="296" width="268" height="44" rx="22" fill="#241d24" stroke="#6b5570" stroke-width="2" stroke-dasharray="6 5"/>
<text x="172" y="324" fill="#c9b3d4" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Neither protocol published</text>
<text x="38" y="360" fill="#8fa3b8" font-family="Helvetica,Arial,sans-serif" font-size="13">Absence of a claim, not proof</text>

<text x="18" y="404" fill="#6f8296" font-family="Helvetica,Arial,sans-serif" font-size="12">Confirm transport support for your exact</text>
<text x="18" y="420" fill="#6f8296" font-family="Helvetica,Arial,sans-serif" font-size="12">chassis before purchase.</text>
</svg>
