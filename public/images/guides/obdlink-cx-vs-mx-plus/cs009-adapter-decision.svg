<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="694" viewBox="0 0 1100 694" role="img" aria-labelledby="t d"><title id="t">Adapter decision sequence</title><desc id="d">Start with the fleet and app—not an unsupported speed claim.</desc><rect width="1100" height="694" rx="24" fill="#f8fafc"/><rect width="1100" height="14" fill="#c2410c"/><text x="44" y="62" font-size="34" font-weight="800" fill="#35180d">Adapter decision sequence</text><text x="44" y="98" font-size="18" fill="#475569">Start with the fleet and app—not an unsupported speed claim.</text><rect x="50" y="165" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="201" font-size="20" font-weight="700" fill="#35180d">BMW/MINI + BimmerCode?</text><text x="70" y="233" font-size="16" fill="#475569">CX is purpose-built; confirm exact vehicle</text><text x="70" y="256" font-size="16" fill="#475569">support.</text><rect x="560" y="165" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="201" font-size="20" font-weight="700" fill="#35180d">Older or mixed-brand fleet?</text><text x="580" y="233" font-size="16" fill="#475569">MX+ has broader documented protocol coverage.</text><rect x="50" y="333" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="369" font-size="20" font-weight="700" fill="#35180d">Need OBDLink OEM add-ons?</text><text x="70" y="401" font-size="16" fill="#475569">MX+ includes upgrades other models may sell</text><text x="70" y="424" font-size="16" fill="#475569">separately.</text><rect x="560" y="333" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="369" font-size="20" font-weight="700" fill="#35180d">Windows computer?</text><text x="580" y="401" font-size="16" fill="#475569">CX requires compatible BLE hardware.</text><rect x="50" y="501" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="537" font-size="20" font-weight="700" fill="#35180d">Still tied?</text><text x="70" y="569" font-size="16" fill="#475569">Compare current price, apps and future vehicles.</text><text x="44" y="674" font-size="13" fill="#64748b">Chassis Signal · documentation-first editorial synthesis</text></svg>