<svg xmlns="http://www.w3.org/2000/svg" width="420" height="970" viewBox="0 0 420 970" role="img" aria-labelledby="t d"><title id="t">Adapter decision sequence</title><desc id="d">Start with the fleet and app—not an unsupported speed claim.</desc><rect width="420" height="970" rx="24" fill="#f8fafc"/><rect width="420" height="14" fill="#c2410c"/><text x="28" y="62" font-size="24" font-weight="800" fill="#35180d">Adapter decision sequence</text><text x="28" y="98" font-size="14" fill="#475569">Start with the fleet and app—not an unsupported</text><text x="28" y="120" font-size="14" fill="#475569">speed claim.</text><rect x="30" y="170" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="206" font-size="17" font-weight="700" fill="#35180d">BMW/MINI + BimmerCode?</text><text x="50" y="238" font-size="14" fill="#475569">CX is purpose-built; confirm exact vehicle</text><text x="50" y="261" font-size="14" fill="#475569">support.</text><rect x="30" y="326" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="362" font-size="17" font-weight="700" fill="#35180d">Older or mixed-brand fleet?</text><text x="50" y="394" font-size="14" fill="#475569">MX+ has broader documented protocol</text><text x="50" y="417" font-size="14" fill="#475569">coverage.</text><rect x="30" y="482" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="518" font-size="17" font-weight="700" fill="#35180d">Need OBDLink OEM add-ons?</text><text x="50" y="550" font-size="14" fill="#475569">MX+ includes upgrades other models may</text><text x="50" y="573" font-size="14" fill="#475569">sell separately.</text><rect x="30" y="638" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="674" font-size="17" font-weight="700" fill="#35180d">Windows computer?</text><text x="50" y="706" font-size="14" fill="#475569">CX requires compatible BLE hardware.</text><rect x="30" y="794" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="830" font-size="17" font-weight="700" fill="#35180d">Still tied?</text><text x="50" y="862" font-size="14" fill="#475569">Compare current price, apps and future</text><text x="50" y="885" font-size="14" fill="#475569">vehicles.</text><text x="28" y="950" font-size="13" fill="#64748b">Chassis Signal · documentation-first editorial synthesis</text></svg>