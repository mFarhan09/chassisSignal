<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">BMW battery registration versus battery configuration</title>
  <desc id="desc">A two-panel comparison showing that recording a replacement battery is a different requirement from changing battery type or capacity.</desc>
  <rect width="1500" height="760" rx="30" fill="#0b1017"/>
  <text x="70" y="80" fill="#f3f0e8" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="700">Two different requirements</text>
  <text x="70" y="120" fill="#aab5c4" font-family="Inter,Arial,sans-serif" font-size="21">A registration-capable tool is not automatically a configuration tool</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(70 190)"><rect width="640" height="440" rx="24" fill="#151e2b" stroke="#64c9a5" stroke-width="2"/><text x="38" y="58" fill="#64c9a5" font-size="18" font-weight="700">BATTERY REGISTRATION</text><text x="38" y="112" fill="#f3f0e8" font-size="31" font-weight="700">Replacement recorded</text><circle cx="86" cy="208" r="38" fill="#203645"/><rect x="66" y="182" width="40" height="52" rx="5" fill="none" stroke="#64c9a5" stroke-width="4"/><path d="M77 177v-10m18 10v-10" stroke="#64c9a5" stroke-width="4"/><path d="M145 208H530" stroke="#64c9a5" stroke-width="4"/><path d="M520 196l20 12-20 12z" fill="#64c9a5"/><rect x="438" y="162" width="140" height="92" rx="14" fill="#203645"/><text x="508" y="202" text-anchor="middle" fill="#f3f0e8" font-size="18">Vehicle record</text><text x="38" y="316" fill="#aab5c4" font-size="21">Tells the vehicle a replacement</text><text x="38" y="350" fill="#aab5c4" font-size="21">battery was installed.</text><rect x="38" y="382" width="564" height="1" fill="#2d3a49"/><text x="38" y="422" fill="#f0b46d" font-size="18" font-weight="700">VERIFY</text><text x="125" y="422" fill="#d8dee8" font-size="18">exact chassis + main/auxiliary battery</text></g>
    <g transform="translate(790 190)"><rect width="640" height="440" rx="24" fill="#151e2b" stroke="#c7a4ff" stroke-width="2"/><text x="38" y="58" fill="#c7a4ff" font-size="18" font-weight="700">TYPE / CAPACITY CONFIGURATION</text><text x="38" y="112" fill="#f3f0e8" font-size="31" font-weight="700">Specification may change</text><rect x="46" y="172" width="230" height="92" rx="14" fill="#202b3c"/><text x="161" y="207" text-anchor="middle" fill="#d8dee8" font-size="17">Chemistry</text><text x="161" y="238" text-anchor="middle" fill="#f3f0e8" font-size="23" font-weight="700">AGM / standard</text><rect x="326" y="172" width="230" height="92" rx="14" fill="#202b3c"/><text x="441" y="207" text-anchor="middle" fill="#d8dee8" font-size="17">Capacity</text><text x="441" y="238" text-anchor="middle" fill="#f3f0e8" font-size="23" font-weight="700">Supported Ah value</text><text x="38" y="316" fill="#aab5c4" font-size="21">Requires separate, vehicle-specific</text><text x="38" y="350" fill="#aab5c4" font-size="21">support where a change is needed.</text><rect x="38" y="382" width="564" height="1" fill="#2d3a49"/><text x="38" y="422" fill="#f0b46d" font-size="18" font-weight="700">DO NOT INFER</text><text x="180" y="422" fill="#d8dee8" font-size="18">from “battery registration”</text></g>
  </g>
  <text x="750" y="704" text-anchor="middle" fill="#aab5c4" font-family="Inter,Arial,sans-serif" font-size="20">This is a tool-selection distinction, not a service procedure.</text>
</svg>

