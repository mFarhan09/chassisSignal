<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1000" viewBox="0 0 420 1000" role="img" aria-labelledby="t d"><title id="t">The BMW diagnostic capability ladder</title><desc id="d">Buy the documented rung, not the noun printed on the box.</desc><rect width="420" height="1000" rx="24" fill="#f8fafc"/><rect width="420" height="14" fill="#c2410c"/><text x="28" y="62" font-size="24" font-weight="800" fill="#35180d">The BMW diagnostic</text><text x="28" y="92" font-size="24" font-weight="800" fill="#35180d">capability ladder</text><text x="28" y="128" font-size="14" fill="#475569">Buy the documented rung, not the noun printed on</text><text x="28" y="150" font-size="14" fill="#475569">the box.</text><rect x="30" y="200" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="236" font-size="17" font-weight="700" fill="#35180d">1 · Generic OBD-II</text><text x="50" y="268" font-size="14" fill="#475569">Emissions DTCs, readiness and standardized</text><text x="50" y="291" font-size="14" fill="#475569">live data.</text><rect x="30" y="356" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="392" font-size="17" font-weight="700" fill="#35180d">2 · BMW-aware</text><text x="50" y="424" font-size="14" fill="#475569">Manufacturer modules and enhanced data</text><text x="50" y="447" font-size="14" fill="#475569">where listed.</text><rect x="30" y="512" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="548" font-size="17" font-weight="700" fill="#35180d">3 · Service functions</text><text x="50" y="580" font-size="14" fill="#475569">Named maintenance procedures with exact</text><text x="50" y="603" font-size="14" fill="#475569">coverage.</text><rect x="30" y="668" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="704" font-size="17" font-weight="700" fill="#35180d">4 · Active tests</text><text x="50" y="736" font-size="14" fill="#475569">Commands supported components for</text><text x="50" y="759" font-size="14" fill="#475569">diagnosis.</text><rect x="30" y="824" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="860" font-size="17" font-weight="700" fill="#35180d">5 · Coding/programming</text><text x="50" y="892" font-size="14" fill="#475569">Configuration or software work; a separate</text><text x="50" y="915" font-size="14" fill="#475569">risk class.</text><text x="28" y="980" font-size="13" fill="#64748b">Chassis Signal · documentation-first editorial synthesis</text></svg>