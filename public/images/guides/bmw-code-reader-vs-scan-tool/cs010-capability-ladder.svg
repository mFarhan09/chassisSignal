<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="694" viewBox="0 0 1100 694" role="img" aria-labelledby="t d"><title id="t">The BMW diagnostic capability ladder</title><desc id="d">Buy the documented rung, not the noun printed on the box.</desc><rect width="1100" height="694" rx="24" fill="#f8fafc"/><rect width="1100" height="14" fill="#c2410c"/><text x="44" y="62" font-size="34" font-weight="800" fill="#35180d">The BMW diagnostic capability ladder</text><text x="44" y="98" font-size="18" fill="#475569">Buy the documented rung, not the noun printed on the box.</text><rect x="50" y="165" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="201" font-size="20" font-weight="700" fill="#35180d">1 · Generic OBD-II</text><text x="70" y="233" font-size="16" fill="#475569">Emissions DTCs, readiness and standardized live</text><text x="70" y="256" font-size="16" fill="#475569">data.</text><rect x="560" y="165" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="201" font-size="20" font-weight="700" fill="#35180d">2 · BMW-aware</text><text x="580" y="233" font-size="16" fill="#475569">Manufacturer modules and enhanced data where</text><text x="580" y="256" font-size="16" fill="#475569">listed.</text><rect x="50" y="333" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="369" font-size="20" font-weight="700" fill="#35180d">3 · Service functions</text><text x="70" y="401" font-size="16" fill="#475569">Named maintenance procedures with exact</text><text x="70" y="424" font-size="16" fill="#475569">coverage.</text><rect x="560" y="333" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="369" font-size="20" font-weight="700" fill="#35180d">4 · Active tests</text><text x="580" y="401" font-size="16" fill="#475569">Commands supported components for diagnosis.</text><rect x="50" y="501" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="537" font-size="20" font-weight="700" fill="#35180d">5 · Coding/programming</text><text x="70" y="569" font-size="16" fill="#475569">Configuration or software work; a separate risk</text><text x="70" y="592" font-size="16" fill="#475569">class.</text><text x="44" y="674" font-size="13" fill="#64748b">Chassis Signal · documentation-first editorial synthesis</text></svg>