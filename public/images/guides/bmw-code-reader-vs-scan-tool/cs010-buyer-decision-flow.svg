<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="694" viewBox="0 0 1100 694" role="img" aria-labelledby="t d"><title id="t">Choose from the job backward</title><desc id="d">One missing function can make a long feature list irrelevant.</desc><rect width="1100" height="694" rx="24" fill="#f8fafc"/><rect width="1100" height="14" fill="#c2410c"/><text x="44" y="62" font-size="34" font-weight="800" fill="#35180d">Choose from the job backward</text><text x="44" y="98" font-size="18" fill="#475569">One missing function can make a long feature list irrelevant.</text><rect x="50" y="165" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="201" font-size="20" font-weight="700" fill="#35180d">Only a check-engine light?</text><text x="70" y="233" font-size="16" fill="#475569">A reputable generic reader may be enough.</text><rect x="560" y="165" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="201" font-size="20" font-weight="700" fill="#35180d">Need a BMW module?</text><text x="580" y="233" font-size="16" fill="#475569">Require the exact model, year and module.</text><rect x="50" y="333" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="369" font-size="20" font-weight="700" fill="#35180d">Need maintenance work?</text><text x="70" y="401" font-size="16" fill="#475569">Verify the named service procedure.</text><rect x="560" y="333" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="369" font-size="20" font-weight="700" fill="#35180d">Need actuator commands?</text><text x="580" y="401" font-size="16" fill="#475569">Require explicit active-test coverage.</text><rect x="50" y="501" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="537" font-size="20" font-weight="700" fill="#35180d">Need coding?</text><text x="70" y="569" font-size="16" fill="#475569">Confirm vehicle, app and interface separately.</text><text x="44" y="674" font-size="13" fill="#64748b">Chassis Signal · documentation-first editorial synthesis</text></svg>