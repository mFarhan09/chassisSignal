<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1000" viewBox="0 0 420 1000" role="img" aria-labelledby="t d"><title id="t">Choose from the job backward</title><desc id="d">One missing function can make a long feature list irrelevant.</desc><rect width="420" height="1000" rx="24" fill="#f8fafc"/><rect width="420" height="14" fill="#c2410c"/><text x="28" y="62" font-size="24" font-weight="800" fill="#35180d">Choose from the job</text><text x="28" y="92" font-size="24" font-weight="800" fill="#35180d">backward</text><text x="28" y="128" font-size="14" fill="#475569">One missing function can make a long feature</text><text x="28" y="150" font-size="14" fill="#475569">list irrelevant.</text><rect x="30" y="200" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="236" font-size="17" font-weight="700" fill="#35180d">Only a check-engine light?</text><text x="50" y="268" font-size="14" fill="#475569">A reputable generic reader may be enough.</text><rect x="30" y="356" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="392" font-size="17" font-weight="700" fill="#35180d">Need a BMW module?</text><text x="50" y="424" font-size="14" fill="#475569">Require the exact model, year and module.</text><rect x="30" y="512" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="548" font-size="17" font-weight="700" fill="#35180d">Need maintenance work?</text><text x="50" y="580" font-size="14" fill="#475569">Verify the named service procedure.</text><rect x="30" y="668" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="704" font-size="17" font-weight="700" fill="#35180d">Need actuator commands?</text><text x="50" y="736" font-size="14" fill="#475569">Require explicit active-test coverage.</text><rect x="30" y="824" width="360" height="138" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="860" font-size="17" font-weight="700" fill="#35180d">Need coding?</text><text x="50" y="892" font-size="14" fill="#475569">Confirm vehicle, app and interface</text><text x="50" y="915" font-size="14" fill="#475569">separately.</text><text x="28" y="980" font-size="13" fill="#64748b">Chassis Signal · documentation-first editorial synthesis</text></svg>