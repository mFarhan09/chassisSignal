<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1700" viewBox="0 0 1080 1700" role="img" aria-labelledby="title desc">
<title id="title">Configuration intersection mobile diagram</title><desc id="desc">Six stacked compatibility layers lead to supported or unknown.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0F14"/><stop offset="1" stop-color="#101720"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#526275"/></marker><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#F4F1E8}.eye{font-size:24px;font-weight:700;letter-spacing:3px;fill:#63B3FF}.h1{font-size:56px;font-weight:720}.sub{font-size:27px;fill:#AAB4C2}.name{font-size:28px;font-weight:720}.small{font-size:22px;fill:#AAB4C2}.label{font-size:21px;font-weight:750;letter-spacing:2px}.card{fill:#121923;stroke:#344252;stroke-width:2}.flow{stroke:#526275;stroke-width:4;marker-end:url(#a)}</style></defs>
<rect width="1080" height="1700" fill="url(#bg)"/><text x="70" y="72" class="eye">CHASSIS SIGNAL ANALYSIS</text><text x="70" y="144" class="h1">Support is an intersection</text><text x="70" y="190" class="sub">Every applicable layer must align</text>
<rect x="70" y="228" width="940" height="70" rx="16" fill="#281A18" stroke="#744039"/><text x="540" y="273" text-anchor="middle" font-size="26" font-weight="700" fill="#FFAA98">PHYSICAL OBD FIT ≠ APP COMPATIBILITY</text>
<g class="card"><rect x="140" y="340" width="800" height="130" rx="22"/><rect x="140" y="505" width="800" height="130" rx="22"/><rect x="140" y="670" width="800" height="130" rx="22"/><rect x="140" y="835" width="800" height="130" rx="22"/><rect x="140" y="1000" width="800" height="130" rx="22"/><rect x="140" y="1165" width="800" height="130" rx="22"/></g>
<path d="M540 470V495M540 635V660M540 800V825M540 965V990M540 1130V1155" class="flow"/>
<g><circle cx="190" cy="405" r="25" fill="#63B3FF"/><circle cx="190" cy="570" r="25" fill="#63B3FF"/><circle cx="190" cy="735" r="25" fill="#63B3FF"/><circle cx="190" cy="900" r="25" fill="#63B3FF"/><circle cx="190" cy="1065" r="25" fill="#63B3FF"/><circle cx="190" cy="1230" r="25" fill="#63B3FF"/></g>
<g font-size="22" font-weight="800" fill="#0B0F14" text-anchor="middle"><text x="190" y="413">1</text><text x="190" y="578">2</text><text x="190" y="743">3</text><text x="190" y="908">4</text><text x="190" y="1073">5</text><text x="190" y="1238">6</text></g>
<text x="245" y="397" class="name">VEHICLE / MODEL YEAR</text><text x="245" y="430" class="small">Exact car, not only the series</text>
<text x="245" y="562" class="name">INSTALLED ECU / MODULE</text><text x="245" y="595" class="small">Available hardware and software</text>
<text x="245" y="727" class="name">ADAPTER</text><text x="245" y="760" class="small">Exact officially listed route</text>
<text x="245" y="892" class="name">PHONE / PLATFORM</text><text x="245" y="925" class="small">Supported OS and app build</text>
<text x="245" y="1057" class="name">PAID ENTITLEMENT</text><text x="245" y="1090" class="small">Correct product, plan, and channel</text>
<text x="245" y="1222" class="name">REQUESTED FUNCTION</text><text x="245" y="1255" class="small">The precise coding or diagnostic job</text>
<rect x="70" y="1350" width="940" height="120" rx="20" fill="#102234" stroke="#315C7E" stroke-width="2"/><text x="540" y="1394" text-anchor="middle" class="label" fill="#B8DFFF">ALL APPLICABLE LAYERS ALIGN</text><text x="540" y="1440" text-anchor="middle" font-size="29" font-weight="720">SUPPORTED FOR THIS CONFIGURATION</text>
<rect x="70" y="1510" width="940" height="120" rx="20" fill="#2A1717" stroke="#744039" stroke-width="2"/><text x="540" y="1554" text-anchor="middle" class="label" fill="#FFAA98">ONE LAYER UNDOCUMENTED</text><text x="540" y="1600" text-anchor="middle" font-size="29" font-weight="720">UNKNOWN — DO NOT ASSUME</text>
</svg>
