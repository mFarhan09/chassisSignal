<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1900" viewBox="0 0 1080 1900" role="img" aria-labelledby="title desc">
<title id="title">Adapter compatibility mobile cards</title><desc id="desc">Seven documented adapter route cards with restrictions and cross-app status.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0F14"/><stop offset="1" stop-color="#101720"/></linearGradient><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#F4F1E8}.eye{font-size:23px;font-weight:700;letter-spacing:3px;fill:#63B3FF}.h1{font-size:51px;font-weight:720}.sub{font-size:26px;fill:#AAB4C2}.name{font-size:27px;font-weight:720}.status{font-size:20px;font-weight:750;letter-spacing:1px}.body{font-size:21px;fill:#D6DDE6}.small{font-size:18px;fill:#99A6B6}.card{fill:#121923;stroke:#2B3542;stroke-width:2}.ok{fill:#B8DFFF}.warn{fill:#FFD49A}.no{fill:#FFAA98}</style></defs>
<rect width="1080" height="1900" fill="url(#bg)"/><text x="60" y="68" class="eye">APP + VEHICLE + PLATFORM</text><text x="60" y="132" class="h1">Adapter compatibility</text><text x="60" y="175" class="sub">Documented routes only · no cross-app assumptions</text>
<g class="card"><rect x="60" y="220" width="960" height="190" rx="22"/><rect x="60" y="428" width="960" height="190" rx="22"/><rect x="60" y="636" width="960" height="190" rx="22"/><rect x="60" y="844" width="960" height="210" rx="22"/><rect x="60" y="1072" width="960" height="190" rx="22"/><rect x="60" y="1280" width="960" height="210" rx="22"/></g>
<rect x="60" y="1508" width="960" height="230" rx="22" fill="#17152A" stroke="#4C4072" stroke-width="2"/>
<text x="94" y="264" class="name">BimmerCode · OBDLink CX</text><text x="94" y="304" class="status ok">OFFICIALLY SUPPORTED · ALL SERIES</text><text x="94" y="344" class="body">Exact vehicle/module checker still controls.</text><text x="94" y="380" class="small no">Carly Premium support: not officially documented</text>
<text x="94" y="472" class="name">BimmerCode · OBDLink MX+</text><text x="94" y="512" class="status ok">OFFICIALLY SUPPORTED · ALL SERIES</text><text x="94" y="552" class="body">Exact vehicle/module checker still controls.</text><text x="94" y="588" class="small no">Carly Premium support: not officially documented</text>
<text x="94" y="680" class="name">BimmerCode · UniCarScan UCSI-2100</text><text x="94" y="720" class="status ok">OFFICIALLY SUPPORTED · ALL SERIES</text><text x="94" y="760" class="body">Exact vehicle/module checker still controls.</text><text x="94" y="796" class="small no">Carly Premium support: not officially documented</text>
<text x="94" y="888" class="name">BimmerCode · Veepeak BLE / BLE+</text><text x="94" y="928" class="status warn">RESTRICTED</text><text x="94" y="968" class="body">E 2008+, F, I, R 2008+ · G is not listed.</text><text x="94" y="1018" class="small no">Carly Premium support: not officially documented</text>
<text x="94" y="1116" class="name">BimmerCode · ENET routes</text><text x="94" y="1156" class="status ok">OFFICIALLY SUPPORTED</text><text x="94" y="1196" class="body">Listed F, G, and I routes only.</text><text x="94" y="1232" class="small no">Carly Premium support: not officially documented</text>
<text x="94" y="1324" class="name">BimmerCode · DCAN USB</text><text x="94" y="1364" class="status ok">OFFICIALLY SUPPORTED</text><text x="94" y="1404" class="body">Listed E and R categories only.</text><text x="94" y="1440" class="small">Not a universal K-DCAN rule.</text><text x="620" y="1440" class="small no">Carly: not documented</text>
<text x="94" y="1554" class="name">Carly · Universal Scanner</text><text x="94" y="1594" class="status" fill="#D7CAFF">DOCUMENTED FOR CARLY ECOSYSTEM</text><text x="94" y="1634" class="body">Exact vehicle and function support varies.</text><text x="94" y="1670" class="small">Around 1996–2002 may need an extra 20-pin adapter.</text><text x="94" y="1710" class="small no">BimmerCode support: not official; scanner is not on its list</text>
<rect x="60" y="1770" width="960" height="84" rx="18" fill="#281A18" stroke="#744039"/><text x="540" y="1804" text-anchor="middle" font-size="20" font-weight="750" fill="#FFAA98">OBD CONNECTOR FIT ALONE DOES NOT</text><text x="540" y="1834" text-anchor="middle" font-size="20" font-weight="750" fill="#FFAA98">ESTABLISH APP COMPATIBILITY</text>
</svg>
