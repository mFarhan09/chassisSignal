<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Configuration intersection for BMW and MINI app support</title><desc id="desc">Vehicle, ECU, adapter, platform, entitlement, and requested function must all align. An undocumented layer means unknown.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0F14"/><stop offset="1" stop-color="#101720"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".25"/></filter><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#526275"/></marker><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#F4F1E8}.eye{font-size:18px;font-weight:700;letter-spacing:3px;fill:#63B3FF}.h1{font-size:48px;font-weight:720}.sub{font-size:22px;fill:#AAB4C2}.num{font-size:16px;font-weight:800;fill:#0B0F14}.name{font-size:21px;font-weight:700}.small{font-size:16px;fill:#AAB4C2}.label{font-size:17px;font-weight:750;letter-spacing:2px}.card{fill:#121923;stroke:#344252;stroke-width:2}.flow{stroke:#526275;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/><text x="90" y="86" class="eye">CHASSIS SIGNAL ANALYSIS</text><text x="90" y="150" class="h1">Support is an intersection</text><text x="90" y="190" class="sub">Every applicable layer must align with the requested function</text>
<g filter="url(#s)">
<rect x="70" y="300" width="220" height="190" rx="22" class="card"/><rect x="318" y="300" width="220" height="190" rx="22" class="card"/><rect x="566" y="300" width="220" height="190" rx="22" class="card"/><rect x="814" y="300" width="220" height="190" rx="22" class="card"/><rect x="1062" y="300" width="220" height="190" rx="22" class="card"/><rect x="1310" y="300" width="220" height="190" rx="22" class="card"/>
</g>
<path d="M290 395H310M538 395H558M786 395H806M1034 395H1054M1282 395H1302" class="flow"/>
<g><circle cx="110" cy="340" r="18" fill="#63B3FF"/><text x="105" y="346" class="num">1</text><circle cx="358" cy="340" r="18" fill="#63B3FF"/><text x="353" y="346" class="num">2</text><circle cx="606" cy="340" r="18" fill="#63B3FF"/><text x="601" y="346" class="num">3</text><circle cx="854" cy="340" r="18" fill="#63B3FF"/><text x="849" y="346" class="num">4</text><circle cx="1102" cy="340" r="18" fill="#63B3FF"/><text x="1097" y="346" class="num">5</text><circle cx="1350" cy="340" r="18" fill="#63B3FF"/><text x="1345" y="346" class="num">6</text></g>
<text x="100" y="395" class="name">VEHICLE</text><text x="100" y="425" class="small">Model + year</text>
<text x="348" y="395" class="name">ECU / MODULE</text><text x="348" y="425" class="small">Installed hardware</text>
<text x="596" y="395" class="name">ADAPTER</text><text x="596" y="425" class="small">Exact listed route</text>
<text x="844" y="395" class="name">PLATFORM</text><text x="844" y="425" class="small">Phone / desktop</text>
<text x="1092" y="395" class="name">ENTITLEMENT</text><text x="1092" y="425" class="small">Paid access</text>
<text x="1340" y="395" class="name">FUNCTION</text><text x="1340" y="425" class="small">The actual job</text>
<rect x="250" y="570" width="1100" height="100" rx="20" fill="#102234" stroke="#315C7E" stroke-width="2"/><text x="800" y="612" text-anchor="middle" class="label" fill="#B8DFFF">ALL APPLICABLE LAYERS DOCUMENTED</text><text x="800" y="648" text-anchor="middle" font-size="25" font-weight="700">SUPPORTED FOR THIS CONFIGURATION</text>
<rect x="250" y="700" width="1100" height="100" rx="20" fill="#2A1717" stroke="#744039" stroke-width="2"/><text x="800" y="742" text-anchor="middle" class="label" fill="#FFAA98">ONE LAYER UNDOCUMENTED</text><text x="800" y="778" text-anchor="middle" font-size="25" font-weight="700">UNKNOWN — DO NOT ASSUME SUPPORT</text>
<rect x="90" y="224" width="510" height="48" rx="14" fill="#281A18" stroke="#744039"/><text x="116" y="255" font-size="20" font-weight="700" fill="#FFAA98">PHYSICAL OBD FIT ≠ APP COMPATIBILITY</text>
</svg>
