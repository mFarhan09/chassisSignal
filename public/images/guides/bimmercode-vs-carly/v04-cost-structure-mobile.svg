<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1750" viewBox="0 0 1080 1750" role="img" aria-labelledby="title desc">
<title id="title">Four-bucket cost structure mobile diagram</title><desc id="desc">Four stacked cost buckets separate hardware, initial software, recurring entitlement, and optional software.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0F14"/><stop offset="1" stop-color="#101720"/></linearGradient><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#F4F1E8}.eye{font-size:23px;font-weight:700;letter-spacing:3px;fill:#63B3FF}.h1{font-size:50px;font-weight:720}.sub{font-size:25px;fill:#AAB4C2}.num{font-size:38px;font-weight:760;fill:#526275}.label{font-size:21px;font-weight:750;letter-spacing:1.5px}.product{font-size:23px;font-weight:720}.body{font-size:21px;fill:#D6DDE6}.small{font-size:18px;fill:#99A6B6}.card{fill:#121923;stroke:#2B3542;stroke-width:2}</style></defs>
<rect width="1080" height="1750" fill="url(#bg)"/><text x="60" y="68" class="eye">PRICING CHECKED · 2026-08-22</text><text x="60" y="132" class="h1">Four cost buckets</text><text x="60" y="174" class="sub">No one-price shortcut · no universal total</text>
<g class="card"><rect x="60" y="220" width="960" height="300" rx="22"/><rect x="60" y="540" width="960" height="300" rx="22"/><rect x="60" y="860" width="960" height="300" rx="22"/><rect x="60" y="1180" width="960" height="340" rx="22"/></g>
<text x="96" y="270" class="num">01</text><text x="176" y="270" class="label" fill="#63B3FF">HARDWARE</text><text x="96" y="330" class="product">BimmerCode route</text><text x="380" y="330" class="body">Supported adapter required · price not verified</text><text x="96" y="394" class="product">Carly route</text><text x="380" y="394" class="body">Scanner / package path</text><text x="380" y="430" class="small">Website bundle differs from App Store IAP</text>
<text x="96" y="590" class="num">02</text><text x="176" y="590" class="label" fill="#63B3FF">INITIAL SOFTWARE</text><text x="96" y="650" class="product">BimmerCode · US iOS</text><text x="430" y="650" class="body">$49.99 Full Version</text><text x="430" y="686" class="small">Android / desktop price unknown</text><text x="96" y="750" class="product">Carly · US iOS</text><text x="430" y="750" class="body">$59.99 / $63.99 / $82.99 yearly SKUs</text><text x="430" y="786" class="small">Do not infer why the BMW SKU names differ</text>
<text x="96" y="910" class="num">03</text><text x="176" y="910" class="label" fill="#B89CFF">RECURRING ENTITLEMENT</text><text x="96" y="970" class="product">BimmerCode · US iOS</text><text x="430" y="970" class="body">None documented for verified purchase</text><text x="96" y="1040" class="product">Carly Premium</text><text x="430" y="1040" class="body">Yearly · renewal route depends on channel</text>
<text x="96" y="1230" class="num">04</text><text x="176" y="1230" class="label" fill="#F2B35D">OPTIONAL / ADDITIONAL</text><text x="96" y="1290" class="product">BimmerLink · separate</text><text x="430" y="1290" class="body">$39.99 US iOS</text><text x="430" y="1326" class="small">$9.99 CarPlay add-on only if wanted</text><text x="96" y="1400" class="product">Carly</text><text x="430" y="1400" class="body">Smart Mechanic / broader plan if needed</text><text x="96" y="1470" class="small">Keep separate products, channels, and entitlements visible.</text>
<rect x="60" y="1570" width="960" height="120" rx="20" fill="#281A18" stroke="#744039" stroke-width="2"/><text x="540" y="1614" text-anchor="middle" class="label" fill="#FFAA98">NO UNIVERSAL TOTAL</text><text x="540" y="1654" text-anchor="middle" class="body">Owned hardware, platform, plan, add-ons, and time horizon matter.</text>
</svg>
