<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Four-bucket cost structure for BimmerCode and Carly</title><desc id="desc">Hardware, initial software, recurring entitlement, and optional software are separated with channel-specific examples and no universal total.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0F14"/><stop offset="1" stop-color="#101720"/></linearGradient><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#F4F1E8}.eye{font-size:18px;font-weight:700;letter-spacing:3px;fill:#63B3FF}.h1{font-size:46px;font-weight:720}.sub{font-size:21px;fill:#AAB4C2}.num{font-size:42px;font-weight:760;fill:#425065}.label{font-size:17px;font-weight:750;letter-spacing:1.5px}.product{font-size:18px;font-weight:720}.body{font-size:16px;fill:#D6DDE6}.small{font-size:14px;fill:#99A6B6}.card{fill:#121923;stroke:#2B3542;stroke-width:2}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="80" class="eye">PRICING CHECKED · 2026-08-22</text><text x="80" y="142" class="h1">One headline price misses four cost buckets</text><text x="80" y="182" class="sub">Compare the same channel, configuration, and time horizon — without a universal total</text>
<g class="card"><rect x="80" y="250" width="340" height="470" rx="22"/><rect x="447" y="250" width="340" height="470" rx="22"/><rect x="814" y="250" width="340" height="470" rx="22"/><rect x="1181" y="250" width="340" height="470" rx="22"/></g>
<text x="110" y="314" class="num">01</text><text x="110" y="358" class="label" fill="#63B3FF">HARDWARE</text><line x1="110" y1="382" x2="390" y2="382" stroke="#344252" stroke-width="2"/><text x="110" y="426" class="product">BimmerCode route</text><text x="110" y="458" class="body">Supported adapter required</text><text x="110" y="484" class="small">Current price not verified</text><text x="110" y="544" class="product">Carly route</text><text x="110" y="576" class="body">Scanner / package path</text><text x="110" y="602" class="small">Website bundle differs from App Store</text>
<text x="477" y="314" class="num">02</text><text x="477" y="358" class="label" fill="#63B3FF">INITIAL SOFTWARE</text><line x1="477" y1="382" x2="757" y2="382" stroke="#344252" stroke-width="2"/><text x="477" y="426" class="product">BimmerCode · US iOS</text><text x="477" y="458" class="body">Full Version · $49.99</text><text x="477" y="484" class="small">Android / desktop price unknown</text><text x="477" y="544" class="product">Carly · US iOS</text><text x="477" y="576" class="body">$59.99 / $63.99 / $82.99</text><text x="477" y="602" class="small">Separate yearly SKUs; scope differs</text>
<text x="844" y="314" class="num">03</text><text x="844" y="358" class="label" fill="#B89CFF">RECURRING ENTITLEMENT</text><line x1="844" y1="382" x2="1124" y2="382" stroke="#344252" stroke-width="2"/><text x="844" y="426" class="product">BimmerCode · US iOS</text><text x="844" y="458" class="body">No recurring subscription</text><text x="844" y="484" class="small">documented for verified purchase</text><text x="844" y="544" class="product">Carly Premium</text><text x="844" y="576" class="body">Yearly entitlement</text><text x="844" y="602" class="small">Renewal route depends on channel</text>
<text x="1211" y="314" class="num">04</text><text x="1211" y="358" class="label" fill="#F2B35D">OPTIONAL / ADDITIONAL</text><line x1="1211" y1="382" x2="1491" y2="382" stroke="#344252" stroke-width="2"/><text x="1211" y="426" class="product">BimmerLink · separate</text><text x="1211" y="458" class="body">US iOS · $39.99</text><text x="1211" y="484" class="small">CarPlay add-on · $9.99 optional</text><text x="1211" y="544" class="product">Carly</text><text x="1211" y="576" class="body">Smart Mechanic / broader plan</text><text x="1211" y="602" class="small">Only if the owner needs it</text>
<rect x="80" y="762" width="1440" height="82" rx="18" fill="#281A18" stroke="#744039" stroke-width="2"/><text x="800" y="796" text-anchor="middle" class="label" fill="#FFAA98">NO UNIVERSAL TOTAL</text><text x="800" y="826" text-anchor="middle" font-size="19">Hardware ownership, platform, SKU, add-ons, and time horizon change the comparison.</text>
</svg>
