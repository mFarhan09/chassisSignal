<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600" role="img" aria-labelledby="title desc">
<title id="title">Documented product scope on mobile</title><desc id="desc">Separate stacked cards for BimmerCode, BimmerCode plus BimmerLink, and Carly.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0F14"/><stop offset="1" stop-color="#101720"/></linearGradient><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#F4F1E8}.eye{font-size:24px;font-weight:700;letter-spacing:3px;fill:#63B3FF}.h1{font-size:54px;font-weight:720}.sub{font-size:28px;fill:#AAB4C2}.name{font-size:34px;font-weight:720}.label{font-size:20px;font-weight:700;letter-spacing:2px}.body{font-size:25px;fill:#D8DEE7}.small{font-size:21px;fill:#AAB4C2}.card{fill:#121923;stroke:#2B3542;stroke-width:2}</style></defs>
<rect width="1080" height="1600" fill="url(#bg)"/><text x="70" y="72" class="eye">CHASSIS SIGNAL / CS-001</text><text x="70" y="142" class="h1">Documented product scope</text><text x="70" y="188" class="sub">Three distinct routes · no winner</text>
<rect x="70" y="246" width="940" height="300" rx="24" class="card"/><rect x="70" y="246" width="9" height="300" rx="4" fill="#63B3FF"/><text x="116" y="298" class="label" fill="#63B3FF">ONE PRODUCT</text><text x="116" y="350" class="name">BimmerCode</text><text x="116" y="390" class="body">Focused coding / customization</text><text x="116" y="446" class="small">Exact vehicle, ECU/module, and adapter still control.</text><text x="116" y="486" class="small">Diagnostics/service are not BimmerCode functions.</text>
<rect x="70" y="578" width="940" height="400" rx="24" class="card"/><rect x="70" y="578" width="9" height="400" rx="4" fill="#F2B35D"/><text x="116" y="630" class="label" fill="#F2B35D">TWO SEPARATE PRODUCTS</text><rect x="116" y="662" width="848" height="110" rx="16" fill="#132A3E" stroke="#315C7E"/><text x="146" y="708" class="name">BimmerCode</text><text x="430" y="708" class="body">coding / customization</text><text x="526" y="810" font-size="34" font-weight="700">+</text><rect x="116" y="836" width="848" height="110" rx="16" fill="#302617" stroke="#72582C"/><text x="146" y="882" class="name">BimmerLink</text><text x="432" y="882" class="body">diagnostics · live data · service</text><text x="116" y="968" class="small">Separate software purchases and licenses.</text>
<rect x="70" y="1010" width="940" height="330" rx="24" class="card"/><rect x="70" y="1010" width="9" height="330" rx="4" fill="#B89CFF"/><text x="116" y="1062" class="label" fill="#B89CFF">PAID ECOSYSTEM</text><text x="116" y="1114" class="name">Carly</text><text x="116" y="1154" class="body">Coding · diagnostics · live data · service · battery</text><text x="116" y="1216" class="small">Documented categories vary by model, build year,</text><text x="116" y="1250" class="small">hardware, software, installed ECU, and entitlement.</text>
<rect x="70" y="1380" width="940" height="150" rx="20" fill="#0F151D" stroke="#303C49" stroke-width="2"/><text x="112" y="1428" class="label" fill="#FF8A72">CHASSIS SIGNAL ANALYSIS</text><text x="112" y="1470" class="body">Overlap on supported coding does not make</text><text x="112" y="1504" class="body">these routes exact like-for-like products.</text></svg>
