<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Approved adapter compatibility routes</title><desc id="desc">Concise BimmerCode and Carly adapter matrix with exact restrictions and no assumed cross-app support.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0F14"/><stop offset="1" stop-color="#101720"/></linearGradient><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#F4F1E8}.eye{font-size:18px;font-weight:700;letter-spacing:3px;fill:#63B3FF}.h1{font-size:46px;font-weight:720}.sub{font-size:21px;fill:#AAB4C2}.head{font-size:15px;font-weight:750;letter-spacing:1.5px;fill:#8F9BAB}.name{font-size:19px;font-weight:700}.body{font-size:16px;fill:#D6DDE6}.small{font-size:14px;fill:#99A6B6}.ok{fill:#B8DFFF}.warn{fill:#FFD49A}.no{fill:#FFAA98}.row{fill:#121923;stroke:#2B3542;stroke-width:1.5}</style></defs>
<rect width="1600" height="1000" fill="url(#bg)"/><text x="80" y="78" class="eye">APP + VEHICLE + PLATFORM</text><text x="80" y="140" class="h1">Adapter compatibility — documented routes only</text><text x="80" y="180" class="sub">Official for one ecosystem does not establish support in the other</text>
<rect x="80" y="226" width="1440" height="58" rx="14" fill="#0F151D" stroke="#2B3542"/><text x="110" y="262" class="head">ECOSYSTEM / ADAPTER</text><text x="560" y="262" class="head">OFFICIAL STATUS</text><text x="890" y="262" class="head">KEY RESTRICTION</text><text x="1280" y="262" class="head">OTHER APP</text>
<g>
<rect x="80" y="300" width="1440" height="78" rx="14" class="row"/><text x="110" y="332" class="name">BimmerCode · OBDLink CX</text><text x="110" y="356" class="small">Bluetooth</text><text x="560" y="344" class="body ok">OFFICIALLY SUPPORTED · ALL SERIES</text><text x="890" y="334" class="body">Exact vehicle/module checker</text><text x="890" y="358" class="small">still controls</text><text x="1280" y="344" class="body no">CARLY: NOT DOCUMENTED</text>
<rect x="80" y="390" width="1440" height="78" rx="14" class="row"/><text x="110" y="422" class="name">BimmerCode · OBDLink MX+</text><text x="110" y="446" class="small">Bluetooth</text><text x="560" y="434" class="body ok">OFFICIALLY SUPPORTED · ALL SERIES</text><text x="890" y="424" class="body">Exact vehicle/module checker</text><text x="890" y="448" class="small">still controls</text><text x="1280" y="434" class="body no">CARLY: NOT DOCUMENTED</text>
<rect x="80" y="480" width="1440" height="78" rx="14" class="row"/><text x="110" y="512" class="name">BimmerCode · UCSI-2100</text><text x="110" y="536" class="small">Bluetooth</text><text x="560" y="524" class="body ok">OFFICIALLY SUPPORTED · ALL SERIES</text><text x="890" y="514" class="body">Exact vehicle/module checker</text><text x="890" y="538" class="small">still controls</text><text x="1280" y="524" class="body no">CARLY: NOT DOCUMENTED</text>
<rect x="80" y="570" width="1440" height="78" rx="14" class="row"/><text x="110" y="602" class="name">BimmerCode · Veepeak BLE / BLE+</text><text x="110" y="626" class="small">Bluetooth LE</text><text x="560" y="614" class="body warn">RESTRICTED</text><text x="890" y="604" class="body">E 2008+, F, I, R 2008+</text><text x="890" y="628" class="small">G-series is not listed</text><text x="1280" y="614" class="body no">CARLY: NOT DOCUMENTED</text>
<rect x="80" y="660" width="1440" height="78" rx="14" class="row"/><text x="110" y="692" class="name">BimmerCode · ENET routes</text><text x="110" y="716" class="small">Wi-Fi / Ethernet</text><text x="560" y="704" class="body ok">OFFICIALLY SUPPORTED</text><text x="890" y="704" class="body">Listed F, G, and I routes only</text><text x="1280" y="704" class="body no">CARLY: NOT DOCUMENTED</text>
<rect x="80" y="750" width="1440" height="78" rx="14" class="row"/><text x="110" y="782" class="name">BimmerCode · DCAN USB</text><text x="110" y="806" class="small">USB cable route</text><text x="560" y="794" class="body ok">OFFICIALLY SUPPORTED</text><text x="890" y="784" class="body">Listed E and R categories only</text><text x="890" y="808" class="small">Not a universal protocol rule</text><text x="1280" y="794" class="body no">CARLY: NOT DOCUMENTED</text>
<rect x="80" y="840" width="1440" height="78" rx="14" fill="#17152A" stroke="#4C4072" stroke-width="1.5"/><text x="110" y="872" class="name">Carly · Universal Scanner</text><text x="110" y="896" class="small">Current black model</text><text x="560" y="884" class="body" fill="#D7CAFF">DOCUMENTED FOR CARLY ECOSYSTEM</text><text x="890" y="874" class="body">Exact car/function support varies</text><text x="890" y="898" class="small">Around 1996–2002 may need 20-pin adapter</text><text x="1280" y="884" class="body no">BIMMERCODE: NOT SUPPORTED</text>
</g>
<rect x="80" y="938" width="1440" height="42" rx="12" fill="#281A18" stroke="#744039"/><text x="800" y="966" text-anchor="middle" font-size="18" font-weight="750" fill="#FFAA98">OBD CONNECTOR FIT ALONE DOES NOT ESTABLISH APP COMPATIBILITY</text>
</svg>
