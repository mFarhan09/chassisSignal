<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Documented product scope: BimmerCode, BimmerCode plus BimmerLink, and Carly</title>
<desc id="desc">Three distinct routes compare focused coding, a two-product coding and diagnostics route, and Carly's broader paid ecosystem. Exact vehicle and function support still control.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0F14"/><stop offset="1" stop-color="#101720"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter><style>text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#F4F1E8}.eye{font-size:18px;font-weight:700;letter-spacing:3px;fill:#63B3FF}.h1{font-size:48px;font-weight:720}.sub{font-size:22px;fill:#AAB4C2}.name{font-size:30px;font-weight:720}.label{font-size:16px;font-weight:700;letter-spacing:2px}.body{font-size:20px;fill:#D8DEE7}.small{font-size:16px;fill:#9DA9B8}.chip{font-size:17px;font-weight:650}.card{fill:#121923;stroke:#2B3542;stroke-width:2}.line{stroke:#344252;stroke-width:2}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="90" y="86" class="eye">CHASSIS SIGNAL / CS-001</text><text x="90" y="150" class="h1">Documented product scope</text><text x="90" y="190" class="sub">Three distinct routes — not a feature-winner chart</text>
<g filter="url(#shadow)"><rect x="90" y="250" width="420" height="450" rx="22" class="card"/><rect x="590" y="250" width="420" height="450" rx="22" class="card"/><rect x="1090" y="250" width="420" height="450" rx="22" class="card"/></g>
<rect x="90" y="250" width="420" height="8" rx="4" fill="#63B3FF"/><text x="126" y="314" class="label" fill="#63B3FF">ONE PRODUCT</text><text x="126" y="366" class="name">BimmerCode</text><text x="126" y="410" class="body">Focused coding / customization</text><line x1="126" y1="446" x2="474" y2="446" class="line"/><rect x="126" y="482" width="214" height="42" rx="12" fill="#132A3E" stroke="#315C7E"/><text x="146" y="510" class="chip">SUPPORTED CODING</text><text x="126" y="570" class="small">Available options depend on the exact</text><text x="126" y="596" class="small">vehicle, ECU/module, and adapter.</text><text x="126" y="650" class="small">Diagnostics and service functions are</text><text x="126" y="676" class="small">not attributed to BimmerCode.</text>
<rect x="590" y="250" width="420" height="8" rx="4" fill="#F2B35D"/><text x="626" y="314" class="label" fill="#F2B35D">TWO SEPARATE PRODUCTS</text><rect x="626" y="350" width="348" height="100" rx="16" fill="#132A3E" stroke="#315C7E"/><text x="652" y="390" class="name" font-size="25">BimmerCode</text><text x="652" y="422" class="small">Coding / customization</text><circle cx="800" cy="478" r="20" fill="#2A3340"/><text x="793" y="486" font-size="25" font-weight="700">+</text><rect x="626" y="506" width="348" height="120" rx="16" fill="#302617" stroke="#72582C"/><text x="652" y="548" class="name" font-size="25">BimmerLink</text><text x="652" y="580" class="small">Diagnostics · live data · battery</text><text x="652" y="606" class="small">DPF and service where supported</text><text x="626" y="672" class="small">Separate purchases and licenses.</text>
<rect x="1090" y="250" width="420" height="8" rx="4" fill="#B89CFF"/><text x="1126" y="314" class="label" fill="#B89CFF">PAID ECOSYSTEM</text><text x="1126" y="366" class="name">Carly</text><text x="1126" y="410" class="body">Broader documented categories</text><line x1="1126" y1="446" x2="1474" y2="446" class="line"/><g class="chip"><rect x="1126" y="478" width="132" height="42" rx="12" fill="#251F38"/><text x="1146" y="506">CODING</text><rect x="1272" y="478" width="178" height="42" rx="12" fill="#302617"/><text x="1292" y="506">DIAGNOSTICS</text><rect x="1126" y="534" width="148" height="42" rx="12" fill="#302617"/><text x="1146" y="562">LIVE DATA</text><rect x="1288" y="534" width="162" height="42" rx="12" fill="#302617"/><text x="1308" y="562">SERVICE</text><rect x="1126" y="590" width="150" height="42" rx="12" fill="#302617"/><text x="1146" y="618">BATTERY</text></g><text x="1126" y="666" class="small">Category availability varies by model,</text><text x="1126" y="692" class="small">build year, hardware, software, and ECU.</text>
<rect x="90" y="748" width="1420" height="92" rx="18" fill="#0F151D" stroke="#303C49" stroke-width="2"/><text x="126" y="786" class="label" fill="#FF8A72">CHASSIS SIGNAL ANALYSIS</text><text x="126" y="820" class="body">The routes overlap on supported coding, but they are partial substitutes — not exact like-for-like products.</text>
</svg>
