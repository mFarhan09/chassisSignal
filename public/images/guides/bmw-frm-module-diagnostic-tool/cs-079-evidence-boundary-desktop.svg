<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">What a scanner can and cannot prove</title><desc id="desc">Identity, faults, status and documented outputs stop before memory repair and replacement programming. Module identity; Fault records; Live status; Output test; Coding boundary; Repair escalation.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="64" y="68" class="heading">What a scanner can and cannot prove</text><text x="64" y="114" class="sub">Identity, faults, status and documented outputs stop before memory repair and replacement programming.</text><circle cx="105" cy="215" r="21" fill="#65c8ff"/><rect x="155" y="184" width="950" height="62" rx="15" fill="#243b5a"/><text x="190" y="222" text-anchor="start" class="label"><tspan x="190" dy="0">Module identity</tspan></text><circle cx="105" cy="297" r="21" fill="#65c8ff"/><rect x="155" y="266" width="950" height="62" rx="15" fill="#243b5a"/><text x="190" y="304" text-anchor="start" class="label"><tspan x="190" dy="0">Fault records</tspan></text><circle cx="105" cy="379" r="21" fill="#65c8ff"/><rect x="155" y="348" width="950" height="62" rx="15" fill="#243b5a"/><text x="190" y="386" text-anchor="start" class="label"><tspan x="190" dy="0">Live status</tspan></text><circle cx="105" cy="461" r="21" fill="#65c8ff"/><rect x="155" y="430" width="950" height="62" rx="15" fill="#243b5a"/><text x="190" y="468" text-anchor="start" class="label"><tspan x="190" dy="0">Output test</tspan></text><circle cx="105" cy="543" r="21" fill="#65c8ff"/><rect x="155" y="512" width="950" height="62" rx="15" fill="#243b5a"/><text x="190" y="550" text-anchor="start" class="label"><tspan x="190" dy="0">Coding boundary</tspan></text><circle cx="105" cy="625" r="21" fill="#ff7f7f"/><rect x="155" y="594" width="950" height="62" rx="15" fill="#243b5a"/><text x="190" y="632" text-ancho