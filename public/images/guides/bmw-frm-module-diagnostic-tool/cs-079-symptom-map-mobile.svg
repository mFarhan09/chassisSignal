<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Map symptoms to FRM-controlled domains</title><desc id="desc">Lighting, windows and body states are clues only after the exact chassis assigns ownership. Identify chassis; List symptoms; Map functions; Check other modules; Form hypothesis.</desc><rect width="720" height="980" fill="#181426"/><rect width="720" height="16" fill="#c5a3ff"/><text x="44" y="70" text-anchor="start" class="heading"><tspan x="44" dy="0">Map symptoms to FRM-controlled</tspan><tspan x="44" dy="34">domains</tspan></text><text x="44" y="156" text-anchor="start" class="sub"><tspan x="44" dy="0">Lighting, windows and body states are clues only</tspan><tspan x="44" dy="24">after the exact chassis assigns ownership.</tspan></text><rect x="55" y="238" width="300" height="142" rx="18" fill="#3e315c" stroke="#c5a3ff" stroke-width="4"/><text x="205" y="316" text-anchor="middle" class="label"><tspan x="205" dy="0">Identify chassis</tspan></text><rect x="365" y="238" width="300" height="142" rx="21" fill="#3e315c" stroke="#c5a3ff" stroke-width="4"/><text x="515" y="316" text-anchor="middle" class="label"><tspan x="515" dy="0">List symptoms</tspan></text><rect x="55" y="428" width="300" height="142" rx="24" fill="#3e315c" stroke="#c5a3ff" stroke-width="4"/><text x="205" y="506" text-anchor="middle" class="label"><tspan x="205" dy="0">Map functions</tspan></text><rect x="365" y="428" width="300" height="142" rx="27" fill="#3e315c" stroke="#c5a3ff" stroke-width="4"/><text x="515" y="494" text-anchor="middle" class="label"><tspan x="515" dy="0">Check other</tspan><tspan x="515" dy="24">modules</tspan></text><rect x="55" y="618" width="300" height="142" rx="30" fill="#3e315c" stroke="#78e3d2" stroke-width="4"/><text x="205" y="696" text-anchor="middle" class="label"><tspan x="205" dy="0">Form hypothesis</tspan></text><circle cx="24" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="40" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="56" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="72" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="88" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="104" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="120" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="136" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="152" cy="958" r="2" fill="#78e3d2" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#bfd0dc}.label{font:600 19px Arial,sans-serif;fill:#fff}</style></svg>