"/><circle cx="104" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="120" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="136" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="152" cy="698" r="2" fill="#78e3d2" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#bfd0dc}.label{font:600 17px Arial,sans-serif;fill:#fff}</style></svg>