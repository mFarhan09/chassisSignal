<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">A dated scenario, not a universal price</title><desc id="desc">Record the quote inputs so another buyer can reproduce it.</desc><rect width="1200" height="700" fill="#fffbeb"/><text x="55" y="78" font-family="Arial" font-size="46" font-weight="800" fill="#78350f">A dated scenario, not a universal price</text><text x="55" y="125" font-family="Arial" font-size="24" fill="#475569">Record the quote inputs so another buyer can reproduce it.</text><text x="75" y="210" font-family="Arial" font-size="24" font-weight="700" fill="#b45309">CHECK</text><text x="540" y="210" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#78350f">Cost line</text><text x="920" y="210" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#78350f">Record</text><rect x="55" y="228" width="1090" height="82" rx="12" fill="#fff"/><foreignObject x="75" y="240" width="265" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 23px/1.25 Arial;color:#78350f">Market</div></foreignObject><foreignObject x="365" y="240" width="350" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.25 Arial;color:#334155">Country, currency and tax display</div></foreignObject><rect x="55" y="323" width="1090" height="82" rx="12" fill="#fef3c7"/><foreignObject x="75" y="335" width="265" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 23px/1.25 Arial;color:#78350f">Channel</div></foreignObject><foreignObject x="365" y="335" width="350" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.25 Arial;color:#334155">Carly website, Apple or Google</div></foreignObject><rect x="55" y="418" width="1090" height="82" rx="12" fill="#fff"/><foreignObject x="75" y="430" width="265" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 23px/1.25 Arial;color:#78350f">Package</div></foreignObject><foreignObject x="365" y="430" width="350" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.25 Arial;color:#334155">Basic, Premium, brand scope</div></foreignObject><rect x="55" y="513" width="1090" height="82" rx="12" fill="#fef3c7"/><foreignObject x="75" y="525" width="265" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 23px/1.25 Arial;color:#78350f">Lifecycle</div></foreignObject><foreignObject x="365" y="525" width="350" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.25 Arial;color:#334155">First year, renewal, optional features</div></foreignObject></svg>
