<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">Build the Carly ownership stack</title><desc id="desc">Dedicated mobile reflow. Keep acquisition channel, hardware and recurring software on separate lines.</desc><rect width="720" height="1080" fill="#fffbeb"/><foreignObject x="55" y="55" width="610" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="font:800 43px/1.12 Arial;color:#78350f">Build the Carly ownership stack</div></foreignObject><foreignObject x="55" y="170" width="610" height="60"><div xmlns="http://www.w3.org/1999/xhtml" style="font:24px/1.3 Arial;color:#475569">Keep acquisition channel, hardware and recurring software on separate lines.</div></foreignObject><g><rect x="55" y="250" width="610" height="175" rx="28" fill="#fff" stroke="#b45309" stroke-width="4"/><circle cx="110" cy="305" r="29" fill="#b45309"/><text x="110" y="315" text-anchor="middle" font-size="28" font-family="Arial" font-weight="700" fill="#fff">1</text><text x="160" y="312" font-size="32" font-family="Arial" font-weight="700" fill="#78350f">Acquire</text><foreignObject x="85" y="340" width="550" height="65"><div xmlns="http://www.w3.org/1999/xhtml" style="font:25px/1.3 Arial;color:#334155">Website bundle or app-store path</div></foreignObject></g><g><rect x="55" y="475" width="610" height="175" rx="28" fill="#fef3c7" stroke="#b45309" stroke-width="4"/><circle cx="110" cy="530" r="29" fill="#b45309"/><text x="110" y="540" text-anchor="middle" font-size="28" font-family="Arial" font-weight="700" fill="#fff">2</text><text x="160" y="537" font-size="32" font-family="Arial" font-weight="700" fill="#78350f">Operate</text><foreignObject x="85" y="565" width="550" height="65"><div xmlns="http://www.w3.org/1999/xhtml" style="font:25px/1.3 Arial;color:#334155">Annual license + supported scanner</div></foreignObject></g><g><rect x="55" y="700" width="610" height="175" rx="28" fill="#fff" stroke="#b45309" stroke-