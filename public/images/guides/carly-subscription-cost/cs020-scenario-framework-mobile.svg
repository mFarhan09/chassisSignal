<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc"><title id="title">A dated scenario, not a universal price</title><desc id="desc">Dedicated stacked mobile decision cards. Record the quote inputs so another buyer can reproduce it.</desc><rect width="720" height="1080" fill="#fffbeb"/><foreignObject x="45" y="45" width="630" height="115"><div xmlns="http://www.w3.org/1999/xhtml" style="font:800 42px/1.12 Arial;color:#78350f">A dated scenario, not a universal price</div></foreignObject><foreignObject x="45" y="165" width="630" height="70"><div xmlns="http://www.w3.org/1999/xhtml" style="font:24px/1.3 Arial;color:#475569">Record the quote inputs so another buyer can reproduce it.</div></foreignObject><g><rect x="45" y="260" width="630" height="155" rx="24" fill="#fff" stroke="#b45309" stroke-width="3"/><text x="75" y="302" font-family="Arial" font-size="27" font-weight="800" fill="#78350f">Market</text><foreignObject x="75" y="318" width="570" height="85"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.28 Arial;color:#334155">Country, currency and tax display</div></foreignObject></g><g><rect x="45" y="440" width="630" height="155" rx="24" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="75" y="482" font-family="Arial" font-size="27" font-weight="800" fill="#78350f">Channel</text><foreignObject x="75" y="498" width="570" height="85"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.28 Arial;color:#334155">Carly website, Apple or Google</div></foreignObject></g><g><rect x="45" y="620" width="630" height="155" rx="24" fill="#fff" stroke="#b45309" stroke-width="3"/><text x="75" y="662" font-family="Arial" font-size="27" font-weight="800" fill="#78350f">Package</text><foreignObject x="75" y="678" width="570" height="85"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.28 Arial;color:#334155">Basic, Premium, brand scope</div></foreignObject></g><g><rect x="45" y="800" width="630" height="155" rx="24" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><text x="75" y="842" font-family="Arial" font-size="27" font-weight="800" fill="#78350f">Lifecycle</text><foreignObject x="75" y="858" width="570" height="85"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.28 Arial;color:#334155">First year, renewal, optional features</div></foreignObject></g></svg>
