<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="541" viewBox="0 0 1100 541" role="img" aria-labelledby="title desc"><title id="title">A safe adapter purchase record</title><desc id="desc">Save the evidence that applies to your exact path.</desc><rect width="1100" height="541" rx="24" fill="#f8fafc"/><rect width="1100" height="14" fill="#c2410c"/><text x="44" y="62" font-size="34" font-weight="800" fill="#35180d">A safe adapter purchase record</text><text x="44" y="104" font-size="18" fill="#475569">Save the evidence that applies to your exact path.</text><rect x="50" y="165" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="201" font-size="20" font-weight="700" fill="#35180d">App evidence</text><text x="70" y="233" font-size="16" fill="#475569">Current BimmerLink vehicle and function pages.</text><rect x="560" y="165" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="201" font-size="20" font-weight="700" fill="#35180d">Adapter evidence</text><text x="580" y="233" font-size="16" fill="#475569">Exact model in the official compatibility table.</text><rect x="50" y="333" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="369" font-size="20" font-weight="700" fill="#35180d">Vendor evidence</text><text x="70" y="401" font-size="16" fill="#475569">OS, radio type, firmware, and electrical limits.</text><rect x="560" y="333" width="490" height="150" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="369" font-size="20" font-weight="700" fill="#35180d">Operational limits</text><text x="580" y="401" font-size="16" fill="#475569">Other app conflicts, pairing steps, and</text><text x="580" y="423" font-size="16" fill="#475569">removal/storage guidance.</text><text x="44" y="523" font-size="13" fill="#64748b">Chassis Signal · documentation-first editorial synthesis</text></svg>