<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Know when to stop and hand off</title><desc id="desc">Leaks, warnings, unstable pedal feel, communication faults, and failed routines raise the escalation level. Labels: Verify, Pause, Diagnose, Professional handoff.</desc><rect width="1280" height="720" fill="#07111f"/><rect width="1280" height="18" fill="#f472b6"/><text x="58" y="76" class="heading">Know when to stop and hand off</text><text x="58" y="130" class="sub">Leaks, warnings, unstable pedal feel, communication faults, and failed routines raise the escalation level.</text><text x="1226" y="174" text-anchor="end" class="type">ESCALATION METER</text><g><rect x="50" y="235" width="278" height="210" rx="27" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="74" y="267" class="num">01</text><text x="189" y="355" text-anchor="middle" class="label">Verify</text><path d="M328 340 H350" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="350" y="290" width="278" height="210" rx="27" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="374" y="322" class="num">02</text><text x="489" y="410" text-anchor="middle" class="label">Pause</text><path d="M628 395 H650" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="650" y="235" width="278" height="210" rx="27" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="674" y="267" class="num">03</text><text x="789" y="355" text-anchor="middle" class="label">Diagnose</text><path d="M928 340 H950" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="950" y="290" width="278" height="210" rx="27" fill="#f472b6" stroke="#f472b6" stroke-width="0"/><text x="974" y="322" class="num">04</text><text x="1089" y="410" text-anchor="middle" class="label">Professional handoff</text></g><circle cx="30" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="50" c