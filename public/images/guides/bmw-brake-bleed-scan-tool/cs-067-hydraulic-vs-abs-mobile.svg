<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Two layers of the same service event</title><desc id="desc">The physical hydraulic circuit and the DSC service function have related but different roles. Labels: Reservoir, Hydraulic circuit, Calipers, DSC hydraulic unit, Diagnostic command.</desc><rect width="720" height="980" fill="#07111f"/><rect width="720" height="18" fill="#f472b6"/><text x="46" y="78" class="heading">Two layers of the same service event</text><text x="46" y="140" class="sub">The physical hydraulic circuit and the DSC service function have related but different roles.</text><text x="666" y="194" text-anchor="end" class="type">SPLIT FLUID SYSTEM</text><g><rect x="60" y="245" width="600" height="88" rx="18" fill="#f472b6" stroke="#f472b6" stroke-width="0"/><text x="84" y="277" class="num">01</text><text x="142" y="297" text-anchor="start" class="label">Reservoir</text><path d="M360 333 V357" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="357" width="600" height="88" rx="18" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="84" y="389" class="num">02</text><text x="142" y="409" text-anchor="start" class="label">Hydraulic circuit</text><path d="M360 445 V469" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="469" width="600" height="88" rx="18" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="84" y="501" class="num">03</text><text x="142" y="521" text-anchor="start" class="label">Calipers</text><path d="M360 557 V581" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="581" width="600" height="88" rx="18" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="84" y="613" class="num">04</text><text x="142" y="633" text-anchor="start" class="label">DSC hydraulic unit</text><path d="M360 669 V693" stroke="#f472b6" stroke-width="4" stroke-dasha