<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Five locks on a service-function claim</title><desc id="desc">The claim opens only when vehicle, module, function, tool, and software all match. Labels: Vehicle, DSC module, Named function, Tool model, Software and market.</desc><rect width="720" height="980" fill="#07111f"/><rect width="720" height="18" fill="#f472b6"/><text x="46" y="78" class="heading">Five locks on a service-function claim</text><text x="46" y="140" class="sub">The claim opens only when vehicle, module, function, tool, and software all match.</text><text x="666" y="194" text-anchor="end" class="type">LOCK STACK</text><g><rect x="60" y="245" width="600" height="88" rx="24" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="84" y="277" class="num">01</text><text x="142" y="297" text-anchor="start" class="label">Vehicle</text><path d="M360 333 V357" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="357" width="600" height="88" rx="24" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="84" y="389" class="num">02</text><text x="142" y="409" text-anchor="start" class="label">DSC module</text><path d="M360 445 V469" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="469" width="600" height="88" rx="24" fill="#f472b6" stroke="#f472b6" stroke-width="0"/><text x="84" y="501" class="num">03</text><text x="142" y="521" text-anchor="start" class="label">Named function</text><path d="M360 557 V581" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="581" width="600" height="88" rx="24" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="84" y="613" class="num">04</text><text x="142" y="633" text-anchor="start" class="label">Tool model</text><path d="M360 669 V693" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="693" width="600" height="88" rx="24" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="84" y="725" class="num">05</text><text x="142" y="745" text-anchor="start" class="label">Software and market</text></g><circle cx="30" cy="955" r="3" fill="#f472b6" opacity=".28"/><circle cx="50" cy="955" r="3" fill="#f472b6" opacity=".28"/><circle cx="70" cy="955" r="3" fill="#f472b6" opacity=".28"/><circle cx="90" cy="955" r="3" fill="#f472b6" opacity=".28"/><circle cx="110" cy="955" r="3" fill="#f472b6" opacity=".28"/><circle cx="130" cy="955" r="3" fill="#f472b6" opacity=".28"/><circle cx="150" cy="955" r="3" fill="#f472b6" opacity=".28"/><circle cx="170" cy="955" r="3" fill="#f472b6" opacity=".28"/><circle cx="190" cy="955" r="3" fill="#f472b6" opacity=".28"/><circle cx="210" cy="955" r="3" fill="#f472b6" opacity=".28"/><circle cx="230" cy="955" r="3" fill="#f472b6" opacity=".28"/><circle cx="250" cy="955" r="3" fill="#f472b6" opacity=".28"/><circle cx="270" cy="955" r="3" fill="#f472b6" opacity=".28"/><circle cx="290" cy="955" r="3" fill="#f472b6" opacity=".28"/><circle cx="310" cy="955" r="3" fill="#f472b6" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#cbd5e1}.type{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#f472b6}.label{font:600 18px Arial,sans-serif;fill:#fff}.num{font:700 12px Arial,sans-serif;fill:#07111f}</style></svg>