<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Two layers of the same service event</title><desc id="desc">The physical hydraulic circuit and the DSC service function have related but different roles. Labels: Reservoir, Hydraulic circuit, Calipers, DSC hydraulic unit, Diagnostic command.</desc><rect width="1280" height="720" fill="#07111f"/><rect width="1280" height="18" fill="#f472b6"/><text x="58" y="76" class="heading">Two layers of the same service event</text><text x="58" y="130" class="sub">The physical hydraulic circuit and the DSC service function have related but different roles.</text><text x="1226" y="174" text-anchor="end" class="type">SPLIT FLUID SYSTEM</text><g><rect x="50" y="235" width="218" height="210" rx="18" fill="#f472b6" stroke="#f472b6" stroke-width="0"/><text x="74" y="267" class="num">01</text><text x="159" y="355" text-anchor="middle" class="label">Reservoir</text><path d="M268 340 H290" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="290" y="290" width="218" height="210" rx="18" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="314" y="322" class="num">02</text><text x="399" y="410" text-anchor="middle" class="label">Hydraulic circuit</text><path d="M508 395 H530" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="530" y="235" width="218" height="210" rx="18" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="554" y="267" class="num">03</text><text x="639" y="355" text-anchor="middle" class="label">Calipers</text><path d="M748 340 H770" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="770" y="290" width="218" height="210" rx="18" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="794" y="322" class="num">04</text><text x="879" y="410" text-anchor="middle" class="label">DSC hydraulic unit</text><path d="M988 395 H1010" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="1010" y="235" width="218" height="210" rx="18" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="1034" y="267" class="num">05</text><text x="1119" y="355" text-anchor="middle" class="label">Diagnostic command</text></g><circle cx="30" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="50" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="70" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="90" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="110" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="130" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="150" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="170" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="190" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="210" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="230" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="250" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="270" cy="695" r="3" fill="#f472b6" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#cbd5e1}.type{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#f472b6}.label{font:600 16px Arial,sans-serif;fill:#fff}.num{font:700 12px Arial,sans-serif;fill:#07111f}</style></svg>