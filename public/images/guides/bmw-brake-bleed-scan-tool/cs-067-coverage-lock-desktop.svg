<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Five locks on a service-function claim</title><desc id="desc">The claim opens only when vehicle, module, function, tool, and software all match. Labels: Vehicle, DSC module, Named function, Tool model, Software and market.</desc><rect width="1280" height="720" fill="#07111f"/><rect width="1280" height="18" fill="#f472b6"/><text x="58" y="76" class="heading">Five locks on a service-function claim</text><text x="58" y="130" class="sub">The claim opens only when vehicle, module, function, tool, and software all match.</text><text x="1226" y="174" text-anchor="end" class="type">LOCK STACK</text><g><rect x="260" y="235" width="760" height="58" rx="24" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="284" y="267" class="num">01</text><text x="342" y="287" text-anchor="start" class="label">Vehicle</text><path d="M640 293 V311" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="260" y="311" width="760" height="58" rx="24" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="284" y="343" class="num">02</text><text x="342" y="363" text-anchor="start" class="label">DSC module</text><path d="M640 369 V387" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="260" y="387" width="760" height="58" rx="24" fill="#f472b6" stroke="#f472b6" stroke-width="0"/><text x="284" y="419" class="num">03</text><text x="342" y="439" text-anchor="start" class="label">Named function</text><path d="M640 445 V463" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="260" y="463" width="760" height="58" rx="24" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="284" y="495" class="num">04</text><text x="342" y="515" text-anchor="start" class="label">Tool model</text><path d="M640 521 V539" stroke="#f472b6" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="260" y="539" width="760" height="58" rx="24" fill="#1e293b" stroke="#f472b6" stroke-width="3"/><text x="284" y="571" class="num">05</text><text x="342" y="591" text-anchor="start" class="label">Software and market</text></g><circle cx="30" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="50" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="70" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="90" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="110" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="130" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="150" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="170" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="190" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="210" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="230" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="250" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="270" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="290" cy="695" r="3" fill="#f472b6" opacity=".28"/><circle cx="310" cy="695" r="3" fill="#f472b6" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#cbd5e1}.type{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#f472b6}.label{font:600 16px Arial,sans-serif;fill:#fff}.num{font:700 12px Arial,sans-serif;fill:#07111f}</style></svg>