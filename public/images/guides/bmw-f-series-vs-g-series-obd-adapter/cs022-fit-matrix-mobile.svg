<svg xmlns="http://www.w3.org/2000/svg" width="420" height="889" viewBox="0 0 420 889" role="img" aria-labelledby="title desc"><title id="title">Generation is one input, not the answer</title><desc id="desc">The app&#39;s compatibility record determines the safe adapter shortlist.</desc><rect width="420" height="889" rx="24" fill="#f8fafc"/><rect width="420" height="14" fill="#c2410c"/><text x="28" y="62" font-size="24" font-weight="800" fill="#35180d">Generation is one input,</text><text x="28" y="93" font-size="24" font-weight="800" fill="#35180d">not the answer</text><text x="28" y="135" font-size="14" fill="#475569">The app&#39;s compatibility record determines</text><text x="28" y="157" font-size="14" fill="#475569">the safe adapter shortlist.</text><rect x="30" y="225" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="261" font-size="17" font-weight="700" fill="#35180d">Vehicle family</text><text x="50" y="293" font-size="14" fill="#475569">Identify the exact BMW series, year and</text><text x="50" y="316" font-size="14" fill="#475569">equipment.</text><rect x="30" y="385" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="421" font-size="17" font-weight="700" fill="#35180d">Task and app</text><text x="50" y="453" font-size="14" fill="#475569">Diagnostics, coding and service functions</text><text x="50" y="476" font-size="14" fill="#475569">can have different support.</text><rect x="30" y="545" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="581" font-size="17" font-weight="700" fill="#35180d">Connection path</text><text x="50" y="613" font-size="14" fill="#475569">Bluetooth, Wi-Fi or ENET can be relevant</text><text x="50" y="636" font-size="14" fill="#475569">to a documented app.</text><rect x="30" y="705" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="741" font-size="17" font-weight="700" fill="#35180d">Adapter record</text><text x="50" y="773" font-size="14" fill="#475569">Use the app&#39;s vehicle-specific</text><text x="50" y="796" font-size="14" fill="#475569">compatible-adapter result.</text><text x="28" y="869" font-size="13" fill="#64748b">Chassis Signal - documentation-first editorial synthesis</text></svg>