<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="516" viewBox="0 0 1100 516" role="img" aria-labelledby="title desc"><title id="title">Generation is one input, not the answer</title><desc id="desc">The app&#39;s compatibility record determines the safe adapter shortlist.</desc><rect width="1100" height="516" rx="24" fill="#f8fafc"/><rect width="1100" height="14" fill="#c2410c"/><text x="44" y="62" font-size="34" font-weight="800" fill="#35180d">Generation is one input, not the answer</text><text x="44" y="104" font-size="18" fill="#475569">The app&#39;s compatibility record determines the safe adapter shortlist.</text><rect x="50" y="172" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="208" font-size="20" font-weight="700" fill="#35180d">Vehicle family</text><text x="70" y="240" font-size="16" fill="#475569">Identify the exact BMW series, year and equipment.</text><rect x="560" y="172" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="208" font-size="20" font-weight="700" fill="#35180d">Task and app</text><text x="580" y="240" font-size="16" fill="#475569">Diagnostics, coding and service functions can have</text><text x="580" y="263" font-size="16" fill="#475569">different support.</text><rect x="50" y="332" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="368" font-size="20" font-weight="700" fill="#35180d">Connection path</text><text x="70" y="400" font-size="16" fill="#475569">Bluetooth, Wi-Fi or ENET can be relevant to a</text><text x="70" y="423" font-size="16" fill="#475569">documented app.</text><rect x="560" y="332" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="368" font-size="20" font-weight="700" fill="#35180d">Adapter record</text><text x="580" y="400" font-size="16" fill="#475569">Use the app&#39;s vehicle-specific compatible-adapter</text><text x="580" y="423" font-size="16" fill="#475569">result.</text><text x="44" y="496" font-size="13" fill="#64748b">Chassis Signal - documentation-first editorial synthesis</text></svg>