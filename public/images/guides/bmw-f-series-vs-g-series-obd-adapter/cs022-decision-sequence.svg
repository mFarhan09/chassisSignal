<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="516" viewBox="0 0 1100 516" role="img" aria-labelledby="title desc"><title id="title">A safer F-series / G-series adapter choice</title><desc id="desc">Physical fit does not prove application-level compatibility.</desc><rect width="1100" height="516" rx="24" fill="#f8fafc"/><rect width="1100" height="14" fill="#c2410c"/><text x="44" y="62" font-size="34" font-weight="800" fill="#35180d">A safer F-series / G-series adapter choice</text><text x="44" y="104" font-size="18" fill="#475569">Physical fit does not prove application-level compatibility.</text><rect x="50" y="172" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="208" font-size="20" font-weight="700" fill="#35180d">Look up vehicle</text><text x="70" y="240" font-size="16" fill="#475569">Use the app&#39;s official vehicle compatibility tool.</text><rect x="560" y="172" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="208" font-size="20" font-weight="700" fill="#35180d">Select the task</text><text x="580" y="240" font-size="16" fill="#475569">Keep diagnostics and coding requirements separate.</text><rect x="50" y="332" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="368" font-size="20" font-weight="700" fill="#35180d">Check adapter list</text><text x="70" y="400" font-size="16" fill="#475569">Some adapters are listed for all series; others</text><text x="70" y="423" font-size="16" fill="#475569">have limits.</text><rect x="560" y="332" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="368" font-size="20" font-weight="700" fill="#35180d">Check phone path</text><text x="580" y="400" font-size="16" fill="#475569">Confirm iOS/Android and ENET/Wi-Fi/Bluetooth</text><text x="580" y="423" font-size="16" fill="#475569">requirements.</text><text x="44" y="496" font-size="13" fill="#64748b">Chassis Signal - documentation-first editorial synthesis</text></svg>