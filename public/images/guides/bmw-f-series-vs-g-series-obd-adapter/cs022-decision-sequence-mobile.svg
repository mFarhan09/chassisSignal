<svg xmlns="http://www.w3.org/2000/svg" width="420" height="889" viewBox="0 0 420 889" role="img" aria-labelledby="title desc"><title id="title">A safer F-series / G-series adapter choice</title><desc id="desc">Physical fit does not prove application-level compatibility.</desc><rect width="420" height="889" rx="24" fill="#f8fafc"/><rect width="420" height="14" fill="#c2410c"/><text x="28" y="62" font-size="24" font-weight="800" fill="#35180d">A safer F-series / G-series</text><text x="28" y="93" font-size="24" font-weight="800" fill="#35180d">adapter choice</text><text x="28" y="135" font-size="14" fill="#475569">Physical fit does not prove</text><text x="28" y="157" font-size="14" fill="#475569">application-level compatibility.</text><rect x="30" y="225" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="261" font-size="17" font-weight="700" fill="#35180d">Look up vehicle</text><text x="50" y="293" font-size="14" fill="#475569">Use the app&#39;s official vehicle</text><text x="50" y="316" font-size="14" fill="#475569">compatibility tool.</text><rect x="30" y="385" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="421" font-size="17" font-weight="700" fill="#35180d">Select the task</text><text x="50" y="453" font-size="14" fill="#475569">Keep diagnostics and coding requirements</text><text x="50" y="476" font-size="14" fill="#475569">separate.</text><rect x="30" y="545" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="581" font-size="17" font-weight="700" fill="#35180d">Check adapter list</text><text x="50" y="613" font-size="14" fill="#475569">Some adapters are listed for all series;</text><text x="50" y="636" font-size="14" fill="#475569">others have limits.</text><rect x="30" y="705" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="741" font-size="17" font-weight="700" fill="#35180d">Check phone path</text><text x="50" y="773" font-size="14" fill="#475569">Confirm iOS/Android and</text><text x="50" y="796" font-size="14" fill="#475569">ENET/Wi-Fi/Bluetooth requirements.</text><text x="28" y="869" font-size="13" fill="#64748b">Chassis Signal - documentation-first editorial synthesis</text></svg>