<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Replacement starts with sensor identity</title><desc id="desc">A branching flow prevents programming, installation and vehicle learning from collapsing together. Identify vehicle system; Identify sensor type; Program if applicable; Install correctly; Run exact vehicle learn; Confirm RDC state.</desc><rect width="720" height="980" fill="#15151d"/><rect width="720" height="16" fill="#f8c15c"/><text x="44" y="70" class="heading">Replacement starts with sensor identity</text><text x="44" y="122" class="sub">A branching flow prevents programming, installation and vehicle learning from collapsing together.</text><rect x="80" y="210" width="560" height="84" rx="18" fill="#353446" stroke="#f8c15c" stroke-width="3"/><circle cx="115" cy="252" r="21" fill="#f8c15c"/><text x="365" y="248" text-anchor="middle" class="label"><tspan x="365" dy="0">Identify vehicle</tspan><tspan x="365" dy="24">system</tspan></text><path d="M115 273V361" stroke="#698397" stroke-width="5"/><rect x="80" y="340" width="560" height="84" rx="18" fill="#353446" stroke="#f8c15c" stroke-width="3"/><circle cx="115" cy="382" r="21" fill="#f8c15c"/><text x="365" y="390" text-anchor="middle" class="label"><tspan x="365" dy="0">Identify sensor type</tspan></text><path d="M115 403V491" stroke="#698397" stroke-width="5"/><rect x="80" y="470" width="560" height="84" rx="18" fill="#353446" stroke="#f8c15c" stroke-width="3"/><circle cx="115" cy="512" r="21" fill="#f8c15c"/><text x="365" y="508" text-anchor="middle" class="label"><tspan x="365" dy="0">Program if</tspan><tspan x="365" dy="24">applicable</tspan></text><path d="M115 533V621" stroke="#698397" stroke-width="5"/><rect x="80" y="600" width="560" height="84" rx="18" fill="#353446" stroke="#f8c15c" stroke-width="3"/><circle cx="115" cy="642" r="21" fill="#f8c15c"/><text x="365" y="650" text-anchor="middle" class="lab