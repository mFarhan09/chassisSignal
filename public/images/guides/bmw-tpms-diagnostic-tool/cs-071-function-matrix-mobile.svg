<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Six TPMS actions are not synonyms</title><desc id="desc">The primary matrix separates diagnosis, fault reading, activation, initialization, programming and replacement. RDC diagnosis; Fault reading; Sensor activation; Reset / relearn; Sensor programming; Replacement.</desc><rect width="720" height="980" fill="#17120c"/><rect width="720" height="16" fill="#f0ad4e"/><text x="44" y="70" class="heading">Six TPMS actions are not synonyms</text><text x="44" y="122" class="sub">The primary matrix separates diagnosis, fault reading, activation, initialization, programming and replacement.</text><rect x="80" y="210" width="560" height="84" rx="18" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><circle cx="115" cy="252" r="21" fill="#f0ad4e"/><text x="365" y="260" text-anchor="middle" class="label"><tspan x="365" dy="0">RDC diagnosis</tspan></text><path d="M115 273V361" stroke="#698397" stroke-width="5"/><rect x="80" y="340" width="560" height="84" rx="18" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><circle cx="115" cy="382" r="21" fill="#f0ad4e"/><text x="365" y="390" text-anchor="middle" class="label"><tspan x="365" dy="0">Fault reading</tspan></text><path d="M115 403V491" stroke="#698397" stroke-width="5"/><rect x="80" y="470" width="560" height="84" rx="18" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><circle cx="115" cy="512" r="21" fill="#f0ad4e"/><text x="365" y="520" text-anchor="middle" class="label"><tspan x="365" dy="0">Sensor activation</tspan></text><path d="M115 533V621" stroke="#698397" stroke-width="5"/><rect x="80" y="600" width="560" height="84" rx="18" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><circle cx="115" cy="642" r="21" fill="#f0ad4e"/><text x="365" y="650" text-anchor="middle" class="label"><tspan x="365" dy="0">Reset / relearn</tspan></text><path d="M115 663V751" stroke="#698397" strok