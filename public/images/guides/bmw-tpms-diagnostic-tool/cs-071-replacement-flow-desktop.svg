<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Replacement starts with sensor identity</title><desc id="desc">A branching flow prevents programming, installation and vehicle learning from collapsing together. Identify vehicle system; Identify sensor type; Program if applicable; Install correctly; Run exact vehicle learn; Confirm RDC state.</desc><rect width="1280" height="720" fill="#15151d"/><rect width="1280" height="16" fill="#f8c15c"/><text x="64" y="68" class="heading">Replacement starts with sensor identity</text><text x="64" y="114" class="sub">A branching flow prevents programming, installation and vehicle learning from collapsing together.</text><rect x="-2.5" y="300" width="185" height="145" rx="22" fill="#353446" stroke="#f8c15c" stroke-width="4"/><text x="90" y="368" text-anchor="middle" class="label"><tspan x="90" dy="0">Identify vehicle</tspan><tspan x="90" dy="24">system</tspan></text><path d="M182.5 372L217.5 467" stroke="#f8c15c" stroke-width="5"/><rect x="217.5" y="395" width="185" height="145" rx="25" fill="#353446" stroke="#f8c15c" stroke-width="4"/><text x="310" y="475" text-anchor="middle" class="label"><tspan x="310" dy="0">Identify sensor type</tspan></text><path d="M402.5 467L437.5 372" stroke="#f8c15c" stroke-width="5"/><rect x="437.5" y="300" width="185" height="145" rx="28" fill="#353446" stroke="#f8c15c" stroke-width="4"/><text x="530" y="368" text-anchor="middle" class="label"><tspan x="530" dy="0">Program if</tspan><tspan x="530" dy="24">applicable</tspan></text><path d="M622.5 372L657.5 467" stroke="#f8c15c" stroke-width="5"/><rect x="657.5" y="395" width="185" height="145" rx="31" fill="#353446" stroke="#f8c15c" stroke-width="4"/><text x="750" y="475" text-anchor="middle" class="label"><tspan x="750" dy="0">Install correctly</tspan></text><path d="M842.5 467L877.5 372" stroke="#f8c15c" stroke-width="5"/><rect x="877.5" y="300" width="185" height="145" rx="34" fill="#353446" stroke="#f8c15c" stroke-width="4"/><text x="970" y="368" text-anchor="middle" class="label"><tspan x="970" dy="0">Run exact vehicle</tspan><tspan x="970" dy="24">learn</tspan></text><path d="M1062.5 372L1097.5 467" stroke="#f8c15c" stroke-width="5"/><rect x="1097.5" y="395" width="185" height="145" rx="37" fill="#353446" stroke="#8ec5ff" stroke-width="4"/><text x="1190" y="475" text-anchor="middle" class="label"><tspan x="1190" dy="0">Confirm RDC state</tspan></text><circle cx="24" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="40" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="56" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="72" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="88" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="104" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="120" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="136" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="152" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="168" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="184" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="200" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="216" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="232" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="248" cy="698" r="2" fill="#8ec5ff" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#bfd0dc}.label{font:600 17px Arial,sans-serif;fill:#fff}</style></svg>