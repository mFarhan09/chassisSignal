<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Six TPMS actions are not synonyms</title><desc id="desc">The primary matrix separates diagnosis, fault reading, activation, initialization, programming and replacement. RDC diagnosis; Fault reading; Sensor activation; Reset / relearn; Sensor programming; Replacement.</desc><rect width="1280" height="720" fill="#17120c"/><rect width="1280" height="16" fill="#f0ad4e"/><text x="64" y="68" class="heading">Six TPMS actions are not synonyms</text><text x="64" y="114" class="sub">The primary matrix separates diagnosis, fault reading, activation, initialization, programming and replacement.</text><circle cx="640" cy="420" r="84" fill="#f0ad4e"/><text x="640" y="427" text-anchor="middle" class="label"><tspan x="640" dy="0">QUALIFY</tspan></text><path d="M640 420L640 185" stroke="#698397" stroke-width="4"/><rect x="535" y="147" width="210" height="76" rx="20" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><text x="640" y="192" text-anchor="middle" class="label"><tspan x="640" dy="0">RDC diagnosis</tspan></text><path d="M640 420L843.5159698893431 302.5" stroke="#698397" stroke-width="4"/><rect x="738.5159698893431" y="264.5" width="210" height="76" rx="20" fill="#49351f" stroke="#e8e1d3" stroke-width="3"/><text x="843.5159698893431" y="309.5" text-anchor="middle" class="label"><tspan x="843.5159698893431" dy="0">Fault reading</tspan></text><path d="M640 420L843.5159698893431 537.5" stroke="#698397" stroke-width="4"/><rect x="738.5159698893431" y="499.5" width="210" height="76" rx="20" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><text x="843.5159698893431" y="544.5" text-anchor="middle" class="label"><tspan x="843.5159698893431" dy="0">Sensor activation</tspan></text><path d="M640 420L640 655" stroke="#698397" stroke-width="4"/><rect x="535" y="617" width="210" height="76" rx="20" fill="#49351f" stroke="#e8e1d3" stroke-width