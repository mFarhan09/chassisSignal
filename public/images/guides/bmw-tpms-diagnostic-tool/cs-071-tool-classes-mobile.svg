<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Three tool classes touch different layers</title><desc id="desc">A layered stack separates RF trigger, BMW scan and sensor-programming functions. RF trigger / read tool; BMW-capable scan tool; TPMS programming tool.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="70" class="heading">Three tool classes touch different layers</text><text x="44" y="122" class="sub">A layered stack separates RF trigger, BMW scan and sensor-programming functions.</text><rect x="80" y="210" width="560" height="84" rx="18" fill="#243b5a" stroke="#65c8ff" stroke-width="3"/><circle cx="115" cy="252" r="21" fill="#65c8ff"/><text x="365" y="248" text-anchor="middle" class="label"><tspan x="365" dy="0">RF trigger / read</tspan><tspan x="365" dy="24">tool</tspan></text><path d="M115 273V366" stroke="#698397" stroke-width="5"/><rect x="80" y="345" width="560" height="84" rx="18" fill="#243b5a" stroke="#65c8ff" stroke-width="3"/><circle cx="115" cy="387" r="21" fill="#65c8ff"/><text x="365" y="383" text-anchor="middle" class="label"><tspan x="365" dy="0">BMW-capable scan</tspan><tspan x="365" dy="24">tool</tspan></text><path d="M115 408V501" stroke="#698397" stroke-width="5"/><rect x="80" y="480" width="560" height="84" rx="18" fill="#243b5a" stroke="#ff7f7f" stroke-width="3"/><circle cx="115" cy="522" r="21" fill="#ff7f7f"/><text x="365" y="518" text-anchor="middle" class="label"><tspan x="365" dy="0">TPMS programming</tspan><tspan x="365" dy="24">tool</tspan></text><circle cx="24" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="40" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="56" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="72" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="88" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="104" cy="95