<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">The reset gate comes after diagnosis</title><desc id="desc">Symptoms lead to a fault plan and confirmed service event before a reset or calibration is considered. Labels: Symptom, Fault plan, Service event, Justified function.</desc><rect width="1280" height="720" fill="#07111f"/><rect width="1280" height="18" fill="#38bdf8"/><text x="58" y="76" class="heading">The reset gate comes after diagnosis</text><text x="58" y="130" class="sub">Symptoms lead to a fault plan and confirmed service event before a reset or calibration is considered.</text><text x="1226" y="174" text-anchor="end" class="type">BRANCHING FLOW</text><g><rect x="50" y="235" width="278" height="210" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><text x="74" y="267" class="num">01</text><text x="189" y="355" text-anchor="middle" class="label">Symptom</text><path d="M328 340 H350" stroke="#38bdf8" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="350" y="290" width="278" height="210" rx="21" fill="#38bdf8" stroke="#38bdf8" stroke-width="0"/><text x="374" y="322" class="num">02</text><text x="489" y="410" text-anchor="middle" class="label">Fault plan</text><path d="M628 395 H650" stroke="#38bdf8" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="650" y="235" width="278" height="210" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><text x="674" y="267" class="num">03</text><text x="789" y="355" text-anchor="middle" class="label">Service event</text><path d="M928 340 H950" stroke="#38bdf8" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="950" y="290" width="278" height="210" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><text x="974" y="322" class="num">04</text><text x="1089" y="410" text-anchor="middle" class="label">Justified function</text></g><circle cx="30" cy="695" r="3" fill="#38bdf8" opacity=".28"/><circle cx="50" cy="695" r="3" fill="#38bdf8" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#cbd5e1}.type{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#38bdf8}.label{font:600 16px Arial,sans-serif;fill:#fff}.num{font:700 12px Arial,sans-serif;fill:#07111f}</style></svg>