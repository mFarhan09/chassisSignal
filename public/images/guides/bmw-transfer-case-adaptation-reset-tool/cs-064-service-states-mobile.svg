<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Four transfer-case service states</title><desc id="desc">Diagnosis, fluid service, reset or adaptation, and calibration are separated by purpose and proof. Labels: Diagnosis, Fluid service, Reset / adaptation, Calibration.</desc><rect width="720" height="980" fill="#07111f"/><rect width="720" height="18" fill="#38bdf8"/><text x="46" y="78" class="heading">Four transfer-case service states</text><text x="46" y="140" class="sub">Diagnosis, fluid service, reset or adaptation, and calibration are separated by purpose and proof.</text><text x="666" y="194" text-anchor="end" class="type">QUADRANT MATRIX</text><g><rect x="60" y="245" width="600" height="88" rx="18" fill="#38bdf8" stroke="#38bdf8" stroke-width="0"/><text x="84" y="277" class="num">01</text><text x="142" y="297" text-anchor="start" class="label">Diagnosis</text><path d="M360 333 V357" stroke="#38bdf8" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="357" width="600" height="88" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><text x="84" y="389" class="num">02</text><text x="142" y="409" text-anchor="start" class="label">Fluid service</text><path d="M360 445 V469" stroke="#38bdf8" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="469" width="600" height="88" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><text x="84" y="501" class="num">03</text><text x="142" y="521" text-anchor="start" class="label">Reset / adaptation</text><path d="M360 557 V581" stroke="#38bdf8" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="581" width="600" height="88" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><text x="84" y="613" class="num">04</text><text x="142" y="633" text-anchor="start" class="label">Calibration</text></g><circle cx="30" cy="955" r="3" fill="#38bdf8" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#cbd5e1}.type{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#38bdf8}.label{font:600 18px Arial,sans-serif;fill:#fff}.num{font:700 12px Arial,sans-serif;fill:#07111f}</style></svg>