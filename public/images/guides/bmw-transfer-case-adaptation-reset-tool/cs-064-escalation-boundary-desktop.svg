<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Software cannot repair hardware</title><desc id="desc">A verified service function stays inside a boundary set by mechanical, tire, electrical, and communication findings. Labels: Service function, Mechanical, Tires, Electrical, Network.</desc><rect width="1280" height="720" fill="#07111f"/><rect width="1280" height="18" fill="#38bdf8"/><text x="58" y="76" class="heading">Software cannot repair hardware</text><text x="58" y="130" class="sub">A verified service function stays inside a boundary set by mechanical, tire, electrical, and communication findings.</text><text x="1226" y="174" text-anchor="end" class="type">BOUNDARY RINGS</text><g><rect x="50" y="235" width="218" height="210" rx="27" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><text x="74" y="267" class="num">01</text><text x="159" y="355" text-anchor="middle" class="label">Service function</text><path d="M268 340 H290" stroke="#38bdf8" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="290" y="290" width="218" height="210" rx="27" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><text x="314" y="322" class="num">02</text><text x="399" y="410" text-anchor="middle" class="label">Mechanical</text><path d="M508 395 H530" stroke="#38bdf8" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="530" y="235" width="218" height="210" rx="27" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/><text x="554" y="267" class="num">03</text><text x="639" y="355" text-anchor="middle" class="label">Tires</text><path d="M748 340 H770" stroke="#38bdf8" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="770" y="290" width="218" height="210" rx="27" fill="#38bdf8" stroke="#38bdf8" stroke-width="0"/><text x="794" y="322" class="num">04</text><text x="879" y="410" text-anchor="middle" class="label">Electrical</text><path d="M988 395 H1010" stroke="#38bdf8" stroke-wid