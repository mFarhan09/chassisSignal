<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" data-layout="cost-ledger"><title>The BimmerLink cost stack</title><desc>One-time app and hardware choices, with market-dependent checkout. Full-version unlock, Supported adapter, Optional CarPlay, Tax / VAT, No assumed subscription</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#45d6c6"/></marker></defs><rect width="100%" height="100%" fill="#081421"/><circle cx="1200" cy="70" r="170" fill="#45d6c6" opacity="0.06"/><text x="70" y="58" class="k">CHASSIS SIGNAL / COST-LEDGER</text><text x="70" y="112" class="title" text-anchor="start"><tspan x="70" dy="0">The BimmerLink cost stack</tspan></text><text x="70" y="178" class="subtitle" text-anchor="start"><tspan x="70" dy="0">One-time app and hardware choices, with market-dependent checkout.</tspan></text><g><rect x="70" y="245" width="1140" height="58" rx="10" fill="#102b40"/><text x="88" y="281" class="label" text-anchor="start"><tspan x="88" dy="0">Full-version unlock</tspan></text><rect x="900" y="263" width="77.14285714285714" height="20" rx="5" fill="#45d6c6"/></g><g><rect x="70" y="311" width="1140" height="58" rx="10" fill="#102b40"/><text x="88" y="347" class="label" text-anchor="start"><tspan x="88" dy="0">Supported adapter</tspan></text><rect x="900" y="329" width="115.71428571428571" height="20" rx="5" fill="#f5b95f"/></g><g><rect x="70" y="377" width="1140" height="58" rx="10" fill="#102b40"/><text x="88" y="413" class="label" text-anchor="start"><tspan x="88" dy="0">Optional CarPlay</tspan></text><rect x="900" y="395" width="154.28571428571428" height="20" rx="5" fill="#45d6c6"/></g><g><rect x="70" y="443" width="1140" height="58" rx="10" fill="#102b40"/><text x="88" y="479" class="label" text-anchor="start"><tspan x="88" dy="0">Tax / VAT</tspan></text><rect x="900" y="461" width="192.85714285714286" height="20" rx="5" fill="#f5b95f"/></g><g><rect x="70" y="509" width="1140" height="58" rx="10" fill="#102b40"/><text x="88" y="545" class="label" text-anchor="start"><tspan x="88" dy="0">No assumed subscription</tspan></text><rect x="900" y="527" width="231.42857142857142" height="20" rx="5" fill="#45d6c6"/></g><path d="M 1130 245 L 1170 245 L 1170 555 L 1130 555" fill="none" stroke="#f5b95f" stroke-width="5"/><text x="70" y="692" class="k">DECISION ARTIFACT / CS-042</text><style>.title{font:700 40px Arial,sans-serif;fill:#fff}.subtitle{font:19px Arial,sans-serif;fill:#b7c8d8}.k{font:14px Arial,sans-serif;fill:#45d6c6;letter-spacing:2px}.label{font:700 18px Arial,sans-serif;fill:#fff}.zone{font:700 15px Arial,sans-serif;fill:#d9e7ef;letter-spacing:2px}.plus{font:700 28px Arial,sans-serif;fill:#b7c8d8}</style></svg>