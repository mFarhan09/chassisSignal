<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" data-layout="checkout-scenarios"><title>Three ownership scenarios</title><desc>Keep platform, currency and optional items visible. Existing adapter, New CX adapter, CarPlay add-on, US iOS example, Recheck at checkout</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f5b95f"/></marker></defs><rect width="100%" height="100%" fill="#081421"/><circle cx="640" cy="70" r="120" fill="#f5b95f" opacity="0.06"/><text x="48" y="58" class="k">CHASSIS SIGNAL / CHECKOUT-SCENARIOS</text><text x="48" y="112" class="title" text-anchor="start"><tspan x="48" dy="0">Three ownership scenarios</tspan></text><text x="48" y="190" class="subtitle" text-anchor="start"><tspan x="48" dy="0">Keep platform, currency and optional items visible.</tspan></text><g><rect x="48" y="250" width="624" height="76" rx="14" fill="#10394a" stroke="#f5b95f" stroke-width="2"/><text x="360" y="294" class="label" text-anchor="middle"><tspan x="360" dy="0">Existing adapter</tspan></text></g><g><rect x="48" y="355" width="624" height="76" rx="14" fill="#142d42" stroke="#ef7d75" stroke-width="2"/><text x="360" y="399" class="label" text-anchor="middle"><tspan x="360" dy="0">New CX adapter</tspan></text></g><g><rect x="48" y="460" width="624" height="76" rx="14" fill="#10394a" stroke="#f5b95f" stroke-width="2"/><text x="360" y="504" class="label" text-anchor="middle"><tspan x="360" dy="0">CarPlay add-on</tspan></text></g><g><rect x="48" y="565" width="624" height="76" rx="14" fill="#142d42" stroke="#ef7d75" stroke-width="2"/><text x="360" y="609" class="label" text-anchor="middle"><tspan x="360" dy="0">US iOS example</tspan></text></g><g><rect x="48" y="670" width="624" height="76" rx="14" fill="#10394a" stroke="#f5b95f" stroke-width="2"/><text x="360" y="714" class="label" text-anchor="middle"><tspan x="360" dy="0">Recheck at checkout</t