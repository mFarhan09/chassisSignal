<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" data-layout="cost-ledger"><title>The BimmerLink cost stack</title><desc>One-time app and hardware choices, with market-dependent checkout. Full-version unlock, Supported adapter, Optional CarPlay, Tax / VAT, No assumed subscription</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#45d6c6"/></marker></defs><rect width="100%" height="100%" fill="#081421"/><circle cx="640" cy="70" r="120" fill="#45d6c6" opacity="0.06"/><text x="48" y="58" class="k">CHASSIS SIGNAL / COST-LEDGER</text><text x="48" y="112" class="title" text-anchor="start"><tspan x="48" dy="0">The BimmerLink cost stack</tspan></text><text x="48" y="190" class="subtitle" text-anchor="start"><tspan x="48" dy="0">One-time app and hardware choices, with market-dependent</tspan><tspan x="48" dy="24">checkout.</tspan></text><g><rect x="48" y="245" width="624" height="70" rx="10" fill="#102b40"/><text x="66" y="287" class="label" text-anchor="start"><tspan x="66" dy="0">Full-version unlock</tspan></text><rect x="462" y="263" width="48.57142857142857" height="20" rx="5" fill="#45d6c6"/></g><g><rect x="48" y="327" width="624" height="70" rx="10" fill="#102b40"/><text x="66" y="369" class="label" text-anchor="start"><tspan x="66" dy="0">Supported adapter</tspan></text><rect x="462" y="345" width="72.85714285714285" height="20" rx="5" fill="#f5b95f"/></g><g><rect x="48" y="409" width="624" height="70" rx="10" fill="#102b40"/><text x="66" y="451" class="label" text-anchor="start"><tspan x="66" dy="0">Optional CarPlay</tspan></text><rect x="462" y="427" width="97.14285714285714" height="20" rx="5" fill="#45d6c6"/></g><g><rect x="48" y="491" width="624" height="70" rx="10" fill="#102b40"/><text x="66" y="533" class="label" text-anchor="start"><tspan x="66" dy="0">Tax / VAT</tspan></text><rect x="462" y="509" width="121.42857142857143" height