<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" data-layout="task-ownership"><title>Task ownership</title><desc>BimmerCode owns coding while NT530 is a diagnostic and service handheld; overlap does not erase the category boundary. Coding, Diagnostics, Service, Programming</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#45d6c6"/></marker></defs><rect width="100%" height="100%" fill="#081421"/><circle cx="1200" cy="70" r="170" fill="#45d6c6" opacity="0.06"/><text x="70" y="58" class="k">CHASSIS SIGNAL / TASK-OWNERSHIP</text><text x="70" y="112" class="title" text-anchor="start"><tspan x="70" dy="0">Task ownership</tspan></text><text x="70" y="178" class="subtitle" text-anchor="start"><tspan x="70" dy="0">BimmerCode owns coding while NT530 is a diagnostic and service handheld; overlap does not erase the</tspan><tspan x="70" dy="26">category boundary.</tspan></text><g><rect x="70" y="245" width="1140" height="58" rx="10" fill="#102b40"/><text x="88" y="281" class="label" text-anchor="start"><tspan x="88" dy="0">Coding</tspan></text><rect x="900" y="263" width="216" height="20" rx="5" fill="#45d6c6"/></g><g><rect x="70" y="311" width="1140" height="58" rx="10" fill="#102b40"/><text x="88" y="347" class="label" text-anchor="start"><tspan x="88" dy="0">Diagnostics</tspan></text><rect x="900" y="329" width="94.5" height="20" rx="5" fill="#f5b95f"/></g><g><rect x="70" y="377" width="1140" height="58" rx="10" fill="#102b40"/><text x="88" y="413" class="label" text-anchor="start"><tspan x="88" dy="0">Service</tspan></text><rect x="900" y="395" width="216" height="20" rx="5" fill="#45d6c6"/></g><g><rect x="70" y="443" width="1140" height="58" rx="10" fill="#102b40"/><text x="88" y="479" class="label" text-anchor="start"><tspan x="88" dy="0">Programming</tspan></text><rect x="900" y="461" width="94.5" height="20" rx="5" fill="#f5b95f"/></g><path d="M 640 235 L 640 650" stroke="#d9e7ef" stroke-width="2" stroke-dasharray="8 8"/><text x="70" y="692" class="k">DECISION ARTIFACT / CS-044</text><style>.title{font:700 40px Arial,sans-serif;fill:#fff}.subtitle{font:19px Arial,sans-serif;fill:#b7c8d8}.k{font:14px Arial,sans-serif;fill:#45d6c6;letter-spacing:2px}.label{font:700 18px Arial,sans-serif;fill:#fff}.zone{font:700 15px Arial,sans-serif;fill:#d9e7ef;letter-spacing:2px}.plus{font:700 28px Arial,sans-serif;fill:#b7c8d8}</style></svg>