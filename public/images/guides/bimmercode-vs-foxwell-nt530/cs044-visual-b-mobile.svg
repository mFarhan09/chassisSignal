<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" data-layout="purchase-architecture"><title>Purchase architecture</title><desc>A task-ownership matrix separates coding, diagnostics, service and programming. Phone, Adapter, App, Handheld, Cable, Brand software</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f5b95f"/></marker></defs><rect width="100%" height="100%" fill="#081421"/><circle cx="640" cy="70" r="120" fill="#f5b95f" opacity="0.06"/><text x="48" y="58" class="k">CHASSIS SIGNAL / PURCHASE-ARCHITECTURE</text><text x="48" y="112" class="title" text-anchor="start"><tspan x="48" dy="0">Purchase architecture</tspan></text><text x="48" y="190" class="subtitle" text-anchor="start"><tspan x="48" dy="0">A task-ownership matrix separates coding, diagnostics,</tspan><tspan x="48" dy="24">service and programming.</tspan></text><g><rect x="70" y="245" width="250" height="66" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="195" y="284" class="label" text-anchor="middle"><tspan x="195" dy="0">Phone</tspan></text></g><g><rect x="70" y="335" width="250" height="66" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="195" y="374" class="label" text-anchor="middle"><tspan x="195" dy="0">Adapter</tspan></text></g><g><rect x="70" y="425" width="250" height="66" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="195" y="464" class="label" text-anchor="middle"><tspan x="195" dy="0">App</tspan></text></g><g><rect x="400" y="520" width="250" height="66" rx="14" fill="#2d2534" stroke="#ef7d75" stroke-width="2"/><text x="525" y="559" class="label" text-anchor="middle"><tspan x="525" dy="0">Handheld</tspan></text></g><g><rect x="400" y="610" width="250" height="66" rx="14" fill="#2d2534" stroke="#ef7d75" stroke-width="2"/><text x="525" y="649" class="label" text-anchor="middle"><tspan x="525" dy="0">Cable</tspan></text></g><g><rect x="400" y="700" width="250" height="66" rx="14" fill="#2d2534" stroke="#ef7d75" stroke-width="2"/><text x="525" y="739" class="label" text-anchor="middle"><tspan x="525" dy="0">Brand software</tspan></text></g><path d="M 320 410 L 400 555" fill="none" stroke="#f5b95f" stroke-width="4" marker-end="url(#arrow)"/><text x="48" y="932" class="k">DECISION ARTIFACT / CS-044</text><style>.title{font:700 30px Arial,sans-serif;fill:#fff}.subtitle{font:17px Arial,sans-serif;fill:#b7c8d8}.k{font:14px Arial,sans-serif;fill:#f5b95f;letter-spacing:2px}.label{font:700 16px Arial,sans-serif;fill:#fff}.zone{font:700 15px Arial,sans-serif;fill:#d9e7ef;letter-spacing:2px}.plus{font:700 28px Arial,sans-serif;fill:#b7c8d8}</style></svg>