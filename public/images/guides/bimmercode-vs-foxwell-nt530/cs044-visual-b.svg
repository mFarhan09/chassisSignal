<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" data-layout="purchase-architecture"><title>Purchase architecture</title><desc>A task-ownership matrix separates coding, diagnostics, service and programming. Phone, Adapter, App, Handheld, Cable, Brand software</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#f5b95f"/></marker></defs><rect width="100%" height="100%" fill="#081421"/><circle cx="1200" cy="70" r="170" fill="#f5b95f" opacity="0.06"/><text x="70" y="58" class="k">CHASSIS SIGNAL / PURCHASE-ARCHITECTURE</text><text x="70" y="112" class="title" text-anchor="start"><tspan x="70" dy="0">Purchase architecture</tspan></text><text x="70" y="178" class="subtitle" text-anchor="start"><tspan x="70" dy="0">A task-ownership matrix separates coding, diagnostics, service and programming.</tspan></text><g><rect x="75" y="310" width="160" height="72" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="155" y="352" class="label" text-anchor="middle"><tspan x="155" dy="0">Phone</tspan></text></g><g><rect x="255" y="310" width="160" height="72" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="335" y="352" class="label" text-anchor="middle"><tspan x="335" dy="0">Adapter</tspan></text></g><g><rect x="435" y="310" width="160" height="72" rx="14" fill="#10334a" stroke="#f5b95f" stroke-width="2"/><text x="515" y="352" class="label" text-anchor="middle"><tspan x="515" dy="0">App</tspan></text></g><g><rect x="735" y="475" width="140" height="72" rx="14" fill="#2d2534" stroke="#ef7d75" stroke-width="2"/><text x="805" y="517" class="label" text-anchor="middle"><tspan x="805" dy="0">Handheld</tspan></text></g><g><rect x="895" y="475" width="140" height="72" rx="14" fill="#2d2534" stroke="#ef7d75" stroke-width="2"/><text x="965" y="517" class="label" text-anchor="middle"><tspan x="965" dy="0">Cable</tspan></text></g><g><rect x="1055" y="475" width="140" height="72" rx="14" fill="#2d2534" stroke="#ef7d75" stroke-width="2"/><text x="1125" y="517" class="label" text-anchor="middle"><tspan x="1125" dy="0">Brand software</tspan></text></g><path d="M 555 346 L 735 511" fill="none" stroke="#f5b95f" stroke-width="4" marker-end="url(#arrow)"/><text x="70" y="692" class="k">DECISION ARTIFACT / CS-044</text><style>.title{font:700 40px Arial,sans-serif;fill:#fff}.subtitle{font:19px Arial,sans-serif;fill:#b7c8d8}.k{font:14px Arial,sans-serif;fill:#f5b95f;letter-spacing:2px}.label{font:700 18px Arial,sans-serif;fill:#fff}.zone{font:700 15px Arial,sans-serif;fill:#d9e7ef;letter-spacing:2px}.plus{font:700 28px Arial,sans-serif;fill:#b7c8d8}</style></svg>