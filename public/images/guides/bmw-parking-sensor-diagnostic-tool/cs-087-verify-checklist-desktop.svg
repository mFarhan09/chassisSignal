<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ti de"><title id="ti">Parking diagnostic verification checklist</title><desc id="de">Clear each item before condemning a sensor; the module and software layers come first.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="56" y="60" class="h">Parking diagnostic verification checklist</text><text x="56" y="102" class="s">Clear each item before condemning a sensor; the module and software layers come first.</text><rect x="56" y="150" width="1168" height="97" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="72" y="186" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M78 200 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="116" y="204" class="l">Confirm the tool reaches the PDC/PMA module</text><text x="593" y="198" class="m">A generic OBD reader may not see module codes; a BMW-capable tool does.</text><rect x="56" y="259" width="1168" height="97" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="72" y="294" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M78 308 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="116" y="314" class="l">Read the exact sensor or circuit named</text><text x="593" y="306" class="m">The module code specifies which sensor or wire, not just 'parking fault'.</text><rect x="56" y="368" width="1168" height="97" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="72" y="404" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M78 418 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="116" y="422" class="l">Read live data; run module output tests</text><text x="593" y="416" class="m">Sensors are inputs you read; the buzzer/self-test is what you command.</text><rect x="56" y="477" width="1168" height="97" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="72" y="512" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M78 526 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="116" y="532" class="l">Check the wiring and connectors</text><text x="593" y="524" class="m">Corrosion, a chafed harness or a bad connector mimics a bad sensor.</text><rect x="56" y="586" width="1168" height="97" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="72" y="622" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M78 636 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="116" y="640" class="l">Consider coding, calibration or an update</text><text x="593" y="634" class="m">Many parking faults are resolved by software, not a replacement part.</text><style>.h{font:700 34px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 19px Arial,sans-serif;fill:#bfd0dc}.l{font:600 16px Arial,sans-serif;fill:#fff}.m{font:400 14px Arial,sans-serif;fill:#bfd0dc}.b{font:700 15px Arial,sans-serif;fill:#0c1727}.t{font:700 15px Arial,sans-serif;fill:#65c8ff}</style></svg>