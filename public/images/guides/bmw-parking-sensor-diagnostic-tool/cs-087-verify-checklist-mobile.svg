<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="ti de"><title id="ti">Parking diagnostic verification checklist</title><desc id="de">Clear each item before condemning a sensor; the module and software layers come first.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="58" class="h">Parking diagnostic verification checklist</text><text x="44" y="94" class="s">Clear each item before condemning a sensor; the module and software layers come</text><text x="44" y="115" class="s">first.</text><rect x="40" y="161" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="221" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 235 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="227" class="l">Confirm the tool reaches the PDC/PMA module</text><text x="100" y="249" class="m">A generic OBD reader may not see module codes; a BMW-capable tool does.</text><rect x="40" y="320" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="380" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 394 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="386" class="l">Read the exact sensor or circuit named</text><text x="100" y="408" class="m">The module code specifies which sensor or wire, not just 'parking fault'.</text><rect x="40" y="479" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="539" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 553 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="545" class="l">Read live data; run module output tests</text><text x="100" y="567" class="m">Sensors are inputs you read; the buzzer/self-test is what you command.</text><rect x="40" y="637" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="698" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 712 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="704" class="l">Check the wiring and connectors</text><text x="100" y="726" class="m">Corrosion, a chafed harness or a bad connector mimics a bad sensor.</text><rect x="40" y="796" width="640" height="147" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><rect x="56" y="857" width="28" height="28" rx="6" fill="none" stroke="#65c8ff" stroke-width="3"/><path d="M62 871 l6 7 l12 -14" stroke="#8fe3a6" stroke-width="4" fill="none"/><text x="100" y="863" class="l">Consider coding, calibration or an update</text><text x="100" y="885" class="m">Many parking faults are resolved by software, not a replacement part.</text><style>.h{font:700 29px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 17px Arial,sans-serif;fill:#bfd0dc}.l{font:600 17px Arial,sans-serif;fill:#fff}.m{font:400 15px Arial,sans-serif;fill:#bfd0dc}.b{font:700 16px Arial,sans-serif;fill:#0c1727}.t{font:700 16px Arial,sans-serif;fill:#65c8ff}</style></svg>