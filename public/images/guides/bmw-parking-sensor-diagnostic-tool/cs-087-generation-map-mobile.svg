<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="ti de"><title id="ti">Generation, module, and tool evidence map</title><desc id="de">Match the parking system to the module it uses and the diagnostic access it actually needs.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="58" class="h">Generation, module, and tool evidence map</text><text x="44" y="94" class="s">Match the parking system to the module it uses and the diagnostic access it actually</text><text x="44" y="115" class="s">needs.</text><rect x="40" y="156" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="186" class="l">Early PDC</text><text x="56" y="210" class="m">Module &amp; sensors: PDC module, bumper ultrasonic</text><text x="56" y="232" class="m">Diagnostic need: BMW-capable scanner for module codes</text><rect x="40" y="306" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="336" class="l">Parking Assistant</text><text x="56" y="360" class="m">Module &amp; sensors: PMA + ultrasonic + cameras</text><text x="56" y="382" class="m">Diagnostic need: Module access; camera aim / calibration</text><rect x="40" y="456" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="486" class="l">Latest PMA</text><text x="56" y="510" class="m">Module &amp; sensors: Up to 12 sensors + cameras</text><text x="56" y="532" class="m">Diagnostic need: ISTA-class for coding / software updates</text><rect x="40" y="606" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="636" class="l">Wiring layer</text><text x="56" y="660" class="m">Module &amp; sensors: Sensor harness and connectors</text><text x="56" y="682" class="m">Diagnostic need: Live sensor data + module output tests</text><rect x="40" y="756" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="786" class="l">Software layer</text><text x="56" y="810" class="m">Module &amp; sensors: Module VO/VIN coding</text><text x="56" y="832" class="m">Diagnostic need: An update may fix it, not a new part</text><style>.h{font:700 29px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 17px Arial,sans-serif;fill:#bfd0dc}.l{font:600 17px Arial,sans-serif;fill:#fff}.m{font:400 15px Arial,sans-serif;fill:#bfd0dc}.b{font:700 16px Arial,sans-serif;fill:#0c1727}.t{font:700 16px Arial,sans-serif;fill:#65c8ff}</style></svg>