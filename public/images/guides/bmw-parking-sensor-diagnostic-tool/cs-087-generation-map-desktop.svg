<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ti de"><title id="ti">Generation, module, and tool evidence map</title><desc id="de">Match the parking system to the module it uses and the diagnostic access it actually needs.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="56" y="60" class="h">Generation, module, and tool evidence map</text><text x="56" y="102" class="s">Match the parking system to the module it uses and the diagnostic access it actually needs.</text><rect x="56" y="147" width="1168" height="40" fill="#1b2f4a"/><text x="70" y="174" class="t">Parking system</text><text x="573" y="174" text-anchor="middle" class="t">Module &amp; sensors</text><text x="1007" y="174" text-anchor="middle" class="t">Diagnostic need</text><rect x="56" y="187" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="242" class="l">Early PDC</text><text x="573" y="241" text-anchor="middle" class="m">PDC module, bumper ultrasonic</text><text x="1007" y="241" text-anchor="middle" class="m">BMW-capable scanner for module codes</text><line x1="356" y1="147" x2="356" y2="288" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="288" stroke="#3a5578" stroke-width="1"/><rect x="56" y="287.6" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="343" class="l">Parking Assistant</text><text x="573" y="342" text-anchor="middle" class="m">PMA + ultrasonic + cameras</text><text x="1007" y="342" text-anchor="middle" class="m">Module access; camera aim / calibration</text><line x1="356" y1="147" x2="356" y2="388" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="388" stroke="#3a5578" stroke-width="1"/><rect x="56" y="388.20000000000005" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="444" class="l">Latest PMA</text><text x="573" y="443" text-anchor="middle" class="m">Up to 12 sensors + cameras</text><text x="1007" y="443" text-anchor="middle" class="m">ISTA-class for coding / software updates</text><line x1="356" y1="147" x2="356" y2="489" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="489" stroke="#3a5578" stroke-width="1"/><rect x="56" y="488.80000000000007" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="544" class="l">Wiring layer</text><text x="573" y="543" text-anchor="middle" class="m">Sensor harness and connectors</text><text x="1007" y="543" text-anchor="middle" class="m">Live sensor data + module output tests</text><line x1="356" y1="147" x2="356" y2="589" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="589" stroke="#3a5578" stroke-width="1"/><rect x="56" y="589.4000000000001" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="645" class="l">Software layer</text><text x="573" y="644" text-anchor="middle" class="m">Module VO/VIN coding</text><text x="1007" y="644" text-anchor="middle" class="m">An update may fix it, not a new part</text><line x1="356" y1="147" x2="356" y2="690" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="690" stroke="#3a5578" stroke-width="1"/><style>.h{font:700 34px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 19px Arial,sans-serif;fill:#bfd0dc}.l{font:600 16px Arial,sans-serif;fill:#fff}.m{font:400 14px Arial,sans-serif;fill:#bfd0dc}.b{font:700 15px Arial,sans-serif;fill:#0c1727}.t{font:700 15px Arial,sans-serif;fill:#65c8ff}</style></svg>