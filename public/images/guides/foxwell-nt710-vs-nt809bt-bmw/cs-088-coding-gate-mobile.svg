<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 486" width="360" height="486" role="img" aria-labelledby="t088m d088m">
<title id="t088m">The BMW ECU coding question separates the two Foxwell tools</title>
<desc id="d088m">A single decision. If BMW ECU coding is in scope, the NT710 is the tool Foxwell ticks for coding, with one make and a lifetime free update term. If it is not, or the fleet spans several makes, the NT809BT covers multiple brands with no coding tick and a three year free update term followed by a published renewal charge of one hundred and fifty US dollars per year.</desc>
<defs>
  <marker id="a088m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#4a6076"/>
  </marker>
</defs>
<rect width="360" height="486" fill="#0f1620"/>
<text x="18" y="34" fill="#f2f6fa" font-family="Georgia,serif" font-size="20" font-weight="bold">One question decides it</text>

<rect x="16" y="54" width="328" height="52" rx="26" fill="#1b2d3a" stroke="#3d6070" stroke-width="2"/>
<text x="180" y="86" fill="#9fdcf0" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Is BMW ECU coding in scope?</text>

<path d="M180 106 L180 136" stroke="#4a6076" stroke-width="2" marker-end="url(#a088m)"/>
<text x="192" y="128" fill="#7fe0a8" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold">Yes</text>

<rect x="16" y="146" width="328" height="130" rx="9" fill="#16212e" stroke="#2f6b45" stroke-width="2"/>
<text x="40" y="182" fill="#7fe0a8" font-family="Georgia,serif" font-size="22" font-weight="bold">NT710</text>
<text x="40" y="212" fill="#dce6f0" font-family="Helvetica,Arial,sans-serif" font-size="15">One make, coding listed</text>
<text x="40" y="234" fill="#dce6f0" font-family="Helvetica,Arial,sans-serif" font-size="15">for specific models</text>
<text x="40" y="260" fill="#8fa3b8" font-family="Helvetica,Arial,sans-serif" font-size="14">Lifetime updates</text>

<path d="M180 276 L180 306" stroke="#4a6076" stroke-width="2" marker-end="url(#a088m)"/>
<text x="192" y="298" fill="#f0c674" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="bold">No</text>

<rect x="16" y="316" width="328" height="130" rx="9" fill="#16212e" stroke="#2c3e52" stroke-width="2"/>
<text x="40" y="352" fill="#9fdcf0" font-family="Georgia,serif" font-size="22" font-weight="bold">NT809BT</text>
<text x="40" y="382" fill="#dce6f0" font-family="Helvetica,Arial,sans-serif" font-size="15">Multi-brand, no coding</text>
<text x="40" y="404" fill="#dce6f0" font-family="Helvetica,Arial,sans-serif" font-size="15">on the Foxwell list</text>
<text x="40" y="430" fill="#8fa3b8" font-family="Helvetica,Arial,sans-serif" font-size="14">3 yr, then US$150/yr</text>

<text x="18" y="472" fill="#6f8296" font-family="Helvetica,Arial,sans-serif" font-size="12">Foxwell pages, checked 26 Sep 2026. Confirm your VIN.</text>
</svg>
