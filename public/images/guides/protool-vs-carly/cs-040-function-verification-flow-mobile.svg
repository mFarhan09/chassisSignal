<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="t d"><title id="t">CS-040 function verification flow</title><desc id="d">Article-specific diagram for protool vs carly</desc><rect width="100%" height="100%" fill="#25141a"/><text x="50" y="80" class="eye">CS-040 / DECISION EVIDENCE</text><text x="50" y="145" class="head">FUNCTION VERIFICATION FLOW</text><text x="50" y="190" class="sub">Confirm vehicle, module and function</text><circle cx="360" cy="245" r="42" fill="#d35d6e"/><text x="360" y="252" text-anchor="middle" class="num">1</text><text x="50" y="252"  class="label">Name function</text><path d="M360 290 L360 335" stroke="#fff" stroke-width="5"/><circle cx="360" cy="380" r="42" fill="#f3b562"/><text x="360" y="387" text-anchor="middle" class="num">2</text><text x="50" y="387"  class="label">Choose vehicle</text><path d="M360 425 L360 470" stroke="#fff" stroke-width="5"/><circle cx="360" cy="515" r="42" fill="#d35d6e"/><text x="360" y="522" text-anchor="middle" class="num">3</text><text x="50" y="522"  class="label">Check module</text><path d="M360 560 L360 605" stroke="#fff" stroke-width="5"/><circle cx="360" cy="650" r="42" fill="#f3b562"/><text x="360" y="657" text-anchor="middle" class="num">4</text><text x="50" y="657"  class="label">Price same horizon</text><path d="M360 695 L360 740" stroke="#fff" stroke-width="5"/><circle cx="360" cy="785" r="42" fill="#d35d6e"/><text x="360" y="792" text-anchor="middle" class="num">5</text><text x="50" y="792"  class="label">Save evidence</text><style>.head{font:700 30px Arial;fill:#fff}.eye{font:700 18px Arial;fill:#f3b562}.sub{font:400 18px Arial;fill:#c9d5dc}.label{font:700 18px Arial;fill:#fff}.num{font:700 19px Arial;fill:#25141a}</style></svg>