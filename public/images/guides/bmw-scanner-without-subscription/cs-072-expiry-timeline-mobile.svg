<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">What can change at expiry</title><desc id="desc">A time horizon separates present installed capability from new coverage and hosted features. Purchase; Included period; Expiry date; Installed state; Future coverage.</desc><rect width="720" height="980" fill="#111827"/><rect width="720" height="16" fill="#72b7ff"/><text x="44" y="70" class="heading">What can change at expiry</text><text x="44" y="122" class="sub">A time horizon separates present installed capability from new coverage and hosted features.</text><path d="M65 210H655L613 294H107Z" fill="#28364d" stroke="#72b7ff" stroke-width="3"/><text x="360" y="260" text-anchor="middle" class="label"><tspan x="360" dy="0">Purchase</tspan></text><path d="M102 335H618L576 419H144Z" fill="#28364d" stroke="#72b7ff" stroke-width="3"/><text x="360" y="385" text-anchor="middle" class="label"><tspan x="360" dy="0">Included period</tspan></text><path d="M139 460H581L539 544H181Z" fill="#28364d" stroke="#72b7ff" stroke-width="3"/><text x="360" y="510" text-anchor="middle" class="label"><tspan x="360" dy="0">Expiry date</tspan></text><path d="M176 585H544L502 669H218Z" fill="#28364d" stroke="#72b7ff" stroke-width="3"/><text x="360" y="635" text-anchor="middle" class="label"><tspan x="360" dy="0">Installed state</tspan></text><path d="M213 710H507L465 794H255Z" fill="#ffb85c" stroke="#72b7ff" stroke-width="3"/><text x="360" y="760" text-anchor="middle" class="label"><tspan x="360" dy="0">Future coverage</tspan></text><circle cx="24" cy="958" r="2" fill="#ffb85c" opacity=".28"/><circle cx="40" cy="958" r="2" fill="#ffb85c" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#bfd0dc}.label{font:600 19px Arial,sans-serif;fill:#fff}</style></svg>