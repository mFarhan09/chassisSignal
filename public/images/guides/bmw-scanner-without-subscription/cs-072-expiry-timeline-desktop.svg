<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">What can change at expiry</title><desc id="desc">A time horizon separates present installed capability from new coverage and hosted features. Purchase; Included period; Expiry date; Installed state; Future coverage.</desc><rect width="1280" height="720" fill="#111827"/><rect width="1280" height="16" fill="#72b7ff"/><text x="64" y="68" class="heading">What can change at expiry</text><text x="64" y="114" class="sub">A time horizon separates present installed capability from new coverage and hosted features.</text><path d="M75 270h181l24 100-24 100H75Z" fill="#28364d" stroke="#72b7ff" stroke-width="4"/><text x="177.5" y="378" text-anchor="middle" class="label"><tspan x="177.5" dy="0">Purchase</tspan></text><path d="M302 270h181l24 100-24 100H302Z" fill="#28364d" stroke="#72b7ff" stroke-width="4"/><text x="404.5" y="378" text-anchor="middle" class="label"><tspan x="404.5" dy="0">Included period</tspan></text><path d="M529 270h181l24 100-24 100H529Z" fill="#28364d" stroke="#72b7ff" stroke-width="4"/><text x="631.5" y="378" text-anchor="middle" class="label"><tspan x="631.5" dy="0">Expiry date</tspan></text><path d="M756 270h181l24 100-24 100H756Z" fill="#28364d" stroke="#72b7ff" stroke-width="4"/><text x="858.5" y="378" text-anchor="middle" class="label"><tspan x="858.5" dy="0">Installed state</tspan></text><path d="M983 270h181l24 100-24 100H983Z" fill="#28364d" stroke="#ffb85c" stroke-width="4"/><text x="1085.5" y="378" text-anchor="middle" class="label"><tspan x="1085.5" dy="0">Future coverage</tspan></text><circle cx="24" cy="698" r="2" fill="#ffb85c" opacity=".28"/><circle cx="40" cy="698" r="2" fill="#ffb85c" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#bfd0dc}.label{font:600 17px Arial,sans-serif;fill:#fff}</style></svg>