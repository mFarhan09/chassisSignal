<svg xmlns="http://www.w3.org/2000/svg" width="420" height="937" viewBox="0 0 420 937" role="img" aria-labelledby="title desc"><title id="title">Choose the adapter from the app and vehicle</title><desc id="desc">Compatibility is the intersection, not the longest feature list.</desc><rect width="420" height="937" rx="24" fill="#f8fafc"/><rect width="420" height="14" fill="#c2410c"/><text x="28" y="62" font-size="24" font-weight="800" fill="#35180d">Choose the adapter from the</text><text x="28" y="93" font-size="24" font-weight="800" fill="#35180d">app and vehicle</text><text x="28" y="135" font-size="14" fill="#475569">Compatibility is the intersection, not the</text><text x="28" y="157" font-size="14" fill="#475569">longest feature list.</text><rect x="30" y="225" width="360" height="154" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="261" font-size="17" font-weight="700" fill="#35180d">Using iPhone/iPad?</text><text x="50" y="293" font-size="14" fill="#475569">Choose MX+ between these two.</text><rect x="30" y="397" width="360" height="154" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="433" font-size="17" font-weight="700" fill="#35180d">Need MS-CAN/SW-CAN?</text><text x="50" y="465" font-size="14" fill="#475569">Choose MX+ and verify the app/vehicle</text><text x="50" y="488" font-size="14" fill="#475569">function.</text><rect x="30" y="569" width="360" height="154" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="605" font-size="17" font-weight="700" fill="#35180d">Android standard OBD-II?</text><text x="50" y="637" font-size="14" fill="#475569">LX can fit when the selected app supports</text><text x="50" y="660" font-size="14" fill="#475569">it.</text><rect x="30" y="741" width="360" height="154" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="777" font-size="17" font-weight="700" fill="#35180d">BMW coding?</text><text x="50" y="809" font-size="14" fill="#475569">Check BimmerCode adapter table; CX vs MX+</text><text x="50" y="832" font-size="14" fill="#475569">is a separate decision.</text><text x="28" y="917" font-size="13" fill="#64748b">Chassis Signal - documentation-first editorial synthesis</text></svg>