<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="516" viewBox="0 0 1100 516" role="img" aria-labelledby="title desc"><title id="title">Choose the adapter from the app and vehicle</title><desc id="desc">Compatibility is the intersection, not the longest feature list.</desc><rect width="1100" height="516" rx="24" fill="#f8fafc"/><rect width="1100" height="14" fill="#c2410c"/><text x="44" y="62" font-size="34" font-weight="800" fill="#35180d">Choose the adapter from the app and vehicle</text><text x="44" y="104" font-size="18" fill="#475569">Compatibility is the intersection, not the longest feature list.</text><rect x="50" y="172" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="208" font-size="20" font-weight="700" fill="#35180d">Using iPhone/iPad?</text><text x="70" y="240" font-size="16" fill="#475569">Choose MX+ between these two.</text><rect x="560" y="172" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="208" font-size="20" font-weight="700" fill="#35180d">Need MS-CAN/SW-CAN?</text><text x="580" y="240" font-size="16" fill="#475569">Choose MX+ and verify the app/vehicle function.</text><rect x="50" y="332" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="368" font-size="20" font-weight="700" fill="#35180d">Android standard OBD-II?</text><text x="70" y="400" font-size="16" fill="#475569">LX can fit when the selected app supports it.</text><rect x="560" y="332" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="368" font-size="20" font-weight="700" fill="#35180d">BMW coding?</text><text x="580" y="400" font-size="16" fill="#475569">Check BimmerCode adapter table; CX vs MX+ is a</text><text x="580" y="423" font-size="16" fill="#475569">separate decision.</text><text x="44" y="496" font-size="13" fill="#64748b">Chassis Signal - documentation-first editorial synthesis</text></svg>