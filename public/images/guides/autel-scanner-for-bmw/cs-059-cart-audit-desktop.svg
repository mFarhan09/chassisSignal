<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Exact-Cart Audit Checklist</title><desc id="desc">Verification checklist auditing model suffix, included vehicle communication interface, regional licensing, and return terms.</desc><rect width="100%" height="100%" fill="#291d16"/><text x="68" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#63c2bc">PRE-PURCHASE CHECKLIST</text><text x="68" y="112" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">EXACT-CART AUDIT</text><text x="68" y="158" font-family="Arial, sans-serif" font-size="19" fill="#f8eee8">Audit the exact model suffix, hardware bundle, and seller authorization</text><path d="M95 270 H200 L285 545 H1030" stroke="#f8eee8" stroke-width="11" fill="none" /><path d="M230 325 H1130 L1050 500 H270" stroke="#e7793d" stroke-width="9" fill="none" /><circle cx="390" cy="590" r="42" fill="#63c2bc" /><circle cx="900" cy="590" r="42" fill="#63c2bc" /><rect x="310" y="355" width="125" height="50" rx="8" fill="#e7793d" /><text x="372" y="372" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff"><tspan x="372" dy="0">Model</tspan><tspan x="372" dy="22">suffix</tspan></text><rect x="455" y="420" width="125" height="50" rx="8" fill="#63c2bc" /><text x="517" y="437" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff"><tspan x="517" dy="0">VCI or</tspan><tspan x="517" dy="22">cable</tspan></text><rect x="600" y="355" width="125" height="50" rx="8" fill="#e7793d" /><text x="662" y="372" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff"><tspan x="662" dy="0">Region</tspan></text><rect x="745" y="420" width="125" height="50" rx="8" fill="#63c2bc" /><text x="807" y="437" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff"><tspan x="807" dy="0">Included</tspan><tspan x="807" dy="22">term</tspan></text><rect x="890" y="355" width="125" height="50" rx="8" fill="#e7793d" /><text x="952" y="372" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#fff"><tspan x="952" dy="0">BMW</tspan><tspan x="952" dy="22">function</tspan><tspan x="952" dy="22">proof</tspan></text></svg>