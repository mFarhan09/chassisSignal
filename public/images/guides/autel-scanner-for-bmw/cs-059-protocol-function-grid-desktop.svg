<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Protocol and Function Grid</title><desc id="desc">Matrix mapping diagnostic functions, active tests, and service routines against CAN FD, DoIP, and legacy bus architectures.</desc><rect width="100%" height="100%" fill="#291d16"/><text x="68" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#63c2bc">TECHNICAL SPECIFICATION MATRIX</text><text x="68" y="112" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">PROTOCOL AND FUNCTION GRID</text><text x="68" y="158" font-family="Arial, sans-serif" font-size="19" fill="#f8eee8">Match vehicle bus architectures and diagnostic protocols to tool capabilities</text><rect x="110" y="285" width="200" height="260" rx="8" fill="none" stroke="#e7793d" stroke-width="5"/><line x1="110" y1="340" x2="310" y2="340" stroke="#e7793d" stroke-width="5" /><circle cx="210" cy="390" r="22" fill="#e7793d" /><text x="210" y="430" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="210" dy="0">Codes and data</tspan></text><rect x="330" y="285" width="200" height="260" rx="8" fill="none" stroke="#63c2bc" stroke-width="5"/><line x1="330" y1="340" x2="530" y2="340" stroke="#63c2bc" stroke-width="5" /><circle cx="430" cy="390" r="22" fill="#63c2bc" /><text x="430" y="430" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="430" dy="0">Active tests</tspan></text><rect x="550" y="285" width="200" height="260" rx="8" fill="none" stroke="#e7793d" stroke-width="5"/><line x1="550" y1="340" x2="750" y2="340" stroke="#e7793d" stroke-width="5" /><circle cx="650" cy="390" r="22" fill="#e7793d" /><text x="650" y="430" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-w