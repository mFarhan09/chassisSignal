<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Software Entitlement Timeline</title><desc id="desc">Lifecycle timeline detailing initial software updates, post-expiry basic diagnostic function, and subscription renewal costs.</desc><rect width="100%" height="100%" fill="#291d16"/><text x="68" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#63c2bc">SUBSCRIPTION AND UPDATE POLICY</text><text x="68" y="112" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">SOFTWARE ENTITLEMENT TIMELINE</text><text x="68" y="158" font-family="Arial, sans-serif" font-size="19" fill="#f8eee8">Account for included software update periods and post-expiry operating terms</text><line x1="100" y1="420" x2="1180" y2="420" stroke="#f8eee8" stroke-width="10" /><circle cx="160" cy="420" r="24" fill="#e7793d" /><path d="M160 390 V285" stroke="#e7793d" stroke-width="5" fill="none" /><text x="160" y="260" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="160" dy="0">Register device</tspan></text><circle cx="380" cy="420" r="24" fill="#e7793d" /><path d="M380 390 V495" stroke="#e7793d" stroke-width="5" fill="none" /><text x="380" y="470" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="380" dy="0">Included updates</tspan></text><circle cx="600" cy="420" r="38" fill="#63c2bc" /><path d="M600 390 V285" stroke="#63c2bc" stroke-width="5" fill="none" /><text x="600" y="260" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="600" dy="0">Term ends</tspan></text><circle cx="820" cy="420" r="24" fill="#e7793d" /><path d="M820 390 V495" stroke="#e7793d" stroke-width="5" fill="none" /><text x="820" y="470" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="820" dy="0">Existing basics</tspan><tspan x="820" dy="22">remain</tspan></text><circle cx="1040" cy="420" r="24" fill="#e7793d" /><path d="M1040 390 V285" stroke="#e7793d" stroke-width="5" fill="none" /><text x="1040" y="260" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="1040" dy="0">Renew for new</tspan><tspan x="1040" dy="22">coverage</tspan></text><line x1="555" y1="355" x2="645" y2="485" stroke="#63c2bc" stroke-width="10" /></svg>