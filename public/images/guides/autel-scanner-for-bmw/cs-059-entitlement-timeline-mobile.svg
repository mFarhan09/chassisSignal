<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Software Entitlement Timeline</title><desc id="desc">Lifecycle timeline detailing initial software updates, post-expiry basic diagnostic function, and subscription renewal costs.</desc><rect width="100%" height="100%" fill="#291d16"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#63c2bc">SUBSCRIPTION AND UPDATE POLICY</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#fff">SOFTWARE ENTITLEMENT TIMELINE</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="17" fill="#f8eee8">Account for included software update periods and post-expiry operating terms</text><line x1="155" y1="260" x2="155" y2="820" stroke="#f8eee8" stroke-width="10" /><circle cx="155" cy="300" r="22" fill="#e7793d" /><path d="M190 300 H310" stroke="#e7793d" stroke-width="5" fill="none" /><text x="335" y="292" text-anchor="start" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="335" dy="0">Register device</tspan></text><circle cx="155" cy="415" r="22" fill="#e7793d" /><path d="M190 415 H355" stroke="#e7793d" stroke-width="5" fill="none" /><text x="380" y="407" text-anchor="start" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="380" dy="0">Included updates</tspan></text><circle cx="155" cy="530" r="34" fill="#63c2bc" /><path d="M190 530 H400" stroke="#63c2bc" stroke-width="5" fill="none" /><text x="425" y="522" text-anchor="start" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="425" dy="0">Term ends</tspan></text><circle cx="155" cy="645" r="22" fill="#e7793d" /><path d="M190 645 H445" stroke="#e7793d" stroke-width="5" fill="none" /><text x="470" y="637" text-anchor="start" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="470" dy="0">Existing basics</tspan><tspan x="470" dy="22">remain</tspan></text><circle cx="155" cy="760" r="22" fill="#e7793d" /><path d="M190 760 H490" stroke="#e7793d" stroke-width="5" fill="none" /><text x="515" y="752" text-anchor="start" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="515" dy="0">Renew for new</tspan><tspan x="515" dy="22">coverage</tspan></text><line x1="105" y1="530" x2="205" y2="530" stroke="#63c2bc" stroke-width="8" stroke-dasharray="10 8"/></svg>