<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">The diagnostic handoff gate</title><desc id="desc">Electrical risk and vehicle-specific thresholds define when DIY evidence collection ends. Safe observation; BMW test plan; Current measurement; Circuit isolation; Professional repair.</desc><rect width="720" height="980" fill="#17120c"/><rect width="720" height="16" fill="#f0ad4e"/><text x="44" y="70" class="heading">The diagnostic handoff gate</text><text x="44" y="122" class="sub">Electrical risk and vehicle-specific thresholds define when DIY evidence collection ends.</text><rect x="80" y="210" width="560" height="84" rx="18" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><circle cx="115" cy="252" r="21" fill="#f0ad4e"/><text x="365" y="260" text-anchor="middle" class="label"><tspan x="365" dy="0">Safe observation</tspan></text><path d="M115 273V366" stroke="#698397" stroke-width="5"/><rect x="80" y="345" width="560" height="84" rx="18" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><circle cx="115" cy="387" r="21" fill="#f0ad4e"/><text x="365" y="395" text-anchor="middle" class="label"><tspan x="365" dy="0">BMW test plan</tspan></text><path d="M115 408V501" stroke="#698397" stroke-width="5"/><rect x="80" y="480" width="560" height="84" rx="18" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><circle cx="115" cy="522" r="21" fill="#f0ad4e"/><text x="365" y="530" text-anchor="middle" class="label"><tspan x="365" dy="0">Current measurement</tspan></text><path d="M115 543V636" stroke="#698397" stroke-width="5"/><rect x="80" y="615" width="560" height="84" rx="18" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><circle cx="115" cy="657" r="21" fill="#f0ad4e"/><text x="365" y="665" text-anchor="middle" class="label"><tspan x="365" dy="0">Circuit isolation</tspan></text><path d="M115 678V771" stroke="#698397" stroke-width="5"/><rect x="80" y="750" width="560" height="84" rx="18" fill="#49351f" stroke="#e8e1d3" stroke-width="3"/><circle cx="115" cy="792" r="21" fill="#e8e1d3"/><text x="365" y="800" text-anchor="middle" class="label"><tspan x="365" dy="0">Professional repair</tspan></text><circle cx="24" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="40" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="56" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="72" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#bfd0dc}.label{font:600 19px Arial,sans-serif;fill:#fff}</style></svg>