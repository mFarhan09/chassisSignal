<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Start with the failed evidence layer</title><desc id="desc">A branch map separates battery condition, charging, sleep, stored energy history and live current. Repeated discharge; Battery condition; Charging evidence; Sleep and wake history; Direct current test.</desc><rect width="1280" height="720" fill="#071722"/><rect width="1280" height="16" fill="#77d8c8"/><text x="64" y="68" class="heading">Start with the failed evidence layer</text><text x="64" y="114" class="sub">A branch map separates battery condition, charging, sleep, stored energy history and live current.</text><circle cx="105" cy="215" r="21" fill="#77d8c8"/><rect x="155" y="184" width="950" height="62" rx="15" fill="#1b4050"/><text x="190" y="222" text-anchor="start" class="label"><tspan x="190" dy="0">Repeated discharge</tspan></text><circle cx="105" cy="297" r="21" fill="#77d8c8"/><rect x="155" y="266" width="950" height="62" rx="15" fill="#1b4050"/><text x="190" y="304" text-anchor="start" class="label"><tspan x="190" dy="0">Battery condition</tspan></text><circle cx="105" cy="379" r="21" fill="#77d8c8"/><rect x="155" y="348" width="950" height="62" rx="15" fill="#1b4050"/><text x="190" y="386" text-anchor="start" class="label"><tspan x="190" dy="0">Charging evidence</tspan></text><circle cx="105" cy="461" r="21" fill="#77d8c8"/><rect x="155" y="430" width="950" height="62" rx="15" fill="#1b4050"/><text x="190" y="456" text-anchor="start" class="label"><tspan x="190" dy="0">Sleep and wake</tspan><tspan x="190" dy="24">history</tspan></text><circle cx="105" cy="543" r="21" fill="#f5c26b"/><rect x="155" y="512" width="950" height="62" rx="15" fill="#1b4050"/><text x="190" y="550" text-anchor="start" class="label"><tspan x="190" dy="0">Direct current test</tspan></text><circle cx="24" cy="698" r="2" fill="#f5c26b" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#bfd0dc}.label{font:600 17px Arial,sans-serif;fill:#fff}</style></svg>