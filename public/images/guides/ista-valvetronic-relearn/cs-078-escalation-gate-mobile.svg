<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">A safe relearn has a stop gate</title><desc id="desc">Unresolved faults, unknown engine procedure or failed learning require diagnosis rather than repetition. Preserve evidence; Resolve hard faults; Meet prerequisites; Run exact plan; Verify result; Escalate if failed.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="70" text-anchor="start" class="heading"><tspan x="44" dy="0">A safe relearn has a stop gate</tspan></text><text x="44" y="122" text-anchor="start" class="sub"><tspan x="44" dy="0">Unresolved faults, unknown engine procedure or</tspan><tspan x="44" dy="24">failed learning require diagnosis rather than</tspan><tspan x="44" dy="24">repetition.</tspan></text><circle cx="360" cy="545" r="88" fill="#65c8ff"/><text x="360" y="553" text-anchor="middle" class="label"><tspan x="360" dy="0">DECIDE</tspan></text><path d="M360 545L360 300" stroke="#698397" stroke-width="4"/><rect x="257" y="258" width="206" height="84" rx="20" fill="#243b5a" stroke="#65c8ff" stroke-width="3"/><text x="360" y="296" text-anchor="middle" class="label"><tspan x="360" dy="0">Preserve</tspan><tspan x="360" dy="24">evidence</tspan></text><path d="M360 545L554.8557158514986 422.5" stroke="#698397" stroke-width="4"/><rect x="451.85571585149864" y="380.5" width="206" height="84" rx="20" fill="#243b5a" stroke="#ff7f7f" stroke-width="3"/><text x="554.8557158514986" y="418.5" text-anchor="middle" class="label"><tspan x="554.8557158514986" dy="0">Resolve hard</tspan><tspan x="554.8557158514986" dy="24">faults</tspan></text><path d="M360 545L554.8557158514986 667.5" stroke="#698397" stroke-width="4"/><rect x="451.85571585149864" y="625.5" width="206" height="84" rx="20" fill="#243b5a" stroke="#65c8ff" stroke-width="3"/><text x="554.8557158514986" y="663.5" text-anchor="middle" class="label"><tspan x="554.8557158514986" dy="0">Meet</tspan><tspan x="554.8557158514986" dy="24">prerequisites</tspan></text><path d="M360 545L360 790" stroke="#698397" stroke-width="4"/><rect x="257" y="748" width="206" height="84" rx="20" fill="#243b5a" stroke="#ff7f7f" stroke-width="3"/><text x="360" y="798" text-anchor="middle" class="label"><tspan x="360" dy="0">Run exact plan</tspan></text><path d="M360 545L165.14428414850133 667.5000000000001" stroke="#698397" stroke-width="4"/><rect x="62.14428414850133" y="625.5000000000001" width="206" height="84" rx="20" fill="#243b5a" stroke="#65c8ff" stroke-width="3"/><text x="165.14428414850133" y="675.5000000000001" text-anchor="middle" class="label"><tspan x="165.14428414850133" dy="0">Verify result</tspan></text><path d="M360 545L165.14428414850133 422.5" stroke="#698397" stroke-width="4"/><rect x="62.14428414850133" y="380.5" width="206" height="84" rx="20" fill="#243b5a" stroke="#ff7f7f" stroke-width="3"/><text x="165.14428414850133" y="418.5" text-anchor="middle" class="label"><tspan x="165.14428414850133" dy="0">Escalate if</tspan><tspan x="165.14428414850133" dy="24">failed</tspan></text><circle cx="24" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="40" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="56" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="72" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="88" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="104" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="120" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="136" cy="958" r="2" fill="#ff7f7f" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#bfd0dc}.label{font:600 19px Arial,sans-serif;fill:#fff}</style></svg>