<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Fault state changes the relearn decision</title><desc id="desc">Mechanical, sensor, motor, supply and DME states lead to different stop or proceed outcomes. Mechanical free?; Signal plausible?; Supply stable?; Motor faults?; DME faults?; Teach-in authorized?.</desc><rect width="1280" height="720" fill="#181426"/><rect width="1280" height="16" fill="#c5a3ff"/><text x="64" y="68" class="heading">Fault state changes the relearn decision</text><text x="64" y="114" class="sub">Mechanical, sensor, motor, supply and DME states lead to different stop or proceed outcomes.</text><circle cx="105" cy="215" r="21" fill="#c5a3ff"/><rect x="155" y="184" width="950" height="62" rx="15" fill="#3e315c"/><text x="190" y="222" text-anchor="start" class="label"><tspan x="190" dy="0">Mechanical free?</tspan></text><circle cx="105" cy="297" r="21" fill="#c5a3ff"/><rect x="155" y="266" width="950" height="62" rx="15" fill="#3e315c"/><text x="190" y="304" text-anchor="start" class="label"><tspan x="190" dy="0">Signal plausible?</tspan></text><circle cx="105" cy="379" r="21" fill="#c5a3ff"/><rect x="155" y="348" width="950" height="62" rx="15" fill="#3e315c"/><text x="190" y="386" text-anchor="start" class="label"><tspan x="190" dy="0">Supply stable?</tspan></text><circle cx="105" cy="461" r="21" fill="#c5a3ff"/><rect x="155" y="430" width="950" height="62" rx="15" fill="#3e315c"/><text x="190" y="468" text-anchor="start" class="label"><tspan x="190" dy="0">Motor faults?</tspan></text><circle cx="105" cy="543" r="21" fill="#c5a3ff"/><rect x="155" y="512" width="950" height="62" rx="15" fill="#3e315c"/><text x="190" y="550" text-anchor="start" class="label"><tspan x="190" dy="0">DME faults?</tspan></text><circle cx="105" cy="625" r="21" fill="#78e3d2"/><rect x="155" y="594" width="950" height="62" rx="15" fill="#3e315c"/><text x="190" y="632" text-anchor="start" class="label"><tspan x="190" dy="0">Teach-in authorized?</tspan></text><circle cx="24" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="40" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="56" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="72" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="88" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="104" cy="698" r="2" fill="#78e3d2" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#bfd0dc}.label{font:600 17px Arial,sans-serif;fill:#fff}</style></svg>