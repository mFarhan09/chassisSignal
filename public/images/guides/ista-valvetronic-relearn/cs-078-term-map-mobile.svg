<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Do not collapse adaptation terminology</title><desc id="desc">Limit learning, end-stop adaptation and a guided test plan are related terms, not universal synonyms. Teach-in; Relearn; Adaptation; Limit positions; Test plan; Verification.</desc><rect width="720" height="980" fill="#17120c"/><rect width="720" height="16" fill="#f0ad4e"/><text x="44" y="70" text-anchor="start" class="heading"><tspan x="44" dy="0">Do not collapse adaptation</tspan><tspan x="44" dy="34">terminology</tspan></text><text x="44" y="156" text-anchor="start" class="sub"><tspan x="44" dy="0">Limit learning, end-stop adaptation and a guided</tspan><tspan x="44" dy="24">test plan are related terms, not universal synonyms.</tspan></text><path d="M65 238H655L613 322H107Z" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><text x="360" y="288" text-anchor="middle" class="label"><tspan x="360" dy="0">Teach-in</tspan></text><path d="M102 350H618L576 434H144Z" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><text x="360" y="400" text-anchor="middle" class="label"><tspan x="360" dy="0">Relearn</tspan></text><path d="M139 462H581L539 546H181Z" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><text x="360" y="512" text-anchor="middle" class="label"><tspan x="360" dy="0">Adaptation</tspan></text><path d="M176 574H544L502 658H218Z" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><text x="360" y="624" text-anchor="middle" class="label"><tspan x="360" dy="0">Limit positions</tspan></text><path d="M213 686H507L465 770H255Z" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><text x="360" y="736" text-anchor="middle" class="label"><tspan x="360" dy="0">Test plan</tspan></text><path d="M250 798H470L428 882H292Z" fill="#e8e1d3" stroke="#f0ad4e" stroke-width="3"/><text x="360" y="848" text-anchor="middle" class="label"><tspan x="360" dy="0">Verification</tspan></text><circle cx="24" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="40" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="56" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="72" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="88" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="104" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="120" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#bfd0dc}.label{font:600 19px Arial,sans-serif;fill:#fff}</style></svg>