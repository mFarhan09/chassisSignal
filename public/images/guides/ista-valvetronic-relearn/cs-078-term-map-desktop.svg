<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Do not collapse adaptation terminology</title><desc id="desc">Limit learning, end-stop adaptation and a guided test plan are related terms, not universal synonyms. Teach-in; Relearn; Adaptation; Limit positions; Test plan; Verification.</desc><rect width="1280" height="720" fill="#17120c"/><rect width="1280" height="16" fill="#f0ad4e"/><text x="64" y="68" class="heading">Do not collapse adaptation terminology</text><text x="64" y="114" class="sub">Limit learning, end-stop adaptation and a guided test plan are related terms, not universal synonyms.</text><path d="M75 270h146l24 100-24 100H75Z" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="160" y="378" text-anchor="middle" class="label"><tspan x="160" dy="0">Teach-in</tspan></text><path d="M267 270h146l24 100-24 100H267Z" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="352" y="378" text-anchor="middle" class="label"><tspan x="352" dy="0">Relearn</tspan></text><path d="M459 270h146l24 100-24 100H459Z" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="544" y="378" text-anchor="middle" class="label"><tspan x="544" dy="0">Adaptation</tspan></text><path d="M651 270h146l24 100-24 100H651Z" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="736" y="378" text-anchor="middle" class="label"><tspan x="736" dy="0">Limit positions</tspan></text><path d="M843 270h146l24 100-24 100H843Z" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="928" y="378" text-anchor="middle" class="label"><tspan x="928" dy="0">Test plan</tspan></text><path d="M1035 270h146l24 100-24 100H1035Z" fill="#49351f" stroke="#e8e1d3" stroke-width="4"/><text x="1120" y="378" text-anchor="middle" class="label"><tspan x="1120" dy="0">Verification</tspan></text><circle cx="24" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="40" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="56" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="72" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="88" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="104" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="120" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#bfd0dc}.label{font:600 17px Arial,sans-serif;fill:#fff}</style></svg>