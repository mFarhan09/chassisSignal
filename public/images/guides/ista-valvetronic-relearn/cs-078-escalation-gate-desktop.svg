<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">A safe relearn has a stop gate</title><desc id="desc">Unresolved faults, unknown engine procedure or failed learning require diagnosis rather than repetition. Preserve evidence; Resolve hard faults; Meet prerequisites; Run exact plan; Verify result; Escalate if failed.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="64" y="68" class="heading">A safe relearn has a stop gate</text><text x="64" y="114" class="sub">Unresolved faults, unknown engine procedure or failed learning require diagnosis rather than repetition.</text><circle cx="640" cy="420" r="84" fill="#65c8ff"/><text x="640" y="427" text-anchor="middle" class="label"><tspan x="640" dy="0">QUALIFY</tspan></text><path d="M640 420L640 185" stroke="#698397" stroke-width="4"/><rect x="535" y="147" width="210" height="76" rx="20" fill="#243b5a" stroke="#65c8ff" stroke-width="3"/><text x="640" y="192" text-anchor="middle" class="label"><tspan x="640" dy="0">Preserve evidence</tspan></text><path d="M640 420L843.5159698893431 302.5" stroke="#698397" stroke-width="4"/><rect x="738.5159698893431" y="264.5" width="210" height="76" rx="20" fill="#243b5a" stroke="#ff7f7f" stroke-width="3"/><text x="843.5159698893431" y="309.5" text-anchor="middle" class="label"><tspan x="843.5159698893431" dy="0">Resolve hard faults</tspan></text><path d="M640 420L843.5159698893431 537.5" stroke="#698397" stroke-width="4"/><rect x="738.5159698893431" y="499.5" width="210" height="76" rx="20" fill="#243b5a" stroke="#65c8ff" stroke-width="3"/><text x="843.5159698893431" y="544.5" text-anchor="middle" class="label"><tspan x="843.5159698893431" dy="0">Meet prerequisites</tspan></text><path d="M640 420L640 655" stroke="#698397" stroke-width="4"/><rect x="535" y="617" width="210" height="76" rx="20" fill="#243b5a" stroke="#ff7f7f" stroke-width="3"/><text x="640" y="662" text-anchor="middle" class="label"><tspan x="640" dy="0">Run exact plan</tspan></text><path d="M640 420L436.48403011065693 537.5000000000001" stroke="#698397" stroke-width="4"/><rect x="331.48403011065693" y="499.5000000000001" width="210" height="76" rx="20" fill="#243b5a" stroke="#65c8ff" stroke-width="3"/><text x="436.48403011065693" y="544.5000000000001" text-anchor="middle" class="label"><tspan x="436.48403011065693" dy="0">Verify result</tspan></text><path d="M640 420L436.48403011065693 302.5" stroke="#698397" stroke-width="4"/><rect x="331.48403011065693" y="264.5" width="210" height="76" rx="20" fill="#243b5a" stroke="#ff7f7f" stroke-width="3"/><text x="436.48403011065693" y="309.5" text-anchor="middle" class="label"><tspan x="436.48403011065693" dy="0">Escalate if failed</tspan></text><circle cx="24" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="40" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="56" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="72" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="88" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="104" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="120" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><circle cx="136" cy="698" r="2" fill="#ff7f7f" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#bfd0dc}.label{font:600 17px Arial,sans-serif;fill:#fff}</style></svg>