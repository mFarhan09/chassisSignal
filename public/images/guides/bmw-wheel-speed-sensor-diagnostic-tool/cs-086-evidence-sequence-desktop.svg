<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ti de"><title id="ti">Four-corner evidence sequence</title><desc id="de">Compare all four wheel speeds before touching a part; the data tells you where to look.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="56" y="60" class="h">Four-corner evidence sequence</text><text x="56" y="102" class="s">Compare all four wheel speeds before touching a part; the data tells you where to look.</text><rect x="56" y="179" width="219" height="150" rx="12" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="82" cy="205" r="15" fill="#65c8ff"/><text x="82" y="210" text-anchor="middle" class="b">1</text><text x="70" y="243" class="l">Read DSC codes</text><text x="70" y="266" class="m">BMW-capable scanner on the</text><text x="70" y="283" class="m">DSC module; note the corner and</text><text x="70" y="300" class="m">fault detail.</text><path d="M275 254 h18 " stroke="#65c8ff" stroke-width="3"/><path d="M291 254 l-10 -7 v14 Z" fill="#65c8ff"/><rect x="293" y="179" width="219" height="150" rx="12" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="319" cy="205" r="15" fill="#65c8ff"/><text x="319" y="210" text-anchor="middle" class="b">2</text><text x="307" y="243" class="l">Compare four corners</text><text x="307" y="266" class="m">A single deviating corner isolates</text><text x="307" y="283" class="m">where to look; the others confirm</text><text x="307" y="300" class="m">it.</text><path d="M512 254 h18 " stroke="#65c8ff" stroke-width="3"/><path d="M528 254 l-10 -7 v14 Z" fill="#65c8ff"/><rect x="530" y="179" width="219" height="150" rx="12" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="556" cy="205" r="15" fill="#65c8ff"/><text x="556" y="210" text-anchor="middle" class="b">3</text><text x="544" y="243" class="l">Static vs dynamic</text><text x="544" y="266" class="m">Check the signal at rest and with</text><text x="544" y="283" class="m">the wheel turning, safely, not</text><text x="544" y="300" class="m">while driving distracted.</text><path d="M750 254 h18 " stroke="#65c8ff" stroke-width="3"/><path d="M766 254 l-10 -7 v14 Z" fill="#65c8ff"/><rect x="768" y="179" width="219" height="150" rx="12" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="794" cy="205" r="15" fill="#65c8ff"/><text x="794" y="210" text-anchor="middle" class="b">4</text><text x="782" y="243" class="l">Narrow the layer</text><text x="782" y="266" class="m">Rule out wiring and connector</text><text x="782" y="283" class="m">before the sensor, and the ring</text><text x="782" y="300" class="m">before the hub.</text><path d="M987 254 h18 " stroke="#65c8ff" stroke-width="3"/><path d="M1003 254 l-10 -7 v14 Z" fill="#65c8ff"/><rect x="1005" y="179" width="219" height="150" rx="12" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="1031" cy="205" r="15" fill="#65c8ff"/><text x="1031" y="210" text-anchor="middle" class="b">5</text><text x="1019" y="243" class="l">Confirm the cause</text><text x="1019" y="266" class="m">Contamination, sensor, encoder</text><text x="1019" y="283" class="m">ring or calibration — verified, then</text><text x="1019" y="300" class="m">repaired.</text><rect x="56" y="369" width="1168" height="52" rx="10" fill="#1b2f4a" stroke="#ff7f7f" stroke-width="2"/><text x="72" y="397" class="m" fill="#ff7f7f">A DSC or ABS code names a circuit, not a broken sensor. Never replace a sensor from a code alone; clean and inspect the encoder ring and wiring first.</text><style>.h{font:700 34px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 19px Arial,sans-serif;fill:#bfd0dc}.l{font:600 16px Arial,sans-serif;fill:#fff}.m{font:400 14px Arial,sans-serif;fill:#bfd0dc}.b{font:700 15px Arial,sans-serif;fill:#0c1727}.t{font:700 15px Arial,sans-serif;fill:#65c8ff}</style></svg>