<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ti de"><title id="ti">What the four-corner data points to</title><desc id="de">Read the pattern across corners; one reading rarely justifies a part on its own.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="56" y="60" class="h">What the four-corner data points to</text><text x="56" y="102" class="s">Read the pattern across corners; one reading rarely justifies a part on its own.</text><rect x="56" y="147" width="1168" height="40" fill="#1b2f4a"/><text x="70" y="174" class="t">Finding</text><text x="573" y="174" text-anchor="middle" class="t">Points to</text><text x="1007" y="174" text-anchor="middle" class="t">Do not conclude</text><rect x="56" y="187" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="242" class="l">One corner reads 0 at speed</text><text x="573" y="241" text-anchor="middle" class="m">That corner's circuit or ring</text><text x="1007" y="241" text-anchor="middle" class="m">The sensor is definitely bad</text><line x1="356" y1="147" x2="356" y2="288" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="288" stroke="#3a5578" stroke-width="1"/><rect x="56" y="287.6" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="343" class="l">Intermittent dropout</text><text x="573" y="342" text-anchor="middle" class="m">Wiring, connector or contamination</text><text x="1007" y="342" text-anchor="middle" class="m">Replace the hub immediately</text><line x1="356" y1="147" x2="356" y2="388" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="388" stroke="#3a5578" stroke-width="1"/><rect x="56" y="388.20000000000005" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="444" class="l">All four low or erratic</text><text x="573" y="443" text-anchor="middle" class="m">Shared wiring, ground or DSC</text><text x="1007" y="443" text-anchor="middle" class="m">A single failed sensor</text><line x1="356" y1="147" x2="356" y2="489" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="489" stroke="#3a5578" stroke-width="1"/><rect x="56" y="488.80000000000007" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="544" class="l">Fault only while turning</text><text x="573" y="543" text-anchor="middle" class="m">Bearing / ring or air gap</text><text x="1007" y="543" text-anchor="middle" class="m">Ignore calibration</text><line x1="356" y1="147" x2="356" y2="589" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="589" stroke="#3a5578" stroke-width="1"/><rect x="56" y="589.4000000000001" width="1168" height="101" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="645" class="l">Clears after cleaning the ring</text><text x="573" y="644" text-anchor="middle" class="m">Metallic contamination</text><text x="1007" y="644" text-anchor="middle" class="m">A sensor was ever needed</text><line x1="356" y1="147" x2="356" y2="690" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="690" stroke="#3a5578" stroke-width="1"/><style>.h{font:700 34px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 19px Arial,sans-serif;fill:#bfd0dc}.l{font:600 16px Arial,sans-serif;fill:#fff}.m{font:400 14px Arial,sans-serif;fill:#bfd0dc}.b{font:700 15px Arial,sans-serif;fill:#0c1727}.t{font:700 15px Arial,sans-serif;fill:#65c8ff}</style></svg>