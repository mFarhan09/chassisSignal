<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ti de"><title id="ti">Four-corner wheel-speed evidence tree</title><desc id="de">A DSC code names a corner and a circuit; the cause still sits in one of these layers.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="56" y="60" class="h">Four-corner wheel-speed evidence tree</text><text x="56" y="102" class="s">A DSC code names a corner and a circuit; the cause still sits in one of these layers.</text><rect x="490" y="163" width="300" height="52" rx="10" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2.5"/><text x="640" y="195" text-anchor="middle" class="l">Wheel-speed fault: isolate the layer</text><line x1="640" y1="215" x2="202" y2="277" stroke="#3a5578" stroke-width="2"/><rect x="72" y="283" width="260" height="52" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><text x="202" y="314" text-anchor="middle" class="l">Electrical path</text><rect x="78" y="361" width="248" height="46" rx="8" fill="#1b2f4a" stroke="#3a5578" stroke-width="1.5"/><text x="202" y="379" text-anchor="middle" class="m">Wiring / connector</text><rect x="78" y="417" width="248" height="46" rx="8" fill="#1b2f4a" stroke="#3a5578" stroke-width="1.5"/><text x="202" y="435" text-anchor="middle" class="m">Corrosion or open</text><line x1="640" y1="215" x2="494" y2="277" stroke="#3a5578" stroke-width="2"/><rect x="364" y="283" width="260" height="52" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><text x="494" y="314" text-anchor="middle" class="l">Sensor head</text><rect x="370" y="361" width="248" height="46" rx="8" fill="#1b2f4a" stroke="#3a5578" stroke-width="1.5"/><text x="494" y="379" text-anchor="middle" class="m">Sensor failure</text><rect x="370" y="417" width="248" height="46" rx="8" fill="#1b2f4a" stroke="#3a5578" stroke-width="1.5"/><text x="494" y="435" text-anchor="middle" class="m">Air gap / mounting</text><line x1="640" y1="215" x2="786" y2="277" stroke="#3a5578" stroke-width="2"/><rect x="656" y="283" width="260" height="52" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><text x="786" y="314" text-anchor="middle" class="l">Encoder ring / bearing</text><rect x="662" y="361" width="248" height="46" rx="8" fill="#1b2f4a" stroke="#3a5578" stroke-width="1.5"/><text x="786" y="379" text-anchor="middle" class="m">Metallic contamination</text><rect x="662" y="417" width="248" height="46" rx="8" fill="#1b2f4a" stroke="#3a5578" stroke-width="1.5"/><text x="786" y="435" text-anchor="middle" class="m">Damaged magnetic ring</text><line x1="640" y1="215" x2="1078" y2="277" stroke="#3a5578" stroke-width="2"/><rect x="948" y="283" width="260" height="52" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><text x="1078" y="314" text-anchor="middle" class="l">System / calibration</text><rect x="954" y="361" width="248" height="46" rx="8" fill="#1b2f4a" stroke="#3a5578" stroke-width="1.5"/><text x="1078" y="379" text-anchor="middle" class="m">DSC module</text><rect x="954" y="417" width="248" height="46" rx="8" fill="#1b2f4a" stroke="#3a5578" stroke-width="1.5"/><text x="1078" y="435" text-anchor="middle" class="m">Steering-angle / calibration</text><style>.h{font:700 34px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 19px Arial,sans-serif;fill:#bfd0dc}.l{font:600 16px Arial,sans-serif;fill:#fff}.m{font:400 14px Arial,sans-serif;fill:#bfd0dc}.b{font:700 15px Arial,sans-serif;fill:#0c1727}.t{font:700 15px Arial,sans-serif;fill:#65c8ff}</style></svg>