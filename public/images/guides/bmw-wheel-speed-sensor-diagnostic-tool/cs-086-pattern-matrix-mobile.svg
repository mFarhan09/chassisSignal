<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="ti de"><title id="ti">What the four-corner data points to</title><desc id="de">Read the pattern across corners; one reading rarely justifies a part on its own.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="58" class="h">What the four-corner data points to</text><text x="44" y="94" class="s">Read the pattern across corners; one reading rarely justifies a part on its own.</text><rect x="40" y="135" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="165" class="l">One corner reads 0 at speed</text><text x="56" y="189" class="m">Points to: That corner's circuit or ring</text><text x="56" y="211" class="m">Do not conclude: The sensor is definitely bad</text><rect x="40" y="285" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="315" class="l">Intermittent dropout</text><text x="56" y="339" class="m">Points to: Wiring, connector or contamination</text><text x="56" y="361" class="m">Do not conclude: Replace the hub immediately</text><rect x="40" y="435" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="465" class="l">All four low or erratic</text><text x="56" y="489" class="m">Points to: Shared wiring, ground or DSC</text><text x="56" y="511" class="m">Do not conclude: A single failed sensor</text><rect x="40" y="585" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="615" class="l">Fault only while turning</text><text x="56" y="639" class="m">Points to: Bearing / ring or air gap</text><text x="56" y="661" class="m">Do not conclude: Ignore calibration</text><rect x="40" y="735" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="765" class="l">Clears after cleaning the ring</text><text x="56" y="789" class="m">Points to: Metallic contamination</text><text x="56" y="811" class="m">Do not conclude: A sensor was ever needed</text><style>.h{font:700 29px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 17px Arial,sans-serif;fill:#bfd0dc}.l{font:600 17px Arial,sans-serif;fill:#fff}.m{font:400 15px Arial,sans-serif;fill:#bfd0dc}.b{font:700 16px Arial,sans-serif;fill:#0c1727}.t{font:700 16px Arial,sans-serif;fill:#65c8ff}</style></svg>