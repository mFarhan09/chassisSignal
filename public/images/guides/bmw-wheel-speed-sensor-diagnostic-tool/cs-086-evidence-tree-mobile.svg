<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="ti de"><title id="ti">Four-corner wheel-speed evidence tree</title><desc id="de">A DSC code names a corner and a circuit; the cause still sits in one of these layers.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="58" class="h">Four-corner wheel-speed evidence tree</text><text x="44" y="94" class="s">A DSC code names a corner and a circuit; the cause still sits in one of these layers.</text><rect x="40" y="135" width="640" height="48" rx="10" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2.5"/><text x="360" y="165" text-anchor="middle" class="l">Wheel-speed fault: isolate the layer</text><line x1="64" y1="199" x2="64" y2="372" stroke="#3a5578" stroke-width="2"/><rect x="58" y="203" width="622" height="40" rx="8" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><text x="74" y="229" class="l">Electrical path</text><text x="84" y="251" class="m">• Wiring / connector</text><text x="84" y="273" class="m">• Corrosion or open</text><line x1="64" y1="388.25" x2="64" y2="562" stroke="#3a5578" stroke-width="2"/><rect x="58" y="392" width="622" height="40" rx="8" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><text x="74" y="418" class="l">Sensor head</text><text x="84" y="440" class="m">• Sensor failure</text><text x="84" y="462" class="m">• Air gap / mounting</text><line x1="64" y1="577.5" x2="64" y2="751" stroke="#3a5578" stroke-width="2"/><rect x="58" y="582" width="622" height="40" rx="8" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><text x="74" y="608" class="l">Encoder ring / bearing</text><text x="84" y="630" class="m">• Metallic contamination</text><text x="84" y="652" class="m">• Damaged magnetic ring</text><line x1="64" y1="766.75" x2="64" y2="940" stroke="#3a5578" stroke-width="2"/><rect x="58" y="771" width="622" height="40" rx="8" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><text x="74" y="797" class="l">System / calibration</text><text x="84" y="819" class="m">• DSC module</text><text x="84" y="841" class="m">• Steering-angle / calibration</text><style>.h{font:700 29px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 17px Arial,sans-serif;fill:#bfd0dc}.l{font:600 17px Arial,sans-serif;fill:#fff}.m{font:400 15px Arial,sans-serif;fill:#bfd0dc}.b{font:700 16px Arial,sans-serif;fill:#0c1727}.t{font:700 16px Arial,sans-serif;fill:#65c8ff}</style></svg>