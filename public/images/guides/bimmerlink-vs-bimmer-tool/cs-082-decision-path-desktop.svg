<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ti de"><title id="ti">Choose by phone OS, then the exact job</title><desc id="de">Start with your phone and adapter, not a feature count; each stage narrows the right app.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="56" y="60" class="h">Choose by phone OS, then the exact job</text><text x="56" y="102" class="s">Start with your phone and adapter, not a feature count; each stage narrows the right app.</text><rect x="56" y="179" width="219" height="150" rx="12" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="82" cy="205" r="15" fill="#65c8ff"/><text x="82" y="210" text-anchor="middle" class="b">1</text><text x="70" y="243" class="l">Phone OS</text><text x="70" y="266" class="m">iPhone rules out Android-only</text><text x="70" y="283" class="m">paths; confirm the app supports</text><text x="70" y="300" class="m">your OS.</text><path d="M275 254 h18 " stroke="#65c8ff" stroke-width="3"/><path d="M291 254 l-10 -7 v14 Z" fill="#65c8ff"/><rect x="293" y="179" width="219" height="150" rx="12" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="319" cy="205" r="15" fill="#65c8ff"/><text x="319" y="210" text-anchor="middle" class="b">2</text><text x="307" y="243" class="l">Adapter</text><text x="307" y="266" class="m">Match the app's supported</text><text x="307" y="283" class="m">adapter; pre-2008 cars often</text><text x="307" y="300" class="m">prefer a K+DCAN cable.</text><path d="M512 254 h18 " stroke="#65c8ff" stroke-width="3"/><path d="M528 254 l-10 -7 v14 Z" fill="#65c8ff"/><rect x="530" y="179" width="219" height="150" rx="12" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="556" cy="205" r="15" fill="#65c8ff"/><text x="556" y="210" text-anchor="middle" class="b">3</text><text x="544" y="243" class="l">Diagnostic job</text><text x="544" y="266" class="m">Codes and live data are covered</text><text x="544" y="283" class="m">by both; decide if graphing</text><text x="544" y="300" class="m">matters.</text><path d="M750 254 h18 " stroke="#65c8ff" stroke-width="3"/><path d="M766 254 l-10 -7 v14 Z" fill="#65c8ff"/><rect x="768" y="179" width="219" height="150" rx="12" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="794" cy="205" r="15" fill="#65c8ff"/><text x="794" y="210" text-anchor="middle" class="b">4</text><text x="782" y="243" class="l">Diesel / DPF</text><text x="782" y="266" class="m">If DPF work is the goal, compare</text><text x="782" y="283" class="m">regeneration and</text><text x="782" y="300" class="m">adaptation-reset depth.</text><path d="M987 254 h18 " stroke="#65c8ff" stroke-width="3"/><path d="M1003 254 l-10 -7 v14 Z" fill="#65c8ff"/><rect x="1005" y="179" width="219" height="150" rx="12" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="1031" cy="205" r="15" fill="#65c8ff"/><text x="1031" y="210" text-anchor="middle" class="b">5</text><text x="1019" y="243" class="l">Service function</text><text x="1019" y="266" class="m">Name the routine (battery reg,</text><text x="1019" y="283" class="m">EPB, oil) and confirm it for your</text><text x="1019" y="300" class="m">car.</text><rect x="56" y="351" width="1168" height="54" rx="10" fill="#1b2f4a" stroke="#ff7f7f" stroke-width="2"/><text x="72" y="385" class="s" fill="#ff7f7f">Neither app replaces ISTA coding or programming. Confirm each function for your exact model and software before relying on it.</text><style>.h{font:700 34px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 19px Arial,sans-serif;fill:#bfd0dc}.l{font:600 16px Arial,sans-serif;fill:#fff}.m{font:400 14px Arial,sans-serif;fill:#bfd0dc}.b{font:700 15px Arial,sans-serif;fill:#0c1727}.t{font:700 15px Arial,sans-serif;fill:#65c8ff}</style></svg>