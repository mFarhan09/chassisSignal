<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ti de"><title id="ti">BimmerLink vs bimmer-tool: use-case matrix</title><desc id="de">Both are BMW diagnostic apps, not coding or programming tools; compare by platform and exact job.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="56" y="60" class="h">BimmerLink vs bimmer-tool: use-case matrix</text><text x="56" y="102" class="s">Both are BMW diagnostic apps, not coding or programming tools; compare by platform and exact job.</text><rect x="56" y="147" width="1168" height="40" fill="#1b2f4a"/><text x="70" y="174" class="t">Trait</text><text x="573" y="174" text-anchor="middle" class="t">BimmerLink</text><text x="1007" y="174" text-anchor="middle" class="t">bimmer-tool</text><rect x="56" y="187" width="1168" height="84" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="234" class="l">Platforms</text><text x="573" y="233" text-anchor="middle" class="m">iOS and Android</text><text x="1007" y="233" text-anchor="middle" class="m">Android (primary)</text><line x1="356" y1="147" x2="356" y2="271" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="271" stroke="#3a5578" stroke-width="1"/><rect x="56" y="270.8333333333333" width="1168" height="84" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="318" class="l">Adapter path</text><text x="573" y="317" text-anchor="middle" class="m">Curated BMW adapter list (e.g. OBDLink)</text><text x="1007" y="317" text-anchor="middle" class="m">ELM327; K+DCAN advised pre-2008</text><line x1="356" y1="147" x2="356" y2="355" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="355" stroke="#3a5578" stroke-width="1"/><rect x="56" y="354.66666666666663" width="1168" height="84" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="402" class="l">Core diagnostics</text><text x="573" y="401" text-anchor="middle" class="m">Fault codes + live-data graphing</text><text x="1007" y="401" text-anchor="middle" class="m">Fault codes + live data</text><line x1="356" y1="147" x2="356" y2="438" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="438" stroke="#3a5578" stroke-width="1"/><rect x="56" y="438.49999999999994" width="1168" height="84" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="485" class="l">Diesel / DPF</text><text x="573" y="484" text-anchor="middle" class="m">DPF status + start regeneration</text><text x="1007" y="484" text-anchor="middle" class="m">DPF regen + reset adaptation values</text><line x1="356" y1="147" x2="356" y2="522" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="522" stroke="#3a5578" stroke-width="1"/><rect x="56" y="522.3333333333333" width="1168" height="84" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="569" class="l">Service functions</text><text x="573" y="568" text-anchor="middle" class="m">Battery reg, EPB service, oil/brake resets</text><text x="1007" y="568" text-anchor="middle" class="m">Battery reg, oil-service reset</text><line x1="356" y1="147" x2="356" y2="606" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="606" stroke="#3a5578" stroke-width="1"/><rect x="56" y="606.1666666666666" width="1168" height="84" fill="none" stroke="#3a5578" stroke-width="1"/><text x="70" y="653" class="l">Coding / programming</text><text x="573" y="652" text-anchor="middle" class="m">None (diagnostics only)</text><text x="1007" y="652" text-anchor="middle" class="m">No ECU flash programming</text><line x1="356" y1="147" x2="356" y2="690" stroke="#3a5578" stroke-width="1"/><line x1="790" y1="147" x2="790" y2="690" stroke="#3a5578" stroke-width="1"/><style>.h{font:700 34px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 19px Arial,sans-serif;fill:#bfd0dc}.l{font:600 16px Arial,sans-serif;fill:#fff}.m{font:400 14px Arial,sans-serif;fill:#bfd0dc}.b{font:700 15px Arial,sans-serif;fill:#0c1727}.t{font:700 15px Arial,sans-serif;fill:#65c8ff}</style></svg>