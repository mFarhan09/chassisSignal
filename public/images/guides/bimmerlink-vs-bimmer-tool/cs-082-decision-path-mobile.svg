<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="ti de"><title id="ti">Choose by phone OS, then the exact job</title><desc id="de">Start with your phone and adapter, not a feature count; each stage narrows the right app.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="58" class="h">Choose by phone OS, then the exact job</text><text x="44" y="94" class="s">Start with your phone and adapter, not a feature count; each stage narrows the right</text><text x="44" y="115" class="s">app.</text><rect x="102" y="162" width="578" height="137" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="70" cy="231" r="20" fill="#65c8ff"/><text x="70" y="237" text-anchor="middle" class="b">1</text><line x1="70" y1="251" x2="70" y2="362" stroke="#65c8ff" stroke-width="3"/><text x="118" y="223" class="l">Phone OS</text><text x="118" y="245" class="m">iPhone rules out Android-only paths; confirm the app supports your OS.</text><rect x="102" y="313" width="578" height="137" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="70" cy="382" r="20" fill="#65c8ff"/><text x="70" y="388" text-anchor="middle" class="b">2</text><line x1="70" y1="402" x2="70" y2="513" stroke="#65c8ff" stroke-width="3"/><text x="118" y="374" class="l">Adapter</text><text x="118" y="396" class="m">Match the app's supported adapter; pre-2008 cars often prefer a K+DCAN cable.</text><rect x="102" y="464" width="578" height="137" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="70" cy="533" r="20" fill="#65c8ff"/><text x="70" y="539" text-anchor="middle" class="b">3</text><line x1="70" y1="553" x2="70" y2="664" stroke="#65c8ff" stroke-width="3"/><text x="118" y="525" class="l">Diagnostic job</text><text x="118" y="547" class="m">Codes and live data are covered by both; decide if graphing matters.</text><rect x="102" y="614" width="578" height="137" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="70" cy="684" r="20" fill="#65c8ff"/><text x="70" y="690" text-anchor="middle" class="b">4</text><line x1="70" y1="704" x2="70" y2="815" stroke="#65c8ff" stroke-width="3"/><text x="118" y="676" class="l">Diesel / DPF</text><text x="118" y="698" class="m">If DPF work is the goal, compare regeneration and adaptation-reset depth.</text><rect x="102" y="765" width="578" height="137" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="70" cy="835" r="20" fill="#65c8ff"/><text x="70" y="841" text-anchor="middle" class="b">5</text><text x="118" y="827" class="l">Service function</text><text x="118" y="849" class="m">Name the routine (battery reg, EPB, oil) and confirm it for your car.</text><rect x="40" y="910" width="640" height="52" rx="10" fill="#1b2f4a" stroke="#ff7f7f" stroke-width="2"/><text x="54" y="934" class="m" fill="#ff7f7f">Neither app replaces ISTA coding or programming. Confirm each function for your exact</text><text x="54" y="952" class="m" fill="#ff7f7f">model and software before relying on it.</text><style>.h{font:700 29px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 17px Arial,sans-serif;fill:#bfd0dc}.l{font:600 17px Arial,sans-serif;fill:#fff}.m{font:400 15px Arial,sans-serif;fill:#bfd0dc}.b{font:700 16px Arial,sans-serif;fill:#0c1727}.t{font:700 16px Arial,sans-serif;fill:#65c8ff}</style></svg>