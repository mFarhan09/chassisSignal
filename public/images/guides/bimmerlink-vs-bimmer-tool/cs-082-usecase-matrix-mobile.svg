<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="ti de"><title id="ti">BimmerLink vs bimmer-tool: use-case matrix</title><desc id="de">Both are BMW diagnostic apps, not coding or programming tools; compare by platform and exact job.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="58" class="h">BimmerLink vs bimmer-tool: use-case matrix</text><text x="44" y="94" class="s">Both are BMW diagnostic apps, not coding or programming tools; compare by</text><text x="44" y="115" class="s">platform and exact job.</text><rect x="40" y="156" width="640" height="120" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="186" class="l">Platforms</text><text x="56" y="210" class="m">BimmerLink: iOS and Android</text><text x="56" y="232" class="m">bimmer-tool: Android (primary)</text><rect x="40" y="288" width="640" height="120" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="318" class="l">Adapter path</text><text x="56" y="342" class="m">BimmerLink: Curated BMW adapter list (e.g. OBDLink)</text><text x="56" y="364" class="m">bimmer-tool: ELM327; K+DCAN advised pre-2008</text><rect x="40" y="421" width="640" height="120" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="451" class="l">Core diagnostics</text><text x="56" y="475" class="m">BimmerLink: Fault codes + live-data graphing</text><text x="56" y="497" class="m">bimmer-tool: Fault codes + live data</text><rect x="40" y="553" width="640" height="120" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="583" class="l">Diesel / DPF</text><text x="56" y="607" class="m">BimmerLink: DPF status + start regeneration</text><text x="56" y="629" class="m">bimmer-tool: DPF regen + reset adaptation values</text><rect x="40" y="685" width="640" height="120" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="715" class="l">Service functions</text><text x="56" y="739" class="m">BimmerLink: Battery reg, EPB service, oil/brake resets</text><text x="56" y="761" class="m">bimmer-tool: Battery reg, oil-service reset</text><rect x="40" y="818" width="640" height="120" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="848" class="l">Coding / programming</text><text x="56" y="872" class="m">BimmerLink: None (diagnostics only)</text><text x="56" y="894" class="m">bimmer-tool: No ECU flash programming</text><style>.h{font:700 29px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 17px Arial,sans-serif;fill:#bfd0dc}.l{font:600 17px Arial,sans-serif;fill:#fff}.m{font:400 15px Arial,sans-serif;fill:#bfd0dc}.b{font:700 16px Arial,sans-serif;fill:#0c1727}.t{font:700 16px Arial,sans-serif;fill:#65c8ff}</style></svg>