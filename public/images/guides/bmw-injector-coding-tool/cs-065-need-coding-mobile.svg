<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Do I need injector code entry?</title><desc id="desc">The decision begins with exact engine instructions and the replacement injector data, not a scanner menu. Labels: Exact engine?, Replacement data?, Procedure requires entry?, Verify tool.</desc><rect width="720" height="980" fill="#07111f"/><rect width="720" height="18" fill="#22c55e"/><text x="46" y="78" class="heading">Do I need injector code entry?</text><text x="46" y="140" class="sub">The decision begins with exact engine instructions and the replacement injector data, not a scanner menu.</text><text x="666" y="194" text-anchor="end" class="type">DECISION DIAMOND</text><g><rect x="60" y="245" width="600" height="88" rx="21" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="84" y="277" class="num">01</text><text x="142" y="297" text-anchor="start" class="label">Exact engine?</text><path d="M360 333 V357" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="357" width="600" height="88" rx="21" fill="#22c55e" stroke="#22c55e" stroke-width="0"/><text x="84" y="389" class="num">02</text><text x="142" y="409" text-anchor="start" class="label">Replacement data?</text><path d="M360 445 V469" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="469" width="600" height="88" rx="21" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="84" y="501" class="num">03</text><text x="142" y="521" text-anchor="start" class="label">Procedure requires entry?</text><path d="M360 557 V581" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="581" width="600" height="88" rx="21" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="84" y="613" class="num">04</text><text x="142" y="633" text-anchor="start" class="label">Verify tool</text></g><circle cx="30" cy="955" r="3" fill="#22c55e" op