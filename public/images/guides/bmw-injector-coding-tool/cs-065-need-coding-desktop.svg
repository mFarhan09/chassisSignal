<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Do I need injector code entry?</title><desc id="desc">The decision begins with exact engine instructions and the replacement injector data, not a scanner menu. Labels: Exact engine?, Replacement data?, Procedure requires entry?, Verify tool.</desc><rect width="1280" height="720" fill="#07111f"/><rect width="1280" height="18" fill="#22c55e"/><text x="58" y="76" class="heading">Do I need injector code entry?</text><text x="58" y="130" class="sub">The decision begins with exact engine instructions and the replacement injector data, not a scanner menu.</text><text x="1226" y="174" text-anchor="end" class="type">DECISION DIAMOND</text><g><rect x="50" y="235" width="278" height="210" rx="21" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="74" y="267" class="num">01</text><text x="189" y="355" text-anchor="middle" class="label">Exact engine?</text><path d="M328 340 H350" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="350" y="290" width="278" height="210" rx="21" fill="#22c55e" stroke="#22c55e" stroke-width="0"/><text x="374" y="322" class="num">02</text><text x="489" y="410" text-anchor="middle" class="label">Replacement data?</text><path d="M628 395 H650" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="650" y="235" width="278" height="210" rx="21" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="674" y="267" class="num">03</text><text x="789" y="355" text-anchor="middle" class="label">Procedure requires entry?</text><path d="M928 340 H950" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="950" y="290" width="278" height="210" rx="21" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="974" y="322" class="num">04</text><text x="1089" y="410" text-anchor="middle" class="label">Verify tool</text></g><circle cx="30" cy="695" r="