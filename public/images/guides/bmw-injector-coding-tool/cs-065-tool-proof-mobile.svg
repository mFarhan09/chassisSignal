<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">A badge is not a coverage record</title><desc id="desc">Injector function, engine, module, code type, software version, and tool SKU must all match. Labels: Function, Engine, Module, Code type, Tool, Version.</desc><rect width="720" height="980" fill="#07111f"/><rect width="720" height="18" fill="#22c55e"/><text x="46" y="78" class="heading">A badge is not a coverage record</text><text x="46" y="140" class="sub">Injector function, engine, module, code type, software version, and tool SKU must all match.</text><text x="666" y="194" text-anchor="end" class="type">VERIFICATION LOOP</text><g><rect x="60" y="245" width="600" height="88" rx="27" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="84" y="277" class="num">01</text><text x="142" y="297" text-anchor="start" class="label">Function</text><path d="M360 333 V357" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="357" width="600" height="88" rx="27" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="84" y="389" class="num">02</text><text x="142" y="409" text-anchor="start" class="label">Engine</text><path d="M360 445 V469" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="469" width="600" height="88" rx="27" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="84" y="501" class="num">03</text><text x="142" y="521" text-anchor="start" class="label">Module</text><path d="M360 557 V581" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="581" width="600" height="88" rx="27" fill="#22c55e" stroke="#22c55e" stroke-width="0"/><text x="84" y="613" class="num">04</text><text x="142" y="633" text-anchor="start" class="label">Code type</text><path d="M360 669 V693" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="693" width="600" height="88" rx="27" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="84" y="725" class="num">05</text><text x="142" y="745" text-anchor="start" class="label">Tool</text><path d="M360 781 V805" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="805" width="600" height="88" rx="27" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="84" y="837" class="num">06</text><text x="142" y="857" text-anchor="start" class="label">Version</text></g><circle cx="30" cy="955" r="3" fill="#22c55e" opacity=".28"/><circle cx="50" cy="955" r="3" fill="#22c55e" opacity=".28"/><circle cx="70" cy="955" r="3" fill="#22c55e" opacity=".28"/><circle cx="90" cy="955" r="3" fill="#22c55e" opacity=".28"/><circle cx="110" cy="955" r="3" fill="#22c55e" opacity=".28"/><circle cx="130" cy="955" r="3" fill="#22c55e" opacity=".28"/><circle cx="150" cy="955" r="3" fill="#22c55e" opacity=".28"/><circle cx="170" cy="955" r="3" fill="#22c55e" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#cbd5e1}.type{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#22c55e}.label{font:600 18px Arial,sans-serif;fill:#fff}.num{font:700 12px Arial,sans-serif;fill:#07111f}</style></svg>