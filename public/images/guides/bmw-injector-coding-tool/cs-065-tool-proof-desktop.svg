<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">A badge is not a coverage record</title><desc id="desc">Injector function, engine, module, code type, software version, and tool SKU must all match. Labels: Function, Engine, Module, Code type, Tool, Version.</desc><rect width="1280" height="720" fill="#07111f"/><rect width="1280" height="18" fill="#22c55e"/><text x="58" y="76" class="heading">A badge is not a coverage record</text><text x="58" y="130" class="sub">Injector function, engine, module, code type, software version, and tool SKU must all match.</text><text x="1226" y="174" text-anchor="end" class="type">VERIFICATION LOOP</text><g><rect x="50" y="235" width="178" height="210" rx="27" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="74" y="267" class="num">01</text><text x="139" y="355" text-anchor="middle" class="label">Function</text><path d="M228 340 H250" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="250" y="290" width="178" height="210" rx="27" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="274" y="322" class="num">02</text><text x="339" y="410" text-anchor="middle" class="label">Engine</text><path d="M428 395 H450" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="450" y="235" width="178" height="210" rx="27" fill="#1e293b" stroke="#22c55e" stroke-width="3"/><text x="474" y="267" class="num">03</text><text x="539" y="355" text-anchor="middle" class="label">Module</text><path d="M628 340 H650" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="650" y="290" width="178" height="210" rx="27" fill="#22c55e" stroke="#22c55e" stroke-width="0"/><text x="674" y="322" class="num">04</text><text x="739" y="410" text-anchor="middle" class="label">Code type</text><path d="M828 395 H850" stroke="#22c55e" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="850" y="235" wi