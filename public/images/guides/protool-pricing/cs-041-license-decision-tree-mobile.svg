<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="t d"><title id="t">CS-041 license decision tree</title><desc id="d">Article-specific diagram for protool pricing</desc><rect width="100%" height="100%" fill="#101b32"/><text x="50" y="80" class="eye">CS-041 / DECISION EVIDENCE</text><text x="50" y="145" class="head">LICENSE DECISION TREE</text><text x="50" y="190" class="sub">Buy only the scope and interface the job needs</text><path d="M360 260 V 820" stroke="#4472ca" stroke-width="16"/><circle cx="360" cy="270" r="34" fill="#efc14f"/><text x="50" y="340"  class="label">Diagnostics only</text><circle cx="360" cy="405" r="34" fill="#efc14f"/><text x="50" y="475"  class="label">Coding only</text><circle cx="360" cy="540" r="34" fill="#efc14f"/><text x="50" y="610"  class="label">Both scopes</text><circle cx="360" cy="675" r="34" fill="#efc14f"/><text x="50" y="745"  class="label">Interface match</text><circle cx="360" cy="810" r="34" fill="#efc14f"/><text x="50" y="880"  class="label">Cart verification</text><style>.head{font:700 30px Arial;fill:#fff}.eye{font:700 18px Arial;fill:#efc14f}.sub{font:400 18px Arial;fill:#c9d5dc}.label{font:700 18px Arial;fill:#fff}.num{font:700 19px Arial;fill:#101b32}</style></svg>