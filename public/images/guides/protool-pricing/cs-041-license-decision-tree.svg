<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">CS-041 license decision tree</title><desc id="d">Article-specific diagram for protool pricing</desc><rect width="100%" height="100%" fill="#101b32"/><text x="70" y="80" class="eye">CS-041 / DECISION EVIDENCE</text><text x="70" y="145" class="head">LICENSE DECISION TREE</text><text x="70" y="190" class="sub">Buy only the scope and interface the job needs</text><path d="M190 260 H 1090" stroke="#4472ca" stroke-width="16"/><circle cx="190" cy="260" r="34" fill="#efc14f"/><text x="190" y="340" text-anchor="middle" class="label">Diagnostics only</text><circle cx="415" cy="260" r="34" fill="#efc14f"/><text x="415" y="340" text-anchor="middle" class="label">Coding only</text><circle cx="640" cy="260" r="34" fill="#efc14f"/><text x="640" y="340" text-anchor="middle" class="label">Both scopes</text><circle cx="865" cy="260" r="34" fill="#efc14f"/><text x="865" y="340" text-anchor="middle" class="label">Interface match</text><circle cx="1090" cy="260" r="34" fill="#efc14f"/><text x="1090" y="340" text-anchor="middle" class="label">Cart verification</text><style>.head{font:700 38px Arial;fill:#fff}.eye{font:700 18px Arial;fill:#efc14f}.sub{font:400 20px Arial;fill:#c9d5dc}.label{font:700 19px Arial;fill:#fff}.num{font:700 19px Arial;fill:#101b32}</style></svg>