<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Scanner Access Depth Ladder</title><desc id="desc">Access hierarchy contrasting generic emissions scan tools with BMW module-level diagnosis and live service routines.</desc><rect width="100%" height="100%" fill="#151f35"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f3c34f">DIAGNOSTIC CAPABILITY TIERS</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#fff">SCANNER ACCESS DEPTH</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="17" fill="#edf3ff">Generic OBD access is not BMW module access</text><line x1="115" y1="250" x2="115" y2="820" stroke="#edf3ff" stroke-width="12" /><line x1="605" y1="250" x2="605" y2="820" stroke="#edf3ff" stroke-width="12" /><line x1="115" y1="730" x2="605" y2="730" stroke="#65a8ff" stroke-width="18" /><text x="360" y="712" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff"><tspan x="360" dy="0">Generic emissions</tspan></text><line x1="115" y1="625" x2="605" y2="625" stroke="#f3c34f" stroke-width="18" /><text x="360" y="607" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff"><tspan x="360" dy="0">BMW module scan</tspan></text><line x1="115" y1="520" x2="605" y2="520" stroke="#65a8ff" stroke-width="18" /><text x="360" y="502" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff"><tspan x="360" dy="0">Module live data</tspan></text><line x1="115" y1="415" x2="605" y2="415" stroke="#f3c34f" stroke-width="18" /><text x="360" y="397" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff"><tspan x="360" dy="0">Named service routine</tspan></text><line x1="115" y1="310" x2="605" y2="310" stroke="#65a8ff" stroke-width="18" /><text x="360" y="292" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff"><tspan x="360" dy="0">Active command</tspan></text></svg>