<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Safe Diagnostic Stop Tree</title><desc id="desc">Safety protocol requiring code preservation before clearing and prohibiting physical probing of restraint circuits.</desc><rect width="100%" height="100%" fill="#151f35"/><text x="68" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f3c34f">SAFETY AND PROTOCOL BOUNDARIES</text><text x="68" y="112" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">SAFE STOP TREE</text><text x="68" y="158" font-family="Arial, sans-serif" font-size="19" fill="#edf3ff">Record fault details before clearing codes and avoid unauthorized wiring probes</text><polygon points="220,230 350,285 350,455 220,510 90,455 90,285" fill="#f3c34f" /><text x="220" y="365" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#151f35"><tspan x="220" dy="0">STOP</tspan></text><path d="M350 370 H515" stroke="#edf3ff" stroke-width="8" fill="none" /><rect x="515" y="285" width="135" height="100" rx="18" fill="#f3c34f" /><text x="582" y="322" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="582" dy="0">Read before</tspan><tspan x="582" dy="22">clear</tspan></text><path d="M650 335 H675" stroke="#edf3ff" stroke-width="5" fill="none" /><rect x="675" y="455" width="135" height="100" rx="18" fill="#65a8ff" /><text x="742" y="492" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="742" dy="0">Save full</tspan><tspan x="742" dy="22">report</tspan></text><path d="M810 505 H835" stroke="#edf3ff" stroke-width="5" fill="none" /><rect x="835" y="285" width="135" height="100" rx="18" fill="#f3c34f" /><text x="902" y="322" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="902" dy="0">Do not probe</tspan><tspan x="902" dy="22">inflators</tspan></text><path d="M970 335 H995" stroke="#edf3ff" stroke-width="5" fill="none" /><rect x="995" y="455" width="135" height="100" rx="18" fill="#65a8ff" /><text x="1062" y="492" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff"><tspan x="1062" dy="0">Follow</tspan><tspan x="1062" dy="22">service data</tspan></text></svg>