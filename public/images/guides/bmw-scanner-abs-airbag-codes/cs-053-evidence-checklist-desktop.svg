<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Coverage Evidence Checklist</title><desc id="desc">Verification checklist detailing exact BMW chassis codes, model years, ABS/DSC hydraulic units, and restraint module coverage.</desc><rect width="100%" height="100%" fill="#151f35"/><text x="68" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f3c34f">PRE-PURCHASE QUALIFICATION</text><text x="68" y="112" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">COVERAGE EVIDENCE CHECKLIST</text><text x="68" y="158" font-family="Arial, sans-serif" font-size="19" fill="#edf3ff">Verify documented chassis and safety module coverage before purchasing</text><path d="M180 250 H1000 L1140 390 V600 H180 Z" stroke="#edf3ff" stroke-width="0" fill="#edf3ff" /><polygon points="1000,250 1140,390 1000,390" fill="#65a8ff" /><circle cx="260" cy="340" r="22" fill="#65a8ff" /><path d="M250 340 l9 10 18 -23" stroke="#151f35" stroke-width="5" fill="none" /><text x="305" y="334" text-anchor="start" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#151f35"><tspan x="305" dy="0">Exact chassis</tspan></text><circle cx="690" cy="340" r="22" fill="#65a8ff" /><path d="M250 340 l9 10 18 -23" stroke="#151f35" stroke-width="5" fill="none" /><text x="735" y="334" text-anchor="start" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#151f35"><tspan x="735" dy="0">Build year</tspan></text><circle cx="260" cy="445" r="22" fill="#65a8ff" /><path d="M250 445 l9 10 18 -23" stroke="#151f35" stroke-width="5" fill="none" /><text x="305" y="439" text-anchor="start" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#151f35"><tspan x="305" dy="0">ABS/DSC named</tspan></text><circle cx="690" cy="445" r="22" fill="#65a8ff" /><path d="M250 44