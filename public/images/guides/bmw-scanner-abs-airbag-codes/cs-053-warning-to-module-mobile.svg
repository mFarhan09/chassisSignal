<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Warning to Control Module Path</title><desc id="desc">Diagnostic workflow tracing dashboard warning lamps to dedicated ABS/DSC and restraint control modules.</desc><rect width="100%" height="100%" fill="#151f35"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f3c34f">DIAGNOSTIC RESOLUTION PATH</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#fff">WARNING TO MODULE PATH</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="17" fill="#edf3ff">Trace dashboard warning lights directly to their underlying BMW control units</text><polygon points="360,220 470,330 360,440 250,330" fill="#f3c34f" /><path d="M360 440 V515" stroke="#edf3ff" stroke-width="7" fill="none" /><rect x="80" y="520" width="245" height="120" rx="18" fill="none" stroke="#65a8ff" stroke-width="7"/><rect x="395" y="520" width="245" height="120" rx="18" fill="none" stroke="#f3c34f" stroke-width="7"/><path d="M202 640 V705 H360" stroke="#65a8ff" stroke-width="6" fill="none" /><path d="M518 640 V705 H360" stroke="#f3c34f" stroke-width="6" fill="none" /><rect x="175" y="705" width="370" height="105" rx="20" fill="#edf3ff" /><text x="360" y="325" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#151f35"><tspan x="360" dy="0">Warning lamp</tspan></text><text x="202" y="565" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="202" dy="0">ABS or restraint</tspan><tspan x="202" dy="22">ECU</tspan></text><text x="518" y="565" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="518" dy="0">Stored code</tspan><tspan x="518" dy="22">detail</tspan></text><text x="360" y="745" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#151f35"><tspan x="360" dy="0">Repair evidence</tspan></text></svg>