<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Safe Diagnostic Stop Tree</title><desc id="desc">Safety protocol requiring code preservation before clearing and prohibiting physical probing of restraint circuits.</desc><rect width="100%" height="100%" fill="#151f35"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f3c34f">SAFETY AND PROTOCOL BOUNDARIES</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#fff">SAFE STOP TREE</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="17" fill="#edf3ff">Record fault details before clearing codes and avoid unauthorized wiring probes</text><rect x="255" y="220" width="210" height="390" rx="60" fill="#151f35" stroke="#edf3ff" stroke-width="8"/><circle cx="360" cy="310" r="58" fill="#f3c34f" /><circle cx="360" cy="420" r="58" fill="#e3ca4c" /><circle cx="360" cy="530" r="58" fill="#65a8ff" /><path d="M360 610 V690 H170" stroke="#edf3ff" stroke-width="7" fill="none" /><path d="M360 690 H550" stroke="#edf3ff" stroke-width="7" fill="none" /><polygon points="145,690 180,670 180,710" fill="#edf3ff" /><polygon points="575,690 540,670 540,710" fill="#edf3ff" /><text x="170" y="748" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="170" dy="0">Read before</tspan><tspan x="170" dy="22">clear</tspan></text><text x="550" y="748" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="550" dy="0">Escalate</tspan><tspan x="550" dy="22">ambiguity</tspan></text></svg>