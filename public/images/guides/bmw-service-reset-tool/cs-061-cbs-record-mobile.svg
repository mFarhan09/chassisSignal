<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">CBS record lifecycle</title><desc id="desc">Condition estimate, Service becomes due, Physical work performed, Counter reset, New interval checked.</desc><rect width="720" height="980" fill="#0b1220"/><path d="M0 0H720V18H0Z" fill="#fb7185"/><text x="48" y="85" class="heading">CBS record lifecycle</text><text x="48" y="142" class="sub">BMW service reset tool</text><path d="M80 240h560l-28 50l28 50h-560Z" fill="#1e293b"/><text x="360" y="297" text-anchor="middle" class="small">Condition estimate</text><path d="M80 370h560l-28 50l28 50h-560Z" fill="#1e293b"/><text x="360" y="427" text-anchor="middle" class="small">Service becomes due</text><path d="M80 500h560l-28 50l28 50h-560Z" fill="#1e293b"/><text x="360" y="557" text-anchor="middle" class="small">Physical work performed</text><path d="M80 630h560l-28 50l28 50h-560Z" fill="#1e293b"/><text x="360" y="687" text-anchor="middle" class="small">Counter reset</text><path d="M80 760h560l-28 50l28 50h-560Z" fill="#fb7185"/><text x="360" y="817" text-anchor="middle" class="small">New interval checked</text><circle cx="30" cy="952" r="3" fill="#fb7185" opacity=".25"/><circle cx="52" cy="952" r="3" fill="#fb7185" opacity=".25"/><circle cx="74" cy="952" r="3" fill="#fb7185" opacity=".25"/><circle cx="96" cy="952" r="3" fill="#fb7185" opacity=".25"/><circle cx="118" cy="952" r="3" fill="#fb7185" opacity=".25"/><circle cx="140" cy="952" r="3" fill="#fb7185" opacity=".25"/><circle cx="162" cy="952" r="3" fill="#fb7185" opacity=".25"/><style>.heading{font:700 31px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#cbd5e1}.label{font:600 20px Arial,sans-serif;fill:#fff}.small{font:600 18px Arial,sans-serif;fill:#fff}.core{font:700 19px Arial,sans-serif;fill:#0b1220}</style></svg>