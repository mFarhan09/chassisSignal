<svg xmlns="http://www.w3.org/2000/svg" width="420" height="889" viewBox="0 0 420 889" role="img" aria-labelledby="title desc"><title id="title">A MINI app is not one capability</title><desc id="desc">Diagnosis, service functions and coding have different evidence requirements.</desc><rect width="420" height="889" rx="24" fill="#f8fafc"/><rect width="420" height="14" fill="#c2410c"/><text x="28" y="62" font-size="24" font-weight="800" fill="#35180d">A MINI app is not one</text><text x="28" y="93" font-size="24" font-weight="800" fill="#35180d">capability</text><text x="28" y="135" font-size="14" fill="#475569">Diagnosis, service functions and coding</text><text x="28" y="157" font-size="14" fill="#475569">have different evidence requirements.</text><rect x="30" y="225" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="261" font-size="17" font-weight="700" fill="#35180d">Diagnostics</text><text x="50" y="293" font-size="14" fill="#475569">Read supported modules, codes and live</text><text x="50" y="316" font-size="14" fill="#475569">data where the app lists them.</text><rect x="30" y="385" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="421" font-size="17" font-weight="700" fill="#35180d">Service functions</text><text x="50" y="453" font-size="14" fill="#475569">Verify each named procedure for the exact</text><text x="50" y="476" font-size="14" fill="#475569">vehicle.</text><rect x="30" y="545" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="581" font-size="17" font-weight="700" fill="#35180d">Coding</text><text x="50" y="613" font-size="14" fill="#475569">Customization is separate from ordinary</text><text x="50" y="636" font-size="14" fill="#475569">diagnosis.</text><rect x="30" y="705" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="741" font-size="17" font-weight="700" fill="#35180d">Adapter/platform</text><text x="50" y="773" font-size="14" fill="#475569">Vehicle, OBD interface and iOS/Android all</text><text x="50" y="796" font-size="14" fill="#475569">participate.</text><text x="28" y="869" font-size="13" fill="#64748b">Chassis Signal - documentation-first editorial synthesis</text></svg>