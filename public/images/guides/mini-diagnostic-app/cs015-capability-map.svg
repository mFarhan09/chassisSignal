<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="538" viewBox="0 0 1100 538" role="img" aria-labelledby="title desc"><title id="title">A MINI app is not one capability</title><desc id="desc">Diagnosis, service functions and coding have different evidence requirements.</desc><rect width="1100" height="538" rx="24" fill="#f8fafc"/><rect width="1100" height="14" fill="#c2410c"/><text x="44" y="62" font-size="34" font-weight="800" fill="#35180d">A MINI app is not one capability</text><text x="44" y="104" font-size="18" fill="#475569">Diagnosis, service functions and coding have different evidence</text><text x="44" y="126" font-size="18" fill="#475569">requirements.</text><rect x="50" y="194" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="230" font-size="20" font-weight="700" fill="#35180d">Diagnostics</text><text x="70" y="262" font-size="16" fill="#475569">Read supported modules, codes and live data where</text><text x="70" y="285" font-size="16" fill="#475569">the app lists them.</text><rect x="560" y="194" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="230" font-size="20" font-weight="700" fill="#35180d">Service functions</text><text x="580" y="262" font-size="16" fill="#475569">Verify each named procedure for the exact vehicle.</text><rect x="50" y="354" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="390" font-size="20" font-weight="700" fill="#35180d">Coding</text><text x="70" y="422" font-size="16" fill="#475569">Customization is separate from ordinary diagnosis.</text><rect x="560" y="354" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="390" font-size="20" font-weight="700" fill="#35180d">Adapter/platform</text><text x="580" y="422" font-size="16" fill="#475569">Vehicle, OBD interface and iOS/Android all</text><text x="580" y="445" font-size="16" fill="#475569">participate.</text><text x="44" y="518" font-size="13" fill="#64748b">Chassis Signal - documentation-first editorial synthesis</text></svg>