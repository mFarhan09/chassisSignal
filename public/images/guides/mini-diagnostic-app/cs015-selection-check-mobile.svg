<svg xmlns="http://www.w3.org/2000/svg" width="420" height="889" viewBox="0 0 420 889" role="img" aria-labelledby="title desc"><title id="title">MINI diagnostic-app selection check</title><desc id="desc">Use the vendor vehicle lookup before buying a license or adapter.</desc><rect width="420" height="889" rx="24" fill="#f8fafc"/><rect width="420" height="14" fill="#c2410c"/><text x="28" y="62" font-size="24" font-weight="800" fill="#35180d">MINI diagnostic-app</text><text x="28" y="93" font-size="24" font-weight="800" fill="#35180d">selection check</text><text x="28" y="135" font-size="14" fill="#475569">Use the vendor vehicle lookup before buying</text><text x="28" y="157" font-size="14" fill="#475569">a license or adapter.</text><rect x="30" y="225" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="261" font-size="17" font-weight="700" fill="#35180d">Define the job</text><text x="50" y="293" font-size="14" fill="#475569">Warning light, live data, maintenance</text><text x="50" y="316" font-size="14" fill="#475569">function or coding?</text><rect x="30" y="385" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="421" font-size="17" font-weight="700" fill="#35180d">Identify MINI</text><text x="50" y="453" font-size="14" fill="#475569">Model, generation, year and equipment can</text><text x="50" y="476" font-size="14" fill="#475569">change support.</text><rect x="30" y="545" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="581" font-size="17" font-weight="700" fill="#35180d">Check app table</text><text x="50" y="613" font-size="14" fill="#475569">Confirm exact vehicle, feature and</text><text x="50" y="636" font-size="14" fill="#475569">supported adapter.</text><rect x="30" y="705" width="360" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="741" font-size="17" font-weight="700" fill="#35180d">Confirm platform</text><text x="50" y="773" font-size="14" fill="#475569">Phone OS, connection method and</text><text x="50" y="796" font-size="14" fill="#475569">subscription/one-time terms.</text><text x="28" y="869" font-size="13" fill="#64748b">Chassis Signal - documentation-first editorial synthesis</text></svg>