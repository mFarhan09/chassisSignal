<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="516" viewBox="0 0 1100 516" role="img" aria-labelledby="title desc"><title id="title">MINI diagnostic-app selection check</title><desc id="desc">Use the vendor vehicle lookup before buying a license or adapter.</desc><rect width="1100" height="516" rx="24" fill="#f8fafc"/><rect width="1100" height="14" fill="#c2410c"/><text x="44" y="62" font-size="34" font-weight="800" fill="#35180d">MINI diagnostic-app selection check</text><text x="44" y="104" font-size="18" fill="#475569">Use the vendor vehicle lookup before buying a license or adapter.</text><rect x="50" y="172" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="208" font-size="20" font-weight="700" fill="#35180d">Define the job</text><text x="70" y="240" font-size="16" fill="#475569">Warning light, live data, maintenance function or</text><text x="70" y="263" font-size="16" fill="#475569">coding?</text><rect x="560" y="172" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="208" font-size="20" font-weight="700" fill="#35180d">Identify MINI</text><text x="580" y="240" font-size="16" fill="#475569">Model, generation, year and equipment can change</text><text x="580" y="263" font-size="16" fill="#475569">support.</text><rect x="50" y="332" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="70" y="368" font-size="20" font-weight="700" fill="#35180d">Check app table</text><text x="70" y="400" font-size="16" fill="#475569">Confirm exact vehicle, feature and supported</text><text x="70" y="423" font-size="16" fill="#475569">adapter.</text><rect x="560" y="332" width="490" height="142" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="580" y="368" font-size="20" font-weight="700" fill="#35180d">Confirm platform</text><text x="580" y="400" font-size="16" fill="#475569">Phone OS, connection method and</text><text x="580" y="423" font-size="16" fill="#475569">subscription/one-time terms.</text><text x="44" y="496" font-size="13" fill="#64748b">Chassis Signal - documentation-first editorial synthesis</text></svg>