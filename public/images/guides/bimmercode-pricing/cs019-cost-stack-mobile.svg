<svg xmlns="http://www.w3.org/2000/svg" width="420" height="937" viewBox="0 0 420 937" role="img" aria-labelledby="title desc"><title id="title">BimmerCode ownership-cost stack</title><desc id="desc">The app-store purchase is only one required layer.</desc><rect width="420" height="937" rx="24" fill="#f8fafc"/><rect width="420" height="14" fill="#c2410c"/><text x="28" y="62" font-size="24" font-weight="800" fill="#35180d">BimmerCode ownership-cost</text><text x="28" y="93" font-size="24" font-weight="800" fill="#35180d">stack</text><text x="28" y="135" font-size="14" fill="#475569">The app-store purchase is only one required</text><text x="28" y="157" font-size="14" fill="#475569">layer.</text><rect x="30" y="225" width="360" height="154" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="261" font-size="17" font-weight="700" fill="#35180d">Full Version</text><text x="50" y="293" font-size="14" fill="#475569">Verify current price in the selected</text><text x="50" y="316" font-size="14" fill="#475569">regional storefront.</text><rect x="30" y="397" width="360" height="154" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="433" font-size="17" font-weight="700" fill="#35180d">Platform license</text><text x="50" y="465" font-size="14" fill="#475569">iOS, Android and desktop purchases do not</text><text x="50" y="488" font-size="14" fill="#475569">transfer.</text><rect x="30" y="569" width="360" height="154" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="605" font-size="17" font-weight="700" fill="#35180d">OBD hardware</text><text x="50" y="637" font-size="14" fill="#475569">Buy only an adapter listed for the exact</text><text x="50" y="660" font-size="14" fill="#475569">vehicle/platform.</text><rect x="30" y="741" width="360" height="154" rx="18" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="50" y="777" font-size="17" font-weight="700" fill="#35180d">Compatibility</text><text x="50" y="809" font-size="14" fill="#475569">Confirm the car and desired coding options</text><text x="50" y="832" font-size="14" fill="#475569">before purchase.</text><text x="28" y="917" font-size="13" fill="#64748b">Chassis Signal - documentation-first editorial synthesis</text></svg>