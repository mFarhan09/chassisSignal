<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="t d"><title id="t">CS-038 transport topology</title><desc id="d">Article-specific diagram for obdlink ex vs enet cable</desc><rect width="100%" height="100%" fill="#1c132e"/><text x="50" y="80" class="eye">CS-038 / DECISION EVIDENCE</text><text x="50" y="145" class="head">TRANSPORT TOPOLOGY</text><text x="50" y="190" class="sub">USB OBD and Ethernet use different paths</text><rect x="50" y="270" width="210" height="210" rx="90" fill="none" stroke="#aa6bd8" stroke-width="12"/><text x="155" y="375" text-anchor="middle" class="label">USB host</text><rect x="295" y="270" width="210" height="210" rx="22" fill="none" stroke="#66d9c2" stroke-width="12"/><text x="400" y="375" text-anchor="middle" class="label">OBDLink EX</text><rect x="50" y="500" width="210" height="210" rx="90" fill="none" stroke="#aa6bd8" stroke-width="12"/><text x="155" y="605" text-anchor="middle" class="label">Vehicle bus</text><rect x="295" y="500" width="210" height="210" rx="22" fill="none" stroke="#66d9c2" stroke-width="12"/><text x="400" y="605" text-anchor="middle" class="label">Ethernet host</text><rect x="50" y="730" width="210" height="210" rx="90" fill="none" stroke="#aa6bd8" stroke-width="12"/><text x="155" y="835" text-anchor="middle" class="label">ENET path</text><style>.head{font:700 30px Arial;fill:#fff}.eye{font:700 18px Arial;fill:#66d9c2}.sub{font:400 18px Arial;fill:#c9d5dc}.label{font:700 18px Arial;fill:#fff}.num{font:700 19px Arial;fill:#1c132e}</style></svg>