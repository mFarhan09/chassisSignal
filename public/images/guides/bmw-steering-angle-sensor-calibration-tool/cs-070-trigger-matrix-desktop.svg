<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Service trigger before calibration</title><desc id="desc">A matrix separates complaints, service events, evidence and disposition. Warning only; Alignment event; Steering repair; Sensor/module work; Fault-plan request.</desc><rect width="1280" height="720" fill="#181426"/><rect width="1280" height="16" fill="#c5a3ff"/><text x="64" y="68" class="heading">Service trigger before calibration</text><text x="64" y="114" class="sub">A matrix separates complaints, service events, evidence and disposition.</text><path d="M125 230H1155L1121 290H159Z" fill="#3e315c" stroke="#c5a3ff" stroke-width="3"/><text x="640" y="268" text-anchor="middle" class="label"><tspan x="640" dy="0">Warning only</tspan></text><path d="M182.5 310H1097.5L1063.5 370H216.5Z" fill="#3e315c" stroke="#c5a3ff" stroke-width="3"/><text x="640" y="348" text-anchor="middle" class="label"><tspan x="640" dy="0">Alignment event</tspan></text><path d="M240 390H1040L1006 450H274Z" fill="#3e315c" stroke="#c5a3ff" stroke-width="3"/><text x="640" y="428" text-anchor="middle" class="label"><tspan x="640" dy="0">Steering repair</tspan></text><path d="M297.5 470H982.5L948.5 530H331.5Z" fill="#3e315c" stroke="#c5a3ff" stroke-width="3"/><text x="640" y="508" text-anchor="middle" class="label"><tspan x="640" dy="0">Sensor/module work</tspan></text><path d="M355 550H925L891 610H389Z" fill="#78e3d2" stroke="#c5a3ff" stroke-width="3"/><text x="640" y="588" text-anchor="middle" class="label"><tspan x="640" dy="0">Fault-plan request</tspan></text><circle cx="24" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="40" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="56" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="72" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="88" cy="698" r="2" fill="#78e3d2" opacity=".28"/><circle cx="104" cy="698" r="2" fill="#