ke="#78e3d2" stroke-width="3"/><circle cx="115" cy="792" r="21" fill="#78e3d2"/><text x="365" y="800" text-anchor="middle" class="label"><tspan x="365" dy="0">Fault-plan request</tspan></text><circle cx="24" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="40" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="56" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="72" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="88" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="104" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="120" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="136" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="152" cy="958" r="2" fill="#78e3d2" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#bfd0dc}.label{font:600 19px Arial,sans-serif;fill:#fff}</style></svg>