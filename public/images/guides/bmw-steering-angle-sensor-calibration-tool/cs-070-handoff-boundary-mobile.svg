<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Know where tool selection ends</title><desc id="desc">Safety, failed routines and unresolved alignment conditions trigger professional handoff. Green: qualified function; Amber: evidence incomplete; Red: safety or procedure unknown.</desc><rect width="720" height="980" fill="#15151d"/><rect width="720" height="16" fill="#f8c15c"/><text x="44" y="70" class="heading">Know where tool selection ends</text><text x="44" y="122" class="sub">Safety, failed routines and unresolved alignment conditions trigger professional handoff.</text><rect x="80" y="210" width="560" height="84" rx="18" fill="#353446" stroke="#f8c15c" stroke-width="3"/><circle cx="115" cy="252" r="21" fill="#f8c15c"/><text x="365" y="248" text-anchor="middle" class="label"><tspan x="365" dy="0">Green: qualified</tspan><tspan x="365" dy="24">function</tspan></text><path d="M115 273V366" stroke="#698397" stroke-width="5"/><rect x="80" y="345" width="560" height="84" rx="18" fill="#353446" stroke="#f8c15c" stroke-width="3"/><circle cx="115" cy="387" r="21" fill="#f8c15c"/><text x="365" y="383" text-anchor="middle" class="label"><tspan x="365" dy="0">Amber: evidence</tspan><tspan x="365" dy="24">incomplete</tspan></text><path d="M115 408V501" stroke="#698397" stroke-width="5"/><rect x="80" y="480" width="560" height="84" rx="18" fill="#353446" stroke="#8ec5ff" stroke-width="3"/><circle cx="115" cy="522" r="21" fill="#8ec5ff"/><text x="365" y="518" text-anchor="middle" class="label"><tspan x="365" dy="0">Red: safety or</tspan><tspan x="365" dy="24">procedure unknown</tspan></text><circle cx="24" cy="958" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="40" cy="958" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="56" cy="958" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="72" cy="958" r="2" fill="#8ec5ff" opacity=".28"/><circle cx="88" cy="958" r="2" fill="#8ec5ff" opac