<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc"><title id="title">What the documentation can—and cannot—decide</title><desc id="desc">Separate published facts from claims that require a controlled test. Explanatory decision model; not a measured benchmark.</desc><rect width="720" height="960" fill="#faf7f2"/><path d="M53 902 h57" stroke="#e46b3c" stroke-width="6" stroke-linecap="round"/><path d="M0 0 H720 V142 H0 Z" fill="#161c24"/><text x="40" y="58" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">What the documentation can—and cannot—decide</text><text x="40" y="101" fill="#f4e1d9" font-family="Segoe UI,Arial,sans-serif" font-size="18">Separate published facts from claims that require a controlled</text><rect x="48" y="185" width="300" height="105" rx="14" fill="#fff" stroke="#9d2c2f" stroke-width="4"/><text x="198" y="225" text-anchor="middle" fill="#161c24" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650"><tspan x="198" dy="0">Documented: app approval</tspan></text><rect x="372" y="185" width="300" height="105" rx="52" fill="#f4e1d9" stroke="#e46b3c" stroke-width="4"/><text x="522" y="225" text-anchor="middle" fill="#161c24" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650"><tspan x="522" dy="0">Documented: protocols</tspan></text><path d="M348 237 H372" stroke="#e46b3c" stroke-width="8"/><rect x="48" y="327" width="300" height="105" rx="14" fill="#f4e1d9" stroke="#9d2c2f" stroke-width="4"/><text x="198" y="367" text-anchor="middle" fill="#161c24" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650"><tspan x="198" dy="0">Documented: platforms</tspan></text><rect x="372" y="327" width="300" height="105" rx="52" fill="#fff" stroke="#e46b3c" stroke-width="4"/><text x="522" y="367" text-anchor="middle" fill="#161c24" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650"><tspan x="522" dy="0">Verify: exact vehicle</tspan></text><path d="M348 379 H372" stroke="#e46b3c" stroke-width="8"/><rect x="48" y="469" width="300" height="105" rx="14" fill="#f4e1d9" stroke="#9d2c2f" stroke-width="4"/><text x="198" y="509" text-anchor="middle" fill="#161c24" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650"><tspan x="198" dy="0">Not established: fastest</tspan></text><rect x="372" y="469" width="300" height="105" rx="52" fill="#f4e1d9" stroke="#e46b3c" stroke-width="4"/><text x="522" y="509" text-anchor="middle" fill="#161c24" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650"><tspan x="522" dy="0">Not established: universal</tspan><tspan x="522" dy="19.040000000000003">reliability</tspan></text><text x="40" y="930" fill="#9d2c2f" font-family="Segoe UI,Arial,sans-serif" font-size="15">CS-028 · Chassis Signal · documentation model · verified 2026-08-28</text></svg>