<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">The four-layer adapter decision</title><desc id="desc">An approved adapter still needs the right app, host and vehicle combination. Explanatory decision model; not a measured benchmark.</desc><rect width="1280" height="720" fill="#faf7f2"/><path d="M46 662 h54" stroke="#e46b3c" stroke-width="6" stroke-linecap="round"/><path d="M0 0 H1280 V132 H0 Z" fill="#161c24"/><text x="64" y="50" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">The four-layer adapter decision</text><text x="64" y="91" fill="#f4e1d9" font-family="Segoe UI,Arial,sans-serif" font-size="20">An approved adapter still needs the right app, host and vehicle combination.</text><circle cx="640" cy="370" r="110" fill="#e46b3c" opacity=".95"/><text x="640" y="356" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650"><tspan x="640" dy="0">Vehicle and</tspan><tspan x="640" dy="24.64">build date</tspan></text><path d="M640 260 L640 165" stroke="#9d2c2f" stroke-width="3"/><circle cx="640" cy="165" r="68" fill="#f4e1d9" stroke="#9d2c2f" stroke-width="3"/><text x="640" y="157" text-anchor="middle" fill="#161c24" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="650"><tspan x="640" dy="0">BimmerCode /</tspan><tspan x="640" dy="17.92">BimmerLink</tspan></text><path d="M750 370 L1000 370" stroke="#9d2c2f" stroke-width="3"/><circle cx="1000" cy="370" r="68" fill="#f4e1d9" stroke="#9d2c2f" stroke-width="3"/><text x="1000" y="362" text-anchor="middle" fill="#161c24" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="650"><tspan x="1000" dy="0">iOS /</tspan><tspan x="1000" dy="17.92">Android /</tspan><tspan x="1000" dy="17.92">Windows</tspan></text><path d="M640 480 L640 575" stroke="#9d2c2f" stroke-width="3"/><circle cx="640" cy="575" r="68" fill="#f4e1