<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">What the documentation can—and cannot—decide</title><desc id="desc">Separate published facts from claims that require a controlled test. Explanatory decision model; not a measured benchmark.</desc><rect width="1280" height="720" fill="#faf7f2"/><path d="M53 662 h57" stroke="#e46b3c" stroke-width="6" stroke-linecap="round"/><path d="M0 0 H1280 V132 H0 Z" fill="#161c24"/><text x="64" y="50" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">What the documentation can—and cannot—decide</text><text x="64" y="91" fill="#f4e1d9" font-family="Segoe UI,Arial,sans-serif" font-size="20">Separate published facts from claims that require a controlled test.</text><rect x="230" y="205" width="820" height="50" rx="12" fill="#e46b3c" opacity="0.92"/><text x="640" y="223" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650"><tspan x="640" dy="0">Documented: app approval</tspan></text><rect x="257" y="267" width="766" height="50" rx="12" fill="#9d2c2f" opacity="0.885"/><text x="640" y="285" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650"><tspan x="640" dy="0">Documented: protocols</tspan></text><rect x="284" y="329" width="712" height="50" rx="12" fill="#e46b3c" opacity="0.8500000000000001"/><text x="640" y="347" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650"><tspan x="640" dy="0">Documented: platforms</tspan></text><rect x="311" y="391" width="658" height="50" rx="12" fill="#9d2c2f" opacity="0.8150000000000001"/><text x="640" y="409" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650"><tspan x="640" dy="0">Verify: exact vehicle</tspan></text><rect x="338" y="453" width="604" height="50" rx="12" fill="#e46b3c" opacity="0.78"/><text x="640" y="471" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650"><tspan x="640" dy="0">Not established: fastest</tspan></text><rect x="365" y="515" width="550" height="50" rx="12" fill="#9d2c2f" opacity="0.745"/><text x="640" y="533" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="650"><tspan x="640" dy="0">Not established: universal reliability</tspan></text><text x="64" y="690" fill="#9d2c2f" font-family="Segoe UI,Arial,sans-serif" font-size="15">CS-028 · Chassis Signal · documentation model · verified 2026-08-28</text></svg>