<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Power and communication are separate observations</title><desc id="desc">Four states prevent a powered tool from being mistaken for a working link. No power / no link; Power / no link; Generic link only; BMW module link.</desc><rect width="720" height="980" fill="#181426"/><rect width="720" height="16" fill="#c5a3ff"/><text x="44" y="70" class="heading">Power and communication are separate observations</text><text x="44" y="122" class="sub">Four states prevent a powered tool from being mistaken for a working link.</text><rect x="80" y="210" width="560" height="84" rx="18" fill="#3e315c" stroke="#c5a3ff" stroke-width="3"/><circle cx="115" cy="252" r="21" fill="#c5a3ff"/><text x="365" y="260" text-anchor="middle" class="label"><tspan x="365" dy="0">No power / no link</tspan></text><path d="M115 273V366" stroke="#698397" stroke-width="5"/><rect x="80" y="345" width="560" height="84" rx="18" fill="#3e315c" stroke="#c5a3ff" stroke-width="3"/><circle cx="115" cy="387" r="21" fill="#c5a3ff"/><text x="365" y="395" text-anchor="middle" class="label"><tspan x="365" dy="0">Power / no link</tspan></text><path d="M115 408V501" stroke="#698397" stroke-width="5"/><rect x="80" y="480" width="560" height="84" rx="18" fill="#3e315c" stroke="#c5a3ff" stroke-width="3"/><circle cx="115" cy="522" r="21" fill="#c5a3ff"/><text x="365" y="530" text-anchor="middle" class="label"><tspan x="365" dy="0">Generic link only</tspan></text><path d="M115 543V636" stroke="#698397" stroke-width="5"/><rect x="80" y="615" width="560" height="84" rx="18" fill="#3e315c" stroke="#78e3d2" stroke-width="3"/><circle cx="115" cy="657" r="21" fill="#78e3d2"/><text x="365" y="665" text-anchor="middle" class="label"><tspan x="365" dy="0">BMW module link</tspan></text><circle cx="24" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="40" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="56" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="72" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="88" cy="958" r="2" fill="#78e3d2" opacity=".28"/><circle cx="104" cy="958" r="2" fill="#78e3d2" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#bfd0dc}.label{font:600 19px Arial,sans-serif;fill:#fff}</style></svg>