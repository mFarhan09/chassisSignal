<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">The pattern of missing modules narrows the fault</title><desc id="desc">Whole-vehicle, one-domain and one-module failures point to different layers. Nothing responds; Generic OBD responds; One network missing; One module missing.</desc><rect width="720" height="980" fill="#17120c"/><rect width="720" height="16" fill="#f0ad4e"/><text x="44" y="70" class="heading">The pattern of missing modules narrows the fault</text><text x="44" y="122" class="sub">Whole-vehicle, one-domain and one-module failures point to different layers.</text><rect x="80" y="210" width="560" height="84" rx="18" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><circle cx="115" cy="252" r="21" fill="#f0ad4e"/><text x="365" y="260" text-anchor="middle" class="label"><tspan x="365" dy="0">Nothing responds</tspan></text><path d="M115 273V366" stroke="#698397" stroke-width="5"/><rect x="80" y="345" width="560" height="84" rx="18" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><circle cx="115" cy="387" r="21" fill="#f0ad4e"/><text x="365" y="395" text-anchor="middle" class="label"><tspan x="365" dy="0">Generic OBD responds</tspan></text><path d="M115 408V501" stroke="#698397" stroke-width="5"/><rect x="80" y="480" width="560" height="84" rx="18" fill="#49351f" stroke="#f0ad4e" stroke-width="3"/><circle cx="115" cy="522" r="21" fill="#f0ad4e"/><text x="365" y="530" text-anchor="middle" class="label"><tspan x="365" dy="0">One network missing</tspan></text><path d="M115 543V636" stroke="#698397" stroke-width="5"/><rect x="80" y="615" width="560" height="84" rx="18" fill="#49351f" stroke="#e8e1d3" stroke-width="3"/><circle cx="115" cy="657" r="21" fill="#e8e1d3"/><text x="365" y="665" text-anchor="middle" class="label"><tspan x="365" dy="0">One module missing</tspan></text><circle cx="24" cy="958" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="40" cy="958" r=