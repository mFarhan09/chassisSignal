<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">The pattern of missing modules narrows the fault</title><desc id="desc">Whole-vehicle, one-domain and one-module failures point to different layers. Nothing responds; Generic OBD responds; One network missing; One module missing.</desc><rect width="1280" height="720" fill="#17120c"/><rect width="1280" height="16" fill="#f0ad4e"/><text x="64" y="68" class="heading">The pattern of missing modules narrows the fault</text><text x="64" y="114" class="sub">Whole-vehicle, one-domain and one-module failures point to different layers.</text><path d="M75 270h181l24 100-24 100H75Z" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="177.5" y="378" text-anchor="middle" class="label"><tspan x="177.5" dy="0">Nothing responds</tspan></text><path d="M302 270h181l24 100-24 100H302Z" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="404.5" y="378" text-anchor="middle" class="label"><tspan x="404.5" dy="0">Generic OBD responds</tspan></text><path d="M529 270h181l24 100-24 100H529Z" fill="#49351f" stroke="#f0ad4e" stroke-width="4"/><text x="631.5" y="378" text-anchor="middle" class="label"><tspan x="631.5" dy="0">One network missing</tspan></text><path d="M756 270h181l24 100-24 100H756Z" fill="#49351f" stroke="#e8e1d3" stroke-width="4"/><text x="858.5" y="378" text-anchor="middle" class="label"><tspan x="858.5" dy="0">One module missing</tspan></text><circle cx="24" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="40" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="56" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="72" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="88" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="104" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><circle cx="120" cy="698" r="2" fill="#e8e1d3" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#bfd0dc}.label{font:600 17px Arial,sans-serif;fill:#fff}</style></svg>