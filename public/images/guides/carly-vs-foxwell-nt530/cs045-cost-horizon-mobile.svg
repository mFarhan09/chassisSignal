<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" data-layout="renewal-clock"><title>Cost moves on two clocks</title><desc>License renewal and hardware ownership must be modeled separately. Purchase day, Carly renewal, Optional add-on, NT530 brand add-on, Update-policy check</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fa9ff"/></marker></defs><rect width="100%" height="100%" fill="#081421"/><circle cx="640" cy="70" r="120" fill="#7fa9ff" opacity="0.06"/><text x="48" y="58" class="k">CHASSIS SIGNAL / RENEWAL-CLOCK</text><text x="48" y="112" class="title" text-anchor="start"><tspan x="48" dy="0">Cost moves on two clocks</tspan></text><text x="48" y="190" class="subtitle" text-anchor="start"><tspan x="48" dy="0">License renewal and hardware ownership must be modeled</tspan><tspan x="48" dy="24">separately.</tspan></text><circle cx="360" cy="520" r="210" fill="none" stroke="#7fa9ff" stroke-width="10"/><path d="M 360 520 L 360 365 M 360 520 L 490 590" stroke="#45d6c6" stroke-width="9"/><circle cx="360" cy="520" r="18" fill="#45d6c6"/><text x="48" y="932" class="k">DECISION ARTIFACT / CS-045</text><style>.title{font:700 30px Arial,sans-serif;fill:#fff}.subtitle{font:17px Arial,sans-serif;fill:#b7c8d8}.k{font:14px Arial,sans-serif;fill:#7fa9ff;letter-spacing:2px}.label{font:700 16px Arial,sans-serif;fill:#fff}.zone{font:700 15px Arial,sans-serif;fill:#d9e7ef;letter-spacing:2px}.plus{font:700 28px Arial,sans-serif;fill:#b7c8d8}</style></svg>