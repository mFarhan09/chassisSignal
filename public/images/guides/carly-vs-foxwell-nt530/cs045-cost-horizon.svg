<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" data-layout="renewal-clock"><title>Cost moves on two clocks</title><desc>License renewal and hardware ownership must be modeled separately. Purchase day, Carly renewal, Optional add-on, NT530 brand add-on, Update-policy check</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7fa9ff"/></marker></defs><rect width="100%" height="100%" fill="#081421"/><circle cx="1200" cy="70" r="170" fill="#7fa9ff" opacity="0.06"/><text x="70" y="58" class="k">CHASSIS SIGNAL / RENEWAL-CLOCK</text><text x="70" y="112" class="title" text-anchor="start"><tspan x="70" dy="0">Cost moves on two clocks</tspan></text><text x="70" y="178" class="subtitle" text-anchor="start"><tspan x="70" dy="0">License renewal and hardware ownership must be modeled separately.</tspan></text><path d="M 110 430 C 330 250 500 610 720 430 S 1070 250 1170 430" fill="none" stroke="#7fa9ff" stroke-width="8"/><circle cx="120" cy="430" r="13" fill="#7fa9ff"/><g><rect x="35" y="285" width="170" height="70" rx="14" fill="#102b40" stroke="#7fa9ff" stroke-width="2"/><text x="120" y="326" class="label" text-anchor="middle"><tspan x="120" dy="0">Purchase day</tspan></text></g><circle cx="375" cy="430" r="13" fill="#45d6c6"/><g><rect x="290" y="490" width="170" height="70" rx="14" fill="#102b40" stroke="#45d6c6" stroke-width="2"/><text x="375" y="531" class="label" text-anchor="middle"><tspan x="375" dy="0">Carly renewal</tspan></text></g><circle cx="630" cy="430" r="13" fill="#7fa9ff"/><g><rect x="545" y="285" width="170" height="70" rx="14" fill="#102b40" stroke="#7fa9ff" stroke-width="2"/><text x="630" y="326" class="label" text-anchor="middle"><tspan x="630" dy="0">Optional add-on</tspan></text></g><circle cx="885" cy="430" r="13" fill="#45d6c6"/><g><rect x="800" y="490" width="170" height="70" rx="14" fill="#102b40" stroke="#45d6c6" stroke-width="2"/><text x="885" y="531" class="label" text-anchor="middle"><tspan x="885" dy="0">NT530 brand add-on</tspan></text></g><circle cx="1140" cy="430" r="13" fill="#7fa9ff"/><g><rect x="1055" y="285" width="170" height="70" rx="14" fill="#102b40" stroke="#7fa9ff" stroke-width="2"/><text x="1140" y="326" class="label" text-anchor="middle"><tspan x="1140" dy="0">Update-policy check</tspan></text></g><text x="70" y="692" class="k">DECISION ARTIFACT / CS-045</text><style>.title{font:700 40px Arial,sans-serif;fill:#fff}.subtitle{font:19px Arial,sans-serif;fill:#b7c8d8}.k{font:14px Arial,sans-serif;fill:#7fa9ff;letter-spacing:2px}.label{font:700 18px Arial,sans-serif;fill:#fff}.zone{font:700 15px Arial,sans-serif;fill:#d9e7ef;letter-spacing:2px}.plus{font:700 28px Arial,sans-serif;fill:#b7c8d8}</style></svg>