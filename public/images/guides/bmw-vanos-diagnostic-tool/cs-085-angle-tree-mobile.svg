<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="ti de"><title id="ti">What abnormal VANOS angles point to</title><desc id="de">Use the evidence to direct inspection, not to pre-order a part from a code.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="58" class="h">What abnormal VANOS angles point to</text><text x="44" y="94" class="s">Use the evidence to direct inspection, not to pre-order a part from a code.</text><rect x="40" y="135" width="640" height="48" rx="10" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2.5"/><text x="360" y="165" text-anchor="middle" class="l">Abnormal target vs actual angle</text><line x1="64" y1="199" x2="64" y2="435" stroke="#3a5578" stroke-width="2"/><rect x="58" y="203" width="622" height="40" rx="8" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><text x="74" y="229" class="l">Slow to follow</text><text x="84" y="251" class="m">• Solenoid response</text><text x="84" y="273" class="m">• Oil supply / pressure</text><line x1="64" y1="451.33333333333337" x2="64" y2="688" stroke="#3a5578" stroke-width="2"/><rect x="58" y="455" width="622" height="40" rx="8" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><text x="74" y="481" class="l">Stuck or extreme</text><text x="84" y="503" class="m">• Mechanical binding</text><text x="84" y="525" class="m">• Timing / cam issue</text><line x1="64" y1="703.6666666666667" x2="64" y2="940" stroke="#3a5578" stroke-width="2"/><rect x="58" y="708" width="622" height="40" rx="8" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><text x="74" y="734" class="l">Adaptation drift</text><text x="84" y="756" class="m">• Relearn under DME</text><text x="84" y="778" class="m">• Wear over time</text><style>.h{font:700 29px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 17px Arial,sans-serif;fill:#bfd0dc}.l{font:600 17px Arial,sans-serif;fill:#fff}.m{font:400 15px Arial,sans-serif;fill:#bfd0dc}.b{font:700 16px Arial,sans-serif;fill:#0c1727}.t{font:700 16px Arial,sans-serif;fill:#65c8ff}</style></svg>