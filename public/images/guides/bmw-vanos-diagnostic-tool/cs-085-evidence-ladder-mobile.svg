<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="ti de"><title id="ti">VANOS diagnostic evidence ladder</title><desc id="de">Build the case in order; one fault code is a starting point, not a diagnosis.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="58" class="h">VANOS diagnostic evidence ladder</text><text x="44" y="94" class="s">Build the case in order; one fault code is a starting point, not a diagnosis.</text><rect x="40" y="141" width="640" height="141" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="74" cy="212" r="20" fill="#65c8ff"/><text x="74" y="218" text-anchor="middle" class="b">1</text><text x="112" y="206" class="l">Fault codes</text><text x="112" y="228" class="m">Read VANOS-related codes as a lead; note engine family and DME.</text><path d="M74 282 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 74 282)"/><rect x="40" y="296" width="640" height="141" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="74" cy="368" r="20" fill="#65c8ff"/><text x="74" y="374" text-anchor="middle" class="b">2</text><text x="112" y="362" class="l">Live target vs actual angle</text><text x="112" y="384" class="m">Compare requested and actual cam angle on each bank; watch the follow.</text><path d="M74 437 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 74 437)"/><rect x="40" y="451" width="640" height="141" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="74" cy="522" r="20" fill="#65c8ff"/><text x="74" y="528" text-anchor="middle" class="b">3</text><text x="112" y="516" class="l">Activation / dynamic test</text><text x="112" y="538" class="m">Command the solenoid and measure advance/retard response time.</text><path d="M74 592 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 74 592)"/><rect x="40" y="606" width="640" height="141" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="74" cy="678" r="20" fill="#65c8ff"/><text x="74" y="684" text-anchor="middle" class="b">4</text><text x="112" y="672" class="l">ISTA guided test / relearn</text><text x="112" y="694" class="m">Run the guided VANOS check and any relearn under the DME section.</text><path d="M74 747 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 74 747)"/><rect x="40" y="761" width="640" height="141" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="74" cy="832" r="20" fill="#65c8ff"/><text x="74" y="838" text-anchor="middle" class="b">5</text><text x="112" y="826" class="l">Mechanical escalation</text><text x="112" y="848" class="m">Slow or stuck response points to solenoid, oil supply or timing.</text><text x="40" y="946" class="m" fill="#ff7f7f">No single code or value diagnoses VANOS. Software gathers evidence; mechanical causes</text><text x="40" y="966" class="m" fill="#ff7f7f">still need physical inspection.</text><style>.h{font:700 29px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 17px Arial,sans-serif;fill:#bfd0dc}.l{font:600 17px Arial,sans-serif;fill:#fff}.m{font:400 15px Arial,sans-serif;fill:#bfd0dc}.b{font:700 16px Arial,sans-serif;fill:#0c1727}.t{font:700 16px Arial,sans-serif;fill:#65c8ff}</style></svg>