<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="ti de"><title id="ti">What each tool class shows for VANOS</title><desc id="de">A code reader that cannot show target-vs-actual angle cannot isolate a VANOS fault.</desc><rect width="720" height="980" fill="#0c1727"/><rect width="720" height="16" fill="#65c8ff"/><text x="44" y="58" class="h">What each tool class shows for VANOS</text><text x="44" y="94" class="s">A code reader that cannot show target-vs-actual angle cannot isolate a VANOS</text><text x="44" y="115" class="s">fault.</text><rect x="40" y="156" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="186" class="l">Generic code reader</text><text x="56" y="210" class="m">What it shows: Stored fault codes only</text><text x="56" y="232" class="m">VANOS limit: No live angle or activation</text><rect x="40" y="306" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="336" class="l">BMW diagnostic app</text><text x="56" y="360" class="m">What it shows: Some live data, limited tests</text><text x="56" y="382" class="m">VANOS limit: Activation depth varies by app</text><rect x="40" y="456" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="486" class="l">INPA / ISTA (OEM interface)</text><text x="56" y="510" class="m">What it shows: Target/actual, dynamic check, relearn</text><text x="56" y="532" class="m">VANOS limit: Interface varies by chassis</text><rect x="40" y="606" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="636" class="l">Pro shop scanner</text><text x="56" y="660" class="m">What it shows: Codes, data, some activation</text><text x="56" y="682" class="m">VANOS limit: Verify VANOS test on your model</text><rect x="40" y="756" width="640" height="138" rx="12" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2"/><text x="56" y="786" class="l">Mechanical inspection</text><text x="56" y="810" class="m">What it shows: Physical cause (solenoid, oil, timing)</text><text x="56" y="832" class="m">VANOS limit: Beyond any software</text><style>.h{font:700 29px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 17px Arial,sans-serif;fill:#bfd0dc}.l{font:600 17px Arial,sans-serif;fill:#fff}.m{font:400 15px Arial,sans-serif;fill:#bfd0dc}.b{font:700 16px Arial,sans-serif;fill:#0c1727}.t{font:700 16px Arial,sans-serif;fill:#65c8ff}</style></svg>