<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ti de"><title id="ti">VANOS diagnostic evidence ladder</title><desc id="de">Build the case in order; one fault code is a starting point, not a diagnosis.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="56" y="60" class="h">VANOS diagnostic evidence ladder</text><text x="56" y="102" class="s">Build the case in order; one fault code is a starting point, not a diagnosis.</text><rect x="56" y="151" width="1168" height="87" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="90" cy="196" r="20" fill="#65c8ff"/><text x="90" y="202" text-anchor="middle" class="b">1</text><text x="128" y="202" class="l">Fault codes</text><text x="547" y="200" class="m">Read VANOS-related codes as a lead; note engine family and DME.</text><path d="M90 238 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 90 238)"/><rect x="56" y="252" width="1168" height="87" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="90" cy="296" r="20" fill="#65c8ff"/><text x="90" y="302" text-anchor="middle" class="b">2</text><text x="128" y="302" class="l">Live target vs actual angle</text><text x="547" y="300" class="m">Compare requested and actual cam angle on each bank; watch the follow.</text><path d="M90 339 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 90 339)"/><rect x="56" y="353" width="1168" height="87" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="90" cy="398" r="20" fill="#65c8ff"/><text x="90" y="404" text-anchor="middle" class="b">3</text><text x="128" y="404" class="l">Activation / dynamic test</text><text x="547" y="402" class="m">Command the solenoid and measure advance/retard response time.</text><path d="M90 440 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 90 440)"/><rect x="56" y="454" width="1168" height="87" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="90" cy="498" r="20" fill="#65c8ff"/><text x="90" y="504" text-anchor="middle" class="b">4</text><text x="128" y="504" class="l">ISTA guided test / relearn</text><text x="547" y="502" class="m">Run the guided VANOS check and any relearn under the DME section.</text><path d="M90 541 l-7 -12 h14 Z" fill="#65c8ff" transform="rotate(180 90 541)"/><rect x="56" y="555" width="1168" height="87" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><circle cx="90" cy="600" r="20" fill="#65c8ff"/><text x="90" y="606" text-anchor="middle" class="b">5</text><text x="128" y="606" class="l">Mechanical escalation</text><text x="547" y="604" class="m">Slow or stuck response points to solenoid, oil supply or timing.</text><text x="56" y="706" class="m" fill="#ff7f7f">No single code or value diagnoses VANOS. Software gathers evidence; mechanical causes still need physical inspection.</text><style>.h{font:700 34px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 19px Arial,sans-serif;fill:#bfd0dc}.l{font:600 16px Arial,sans-serif;fill:#fff}.m{font:400 14px Arial,sans-serif;fill:#bfd0dc}.b{font:700 15px Arial,sans-serif;fill:#0c1727}.t{font:700 15px Arial,sans-serif;fill:#65c8ff}</style></svg>