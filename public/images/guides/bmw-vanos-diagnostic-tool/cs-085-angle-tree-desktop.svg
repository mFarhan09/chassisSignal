<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="ti de"><title id="ti">What abnormal VANOS angles point to</title><desc id="de">Use the evidence to direct inspection, not to pre-order a part from a code.</desc><rect width="1280" height="720" fill="#0c1727"/><rect width="1280" height="16" fill="#65c8ff"/><text x="56" y="60" class="h">What abnormal VANOS angles point to</text><text x="56" y="102" class="s">Use the evidence to direct inspection, not to pre-order a part from a code.</text><rect x="490" y="163" width="300" height="52" rx="10" fill="#1b2f4a" stroke="#65c8ff" stroke-width="2.5"/><text x="640" y="195" text-anchor="middle" class="l">Abnormal target vs actual angle</text><line x1="640" y1="215" x2="251" y2="277" stroke="#3a5578" stroke-width="2"/><rect x="72" y="283" width="357" height="52" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><text x="251" y="314" text-anchor="middle" class="l">Slow to follow</text><rect x="78" y="361" width="345" height="46" rx="8" fill="#1b2f4a" stroke="#3a5578" stroke-width="1.5"/><text x="251" y="379" text-anchor="middle" class="m">Solenoid response</text><rect x="78" y="417" width="345" height="46" rx="8" fill="#1b2f4a" stroke="#3a5578" stroke-width="1.5"/><text x="251" y="435" text-anchor="middle" class="m">Oil supply / pressure</text><line x1="640" y1="215" x2="640" y2="277" stroke="#3a5578" stroke-width="2"/><rect x="461" y="283" width="357" height="52" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><text x="640" y="314" text-anchor="middle" class="l">Stuck or extreme</text><rect x="467" y="361" width="345" height="46" rx="8" fill="#1b2f4a" stroke="#3a5578" stroke-width="1.5"/><text x="640" y="379" text-anchor="middle" class="m">Mechanical binding</text><rect x="467" y="417" width="345" height="46" rx="8" fill="#1b2f4a" stroke="#3a5578" stroke-width="1.5"/><text x="640" y="435" text-anchor="middle" class="m">Timing / cam issue</text><line x1="640" y1="215" x2="1029" y2="277" stroke="#3a5578" stroke-width="2"/><rect x="851" y="283" width="357" height="52" rx="10" fill="#243b5a" stroke="#65c8ff" stroke-width="2"/><text x="1029" y="314" text-anchor="middle" class="l">Adaptation drift</text><rect x="857" y="361" width="345" height="46" rx="8" fill="#1b2f4a" stroke="#3a5578" stroke-width="1.5"/><text x="1029" y="379" text-anchor="middle" class="m">Relearn under DME</text><rect x="857" y="417" width="345" height="46" rx="8" fill="#1b2f4a" stroke="#3a5578" stroke-width="1.5"/><text x="1029" y="435" text-anchor="middle" class="m">Wear over time</text><style>.h{font:700 34px Arial,Helvetica,sans-serif;fill:#fff}.s{font:400 19px Arial,sans-serif;fill:#bfd0dc}.l{font:600 16px Arial,sans-serif;fill:#fff}.m{font:400 14px Arial,sans-serif;fill:#bfd0dc}.b{font:700 15px Arial,sans-serif;fill:#0c1727}.t{font:700 15px Arial,sans-serif;fill:#65c8ff}</style></svg>