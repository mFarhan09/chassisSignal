<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Job triage path</title><desc id="desc">Name the requested change, Identify affected module, Decide configuration or software, Check supported tool, Escalate firmware work.</desc><rect width="720" height="980" fill="#0b1220"/><path d="M0 0H720V18H0Z" fill="#38bdf8"/><text x="48" y="85" class="heading">Job triage path</text><text x="48" y="142" class="sub">BMW coding vs programming</text><path d="M80 340L105 235H615L640 340Z" fill="#26354b" stroke="#38bdf8" stroke-width="4"/><text x="360" y="287.5" text-anchor="middle" class="label">Name the requested change</text><path d="M80 475L105 370H615L640 475Z" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/><text x="360" y="422.5" text-anchor="middle" class="label">Identify affected module</text><path d="M80 610L105 505H615L640 610Z" fill="#26354b" stroke="#38bdf8" stroke-width="4"/><text x="360" y="557.5" text-anchor="middle" class="label">Decide configuration or software</text><path d="M80 745L105 640H615L640 745Z" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/><text x="360" y="692.5" text-anchor="middle" class="label">Check supported tool</text><path d="M80 880L105 775H615L640 880Z" fill="#26354b" stroke="#38bdf8" stroke-width="4"/><text x="360" y="827.5" text-anchor="middle" class="label">Escalate firmware work</text><circle cx="30" cy="952" r="3" fill="#38bdf8" opacity=".25"/><circle cx="52" cy="952" r="3" fill="#38bdf8" opacity=".25"/><style>.heading{font:700 31px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#cbd5e1}.label{font:600 20px Arial,sans-serif;fill:#fff}.small{font:600 18px Arial,sans-serif;fill:#fff}.core{font:700 19px Arial,sans-serif;fill:#0b1220}</style></svg>