<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Job triage path</title><desc id="desc">Name the requested change, Identify affected module, Decide configuration or software, Check supported tool, Escalate firmware work.</desc><rect width="1280" height="720" fill="#0b1220"/><path d="M0 0H1280V18H0Z" fill="#38bdf8"/><text x="65" y="82" class="heading">Job triage path</text><text x="65" y="135" class="sub">BMW coding vs programming</text><path d="M65 510L90 260H245L270 510Z" fill="#26354b" stroke="#38bdf8" stroke-width="4"/><text x="167.5" y="385" text-anchor="middle" class="label">Name the requested change</text><path d="M305 510L330 260H485L510 510Z" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/><text x="407.5" y="385" text-anchor="middle" class="label">Identify affected module</text><path d="M545 510L570 260H725L750 510Z" fill="#26354b" stroke="#38bdf8" stroke-width="4"/><text x="647.5" y="385" text-anchor="middle" class="label">Decide configuration or software</text><path d="M785 510L810 260H965L990 510Z" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/><text x="887.5" y="385" text-anchor="middle" class="label">Check supported tool</text><path d="M1025 510L1050 260H1205L1230 510Z" fill="#26354b" stroke="#38bdf8" stroke-width="4"/><text x="1127.5" y="385" text-anchor="middle" class="label">Escalate firmware work</text><circle cx="30" cy="692" r="3" fill="#38bdf8" opacity=".25"/><circle cx="52" cy="692" r="3" fill="#38bdf8" opacity=".25"/><style>.heading{font:700 40px Arial,sans-serif;fill:#fff}.sub{font:400 22px Arial,sans-serif;fill:#cbd5e1}.label{font:600 19px Arial,sans-serif;fill:#fff}.small{font:600 16px Arial,sans-serif;fill:#fff}.core{font:700 17px Arial,sans-serif;fill:#0b1220}</style></svg>