<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Preserve the sequence before deciding</title><desc id="desc">The scan becomes more useful when captured before clearing, repair, or purchase. Labels: Identity, First scan, Physical check, Road test, Rescan, Decision.</desc><rect width="1280" height="720" fill="#07111f"/><rect width="1280" height="18" fill="#f59e0b"/><text x="58" y="76" class="heading">Preserve the sequence before deciding</text><text x="58" y="130" class="sub">The scan becomes more useful when captured before clearing, repair, or purchase.</text><text x="1226" y="174" text-anchor="end" class="type">TIMELINE SNAPSHOTS</text><g><rect x="50" y="235" width="178" height="210" rx="24" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><text x="74" y="267" class="num">01</text><text x="139" y="355" text-anchor="middle" class="label">Identity</text><path d="M228 340 H250" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="250" y="290" width="178" height="210" rx="24" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><text x="274" y="322" class="num">02</text><text x="339" y="410" text-anchor="middle" class="label">First scan</text><path d="M428 395 H450" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="450" y="235" width="178" height="210" rx="24" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/><text x="474" y="267" class="num">03</text><text x="539" y="355" text-anchor="middle" class="label">Physical check</text><path d="M628 340 H650" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="650" y="290" width="178" height="210" rx="24" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><text x="674" y="322" class="num">04</text><text x="739" y="410" text-anchor="middle" class="label">Road test</text><path d="M828 395 H850" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="8