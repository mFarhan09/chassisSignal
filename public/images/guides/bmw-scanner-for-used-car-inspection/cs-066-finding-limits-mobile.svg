<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Separate the finding from its limit</title><desc id="desc">Every scanner observation has a valid meaning and something it cannot prove. Labels: Finding, Supports, Does not prove.</desc><rect width="720" height="980" fill="#07111f"/><rect width="720" height="18" fill="#f59e0b"/><text x="46" y="78" class="heading">Separate the finding from its limit</text><text x="46" y="140" class="sub">Every scanner observation has a valid meaning and something it cannot prove.</text><text x="666" y="194" text-anchor="end" class="type">THREE COLUMN</text><g><rect x="60" y="245" width="600" height="88" rx="21" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><text x="84" y="277" class="num">01</text><text x="142" y="297" text-anchor="start" class="label">Finding</text><path d="M360 333 V357" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="357" width="600" height="88" rx="21" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/><text x="84" y="389" class="num">02</text><text x="142" y="409" text-anchor="start" class="label">Supports</text><path d="M360 445 V469" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="469" width="600" height="88" rx="21" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><text x="84" y="501" class="num">03</text><text x="142" y="521" text-anchor="start" class="label">Does not prove</text></g><circle cx="30" cy="955" r="3" fill="#f59e0b" opacity=".28"/><circle cx="50" cy="955" r="3" fill="#f59e0b" opacity=".28"/><circle cx="70" cy="955" r="3" fill="#f59e0b" opacity=".28"/><circle cx="90" cy="955" r="3" fill="#f59e0b" opacity=".28"/><circle cx="110" cy="955" r="3" fill="#f59e0b" opacity=".28"/><circle cx="130" cy="955" r="3" fill="#f59e0b" opacity=".28"/><circle cx="150" cy="955" r="3" fill="#f59e0b" opacity=".28"/><circle cx="170" cy="955" r="3" fill="#f59e0b" opacity=".28"/><circle cx="190" cy="955" r="3" fill="#f59e0b" opacity=".28"/><circle cx="210" cy="955" r="3" fill="#f59e0b" opacity=".28"/><style>.heading{font:700 30px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#cbd5e1}.type{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#f59e0b}.label{font:600 18px Arial,sans-serif;fill:#fff}.num{font:700 12px Arial,sans-serif;fill:#07111f}</style></svg>