<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Separate the finding from its limit</title><desc id="desc">Every scanner observation has a valid meaning and something it cannot prove. Labels: Finding, Supports, Does not prove.</desc><rect width="1280" height="720" fill="#07111f"/><rect width="1280" height="18" fill="#f59e0b"/><text x="58" y="76" class="heading">Separate the finding from its limit</text><text x="58" y="130" class="sub">Every scanner observation has a valid meaning and something it cannot prove.</text><text x="1226" y="174" text-anchor="end" class="type">THREE COLUMN</text><g><rect x="50" y="235" width="378" height="210" rx="21" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><text x="74" y="267" class="num">01</text><text x="239" y="355" text-anchor="middle" class="label">Finding</text><path d="M428 340 H450" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="450" y="290" width="378" height="210" rx="21" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/><text x="474" y="322" class="num">02</text><text x="639" y="410" text-anchor="middle" class="label">Supports</text><path d="M828 395 H850" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="850" y="235" width="378" height="210" rx="21" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><text x="874" y="267" class="num">03</text><text x="1039" y="355" text-anchor="middle" class="label">Does not prove</text></g><circle cx="30" cy="695" r="3" fill="#f59e0b" opacity=".28"/><circle cx="50" cy="695" r="3" fill="#f59e0b" opacity=".28"/><circle cx="70" cy="695" r="3" fill="#f59e0b" opacity=".28"/><circle cx="90" cy="695" r="3" fill="#f59e0b" opacity=".28"/><circle cx="110" cy="695" r="3" fill="#f59e0b" opacity=".28"/><circle cx="130" cy="695" r="3" fill="#f59e0b" opacity=".28"/><circle cx="150" cy="695" r="3" fill="#f59e0b" opacity=".28"/><circle cx="170" cy="695" r="3" fill="#f59e0b" opacity=".28"/><circle cx="190" cy="695" r="3" fill="#f59e0b" opacity=".28"/><circle cx="210" cy="695" r="3" fill="#f59e0b" opacity=".28"/><style>.heading{font:700 38px Arial,sans-serif;fill:#fff}.sub{font:400 20px Arial,sans-serif;fill:#cbd5e1}.type{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#f59e0b}.label{font:600 16px Arial,sans-serif;fill:#fff}.num{font:700 12px Arial,sans-serif;fill:#07111f}</style></svg>