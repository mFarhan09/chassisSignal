<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Preserve the sequence before deciding</title><desc id="desc">The scan becomes more useful when captured before clearing, repair, or purchase. Labels: Identity, First scan, Physical check, Road test, Rescan, Decision.</desc><rect width="720" height="980" fill="#07111f"/><rect width="720" height="18" fill="#f59e0b"/><text x="46" y="78" class="heading">Preserve the sequence before deciding</text><text x="46" y="140" class="sub">The scan becomes more useful when captured before clearing, repair, or purchase.</text><text x="666" y="194" text-anchor="end" class="type">TIMELINE SNAPSHOTS</text><g><rect x="60" y="245" width="600" height="88" rx="24" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><text x="84" y="277" class="num">01</text><text x="142" y="297" text-anchor="start" class="label">Identity</text><path d="M360 333 V357" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="357" width="600" height="88" rx="24" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><text x="84" y="389" class="num">02</text><text x="142" y="409" text-anchor="start" class="label">First scan</text><path d="M360 445 V469" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="469" width="600" height="88" rx="24" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/><text x="84" y="501" class="num">03</text><text x="142" y="521" text-anchor="start" class="label">Physical check</text><path d="M360 557 V581" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="581" width="600" height="88" rx="24" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/><text x="84" y="613" class="num">04</text><text x="142" y="633" text-anchor="start" class="label">Road test</text><path d="M360 669 V693" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 8"/></g><g><rect x="60" y="693" width="6