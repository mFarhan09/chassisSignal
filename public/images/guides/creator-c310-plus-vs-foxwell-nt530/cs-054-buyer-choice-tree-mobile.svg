<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Handheld Scanner Choice Tree</title><desc id="desc">Decision tree guiding buyers based on diagnostic depth requirements, multi-vehicle ownership, and budget.</desc><rect width="100%" height="100%" fill="#251b2d"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ff9a62">TOOL SELECTION GUIDE</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#fff">HANDHELD CHOICE TREE</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="17" fill="#f8ecff">Align tool capabilities with personal repair scope and vehicle fleet requirements</text><rect x="220" y="225" width="280" height="90" rx="20" fill="#f8ecff" /><path d="M360 315 V385 H170 V445" stroke="#bd7cff" stroke-width="7" fill="none" /><path d="M360 385 H550 V445" stroke="#ff9a62" stroke-width="7" fill="none" /><polygon points="150,445 190,445 170,480" fill="#bd7cff" /><polygon points="530,445 570,445 550,480" fill="#ff9a62" /><rect x="70" y="480" width="250" height="120" rx="20" fill="#bd7cff" /><rect x="400" y="480" width="250" height="120" rx="20" fill="#ff9a62" /><path d="M195 600 V720 H360" stroke="#bd7cff" stroke-width="6" fill="none" /><path d="M525 600 V720 H360" stroke="#ff9a62" stroke-width="6" fill="none" /><polygon points="335,720 385,720 360,760" fill="#f8ecff" /><text x="360" y="260" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#251b2d"><tspan x="360" dy="0">Basic BMW scan</tspan></text><text x="195" y="525" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="195" dy="0">Named service</tspan><tspan x="195" dy="22">job</tspan></text><text x="525" y="525" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="525" dy="0">Multi-brand</tspan><tspan x="525" dy="22">expansion</tspan></text></svg>