<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Two Handheld Architectures</title><desc id="desc">Architecture comparison between dedicated BMW handheld firmware and expandable multi-brand diagnostic platforms.</desc><rect width="100%" height="100%" fill="#251b2d"/><text x="68" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ff9a62">HARDWARE COMPARISON</text><text x="68" y="112" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">TWO HANDHELD ARCHITECTURES</text><text x="68" y="158" font-family="Arial, sans-serif" font-size="19" fill="#f8ecff">Compare the exact handheld, not the product family name</text><rect x="100" y="230" width="390" height="350" rx="38" fill="#251b2d" stroke="#bd7cff" stroke-width="11"/><rect x="790" y="230" width="390" height="350" rx="38" fill="#251b2d" stroke="#ff9a62" stroke-width="11"/><rect x="145" y="275" width="300" height="170" rx="18" fill="#bd7cff" /><rect x="835" y="275" width="300" height="170" rx="18" fill="#ff9a62" /><circle cx="295" cy="515" r="30" fill="#f8ecff" /><circle cx="985" cy="515" r="30" fill="#f8ecff" /><path d="M490 405 H640" stroke="#bd7cff" stroke-width="7" fill="none" /><path d="M790 405 H640" stroke="#ff9a62" stroke-width="7" fill="none" /><circle cx="640" cy="405" r="42" fill="#f8ecff" /><text x="295" y="330" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="295" dy="0">BMW-centered reader</tspan></text><text x="985" y="330" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="985" dy="0">Selectable brand</tspan><tspan x="985" dy="22">software</tspan></text></svg>