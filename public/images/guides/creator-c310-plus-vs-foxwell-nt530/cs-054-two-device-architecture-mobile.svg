<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Two Handheld Architectures</title><desc id="desc">Architecture comparison between dedicated BMW handheld firmware and expandable multi-brand diagnostic platforms.</desc><rect width="100%" height="100%" fill="#251b2d"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ff9a62">HARDWARE COMPARISON</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#fff">TWO HANDHELD ARCHITECTURES</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="17" fill="#f8ecff">Compare the exact handheld, not the product family name</text><rect x="80" y="225" width="235" height="360" rx="34" fill="#251b2d" stroke="#bd7cff" stroke-width="10"/><rect x="405" y="225" width="235" height="360" rx="34" fill="#251b2d" stroke="#ff9a62" stroke-width="10"/><rect x="110" y="260" width="175" height="180" rx="16" fill="#bd7cff" /><rect x="435" y="260" width="175" height="180" rx="16" fill="#ff9a62" /><circle cx="197" cy="515" r="28" fill="#f8ecff" /><circle cx="522" cy="515" r="28" fill="#f8ecff" /><path d="M197 585 V760" stroke="#bd7cff" stroke-width="8" fill="none" /><path d="M522 585 V760" stroke="#ff9a62" stroke-width="8" fill="none" /><text x="197" y="620" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff"><tspan x="197" dy="0">BMW-centered</tspan><tspan x="197" dy="22">reader</tspan></text><text x="522" y="620" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff"><tspan x="522" dy="0">Selectable</tspan><tspan x="522" dy="22">brand software</tspan></text></svg>