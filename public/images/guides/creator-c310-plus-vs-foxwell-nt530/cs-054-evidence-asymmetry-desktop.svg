<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Evidence and Documentation Hierarchy</title><desc id="desc">Hierarchy comparing active manufacturer product pages and coverage lookups against mirrored legacy manuals.</desc><rect width="100%" height="100%" fill="#251b2d"/><text x="68" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ff9a62">DOCUMENTATION AUDIT</text><text x="68" y="112" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">EVIDENCE ASYMMETRY</text><text x="68" y="158" font-family="Arial, sans-serif" font-size="19" fill="#f8ecff">Cross-check active manufacturer support against archived documentation</text><line x1="640" y1="240" x2="640" y2="585" stroke="#f8ecff" stroke-width="12" /><polygon points="560,585 720,585 790,640 490,640" fill="#f8ecff" /><line x1="210" y1="360" x2="1070" y2="430" stroke="#f8ecff" stroke-width="10" /><path d="M300 367 V555 H115 Z" stroke="#bd7cff" stroke-width="0" fill="#bd7cff" /><path d="M980 423 V605 H1165 Z" stroke="#ff9a62" stroke-width="0" fill="#ff9a62" /><text x="220" y="585" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="220" dy="0">Current product</tspan><tspan x="220" dy="22">page</tspan></text><text x="1070" y="635" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="1070" dy="0">Older manual copy</tspan></text></svg>