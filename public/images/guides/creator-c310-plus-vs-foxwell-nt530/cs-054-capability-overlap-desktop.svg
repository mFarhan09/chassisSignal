<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Capability Overlap and Gaps</title><desc id="desc">Functional matrix comparing code reading, live values, service routines, bidirectional actuator tests, and coding scope.</desc><rect width="100%" height="100%" fill="#251b2d"/><text x="68" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ff9a62">FUNCTIONAL BOUNDARIES</text><text x="68" y="112" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">CAPABILITY OVERLAP AND GAPS</text><text x="68" y="158" font-family="Arial, sans-serif" font-size="19" fill="#f8ecff">Distinguish routine fault scanning from bidirectional tests and module coding</text><ellipse cx="470" cy="420" rx="330" ry="225" fill="#bd7cff" opacity=".76"/><ellipse cx="810" cy="420" rx="330" ry="225" fill="#ff9a62" opacity=".76"/><text x="300" y="370" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="300" dy="0">Read and clear</tspan></text><text x="980" y="370" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="980" dy="0">Vehicle</tspan><tspan x="980" dy="22">information</tspan></text><text x="640" y="370" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="640" dy="0">Live values</tspan></text><text x="640" y="450" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="640" dy="0">Service functions</tspan></text><text x="640" y="530" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff"><tspan x="640" dy="0">Active tests or</tspan><tspan x="640" dy="22">coding</tspan></text></svg>