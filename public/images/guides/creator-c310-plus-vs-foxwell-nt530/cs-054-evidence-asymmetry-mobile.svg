<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Evidence and Documentation Hierarchy</title><desc id="desc">Hierarchy comparing active manufacturer product pages and coverage lookups against mirrored legacy manuals.</desc><rect width="100%" height="100%" fill="#251b2d"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ff9a62">DOCUMENTATION AUDIT</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#fff">EVIDENCE ASYMMETRY</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="17" fill="#f8ecff">Cross-check active manufacturer support against archived documentation</text><line x1="360" y1="260" x2="360" y2="735" stroke="#f8ecff" stroke-width="12" /><polygon points="300,735 420,735 480,815 240,815" fill="#f8ecff" /><line x1="100" y1="430" x2="620" y2="360" stroke="#f8ecff" stroke-width="9" /><path d="M170 420 V620 H70 Z" stroke="#bd7cff" stroke-width="0" fill="#bd7cff" /><path d="M550 370 V710 H650 Z" stroke="#ff9a62" stroke-width="0" fill="#ff9a62" /><text x="140" y="650" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="140" dy="0">Current</tspan><tspan x="140" dy="22">product page</tspan></text><text x="580" y="740" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff"><tspan x="580" dy="0">Older manual</tspan><tspan x="580" dy="22">copy</tspan></text></svg>