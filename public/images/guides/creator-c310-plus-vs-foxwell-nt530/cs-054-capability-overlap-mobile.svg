<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc"><title id="title">Capability Overlap and Gaps</title><desc id="desc">Functional matrix comparing code reading, live values, service routines, bidirectional actuator tests, and coding scope.</desc><rect width="100%" height="100%" fill="#251b2d"/><text x="48" y="58" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ff9a62">FUNCTIONAL BOUNDARIES</text><text x="48" y="112" font-family="Arial, sans-serif" font-size="29" font-weight="800" fill="#fff">CAPABILITY OVERLAP AND GAPS</text><text x="48" y="158" font-family="Arial, sans-serif" font-size="17" fill="#f8ecff">Distinguish routine fault scanning from bidirectional tests and module coding</text><ellipse cx="285" cy="450" rx="205" ry="250" fill="#bd7cff" opacity=".78"/><ellipse cx="435" cy="450" rx="205" ry="250" fill="#ff9a62" opacity=".78"/><text x="220" y="320" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff"><tspan x="220" dy="0">Read and clear</tspan></text><text x="500" y="320" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff"><tspan x="500" dy="0">Vehicle</tspan><tspan x="500" dy="22">information</tspan></text><text x="360" y="440" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff"><tspan x="360" dy="0">Live values</tspan></text><text x="360" y="515" text-anchor="middle" class="diagram-label" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff"><tspan x="360" dy="0">Active tests or</tspan><tspan x="360" dy="22">coding</tspan></text></svg>