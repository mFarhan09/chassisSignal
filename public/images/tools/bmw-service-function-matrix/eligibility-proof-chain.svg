<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" width="1200" height="480" viewBox="0 0 1200 480"><title id="title">Prove function eligibility first</title><desc id="description">Vehicle + equipped ECU; Named required task; Tool + software scope; Approved interface; Safety + completion</desc><rect width="1200" height="480" rx="18" fill="#f5f5ef"/><rect x="0" y="0" width="1200" height="13" fill="#176459"/><text x="33" y="62" font-family="Arial,sans-serif" font-weight="bold" font-size="38" fill="#103f37">Prove function eligibility first</text><text x="33" y="108" font-family="Arial,sans-serif" font-size="24" fill="#43685c">Each step needs dated evidence for the exact vehicle</text><rect x="34" y="152" width="225" height="164" rx="15" fill="#dce9e5" stroke="#95a9a1"/><circle cx="69" cy="188" r="21" fill="#176459"/><text x="69" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">1</text><text x="48" y="263" font-size="16" font-family="Arial, sans-serif" fill="#1b3932" font-weight="bold">Vehicle + equipped ECU</text><path d="M262 235 h7" stroke="#176459" stroke-width="3"/><path d="M266 228 l9 7-9 7" fill="none" stroke="#176459" stroke-width="3"/><rect x="269" y="152" width="225" height="164" rx="15" fill="#e6e8f0" stroke="#95a9a1"/><circle cx="304" cy="188" r="21" fill="#176459"/><text x="304" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">2</text><text x="283" y="263" font-size="16" font-family="Arial, sans-serif" fill="#1b3932" font-weight="bold">Named required task</text><path d="M497 235 h7" stroke="#176459" stroke-width="3"/><path d="M501 228 l9 7-9 7" fill="none" stroke="#176459" stroke-width="3"/><rect x="504" y="152" width="225" height="164" rx="15" fill="#dce9e5" stroke="#95a9a1"/><circle cx="539" cy="188" r="21" fill="#176459"/><text x="539" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">3</text><text x="518" y="263" font-size="16" font-family="Arial, sans-serif" fill="#1b3932" font-weight="bold">Tool + software scope</text><path d="M732 235 h7" stroke="#176459" stroke-width="3"/><path d="M736 228 l9 7-9 7" fill="none" stroke="#176459" stroke-width="3"/><rect x="739" y="152" width="225" height="164" rx="15" fill="#e6e8f0" stroke="#95a9a1"/><circle cx="774" cy="188" r="21" fill="#176459"/><text x="774" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">4</text><text x="753" y="263" font-size="16" font-family="Arial, sans-serif" fill="#1b3932" font-weight="bold">Approved interface</text><path d="M967 235 h7" stroke="#176459" stroke-width="3"/><path d="M971 228 l9 7-9 7" fill="none" stroke="#176459" stroke-width="3"/><rect x="974" y="152" width="225" height="164" rx="15" fill="#dce9e5" stroke="#95a9a1"/><circle cx="1009" cy="188" r="21" fill="#176459"/><text x="1009" y="195" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">5</text><text x="988" y="263" font-size="16" font-family="Arial, sans-serif" fill="#1b3932" font-weight="bold">Safety + completion</text><text x="33" y="449" font-family="Arial,sans-serif" font-size="20" fill="#43685c">Chassis Signal • documented function scope is not a vehicle-level guarantee</text></svg>