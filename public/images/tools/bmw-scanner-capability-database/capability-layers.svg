<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1200" height="450" viewBox="0 0 1200 450"><title id="title">capability layers</title><desc id="desc">BMW chassis / year, Installed control module, Exact diagnostic task, Scanner model + license, Safety / verification</desc><rect width="1200" height="450" fill="#f4f7f5"/><text x="45" y="60" font-size="30" font-weight="700" font-family="Arial" fill="#173b31">Five verification layers</text><rect x="55" y="133" width="207.6" height="165" rx="13" fill="#e3e8f3" stroke="#93a99f"/><text x="70" y="184" font-family="Arial" font-size="28" fill="#173b31">1</text><text x="68" y="236" font-family="Arial" font-size="16" fill="#173b31">BMW chassis / year</text><rect x="275.6" y="133" width="207.6" height="165" rx="13" fill="#d9eae2" stroke="#93a99f"/><text x="290.6" y="184" font-family="Arial" font-size="28" fill="#173b31">2</text><text x="288.6" y="236" font-family="Arial" font-size="16" fill="#173b31">Installed control module</text><rect x="496.2" y="133" width="207.6" height="165" rx="13" fill="#e3e8f3" stroke="#93a99f"/><text x="511.2" y="184" font-family="Arial" font-size="28" fill="#173b31">3</text><text x="509.2" y="236" font-family="Arial" font-size="16" fill="#173b31">Exact diagnostic task</text><rect x="716.8" y="133" width="207.6" height="165" rx="13" fill="#d9eae2" stroke="#93a99f"/><text x="731.8" y="184" font-family="Arial" font-size="28" fill="#173b31">4</text><text x="729.8" y="236" font-family="Arial" font-size="16" fill="#173b31">Scanner model + license</text><rect x="937.4" y="133" width="207.6" height="165" rx="13" fill="#e3e8f3" stroke="#93a99f"/><text x="952.4" y="184" font-family="Arial" font-size="28" fill="#173b31">5</text><text x="950.4" y="236" font-family="Arial" font-size="16" fill="#173b31">Safety / verification</text><text x="45" y="416" font-family="Arial" font-size="21" fill="#456455">Manufacturer scope is not a vehicle-specific guarantee.</text></svg>