<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="720" height="665" viewBox="0 0 720 665"><title id="title">risk boundaries</title><desc id="desc">Read-only scan, Fault interpretation, Active test / service, Coding / programming</desc><rect width="720" height="665" fill="#f4f7f5"/><text x="45" y="60" font-size="30" font-weight="700" font-family="Arial" fill="#173b31">Risk changes with the operation</text><rect x="28" y="100" width="664" height="95" rx="12" fill="#e3e8f3" stroke="#93a99f"/><text x="48" y="153" font-family="Arial" font-size="25" fill="#173b31">1. Read-only scan</text><rect x="28" y="230" width="664" height="95" rx="12" fill="#d9eae2" stroke="#93a99f"/><text x="48" y="283" font-family="Arial" font-size="25" fill="#173b31">2. Fault interpretation</text><rect x="28" y="360" width="664" height="95" rx="12" fill="#e3e8f3" stroke="#93a99f"/><text x="48" y="413" font-family="Arial" font-size="25" fill="#173b31">3. Active test / service</text><rect x="28" y="490" width="664" height="95" rx="12" fill="#d9eae2" stroke="#93a99f"/><text x="48" y="543" font-family="Arial" font-size="25" fill="#173b31">4. Coding / programming</text><text x="45" y="631" font-family="Arial" font-size="21" fill="#456455">Manufacturer scope is not a vehicle-specific guarantee.</text></svg>