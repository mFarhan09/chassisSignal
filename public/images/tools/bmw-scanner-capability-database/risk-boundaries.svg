<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1200" height="450" viewBox="0 0 1200 450"><title id="title">risk boundaries</title><desc id="desc">Read-only scan, Fault interpretation, Active test / service, Coding / programming</desc><rect width="1200" height="450" fill="#f4f7f5"/><text x="45" y="60" font-size="30" font-weight="700" font-family="Arial" fill="#173b31">Risk changes with the operation</text><rect x="55" y="133" width="262.75" height="165" rx="13" fill="#e3e8f3" stroke="#93a99f"/><text x="70" y="184" font-family="Arial" font-size="28" fill="#173b31">1</text><text x="68" y="236" font-family="Arial" font-size="20" fill="#173b31">Read-only scan</text><rect x="330.75" y="133" width="262.75" height="165" rx="13" fill="#d9eae2" stroke="#93a99f"/><text x="345.75" y="184" font-family="Arial" font-size="28" fill="#173b31">2</text><text x="343.75" y="236" font-family="Arial" font-size="20" fill="#173b31">Fault interpretation</text><rect x="606.5" y="133" width="262.75" height="165" rx="13" fill="#e3e8f3" stroke="#93a99f"/><text x="621.5" y="184" font-family="Arial" font-size="28" fill="#173b31">3</text><text x="619.5" y="236" font-family="Arial" font-size="20" fill="#173b31">Active test / service</text><rect x="882.25" y="133" width="262.75" height="165" rx="13" fill="#d9eae2" stroke="#93a99f"/><text x="897.25" y="184" font-family="Arial" font-size="28" fill="#173b31">4</text><text x="895.25" y="236" font-family="Arial" font-size="20" fill="#173b31">Coding / programming</text><text x="45" y="416" font-family="Arial" font-size="21" fill="#456455">Manufacturer scope is not a vehicle-specific guarantee.</text></svg>