<svg xmlns="http://www.w3.org/2000/svg" width="720" height="778" viewBox="0 0 720 778" role="img" aria-labelledby="title desc"><title id="title">Adapter evidence levels</title><desc id="desc">OBD protocol then Transport + OS then App accepts SKU then Vehicle + function</desc><rect width="720" height="778" fill="#f5f7f6" rx="18"/><text x="34" y="64" font-family="Arial,sans-serif" font-size="32" fill="#183d33" font-weight="700">Four evidence layers</text><rect x="32" y="112" width="656" height="114" rx="16" fill="#e1e8f3" stroke="#9aa9a6" stroke-width="2"/><text x="62" y="160" font-family="Arial,sans-serif" font-size="31" fill="#183d33" font-weight="700">1.</text><text x="122" y="160" font-family="Arial,sans-serif" font-size="27" fill="#183d33">OBD protocol</text><path d="M360 230v27" stroke="#5c867a" stroke-width="4" stroke-dasharray="5 5"/><rect x="32" y="264" width="656" height="114" rx="16" fill="#d8e9e2" stroke="#9aa9a6" stroke-width="2"/><text x="62" y="312" font-family="Arial,sans-serif" font-size="31" fill="#183d33" font-weight="700">2.</text><text x="122" y="312" font-family="Arial,sans-serif" font-size="27" fill="#183d33">Transport + OS</text><path d="M360 382v27" stroke="#5c867a" stroke-width="4" stroke-dasharray="5 5"/><rect x="32" y="416" width="656" height="114" rx="16" fill="#e1e8f3" stroke="#9aa9a6" stroke-width="2"/><text x="62" y="464" font-family="Arial,sans-serif" font-size="31" fill="#183d33" font-weight="700">3.</text><text x="122" y="464" font-family="Arial,sans-serif" font-size="27" fill="#183d33">App accepts SKU</text><path d="M360 534v27" stroke="#5c867a" stroke-width="4" stroke-dasharray="5 5"/><rect x="32" y="568" width="656" height="114" rx="16" fill="#d8e9e2" stroke="#9aa9a6" stroke-width="2"/><text x="62" y="616" font-family="Arial,sans-serif" font-size="31" fill="#183d33" font-weight="700">4.</text><text x="122" y="616" font-family="Arial,sans-serif" font-size="27" fill="#183d33">Vehicle + function</text><text x="34" y="736" font-family="Arial,sans-serif" font-size="24" fill="#54665f">One supported layer cannot guarantee the next.</text></svg>