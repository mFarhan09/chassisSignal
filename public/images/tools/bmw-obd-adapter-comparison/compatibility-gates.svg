<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">BMW adapter decision gates</title><desc id="d">Vehicle + chassis then Software + function then Phone / computer then Bluetooth / USB then Exact module task</desc><rect width="1200" height="480" fill="#f5f7f6" rx="20"/><text x="55" y="72" font-size="36" font-family="Arial" font-weight="700" fill="#15352e">Qualify all five gates</text><rect x="55" y="150" width="208.4" height="170" rx="13" fill="#e0e5f1" stroke="#9bacaa"/><text x="72" y="204" font-size="29" font-family="Arial" font-weight="700" fill="#15352e">1</text><text x="72" y="250" font-family="Arial" font-size="18" fill="#15352e">Vehicle + chassis</text><rect x="275.4" y="150" width="208.4" height="170" rx="13" fill="#d7e9e2" stroke="#9bacaa"/><text x="292.4" y="204" font-size="29" font-family="Arial" font-weight="700" fill="#15352e">2</text><text x="292.4" y="250" font-family="Arial" font-size="18" fill="#15352e">Software + function</text><rect x="495.8" y="150" width="208.4" height="170" rx="13" fill="#e0e5f1" stroke="#9bacaa"/><text x="512.8" y="204" font-size="29" font-family="Arial" font-weight="700" fill="#15352e">3</text><text x="512.8" y="250" font-family="Arial" font-size="18" fill="#15352e">Phone / computer</text><rect x="716.2" y="150" width="208.4" height="170" rx="13" fill="#d7e9e2" stroke="#9bacaa"/><text x="733.2" y="204" font-size="29" font-family="Arial" font-weight="700" fill="#15352e">4</text><text x="733.2" y="250" font-family="Arial" font-size="18" fill="#15352e">Bluetooth / USB</text><rect x="936.6" y="150" width="208.4" height="170" rx="13" fill="#e0e5f1" stroke="#9bacaa"/><text x="953.6" y="204" font-size="29" font-family="Arial" font-weight="700" fill="#15352e">5</text><text x="953.6" y="250" font-family="Arial" font-size="18" fill="#15352e">Exact module task</text><text x="55" y="410" font-family="Arial" font-size="25" fill="#475e57">A claim at one layer cannot guarantee the next.</text><text x="55" y="444" font-family="Arial" font-size="18" fill="#475e57">Evidence-first planning • Verify model, app, vehicle and exact job</text></svg>