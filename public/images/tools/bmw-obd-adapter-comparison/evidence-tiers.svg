<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">Evidence tiers for adapter compatibility</title><desc id="d">OBD protocol then Transport + OS then App accepts SKU then Vehicle + function</desc><rect width="1200" height="440" fill="#f5f7f6" rx="20"/><text x="55" y="72" font-size="36" font-family="Arial" font-weight="700" fill="#15352e">Four levels of compatibility evidence</text><rect x="55" y="150" width="263.5" height="170" rx="13" fill="#e0e5f1" stroke="#9bacaa"/><text x="72" y="204" font-size="29" font-family="Arial" font-weight="700" fill="#15352e">1</text><text x="72" y="250" font-family="Arial" font-size="23" fill="#15352e">OBD protocol</text><rect x="330.5" y="150" width="263.5" height="170" rx="13" fill="#d7e9e2" stroke="#9bacaa"/><text x="347.5" y="204" font-size="29" font-family="Arial" font-weight="700" fill="#15352e">2</text><text x="347.5" y="250" font-family="Arial" font-size="23" fill="#15352e">Transport + OS</text><rect x="606" y="150" width="263.5" height="170" rx="13" fill="#e0e5f1" stroke="#9bacaa"/><text x="623" y="204" font-size="29" font-family="Arial" font-weight="700" fill="#15352e">3</text><text x="623" y="250" font-family="Arial" font-size="23" fill="#15352e">App accepts SKU</text><rect x="881.5" y="150" width="263.5" height="170" rx="13" fill="#d7e9e2" stroke="#9bacaa"/><text x="898.5" y="204" font-size="29" font-family="Arial" font-weight="700" fill="#15352e">4</text><text x="898.5" y="250" font-family="Arial" font-size="23" fill="#15352e">Vehicle + function</text><text x="55" y="370" font-family="Arial" font-size="25" fill="#475e57">A claim at one layer cannot guarantee the next.</text><text x="55" y="404" font-family="Arial" font-size="18" fill="#475e57">Evidence-first planning • Verify model, app, vehicle and exact job</text></svg>