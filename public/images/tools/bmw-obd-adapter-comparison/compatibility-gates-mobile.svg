<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img" aria-labelledby="title desc"><title id="title">Five compatibility gates</title><desc id="desc">Vehicle + chassis then Software + function then Phone / computer then Bluetooth / USB then Exact module task</desc><rect width="720" height="930" fill="#f5f7f6" rx="18"/><text x="34" y="64" font-family="Arial,sans-serif" font-size="32" fill="#183d33" font-weight="700">Check all five gates</text><rect x="32" y="112" width="656" height="114" rx="16" fill="#e1e8f3" stroke="#9aa9a6" stroke-width="2"/><text x="62" y="160" font-family="Arial,sans-serif" font-size="31" fill="#183d33" font-weight="700">1.</text><text x="122" y="160" font-family="Arial,sans-serif" font-size="27" fill="#183d33">Vehicle + chassis</text><path d="M360 230v27" stroke="#5c867a" stroke-width="4" stroke-dasharray="5 5"/><rect x="32" y="264" width="656" height="114" rx="16" fill="#d8e9e2" stroke="#9aa9a6" stroke-width="2"/><text x="62" y="312" font-family="Arial,sans-serif" font-size="31" fill="#183d33" font-weight="700">2.</text><text x="122" y="312" font-family="Arial,sans-serif" font-size="27" fill="#183d33">Software + function</text><path d="M360 382v27" stroke="#5c867a" stroke-width="4" stroke-dasharray="5 5"/><rect x="32" y="416" width="656" height="114" rx="16" fill="#e1e8f3" stroke="#9aa9a6" stroke-width="2"/><text x="62" y="464" font-family="Arial,sans-serif" font-size="31" fill="#183d33" font-weight="700">3.</text><text x="122" y="464" font-family="Arial,sans-serif" font-size="27" fill="#183d33">Phone / computer</text><path d="M360 534v27" stroke="#5c867a" stroke-width="4" stroke-dasharray="5 5"/><rect x="32" y="568" width="656" height="114" rx="16" fill="#d8e9e2" stroke="#9aa9a6" stroke-width="2"/><text x="62" y="616" font-family="Arial,sans-serif" font-size="31" fill="#183d33" font-weight="700">4.</text><text x="122" y="616" font-family="Arial,sans-serif" font-size="27" fill="#183d33">Bluetooth / USB</text><path d="M360 686v27" stroke="#5c867a" stroke-width="4" stroke-dasharray="5 5"/><rect x="32" y="720" width="656" height="114" rx="16" fill="#e1e8f3" stroke="#9aa9a6" stroke-width="2"/><text x="62" y="768" font-family="Arial,sans-serif" font-size="31" fill="#183d33" font-weight="700">5.</text><text x="122" y="768" font-family="Arial,sans-serif" font-size="27" fill="#183d33">Exact module task</text><text x="34" y="888" font-family="Arial,sans-serif" font-size="24" fill="#54665f">One supported layer cannot guarantee the next.</text></svg>