<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" aria-labelledby="title desc" role="img"><title id="title">BMW software verification chain</title><desc id="desc">Vehicle + ECU, Task + risk level, Application + version, Adapter + host, License + safety</desc><rect width="1200" height="450" fill="#f4f7f5"/><text x="52" y="63" font-family="Arial" font-size="35" font-weight="700" fill="#143b31">Verify the whole chain</text><rect x="55" y="133" width="208.4" height="170" rx="14" fill="#e0e6f2" stroke="#93a99f"/><text x="72" y="192" font-family="Arial" font-size="32" font-weight="700" fill="#123d31">1</text><text x="72" y="252" font-family="Arial" font-size="17" fill="#123d31">Vehicle + ECU</text><rect x="275.4" y="133" width="208.4" height="170" rx="14" fill="#d4e7df" stroke="#93a99f"/><text x="292.4" y="192" font-family="Arial" font-size="32" font-weight="700" fill="#123d31">2</text><text x="292.4" y="252" font-family="Arial" font-size="17" fill="#123d31">Task + risk level</text><rect x="495.8" y="133" width="208.4" height="170" rx="14" fill="#e0e6f2" stroke="#93a99f"/><text x="512.8" y="192" font-family="Arial" font-size="32" font-weight="700" fill="#123d31">3</text><text x="512.8" y="252" font-family="Arial" font-size="17" fill="#123d31">Application + version</text><rect x="716.2" y="133" width="208.4" height="170" rx="14" fill="#d4e7df" stroke="#93a99f"/><text x="733.2" y="192" font-family="Arial" font-size="32" font-weight="700" fill="#123d31">4</text><text x="733.2" y="252" font-family="Arial" font-size="17" fill="#123d31">Adapter + host</text><rect x="936.6" y="133" width="208.4" height="170" rx="14" fill="#e0e6f2" stroke="#93a99f"/><text x="953.6" y="192" font-family="Arial" font-size="32" font-weight="700" fill="#123d31">5</text><text x="953.6" y="252" font-family="Arial" font-size="17" fill="#123d31">License + safety</text><text x="52" y="414" font-family="Arial" font-size="23" fill="#45685a">One valid layer does not certify the next.</text></svg>