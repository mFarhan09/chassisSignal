<svg xmlns="http://www.w3.org/2000/svg" width="720" height="835" viewBox="0 0 720 835" aria-labelledby="title desc" role="img"><title id="title">BMW software verification chain</title><desc id="desc">Vehicle + ECU, Task + risk level, Application + version, Adapter + host, License + safety</desc><rect width="720" height="835" fill="#f4f7f5"/><text x="28" y="63" font-family="Arial" font-size="29" font-weight="700" fill="#143b31">Verify the whole chain</text><rect x="30" y="94" width="660" height="105" rx="12" fill="#e0e6f2" stroke="#93a99f"/><text x="50" y="134" font-family="Arial" font-size="28" font-weight="700" fill="#123d31">1</text><text x="105" y="150" font-family="Arial" font-size="25" fill="#123d31">Vehicle + ECU</text><rect x="30" y="232" width="660" height="105" rx="12" fill="#d4e7df" stroke="#93a99f"/><text x="50" y="272" font-family="Arial" font-size="28" font-weight="700" fill="#123d31">2</text><text x="105" y="288" font-family="Arial" font-size="25" fill="#123d31">Task + risk level</text><rect x="30" y="370" width="660" height="105" rx="12" fill="#e0e6f2" stroke="#93a99f"/><text x="50" y="410" font-family="Arial" font-size="28" font-weight="700" fill="#123d31">3</text><text x="105" y="426" font-family="Arial" font-size="25" fill="#123d31">Application + version</text><rect x="30" y="508" width="660" height="105" rx="12" fill="#d4e7df" stroke="#93a99f"/><text x="50" y="548" font-family="Arial" font-size="28" font-weight="700" fill="#123d31">4</text><text x="105" y="564" font-family="Arial" font-size="25" fill="#123d31">Adapter + host</text><rect x="30" y="646" width="660" height="105" rx="12" fill="#e0e6f2" stroke="#93a99f"/><text x="50" y="686" font-family="Arial" font-size="28" font-weight="700" fill="#123d31">5</text><text x="105" y="702" font-family="Arial" font-size="25" fill="#123d31">License + safety</text><text x="28" y="799" font-family="Arial" font-size="21" fill="#45685a">One valid layer does not certify the next.</text></svg>