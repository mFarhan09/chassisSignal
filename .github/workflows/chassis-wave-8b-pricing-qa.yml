name: Chassis Recovery Wave 8B — Pricing Rebuild QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/content/articles/bimmercode-pricing.md'
      - 'src/content/articles/bimmerlink-pricing.md'
      - 'src/content/articles/carly-subscription-cost.md'
      - 'src/content/articles/protool-pricing.md'
      - 'scripts/recovery-chassis-wave8b-pricing-qa.mjs'
      - 'recovery/CHASSIS_WAVE_8B_PRICING_REBUILD_RELEASE.md'
      - '.github/workflows/chassis-wave-8b-pricing-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave8b:
    name: Four pricing articles, legacy preservation and production build
    if: github.head_ref == 'recovery/chassis-wave-8b-pricing-rebuild' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/recovery-chassis-wave8b-pricing-qa.mjs
      - run: pnpm test
      - run: pnpm build
      - run: CHASSIS_WAVE8B_EDITORIAL_REBUILD=1 node scripts/recovery-chassis-wave7-p0-qa.mjs
      - run: node scripts/recovery-chassis-wave8a-editorial.mjs
