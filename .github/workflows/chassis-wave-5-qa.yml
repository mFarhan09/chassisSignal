name: Chassis Recovery Wave 5 QA
on:
  push:
    branches: [recovery/chassis-wave-5-diagnostics-pricing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wave-5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/recovery-chassis-wave5-qa.mjs
      - run: pnpm exec playwright-core install chromium
      - name: Native presentation, calculator and module-finder browser QA
        run: |
          pnpm exec astro preview --host 127.0.0.1 --port 4399 > /tmp/chassis-wave5-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4399/guides/bmw-module-troubleshooting/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4399/tools/bmw-diagnostic-software-price-ledger/ > /dev/null || { cat /tmp/chassis-wave5-preview.log; exit 1; }
          node scripts/recovery-chassis-wave5-browser.mjs
