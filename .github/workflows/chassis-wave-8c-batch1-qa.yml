name: Chassis Recovery Wave 8C — Batch 1 Eleven Specialist Articles
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/content/articles/**'
      - 'src/affiliate/placement-plan.generated.json'
      - 'scripts/recovery-chassis-wave8c-batch1-qa.mjs'
      - 'scripts/recovery-chassis-wave7-p0-qa.mjs'
      - 'recovery/CHASSIS_WAVE_8C_BATCH1_RELEASE.md'
      - '.github/workflows/chassis-wave-8c-batch1-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    name: Eleven source-preserving specialist rebuilds and legacy redirect QA
    if: github.head_ref == 'recovery/chassis-wave-8c-batch1-eleven-specialist-guides' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/recovery-chassis-wave8c-batch1-qa.mjs
      - run: pnpm test
      - run: pnpm build
      - run: CHASSIS_WAVE8C_BATCH1_REBUILD=1 node scripts/recovery-chassis-wave7-p0-qa.mjs
      - run: node scripts/recovery-chassis-wave8a-editorial.mjs
