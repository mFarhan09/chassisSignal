name: Chassis Recovery Wave 1 QA
on:
  push:
    branches:
      - recovery/chassis-wave-1-obd-adapters
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/recovery-chassis-wave1-qa.mjs
      - run: pnpm exec playwright-core install chromium
      - name: Browser test of responsive database
        run: |
          pnpm preview -- --host 127.0.0.1 --port 4399 > /tmp/chassis-wave1-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4399/tools/bmw-obd-adapter-comparison/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/recovery-chassis-wave1-browser.mjs
