name: Chassis Final 65-URL Forensic Closure and Tool-Conversions QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/content/articles/**'
      - 'src/components/ScannerConvertedEvidence.astro'
      - 'src/components/ScannerResearch.astro'
      - 'src/pages/tools/bmw-scanner-capability-database/index.astro'
      - 'src/lib/rehype-canonicalize-retired-guide-links.mjs'
      - 'astro.config.mjs'
      - 'src/data/**'
      - 'public/_redirects'
      - 'scripts/recovery-chassis-final-closure-qa.mjs'
      - 'scripts/recovery-chassis-wave7-p0-qa.mjs'
      - 'src/affiliate/placement-plan.generated.json'
      - 'recovery/**'
      - '.github/workflows/chassis-final-closure-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closure:
    name: Original 65-URL forensic disposition, 5 improved, 2 source-preserving 301s
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --check scripts/recovery-chassis-final-live.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify recovery preservation against the applicable baseline
        run: |
          if [ "${GITHUB_HEAD_REF:-}" = "audit/recovery-second-pass-2026-10-11" ]; then
            node scripts/recovery-second-audit-qa.mjs
          elif [ "${GITHUB_HEAD_REF:-}" = "recovery/chassis-final-closure-65url-discovery-audit" ]; then
            node scripts/recovery-chassis-final-closure-qa.mjs
            CHASSIS_FINAL_MINOR_REBUILD=1 node scripts/recovery-chassis-wave7-p0-qa.mjs
            node scripts/recovery-chassis-wave8a-editorial.mjs
          else
            node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          import { publicGuideRedirects } from './src/data/consolidated-redirects.mjs';

          const redirects = readFileSync('dist/_redirects', 'utf8');
          const sitemap = readFileSync('dist/sitemap-0.xml', 'utf8');
          assert.equal(redirects, readFileSync('public/_redirects', 'utf8'));
          const rules = new Set(redirects.trim().split(/\r?\n/));
          for (const [slug, destination] of Object.entries(publicGuideRedirects)) {
            const path = '/guides/' + slug;
            for (const variant of [path, path + '/']) {
              assert.ok(rules.has(variant + ' ' + destination + '#' + slug + ' 301'), variant);
              assert.ok(!sitemap.includes('<loc>https://chassissignal.com' + variant + '</loc>'), variant);
            }
            assert.ok(sitemap.includes('<loc>https://chassissignal.com' + destination + '</loc>'), destination);
            assert.ok(readFileSync('dist' + destination + 'index.html', 'utf8').includes('id="' + slug + '"'), slug);
            assert.ok(existsSync('src/content/articles/' + slug + '.md'), slug);
          }
          console.log('Verified archived sources, sitemap exclusions and 301 destinations for', Object.keys(publicGuideRedirects).length, 'guides.');
          JS
          fi
